playwright:
  configs: playwright.config.mts
  navigationHelpers: [navigateTo]
  ignoreRoutes:
    - /landing/:idOrUsername
    - /landing/:idOrUsername/:slug
  routeCoverageSources:
    - framework: vitest
      project: web-integration
      include: ['integration-tests/web/**/*.mts']
      routes:
        - /bank-account/:id/settings/source
        - /card/:id/settings/source
        - /copyright/counter-notice
        - /copyright/designated-agent
        - /copyright/repeat-infringer-policy
        - /healthz
        - /referral-program/:id/settings/source
        - /rewards-program-status/:id/settings/source
        - /rewards-program/:id/settings/source
        - /topic/:id/settings/source
      helpers:
        - module: integration-tests/web/helpers/client.mts
          export: WebIntegrationClient
          method: request
          urlArgument: 0
        - module: integration-tests/web/helpers/client.mts
          export: WebIntegrationClient
          method: loadPage
          urlArgument: 0
  projects:
    setup:
      include:
        - playwright/setup/**/*.setup.mts
    chromium:
      include:
        - playwright/tests/**/*.spec.mts
    support-tests:
      include:
        - ci/playwright/**/*.test.mts
        - playwright/helpers/**/*.test.mts
  coverage:
    routes: true
    selectors: true
  selectors:
    testIds:
      - data-pw
      - data-testid
    componentTestIds:
      dataPw: data-pw
    htmlIds: false
    wrappers:
      - module: playwright/helpers/aside-locator.mts
        export: getAsideLocator
        testIdArgument: 1
      - module: playwright/helpers/authenticated-manager-page.mts
        export: assertManagerHeading
        testIdArgument: 1
      - module: playwright/helpers/authenticated-manager-page.mts
        export: assertSeededName
        testIdArgument: 1
      - module: playwright/helpers/authenticated-manager-page.mts
        export: assertExactValue
        testIdArgument: 1
      - module: playwright/helpers/authenticated-manager-page.mts
        export: assertContainedValue
        testIdArgument: 1
      - module: playwright/helpers/authenticated-manager-page.mts
        export: assertManagerControlVisible
        testIdArgument: 1
      - module: playwright/helpers/authenticated-manager-page.mts
        export: assertFirstManagerControlVisible
        testIdArgument: 1
      - module: playwright/helpers/authenticated-manager-page.mts
        export: clickFirstManagerControl
        testIdArgument: 1
      - module: playwright/helpers/authenticated-manager-page.mts
        export: clickManagerControl
        testIdArgument: 1
      - module: playwright/helpers/authenticated-manager-page.mts
        export: clearManagerInputWithFill
        testIdArgument: 1
      - module: playwright/helpers/authenticated-manager-page.mts
        export: clearManagerInputWithSelectAll
        testIdArgument: 1
      - module: playwright/helpers/semantic-vote.mts
        export: chooseVote
        testIdArgument: 1
      - module: playwright/helpers/semantic-vote.mts
        export: voteBinaryChoice
        testIdArgument: 1
      - module: playwright/helpers/semantic-vote.mts
        export: voteChoice
        testIdArgument: 1
      - module: playwright/helpers/semantic-vote.mts
        export: voteChoiceGroup
        testIdArgument: 1
      - module: playwright/helpers/semantic-vote.mts
        export: voteClear
        testIdArgument: 1
      - module: playwright/helpers/semantic-vote.mts
        export: voteTrigger
        testIdArgument: 1
      - module: playwright/helpers/semantic-vote.mts
        export: userSignalChoice
        testIdArgument: 1
  selectorRoots:
    - web/app
    - web/components
    - web/lib/navigation
    - web/lib/podcast-player
    - web/lib/routes
  selectorExclude:
    - '**/*.test.ts'
    - '**/*.test.tsx'
    - '**/*.stories.ts'
    - '**/*.stories.tsx'
    - '**/__tests__/**'
    - '**/*.mock.test.tsx'
vitest:
  configs: vitest.config.mts
  projects:
    web:
      include:
        - web/**/*.test.ts
        - web/**/*.test.tsx
      setup_files:
        - web/test-helpers/vitest.setup.web.mts
      exclude:
        - '**/node_modules/**'
        - '**/.git/**'
        - web/.next/**
        - web/storybook/**
    backend-aws:
      integration_suites:
        aws:
          - aws
    backend-anthropic:
      integration_suites:
        anthropic:
          - anthropic
    backend-bedrock:
      integration_suites:
        bedrock:
          - bedrock
    backend-openai:
      integration_suites:
        openai:
          - openai
    backend-openrouter:
      integration_suites:
        openrouter:
          - openrouter
