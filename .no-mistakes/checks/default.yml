commands:
  - name: typecheck-backend
    command: [pnpm, exec, tsc, --noEmit, --incremental, --project, backend/tsconfig.json]
    fileArgs: none
    always: true
  - name: typecheck-backend-email
    command: [pnpm, exec, tsc, --noEmit, --incremental, --project, email-templates/tsconfig.json]
    fileArgs: none
    always: true
  - name: typecheck-web
    command: [bash, -c, 'cd web && pnpm exec next typegen && pnpm exec tsc --noEmit --incremental']
    fileArgs: none
    always: true
  - name: typecheck-lambdas
    command: [pnpm, exec, tsc, --noEmit, --incremental, --project, lambdas/tsconfig.json]
    fileArgs: none
    always: true
  - name: typecheck-cloudflare-worker
    command: [pnpm, exec, tsc, --noEmit, --incremental, --project, cloudflare-worker/tsconfig.json]
    fileArgs: none
    always: true
  - name: typecheck-scripts
    command: [pnpm, exec, tsc, --noEmit, --incremental, --project, tsconfig.json]
    fileArgs: none
    always: true
  # Generated-artifact freshness (#4024): each entry runs the check CI runs for that artifact so a
  # stale one shows up before pushing. Inputs are the sources that regenerate it.
  - name: api-fixtures
    command: [bash, -c, 'pnpm run backend-row-contracts:check && pnpm run api-fixtures:check']
    fileArgs: none
    include:
      - 'api-fixtures/**'
      - 'backend/test-helpers/api-fixtures/**'
      - 'backend/modules/scheduled-job-manifest/**'
      - 'backend/queues/**/enqueues/schedules.mts'
      - 'backend/services/queue-monitoring/scheduled-jobs-registry.mts'
      - 'backend/services/queue-monitoring/scheduled-job-manifests.mts'
  # Needs the worktree backend env (`./dev/initialize backend`): the registry loads data stores.
  - name: mcp-catalog
    command: [bash, -c, 'if [ -f .env ]; then source .env; fi; pnpm run mcp:catalog -- --check']
    fileArgs: none
    include:
      - 'backend/mcp/**'
      - 'backend/services/mcp-tools/**'
      - 'backend/scripts/*mcp*'
      - 'backend/test-helpers/**/*mcp*'
      - 'api-fixtures/v1/mcp*.json'
      - docs/overview/architecture/mcp/catalog.md
  - name: web-route-selector-map
    command:
      [node, static-code-analysis/i18n-extract/route-selector-map.mts, --check, --diagnostics]
    fileArgs: none
    include:
      - 'web/**/*.ts'
      - 'web/**/*.tsx'
      - 'web/**/*.mts'
      - 'localization/catalog/**'
      - 'static-code-analysis/i18n-extract/**'
  # Compares the live schema with the committed snapshot; migrate the worktree database first.
  - name: postgresql-schema-snapshot
    command: [pnpm, run, db:snapshot:check]
    fileArgs: none
    include:
      - 'backend/data-stores/psql/migrations/**'
      - 'backend/data-stores/psql/config-driven/**'
      - 'backend/data-stores/psql/views/**'
      - 'backend/data-stores/psql/schema-snapshot/**'
  - name: typecheck-ts-shared
    command: [pnpm, exec, tsc, --noEmit, --incremental, --project, ts-shared/tsconfig.json]
    fileArgs: none
    always: true
  - name: typecheck-playwright
    command: [pnpm, exec, tsc, --noEmit, --incremental, --project, playwright/tsconfig.json]
    fileArgs: none
    always: true
  - name: typecheck-test-helpers
    command: [pnpm, exec, tsc, --noEmit, --incremental, --project, test-helpers/tsconfig.json]
    fileArgs: none
    always: true
  - name: typecheck-integration-tests
    command: [pnpm, exec, tsc, --noEmit, --incremental, --project, integration-tests/tsconfig.json]
    fileArgs: none
    always: true
  - name: workflow-runner-policy
    command:
      [
        pnpm,
        exec,
        vouchington,
        runner-policy,
        --config,
        .github/runner-policy.json,
        --root,
        .github/workflows,
      ]
    fileArgs: none
    include:
      - .github/runner-policy.json
      - '.github/workflows/**'
      - package.json
      - pnpm-lock.yaml
  # CI-only static gates (#3015): `check` runs the repository rules, but impacted-checks would
  # otherwise list only typechecks and tests. Each command mirrors its owning workflow step.
  - name: dependency-cruise-web
    command:
      [
        pnpm,
        exec,
        depcruise,
        --config,
        web/.dependency-cruiser.cjs,
        --output-type,
        err,
        --cache,
        --cache-strategy,
        content,
        web,
      ]
    fileArgs: none
    include:
      - 'web/**'
      - 'ts-shared/**'
      - package.json
      - pnpm-lock.yaml
  # Mirrors the vouchington-tooling actionlint workflow's zizmor step (#4018); .mise.toml pins it.
  - name: zizmor
    command: [zizmor, --offline, --min-severity, high, --min-confidence, high, .]
    fileArgs: none
    include:
      - '.github/workflows/**'
      - '.github/actions/**'
      - .github/zizmor.yml
      - .mise.toml
  - name: ast-grep-rules
    command: [pnpm, run, ast-grep]
    fileArgs: none
    always: true
  - name: knip-unused-files
    command: [pnpm, exec, knip, --treat-config-hints-as-errors]
    fileArgs: none
    always: true
  - name: no-mistakes-rules
    command: [pnpm, run, no-mistakes]
    fileArgs: none
    always: true
  - name: classifier-golden-imports
    command: [node, ci/check-classifier-golden-imports.mts]
    fileArgs: none
    include:
      - ci/check-classifier-golden-imports.mts
      - backend/data-stores/psql/index.mts
      - backend/data-stores/psql/migrate.mts
      - 'backend/data-stores/psql/migration-runner/**/*.mts'
      - backend/tsconfig.json
      - backend/data-stores/psql/package.json
  - name: lint-links-internal
    command: [./ci/lint-links.sh, --offline]
    fileArgs: none
    always: true
  - name: repo-node-static-checks
    command:
      - node
      - static-code-analysis/run-node-checks.mts
      - --checks
      - config-inventory-policy,repo-file-policy,scc-complexity,targeted-guardrails
    fileArgs: none
    always: true
  - name: dependency-license-policy
    command: [pnpm, run, dependency-license-policy]
    fileArgs: none
    include:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - 'static-code-analysis/dependency-license-policy/**'
  - name: article-links
    command: [pnpm, run, article-links:check]
    fileArgs: none
    always: true
  - name: ast-grep-config-parity
    command: [pnpm, run, ast-grep:config-check]
    fileArgs: none
    always: true
  - name: live-repository-policies
    command: [node, ci/check-repository-policy-scans.mts]
    fileArgs: none
    always: true
  - name: backend-dependency-boundaries
    command: [pnpm, run, dep-cruise:backend]
    fileArgs: none
    include:
      - 'backend/**/*.mts'
      - 'backend/**/*.cjs'
      - 'ts-shared/**/*.ts'
      - '**/package.json'
      - pnpm-lock.yaml
    exclude:
      - '**/*.test.mts'
      - '**/test-helpers/**'
  - name: knip-production-exports
    command: [pnpm, run, knip:production-exports]
    fileArgs: none
    include:
      - 'backend/**/*.mts'
      - '**/package.json'
      - knip.jsonc
    exclude:
      - '**/*.test.mts'
      - '**/test-helpers/**'
  # CI lints the whole repository (#3505); appending only the changed files keeps the listed
  # local command cheap. It cannot append their dependents, which before-pushing adds.
  - name: oxlint-type-aware
    command: [pnpm, exec, oxlint, --type-aware, --deny-warnings]
    fileArgs: append
    include:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.mts'
      - '**/*.cts'
