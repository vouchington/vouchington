[mcp_servers.vouchington-tooling]
command = "bash"
args = ["-c", 'exec "$(git rev-parse --show-toplevel)/node_modules/.bin/vouchington" mcp']
env = { AGENT_BLACKBOARD_URL = "${AGENT_BLACKBOARD_URL}", AGENT_BLACKBOARD_TOKEN = "${AGENT_BLACKBOARD_TOKEN}" }
enabled = true

[permission]
allow = ["MCPTool(vouchington-tooling__*)"]
