id: no-sql-in-backend-tests
language: Tsx
severity: error
message: 'Do not write raw SQL in tests — add focused helpers under backend/test-helpers or playwright/helpers instead'
files:
  - 'backend/**/*.test.mts'
  - 'backend/**/__tests__/**/*.mts'
  - 'playwright/tests/**/*.spec.mts'
  - 'playwright/credentialed/**/*.spec.mts'
  - 'playwright/**/*.spec.ts'
  - 'integration-tests/**/*.test.mts'
ignores:
  - 'backend/test-helpers/**'
  - 'playwright/helpers/**'
  # Package self-tests that directly verify the data-store modules themselves:
  # Directly tests @data-stores/analytics/query SQL execution, invalid-SQL handling, and DuckDB view evolution.
  - 'backend/data-stores/analytics/query.test.mts'
  # Directly tests the @data-stores/analytics query() helper and DuckDB views.
  - 'backend/data-stores/analytics/__tests__/analytics.part-2.test.mts'
  # Directly tests @data-stores/analytics queue event DuckDB views via query().
  - 'backend/data-stores/analytics/queue.test.mts'
  # Directly tests runAllMigrations against backend connection termination and pool recovery.
  - 'backend/data-stores/psql/migrate.test.mts'
  # Directly tests the exported surface of ./index.mts and ./transactions.mts (no SQL).
  - 'backend/data-stores/psql/index.exports.test.mts'
  # Directly tests beginBoundedTransaction and registerPostCommitAction against ./setup.mts (no SQL).
  - 'backend/data-stores/psql/post-commit-actions.test.mts'
  # Shrinking allowlist of SQL-running psql schema tests — this list may only shrink.
  # Total ignores locked at 31 (2 helper globs + 6 self-tests + 23 schema tests) by
  # static-code-analysis/__tests__/ast-grep-tsx-parity.test.mts (lower the expected count in the same PR when removing entries).
  # Tracked for migration into backend/test-helpers in https://github.com/vouchington/vouchington/issues/6740.
  - 'backend/data-stores/psql/__tests__/index.extension-table-schema.generated.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-classifiers.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-community-application-answers.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-copyright-legal-clock.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-election-partitioning.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-election-vote-stats-snapshot.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-finite-enums.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-growth-registry.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-ingestion-relations.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-membership-entitlement-effects.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-membership-refund-indexes.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-membership-retained-user-references.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-min-child-uuidv7.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-owner-foreign-keys.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-post-admission-reservation-index.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-post-creation-source-url.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-retained-identities.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-retained-media-behavior.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-retained-media-identities.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-retained-user-audit-foreign-keys.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-static-analysis.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-story-projection-relation-fence.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-user-deletion-relation-impacts.test.mts'
rule:
  any:
    # Package imports of @data-stores/psql (root or SQL client/tx/migration entrypoints)
    - all:
        - kind: import_statement
        - regex: 'from\s+[''"]@data-stores/psql(?:/(?:index|clients|setup|transactions|migrate)(?:\.mts)?)?[''"]'
        - not:
            regex: '^import\s+type\b'
    # Relative imports targeting backend/data-stores/psql (root or SQL client/tx/migration entrypoints)
    - all:
        - kind: import_statement
        - regex: 'from\s+[''"](?:\.\.?/)+[^''"]*data-stores/psql(?:/(?:index|clients|setup|transactions|migrate)(?:\.mts)?)?[''"]'
        - not:
            regex: '^import\s+type\b'
    # Package or relative imports of @data-stores/analytics/query
    - all:
        - kind: import_statement
        - regex: 'from\s+[''"](?:@data-stores/analytics/query|(?:\.\.?/)+[^''"]*data-stores/analytics/query)(?:\.mts)?[''"]'
        - not:
            regex: '^import\s+type\b'
    # Package-internal relative imports of psql/analytics query, transaction, or migration exports.
    # Graceful-shutdown-only teardown imports do not execute SQL; @data-stores/graceful-shutdown
    # requires a signal argument, so psql schema tests keep importing onGracefulShutdown here.
    - all:
        - kind: import_statement
        - regex: '^import\s*(?:\{[^}]*\b(?:read|write|query|beginTransaction|beginBoundedTransaction|createPool|runAllMigrations|refreshMaterializedView)\b[^}]*\}|\*\s+as\s+[A-Za-z_$][\w$]*)\s*from\s+[''"](?:\.\.?/)+(?:index|clients|setup|transactions|migrate|query)(?:\.mts)?[''"]'
        - not:
            regex: '^import\s+type\b'
        - not:
            regex: '^import\s+\*\s+as\s+[A-Za-z_$][\w$]*\s+from\s+[''"]\.\.?/index(?:\.mts)?[''"]'
        - not:
            regex: '^import\s*\{\s*onGracefulShutdown\s*\}\s*from\s+[''"]\.\./index\.mts[''"]'
    # sql-template-strings imports
    - all:
        - kind: import_statement
        - regex: 'from\s+[''"]sql-template-strings[''"]'
        - not:
            regex: '^import\s+type\b'
    # Dynamic import() or require() of psql, analytics/query, relative data-store clients, or sql-template-strings
    - all:
        - kind: call_expression
        - regex: '^(?:require|import)\s*\(\s*[''"](?:@data-stores/psql(?:/(?:index|clients|setup|transactions|migrate)(?:\.mts)?)?|(?:\.\.?/)+[^''"]*data-stores/psql(?:/(?:index|clients|setup|transactions|migrate)(?:\.mts)?)?|@data-stores/analytics/query(?:\.mts)?|(?:\.\.?/)+[^''"]*data-stores/analytics/query(?:\.mts)?|(?:\.\.?/)+(?:clients|setup|transactions|migrate|query)(?:\.mts)?|sql-template-strings)[''"]\s*\)$'
    - pattern: 'sql`$$$`'
    # Raw SQL string, template literal (including interpolated prefix), or concatenated string passed as first argument to a query-like call (including multi-level receivers)
    - all:
        - kind: call_expression
        - regex: '^(?:[\w$]+\.)*(?:query|read|write|tx|transaction|exec|execute|runQuery|allowUnannotatedQuery)(?:<[\s\S]*?>)?\s*\('
        - has:
            field: arguments
            has:
              nthChild: 1
              any:
                - kind: string
                  regex: '^[''"]\s*(?:/\*[\s\S]*?\*/\s*)*(?i:\b(?:SELECT|INSERT|UPDATE|DELETE|WITH|TRUNCATE|ALTER|CREATE|DROP|SET|LOCK|REFRESH|EXPLAIN|VACUUM|ANALYZE|BEGIN)\b)'
                - kind: template_string
                  regex: '^`\s*(?:\$\{[^}]*\}\s*)*(?:/\*[\s\S]*?\*/\s*)*(?i:\b(?:SELECT|INSERT|UPDATE|DELETE|WITH|TRUNCATE|ALTER|CREATE|DROP|SET|LOCK|REFRESH|EXPLAIN|VACUUM|ANALYZE|BEGIN)\b)'
                - kind: binary_expression
                  has:
                    stopBy: end
                    any:
                      - kind: string
                        regex: '^[''"]\s*(?:/\*[\s\S]*?\*/\s*)*(?i:\b(?:SELECT|INSERT|UPDATE|DELETE|WITH|TRUNCATE|ALTER|CREATE|DROP|SET|LOCK|REFRESH|EXPLAIN|VACUUM|ANALYZE|BEGIN)\b)'
                      - kind: template_string
                        regex: '^`\s*(?:\$\{[^}]*\}\s*)*(?:/\*[\s\S]*?\*/\s*)*(?i:\b(?:SELECT|INSERT|UPDATE|DELETE|WITH|TRUNCATE|ALTER|CREATE|DROP|SET|LOCK|REFRESH|EXPLAIN|VACUUM|ANALYZE|BEGIN)\b)'
    # Raw SQL statement (uppercase SQL keywords) passed as first argument to any non-assertion call, awaited or not (catches TransactionQuery variables like setup/blocker/cleanup and Promise.all([...]) without flagging sentence-case Playwright UI text)
    - all:
        - kind: call_expression
        - not:
            regex: '^(?:expect|assert|it|test|describe|console|vi|findFirst\w*Violation|result|beforePostgresTransactionQueryForTest|captureTransactionQuery|executeCapturedStatement)\b'
        - not:
            regex: '^(?:[\w$]+\.)*(?:toContain|toEqual|toBe|toMatch|toThrow|rejects|resolves|includes|startsWith|endsWith|match|replace|replaceAll|split|indexOf|exec|test|push|log|warn|error|info|debug|executeCapturedStatement)\s*\('
        - has:
            field: arguments
            has:
              nthChild: 1
              any:
                - kind: string
                  regex: '^[''"]\s*(?:/\*[\s\S]*?\*/\s*)*\b(?:INSERT\s+INTO\b|DELETE\s+FROM\b|UPDATE\s+[A-Za-z_][A-Za-z0-9_."]*\s+SET\b|SELECT\s+(?:\*|DISTINCT\b|\d+\b|[A-Za-z_][A-Za-z0-9_."]*(?:\s*\(|(?:\s*,\s*[A-Za-z_][A-Za-z0-9_."]*)*\s+(?:FROM|AS)\b))|TRUNCATE\s+(?:TABLE\s+)?[A-Za-z_]|ALTER\s+(?:TABLE|INDEX|VIEW|SCHEMA|TYPE|FUNCTION|MATERIALIZED)\b|CREATE\s+(?:OR\s+REPLACE\s+)?(?:TEMP\s+|TEMPORARY\s+|UNIQUE\s+|MATERIALIZED\s+)?(?:TABLE|INDEX|VIEW|SCHEMA|TYPE|FUNCTION|TRIGGER|EXTENSION)\b|DROP\s+(?:TABLE|INDEX|VIEW|MATERIALIZED|SCHEMA|TYPE|FUNCTION|TRIGGER|EXTENSION)\b|SET\s+(?:LOCAL\s+|SESSION\s+)?[A-Za-z_][A-Za-z0-9_."]*\s*(?:=|TO\b)|LOCK\s+(?:TABLE\s+)?[A-Za-z_]|REFRESH\s+MATERIALIZED\s+VIEW\b|EXPLAIN\b(?:\s*\([^)]*\)|\s+(?:ANALYZE|BUFFERS|COSTS|FORMAT|SETTINGS|SUMMARY|TIMING|VERBOSE|SELECT|INSERT|UPDATE|DELETE|WITH)\b)|VACUUM\b(?:\s*\([^)]*\)|\s+(?:FULL|FREEZE|VERBOSE|ANALYZE|[A-Za-z_]))|ANALYZE\s+(?:VERBOSE\s+)?[A-Za-z_]|WITH\s+(?:RECURSIVE\s+)?[A-Za-z_][A-Za-z0-9_]*\s+AS\s*\(|BEGIN(?:\s+(?:TRANSACTION|WORK|ISOLATION|READ|DEFERRABLE|NOT\s+DEFERRABLE))?\s*;?\s*$)'
                - kind: template_string
                  regex: '^`\s*(?:/\*[\s\S]*?\*/\s*)*\b(?:INSERT\s+INTO\b|DELETE\s+FROM\b|UPDATE\s+[A-Za-z_][A-Za-z0-9_."]*\s+SET\b|SELECT\s+(?:\*|DISTINCT\b|\d+\b|[A-Za-z_][A-Za-z0-9_."]*(?:\s*\(|(?:\s*,\s*[A-Za-z_][A-Za-z0-9_."]*)*\s+(?:FROM|AS)\b))|TRUNCATE\s+(?:TABLE\s+)?[A-Za-z_]|ALTER\s+(?:TABLE|INDEX|VIEW|SCHEMA|TYPE|FUNCTION|MATERIALIZED)\b|CREATE\s+(?:OR\s+REPLACE\s+)?(?:TEMP\s+|TEMPORARY\s+|UNIQUE\s+|MATERIALIZED\s+)?(?:TABLE|INDEX|VIEW|SCHEMA|TYPE|FUNCTION|TRIGGER|EXTENSION)\b|DROP\s+(?:TABLE|INDEX|VIEW|MATERIALIZED|SCHEMA|TYPE|FUNCTION|TRIGGER|EXTENSION)\b|SET\s+(?:LOCAL\s+|SESSION\s+)?[A-Za-z_][A-Za-z0-9_."]*\s*(?:=|TO\b)|LOCK\s+(?:TABLE\s+)?[A-Za-z_]|REFRESH\s+MATERIALIZED\s+VIEW\b|EXPLAIN\b(?:\s*\([^)]*\)|\s+(?:ANALYZE|BUFFERS|COSTS|FORMAT|SETTINGS|SUMMARY|TIMING|VERBOSE|SELECT|INSERT|UPDATE|DELETE|WITH)\b)|VACUUM\b(?:\s*\([^)]*\)|\s+(?:FULL|FREEZE|VERBOSE|ANALYZE|[A-Za-z_]))|ANALYZE\s+(?:VERBOSE\s+)?[A-Za-z_]|WITH\s+(?:RECURSIVE\s+)?[A-Za-z_][A-Za-z0-9_]*\s+AS\s*\(|BEGIN(?:\s+(?:TRANSACTION|WORK|ISOLATION|READ|DEFERRABLE|NOT\s+DEFERRABLE))?\s*;?\s*$)'
    # Raw SQL statement (uppercase SQL keywords) written in an initializer, assignment, property value, or return statement
    - all:
        - any:
            - kind: string
              regex: '^[''"]\s*(?:/\*[\s\S]*?\*/\s*)*\b(?:INSERT\s+INTO\b|DELETE\s+FROM\b|UPDATE\s+[A-Za-z_][A-Za-z0-9_."]*\s+SET\b|SELECT\s+(?:\*|DISTINCT\b|\d+\b|[A-Za-z_][A-Za-z0-9_."]*(?:\s*\(|(?:\s*,\s*[A-Za-z_][A-Za-z0-9_."]*)*\s+(?:FROM|AS)\b))|TRUNCATE\s+(?:TABLE\s+)?[A-Za-z_]|ALTER\s+(?:TABLE|INDEX|VIEW|SCHEMA|TYPE|FUNCTION|MATERIALIZED)\b|CREATE\s+(?:OR\s+REPLACE\s+)?(?:TEMP\s+|TEMPORARY\s+|UNIQUE\s+|MATERIALIZED\s+)?(?:TABLE|INDEX|VIEW|SCHEMA|TYPE|FUNCTION|TRIGGER|EXTENSION)\b|DROP\s+(?:TABLE|INDEX|VIEW|MATERIALIZED|SCHEMA|TYPE|FUNCTION|TRIGGER|EXTENSION)\b|SET\s+(?:LOCAL\s+|SESSION\s+)?[A-Za-z_][A-Za-z0-9_."]*\s*(?:=|TO\b)|LOCK\s+(?:TABLE\s+)?[A-Za-z_]|REFRESH\s+MATERIALIZED\s+VIEW\b|EXPLAIN\b(?:\s*\([^)]*\)|\s+(?:ANALYZE|BUFFERS|COSTS|FORMAT|SETTINGS|SUMMARY|TIMING|VERBOSE|SELECT|INSERT|UPDATE|DELETE|WITH)\b)|VACUUM\b(?:\s*\([^)]*\)|\s+(?:FULL|FREEZE|VERBOSE|ANALYZE|[A-Za-z_]))|ANALYZE\s+(?:VERBOSE\s+)?[A-Za-z_]|WITH\s+(?:RECURSIVE\s+)?[A-Za-z_][A-Za-z0-9_]*\s+AS\s*\(|BEGIN(?:\s+(?:TRANSACTION|WORK|ISOLATION|READ|DEFERRABLE|NOT\s+DEFERRABLE))?\s*;?\s*$)'
            - kind: template_string
              regex: '^`\s*(?:/\*[\s\S]*?\*/\s*)*\b(?:INSERT\s+INTO\b|DELETE\s+FROM\b|UPDATE\s+[A-Za-z_][A-Za-z0-9_."]*\s+SET\b|SELECT\s+(?:\*|DISTINCT\b|\d+\b|[A-Za-z_][A-Za-z0-9_."]*(?:\s*\(|(?:\s*,\s*[A-Za-z_][A-Za-z0-9_."]*)*\s+(?:FROM|AS)\b))|TRUNCATE\s+(?:TABLE\s+)?[A-Za-z_]|ALTER\s+(?:TABLE|INDEX|VIEW|SCHEMA|TYPE|FUNCTION|MATERIALIZED)\b|CREATE\s+(?:OR\s+REPLACE\s+)?(?:TEMP\s+|TEMPORARY\s+|UNIQUE\s+|MATERIALIZED\s+)?(?:TABLE|INDEX|VIEW|SCHEMA|TYPE|FUNCTION|TRIGGER|EXTENSION)\b|DROP\s+(?:TABLE|INDEX|VIEW|MATERIALIZED|SCHEMA|TYPE|FUNCTION|TRIGGER|EXTENSION)\b|SET\s+(?:LOCAL\s+|SESSION\s+)?[A-Za-z_][A-Za-z0-9_."]*\s*(?:=|TO\b)|LOCK\s+(?:TABLE\s+)?[A-Za-z_]|REFRESH\s+MATERIALIZED\s+VIEW\b|EXPLAIN\b(?:\s*\([^)]*\)|\s+(?:ANALYZE|BUFFERS|COSTS|FORMAT|SETTINGS|SUMMARY|TIMING|VERBOSE|SELECT|INSERT|UPDATE|DELETE|WITH)\b)|VACUUM\b(?:\s*\([^)]*\)|\s+(?:FULL|FREEZE|VERBOSE|ANALYZE|[A-Za-z_]))|ANALYZE\s+(?:VERBOSE\s+)?[A-Za-z_]|WITH\s+(?:RECURSIVE\s+)?[A-Za-z_][A-Za-z0-9_]*\s+AS\s*\(|BEGIN(?:\s+(?:TRANSACTION|WORK|ISOLATION|READ|DEFERRABLE|NOT\s+DEFERRABLE))?\s*;?\s*$)'
        - inside:
            any:
              - kind: variable_declarator
              - kind: assignment_expression
              - kind: pair
              - kind: return_statement
              - kind: arrow_function
        - not:
            inside:
              stopBy:
                any:
                  - kind: statement_block
                  - kind: arrow_function
                  - kind: function_declaration
              kind: call_expression
              any:
                - regex: '^(?:expect|assert|it|test|describe|console|vi|findFirst\w*Violation|parsePostgresSql|beforePostgresTransactionQueryForTest|captureTransactionQuery|executeCapturedStatement)\b'
                - regex: '^(?:[\w$]+\.)*(?:toContain|toEqual|toBe|toMatch|toThrow|rejects|resolves|includes|startsWith|endsWith|match|replace|replaceAll|split|indexOf|exec|test|push|log|warn|error|info|debug|executeCapturedStatement)\s*\('
