id: no-sql-in-backend-tests
language: Tsx
severity: error
message: 'Do not write raw SQL in backend tests — add focused helpers under backend/test-helpers instead'
files:
  - 'backend/**/*.test.mts'
  - 'backend/**/__tests__/**/*.mts'
ignores:
  - 'backend/data-stores/psql/**'
  - 'backend/test-helpers/**'
rule:
  any:
    - all:
        - kind: import_statement
        - regex: 'from [''"]@data-stores/psql[''"]'
        - not:
            regex: '^import\s+type\b'
    - all:
        - kind: import_statement
        - regex: 'from [''"]sql-template-strings[''"]'
        - not:
            regex: '^import\s+type\b'
    - pattern: "require('@data-stores/psql')"
    - pattern: "await import('@data-stores/psql')"
    - pattern: "require('sql-template-strings')"
    - pattern: "await import('sql-template-strings')"
    - pattern: 'sql`$$$`'
examples:
  - code: "import { read } from '@data-stores/psql'"
    isValid: false
    file: 'backend/services/auth/auth.test.mts'
  - code: "import { write } from '@data-stores/psql'"
    isValid: false
    file: 'backend/services/auth/auth.test.mts'
  - code: "import { query } from '@data-stores/psql'"
    isValid: false
    file: 'backend/services/auth/auth.test.mts'
  - code: "import { createPool } from '@data-stores/psql'"
    isValid: false
    file: 'backend/services/auth/auth.test.mts'
  - code: "import type { SQLStatement } from '@data-stores/psql'"
    isValid: true
    file: 'backend/services/auth/auth.test.mts'
  - code: "import sql from 'sql-template-strings'"
    isValid: false
    file: 'backend/services/auth/auth.test.mts'
  - code: "const sql = (await import('sql-template-strings')).default"
    isValid: false
    file: 'backend/services/auth/auth.test.mts'
  - code: 'const query = sql`SELECT 1`'
    isValid: false
    file: 'backend/services/auth/auth.test.mts'
  - code: "import { read } from '@data-stores/psql'"
    isValid: true
    file: 'backend/data-stores/psql/index.test.mts'
