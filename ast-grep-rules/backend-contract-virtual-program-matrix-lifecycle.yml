    isValid: true
    file: 'backend/test-helpers/api-fixtures/contract-schema.test.mts'
  - code: |
      beforeAll(register(buildVirtualProgramMatrix(import.meta, sources)))
    isValid: false
    file: 'backend/test-helpers/api-fixtures/contract-schema.test.mts'
  - code: |
      beforeAll(() => register(() => buildVirtualProgramMatrix(import.meta, sources)))
    isValid: false
    file: 'backend/test-helpers/api-fixtures/contract-schema.test.mts'
  - code: |
