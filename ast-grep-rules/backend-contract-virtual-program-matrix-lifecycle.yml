id: backend-contract-virtual-program-matrix-lifecycle
language: Tsx
severity: error
message: >-
  Build the consuming test file's single virtual TypeScript program matrix directly inside the
  function callback passed to beforeAll(). API-fixture helper modules must not hide per-call,
  module-scope, or synthetic-owner matrix construction.
files:
  - 'backend/test-helpers/api-fixtures/**/*.mts'
ignores:
  - 'backend/test-helpers/api-fixtures/virtual-program.mts'
rule:
  any:
    - all:
        - kind: call_expression
          regex: >-
            ^(?:buildVirtualProgramMatrix|[A-Za-z_$][\w$]*(?:\.buildVirtualProgramMatrix|\[['"]buildVirtualProgramMatrix['"]\]))\s*\(
        - not:
            regex: >-
              ^(?:buildVirtualProgramMatrix|[A-Za-z_$][\w$]*(?:\.buildVirtualProgramMatrix|\[['"]buildVirtualProgramMatrix['"]\]))\s*\(\s*import\.meta\s*,
    - all:
        - kind: call_expression
          regex: >-
            ^(?:buildVirtualProgramMatrix|[A-Za-z_$][\w$]*(?:\.buildVirtualProgramMatrix|\[['"]buildVirtualProgramMatrix['"]\]))\s*\(
        - not:
            inside:
              any:
                - all:
                    - kind: arrow_function
                    - inside:
                        kind: arguments
                        inside:
                          kind: call_expression
                          regex: '^beforeAll\s*\('
                - all:
                    - kind: function_expression
                    - inside:
                        kind: arguments
                        inside:
                          kind: call_expression
                          regex: '^beforeAll\s*\('
              stopBy:
                any:
                  - kind: arrow_function
                  - kind: function_expression
                  - kind: generator_function
                  - kind: generator_function_declaration
                  - kind: function_declaration
                  - kind: method_definition
    - all:
        - kind: call_expression
          regex: >-
            ^import\s*\(\s*['"](?:[^'"]*/)?virtual-program(?:\.mts)?['"](?:\s*,[\s\S]*)?\)$
        - not:
            inside:
              kind: type_query
              stopBy: end
    - all:
        - kind: import_statement
          regex: '\bbuildVirtualProgramMatrix\s+as\s+[A-Za-z_$][\w$]*'
        - not:
            regex: '^import\s+type\b'
        - not:
            regex: '\btype\s+buildVirtualProgramMatrix\s+as\b'
    - kind: variable_declarator
      regex: >-
        ^(?:\{[^}]*\bbuildVirtualProgramMatrix\b[^}]*\}|[A-Za-z_$][\w$]*)\s*=\s*(?:buildVirtualProgramMatrix|[A-Za-z_$][\w$]*(?:\.buildVirtualProgramMatrix|\[['"]buildVirtualProgramMatrix['"]\]))$
    - kind: object_pattern
      has:
        regex: '\bbuildVirtualProgramMatrix\b'
        stopBy: end
    - kind: assignment_expression
      regex: >-
        ^(?:\{[^}]*\bbuildVirtualProgramMatrix\b[^}]*\}|[A-Za-z_$][\w$]*)\s*=\s*(?:buildVirtualProgramMatrix|[A-Za-z_$][\w$]*(?:\.buildVirtualProgramMatrix|\[['"]buildVirtualProgramMatrix['"]\]))$
    - all:
        - kind: export_specifier
        - regex: '^(?:buildVirtualProgramMatrix(?:\s+as\s+[A-Za-z_$][\w$]*)?|[A-Za-z_$][\w$]*\s+as\s+buildVirtualProgramMatrix)$'
        - not:
            inside:
              kind: export_statement
              regex: '^export\s+type\b'
examples:
  - code: |
      let matrix
      beforeAll(() => {
        matrix = buildVirtualProgramMatrix(import.meta, sources)
      })
    isValid: true
    file: 'backend/test-helpers/api-fixtures/contract-schema.test.mts'
  - code: |
      let matrix
      beforeAll(() => {
        matrix = buildVirtualProgramMatrix('file:///tmp/not-the-owning-test.mts', sources)
      })
    isValid: false
    file: 'backend/test-helpers/api-fixtures/contract-schema.test.mts'
  - code: |
      beforeAll(async function () {
        matrix = buildVirtualProgramMatrix(import.meta, sources)
      })
    isValid: true
    file: 'backend/test-helpers/api-fixtures/contract-schema.test.mts'
  - code: |
