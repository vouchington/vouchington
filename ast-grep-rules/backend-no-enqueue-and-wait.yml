id: backend-no-enqueue-and-wait
language: Tsx
severity: error
message: Never block a request or job on another job's result; write state and let clients poll.
note: >-
  See the queue checklist's never-wait rule (docs/checklists/backend-queues.md#queue-boundaries).
  This covers addAndWait, waitUntilFinished, and any enqueue...AndWait function or call. Return a
  pending resource and let the client poll it. The ignores below are existing violations, each tied
  to the issue that removes it; drop an entry when its issue lands.
files:
  - 'backend/**/*.mts'
ignores:
  - 'backend/**/*.test.mts'
  - 'backend/**/__tests__/**'
  - 'backend/test-helpers/**'
  # #3264: the addAndWait wrapper and the copyright, appeal, dispute, and report-judgement waits
  # with their callers.
  - 'backend/data-stores/valkey-glide-mq/glide-mq-factory.mts'
  - 'backend/queues/ai-agents/enqueues/appeal-resolution.mts'
  - 'backend/queues/ai-agents/enqueues/copyright-appeal-recommendation.mts'
  - 'backend/queues/ai-agents/enqueues/copyright-email-intake.mts'
  - 'backend/queues/ai-agents/enqueues/copyright-form-screening.mts'
  - 'backend/queues/ai-agents/enqueues/copyright-submission-guidance.mts'
  - 'backend/queues/ai-agents/enqueues/dispute-resolution.mts'
  - 'backend/queues/ai-agents/enqueues/report-judgement.mts'
  - 'backend/api/v1/copyright-notices/submission-guidance-enqueue.mts'
  - 'backend/api/v1/copyright-notices/submission-routes.mts'
  - 'backend/services/copyright-notices/copyright-email-decision-actions.mts'
  - 'backend/services/moderation-appeals/rerun-resolution-draft.mts'
  - 'backend/services/moderation-reports/create.mts'
  - 'backend/services/moderation-reports/rerun-judgement.mts'
  - 'backend/services/review-disputes/rerun-resolution-draft.mts'
  - 'backend/workers/ses-inbound/processors/copyright-email.mts'
  # #2853: the crawler wait path and its caller.
  - 'backend/queues/crawler/enqueues.mts'
  - 'backend/services/rss-feeds/discover-feed.mts'
rule:
  any:
    - pattern: $QUEUE.addAndWait($$$)
    - pattern: $QUEUE.addAndWait = $$$
    - pattern: $JOB.waitUntilFinished($$$)
    - kind: function_declaration
      has:
        field: name
        regex: ^enqueue\w*AndWait$
    - kind: call_expression
      has:
        field: function
        any:
          - kind: identifier
            regex: ^enqueue\w*AndWait$
          - kind: member_expression
            has:
              field: property
              regex: ^enqueue\w*AndWait$
examples:
  - file: backend/services/example/rerun.mts
    code: |
      await queue.addAndWait('judge', data)
    isValid: false
  - file: backend/services/example/rerun.mts
    code: |
      await job.waitUntilFinished(queueEvents)
    isValid: false
  - file: backend/queues/example/enqueues.mts
    code: |
      export async function enqueueReviewAndWait(id: string): Promise<void> {
        await queue.add('review', { id })
      }
    isValid: false
  - file: backend/services/example/rerun.mts
    code: |
      await dependencies.enqueueCrawlUrlAndWait(url)
    isValid: false
  - file: backend/services/example/rerun.mts
    code: |
      await enqueueReviewAndWait(id)
    isValid: false
  - file: backend/services/example/rerun.mts
    code: |
      await invalidateRssFeedItemsAndWaitForPurge(...keys)
    isValid: true
  - file: backend/services/example/rerun.mts
    code: |
      await enqueueReview(id)
    isValid: true
  - file: backend/services/example/rerun.test.mts
    code: |
      await queue.addAndWait('judge', data)
    isValid: true
