# Specific shapes come before it($A, $B, $N). An earlier structural match that
# fails the number constraint does not fall through to the next branch.
rule:
  any:
    - pattern: 'it($A, { timeout: $N }, $F)'
    - pattern: 'test($A, { timeout: $N }, $F)'
    - pattern: 'it($A, { timeout: $N, $$$ }, $F)'
    - pattern: 'test($A, { timeout: $N, $$$ }, $F)'
    - pattern: 'it.each($ARR)($A, { timeout: $N }, $F)'
    - pattern: 'test.each($ARR)($A, { timeout: $N }, $F)'
    - pattern: 'it.each($ARR)($A, { timeout: $N, $$$ }, $F)'
    - pattern: 'test.each($ARR)($A, { timeout: $N, $$$ }, $F)'
    - pattern: 'describe($A, { timeout: $N }, $F)'
    - pattern: 'describe($A, { timeout: $N, $$$ }, $F)'
    - pattern: 'it.each($ARR)($A, $B, $N)'
    - pattern: 'test.each($ARR)($A, $B, $N)'
    - pattern: it.concurrent($A, $B, $N)
    - pattern: test.concurrent($A, $B, $N)
    - pattern: it($A, $B, $N)
    - pattern: test($A, $B, $N)
    - pattern: describe($A, $B, $N)
    - pattern: beforeAll($F, $N)
    - pattern: beforeEach($F, $N)
    - pattern: afterAll($F, $N)
    - pattern: afterEach($F, $N)
constraints:
  N:
    kind: number
    regex: '^(?:3000[1-9]|300[1-9][0-9]|30[1-9][0-9]{2}|3[1-9][0-9]{3}|[4-9][0-9]{4}|[1-9][0-9]{5,}|30_(?:[0-9][0-9][1-9]|[0-9][1-9][0-9]|[1-9][0-9][0-9])|3[1-9]_[0-9]{3}|[4-9][0-9]_[0-9]{3}|[1-9][0-9]{2,}_[0-9]{3}(?:_[0-9]{3})*)$'
examples:
  - code: |
      it('slow', async () => {}, 60_000)
    isValid: false
    file: 'backend/services/example-suite-rules.test.mts'
  - code: |
      it('bounded', { timeout: 45_000 }, async () => {})
    isValid: false
    file: 'backend/services/example-suite-rules.test.mts'
  - code: |
      describe('slow', { timeout: 45_000 }, () => {})
    isValid: false
    file: 'backend/services/example-suite-rules.test.mts'
  - code: |
      it.each([1])('slow %s', { timeout: 45_000 }, async () => {})
    isValid: false
    file: 'backend/services/example-suite-rules.test.mts'
  - code: |
      describe('cap', { timeout: 30_000 }, () => {})
    isValid: true
    file: 'backend/services/example-suite-rules.test.mts'
  - code: |
      beforeAll(async () => {}, 60_000)
    isValid: false
    file: 'backend/services/example-suite-rules.test.mts'
  - code: |
      it('default', async () => {}, 5_000)
    isValid: true
    file: 'backend/services/example-suite-rules.test.mts'
  - code: |
      it('cap', async () => {}, 30_000)
    isValid: true
    file: 'backend/services/example-suite-rules.test.mts'
  - code: |
      expect(options).toMatchObject({ timeout: 60_000 })
    isValid: true
    file: 'backend/services/example-suite-rules.test.mts'
