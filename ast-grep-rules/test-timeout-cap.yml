id: test-timeout-cap
language: Tsx
severity: error
message: >-
  A test timeout override is at most 30 seconds. Fix the slow test instead of
  raising it. Interim ast-grep until no-mistakes vitest-timeout-cap ships
  (jonathanong/no-mistakes#1566).
files:
  - '**/*.test.ts'
  - '**/*.test.tsx'
  - '**/*.test.mts'
  - '**/*.spec.ts'
  - '**/*.spec.tsx'
  - '**/*.spec.mts'
  - '**/test-helpers/**/*.ts'
  - '**/test-helpers/**/*.mts'
  - 'test-helpers/**/*.ts'
  - 'test-helpers/**/*.mts'
# Playwright keeps its own action and test budgets. This cap is the vitest rule.
ignores:
