id: backend-no-single-enqueue-in-loop
language: Tsx
severity: warning
message: Enqueue a loop's jobs with the owning queue package's bulk enqueue function (enqueueBulk...) instead of one single-job enqueue per iteration.
note: >-
  Each single enqueue is its own Valkey round trip and its own analytics event. This covers a
  for, for-in, for-of, while, or do statement and a map, forEach, or flatMap callback. Add the
  whole batch with the queue package's bulk enqueue function (created with
  createBulkEnqueueFunction, named enqueueBulk followed by the job), keeping each job's dedup id,
  jobId, priority, and delay in its buildJob. Awaited fan-out stays awaited. A deliberately
  sequential enqueue, such as a reactivation helper that reads the retained job first, needs an
  ast-grep-ignore comment with the reason.
files:
  - 'backend/**/*.mts'
ignores:
  - 'backend/**/*.test.mts'
  - 'backend/**/__tests__/**'
  - 'backend/test-helpers/**'
rule:
  any:
    - kind: call_expression
      all:
        - any:
            - has:
                field: function
                kind: identifier
                regex: ^enqueue[A-Z]
            - has:
                field: function
                kind: member_expression
                has:
                  field: property
                  kind: property_identifier
                  regex: ^enqueue[A-Z]
        - not:
            any:
              - has:
                  field: function
                  kind: identifier
                  regex: ^enqueueBulk
              - has:
                  field: function
                  kind: member_expression
                  has:
                    field: property
                    kind: property_identifier
                    regex: ^enqueueBulk
        - any:
            - inside:
                stopBy: end
                any:
                  - kind: for_statement
                  - kind: for_in_statement
                  - kind: while_statement
                  - kind: do_statement
            # A callback argument of map/forEach/flatMap; the receiver of such a call does not count.
            - inside:
                stopBy: end
                field: arguments
                kind: call_expression
                has:
                  field: function
                  kind: member_expression
                  has:
                    field: property
                    kind: property_identifier
                    regex: ^(map|forEach|flatMap)$
    # A bare enqueue function passed as the callback itself: rows.map(enqueueFoo).
    - all:
        - any:
            - all:
                - kind: identifier
                - regex: ^enqueue[A-Z]
                - not:
                    regex: ^enqueueBulk
            - all:
                - kind: member_expression
                - has:
                    field: property
                    kind: property_identifier
                    regex: ^enqueue[A-Z]
                - not:
                    has:
                      field: property
                      kind: property_identifier
                      regex: ^enqueueBulk
        - inside:
            kind: arguments
            inside:
              kind: call_expression
              has:
                field: function
                kind: member_expression
                has:
                  field: property
                  kind: property_identifier
                  regex: ^(map|forEach|flatMap)$
examples:
