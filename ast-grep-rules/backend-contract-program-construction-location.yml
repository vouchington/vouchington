id: backend-contract-program-construction-location
language: Tsx
severity: error
message: >-
  TypeScript compiler hosts, programs, and language services for backend API contracts must be constructed only in
  backend-program.mts. Reuse loadBackendProgram() or
  buildVirtualProgramMatrix().
files:
  - 'backend/test-helpers/api-fixtures/**/*.mts'
ignores:
  - 'backend/test-helpers/api-fixtures/backend-program.mts'
rule:
  # The compiler-host, program, builder, watch, solution-builder, and language-service factory
  # list below is duplicated
  # verbatim across every regex arm below because YAML cannot import JS: it must stay in sync by
  # hand with the canonical `FACTORIES` set in
  # static-code-analysis/oxlint-plugin/typescript-program-surface.cjs, which is the single source
  # of truth for which `ts.*` factory names count as program/language-service construction.
  any:
    # These two forms are context-free: the exact module is present in the matched syntax. Static
    # default/namespace imports and all transitive aliases are owned by the scope-aware Oxlint rule.
    - all:
        - kind: import_specifier
        - regex: >-
            ^(?:['"])?(?:create(?:CompilerHost|IncrementalCompilerHost|WatchCompilerHost|SolutionBuilderHost|SolutionBuilderWithWatchHost|Program|AbstractBuilder|IncrementalProgram|SemanticDiagnosticsBuilderProgram|EmitAndSemanticDiagnosticsBuilderProgram|LanguageService|WatchProgram|BuilderProgram|BuilderProgramUsingIncrementalBuildInfo|RedirectedBuilderProgram|SolutionBuilderWithWatch|SolutionBuilder)|readBuilderProgram)(?:['"])?(?:\s+as\b|$)
        - inside:
            stopBy: end
            all:
              - kind: import_statement
              - regex: '\bfrom\s*[''"]typescript[''"]'
              - not:
                  regex: '^import\s+type\b'
    - kind: call_expression
      regex: >-
        ^\(\s*await\s+import\(\s*['"]typescript['"]\s*\)\s*\)\s*(?:(?:\.|\?\.)\s*(?:create(?:CompilerHost|IncrementalCompilerHost|WatchCompilerHost|SolutionBuilderHost|SolutionBuilderWithWatchHost|Program|AbstractBuilder|IncrementalProgram|SemanticDiagnosticsBuilderProgram|EmitAndSemanticDiagnosticsBuilderProgram|LanguageService|WatchProgram|BuilderProgram|BuilderProgramUsingIncrementalBuildInfo|RedirectedBuilderProgram|SolutionBuilderWithWatch|SolutionBuilder)|readBuilderProgram)|(?:\[|\?\.\s*\[)\s*['"](?:create(?:CompilerHost|IncrementalCompilerHost|WatchCompilerHost|SolutionBuilderHost|SolutionBuilderWithWatchHost|Program|AbstractBuilder|IncrementalProgram|SemanticDiagnosticsBuilderProgram|EmitAndSemanticDiagnosticsBuilderProgram|LanguageService|WatchProgram|BuilderProgram|BuilderProgramUsingIncrementalBuildInfo|RedirectedBuilderProgram|SolutionBuilderWithWatch|SolutionBuilder)|readBuilderProgram)['"]\s*\])\s*(?:\?\.)?\s*(?:<[\s\S]+>\s*)?\(
    # createRequire(<arg>)('typescript').FACTORY(...) is the one createRequire()/require() loader
    # shape that is "context-free": the whole chain -- call, module string, and factory member --
    # is one expression, with no variable hop for ast-grep (which has no data-flow/scope
    # analysis) to lose track of. This arm matches on the literal `createRequire` identifier and
    # cannot verify it is actually bound to node:module's export, so it will also flag a
    # same-named/same-shaped domain helper -- a false positive ast-grep cannot avoid here. Every
    # multi-statement, destructured, aliased, shadowed-parameter, or reassignment ("kill-pattern")
    # variant of this loader shape is explicitly out of scope for this arm and stays covered only
    # by the scope-aware AST-walking Oxlint rule (create-require-provenance.cjs), which is
    # authoritative for createRequire()/require() provenance.
    - kind: call_expression
      regex: >-
        ^createRequire\([\s\S]*?\)\s*\(\s*['"]typescript['"]\s*\)\s*(?:(?:\.|\?\.)\s*(?:create(?:CompilerHost|IncrementalCompilerHost|WatchCompilerHost|SolutionBuilderHost|SolutionBuilderWithWatchHost|Program|AbstractBuilder|IncrementalProgram|SemanticDiagnosticsBuilderProgram|EmitAndSemanticDiagnosticsBuilderProgram|LanguageService|WatchProgram|BuilderProgram|BuilderProgramUsingIncrementalBuildInfo|RedirectedBuilderProgram|SolutionBuilderWithWatch|SolutionBuilder)|readBuilderProgram)|(?:\[|\?\.\s*\[)\s*['"](?:create(?:CompilerHost|IncrementalCompilerHost|WatchCompilerHost|SolutionBuilderHost|SolutionBuilderWithWatchHost|Program|AbstractBuilder|IncrementalProgram|SemanticDiagnosticsBuilderProgram|EmitAndSemanticDiagnosticsBuilderProgram|LanguageService|WatchProgram|BuilderProgram|BuilderProgramUsingIncrementalBuildInfo|RedirectedBuilderProgram|SolutionBuilderWithWatch|SolutionBuilder)|readBuilderProgram)['"]\s*\])\s*(?:\?\.)?\s*(?:<[\s\S]+>\s*)?\(
    - kind: variable_declarator
      regex: >-
        ^[A-Za-z_$][\w$]*\s*=\s*(?:\(\s*await\s+import\(\s*['"]typescript['"]\s*\)\s*\)\s*(?:(?:\.|\?\.)\s*(?:create(?:CompilerHost|IncrementalCompilerHost|WatchCompilerHost|SolutionBuilderHost|SolutionBuilderWithWatchHost|Program|AbstractBuilder|IncrementalProgram|SemanticDiagnosticsBuilderProgram|EmitAndSemanticDiagnosticsBuilderProgram|LanguageService|WatchProgram|BuilderProgram|BuilderProgramUsingIncrementalBuildInfo|RedirectedBuilderProgram|SolutionBuilderWithWatch|SolutionBuilder)|readBuilderProgram)|(?:\[|\?\.\s*\[)\s*['"](?:create(?:CompilerHost|IncrementalCompilerHost|WatchCompilerHost|SolutionBuilderHost|SolutionBuilderWithWatchHost|Program|AbstractBuilder|IncrementalProgram|SemanticDiagnosticsBuilderProgram|EmitAndSemanticDiagnosticsBuilderProgram|LanguageService|WatchProgram|BuilderProgram|BuilderProgramUsingIncrementalBuildInfo|RedirectedBuilderProgram|SolutionBuilderWithWatch|SolutionBuilder)|readBuilderProgram)['"]\s*\]))$
    - kind: assignment_expression
      regex: >-
        ^[A-Za-z_$][\w$]*\s*=\s*\(\s*await\s+import\(\s*['"]typescript['"]\s*\)\s*\)\s*(?:(?:\.|\?\.)\s*(?:create(?:CompilerHost|IncrementalCompilerHost|WatchCompilerHost|SolutionBuilderHost|SolutionBuilderWithWatchHost|Program|AbstractBuilder|IncrementalProgram|SemanticDiagnosticsBuilderProgram|EmitAndSemanticDiagnosticsBuilderProgram|LanguageService|WatchProgram|BuilderProgram|BuilderProgramUsingIncrementalBuildInfo|RedirectedBuilderProgram|SolutionBuilderWithWatch|SolutionBuilder)|readBuilderProgram)|(?:\[|\?\.\s*\[)\s*['"](?:create(?:CompilerHost|IncrementalCompilerHost|WatchCompilerHost|SolutionBuilderHost|SolutionBuilderWithWatchHost|Program|AbstractBuilder|IncrementalProgram|SemanticDiagnosticsBuilderProgram|EmitAndSemanticDiagnosticsBuilderProgram|LanguageService|WatchProgram|BuilderProgram|BuilderProgramUsingIncrementalBuildInfo|RedirectedBuilderProgram|SolutionBuilderWithWatch|SolutionBuilder)|readBuilderProgram)['"]\s*\])$
    - all:
        - kind: variable_declarator
        - has:
            field: value
            regex: '^await\s+import\(\s*[''"]typescript[''"]\s*\)$'
        - has:
            field: name
            all:
              - kind: object_pattern
              - has:
                  stopBy: neighbor
                  matches: protected-factory-destructure-key
    - all:
        - kind: assignment_expression
        - has:
            field: right
            regex: '^await\s+import\(\s*[''"]typescript[''"]\s*\)$'
        - has:
            field: left
            all:
              - kind: object_pattern
              - has:
                  stopBy: neighbor
                  matches: protected-factory-destructure-key
    - kind: export_statement
      regex: >-
        ^export\s+\*(?:\s+as\s+[A-Za-z_$][\w$]*)?\s+from\s*['"]typescript['"]
    - all:
        - kind: export_specifier
        - regex: >-
            ^(?:['"])?(?:create(?:CompilerHost|IncrementalCompilerHost|WatchCompilerHost|SolutionBuilderHost|SolutionBuilderWithWatchHost|Program|AbstractBuilder|IncrementalProgram|SemanticDiagnosticsBuilderProgram|EmitAndSemanticDiagnosticsBuilderProgram|LanguageService|WatchProgram|BuilderProgram|BuilderProgramUsingIncrementalBuildInfo|RedirectedBuilderProgram|SolutionBuilderWithWatch|SolutionBuilder)|readBuilderProgram)(?:['"])?(?:\s+as\s+[\s\S]+)?$
        - not:
            regex: '^type\b'
        - inside:
            stopBy: end
            kind: export_statement
            regex: >-
              \sfrom\s*['"]typescript['"]
        - not:
            inside:
              stopBy: end
              kind: export_statement
              regex: '\bexport\s+type\b'
    - all:
        - kind: export_specifier
        - regex: '^(?:[''"])?default(?:[''"])?(?:\s+as\s+[\s\S]+)?$'
        - inside:
            stopBy: end
            kind: export_statement
            regex: >-
              \sfrom\s*['"]typescript['"]
        - not:
            inside:
              stopBy: end
              kind: export_statement
              regex: '\bexport\s+type\b'
utils:
  protected-factory-destructure-key:
    any:
      - kind: shorthand_property_identifier_pattern
        regex: >-
          ^(?:create(?:CompilerHost|IncrementalCompilerHost|WatchCompilerHost|SolutionBuilderHost|SolutionBuilderWithWatchHost|Program|AbstractBuilder|IncrementalProgram|SemanticDiagnosticsBuilderProgram|EmitAndSemanticDiagnosticsBuilderProgram|LanguageService|WatchProgram|BuilderProgram|BuilderProgramUsingIncrementalBuildInfo|RedirectedBuilderProgram|SolutionBuilderWithWatch|SolutionBuilder)|readBuilderProgram)$
      - all:
          - kind: object_assignment_pattern
          - has:
              field: left
              kind: shorthand_property_identifier_pattern
              regex: >-
                ^(?:create(?:CompilerHost|IncrementalCompilerHost|WatchCompilerHost|SolutionBuilderHost|SolutionBuilderWithWatchHost|Program|AbstractBuilder|IncrementalProgram|SemanticDiagnosticsBuilderProgram|EmitAndSemanticDiagnosticsBuilderProgram|LanguageService|WatchProgram|BuilderProgram|BuilderProgramUsingIncrementalBuildInfo|RedirectedBuilderProgram|SolutionBuilderWithWatch|SolutionBuilder)|readBuilderProgram)$
      - all:
          - kind: pair_pattern
          - has:
              field: key
              regex: >-
                ^(?:(?:create(?:CompilerHost|IncrementalCompilerHost|WatchCompilerHost|SolutionBuilderHost|SolutionBuilderWithWatchHost|Program|AbstractBuilder|IncrementalProgram|SemanticDiagnosticsBuilderProgram|EmitAndSemanticDiagnosticsBuilderProgram|LanguageService|WatchProgram|BuilderProgram|BuilderProgramUsingIncrementalBuildInfo|RedirectedBuilderProgram|SolutionBuilderWithWatch|SolutionBuilder)|readBuilderProgram)|['"](?:create(?:CompilerHost|IncrementalCompilerHost|WatchCompilerHost|SolutionBuilderHost|SolutionBuilderWithWatchHost|Program|AbstractBuilder|IncrementalProgram|SemanticDiagnosticsBuilderProgram|EmitAndSemanticDiagnosticsBuilderProgram|LanguageService|WatchProgram|BuilderProgram|BuilderProgramUsingIncrementalBuildInfo|RedirectedBuilderProgram|SolutionBuilderWithWatch|SolutionBuilder)|readBuilderProgram)['"]|\[\s*(?:['"](?:create(?:CompilerHost|IncrementalCompilerHost|WatchCompilerHost|SolutionBuilderHost|SolutionBuilderWithWatchHost|Program|AbstractBuilder|IncrementalProgram|SemanticDiagnosticsBuilderProgram|EmitAndSemanticDiagnosticsBuilderProgram|LanguageService|WatchProgram|BuilderProgram|BuilderProgramUsingIncrementalBuildInfo|RedirectedBuilderProgram|SolutionBuilderWithWatch|SolutionBuilder)|readBuilderProgram)['"]|`(?:create(?:CompilerHost|IncrementalCompilerHost|WatchCompilerHost|SolutionBuilderHost|SolutionBuilderWithWatchHost|Program|AbstractBuilder|IncrementalProgram|SemanticDiagnosticsBuilderProgram|EmitAndSemanticDiagnosticsBuilderProgram|LanguageService|WatchProgram|BuilderProgram|BuilderProgramUsingIncrementalBuildInfo|RedirectedBuilderProgram|SolutionBuilderWithWatch|SolutionBuilder)|readBuilderProgram)`)\s*\])$
examples:
