id: no-sql-in-psql-tests
language: Tsx
severity: warning
message: 'Raw SQL in PSQL-owned tests is temporary rollout debt — move it to focused test helpers'
files:
  - 'backend/data-stores/psql/**/*.test.mts'
  - 'backend/data-stores/psql/**/__tests__/**/*.mts'
rule:
  any:
    - all:
        - kind: import_statement
        - regex: 'from [''"]@data-stores/psql[''"]'
        - not:
            regex: '^import\s+type\b'
    - all:
        - kind: import_statement
        - regex: 'from [''"]sql-template-strings[''"]'
        - not:
            regex: '^import\s+type\b'
    - pattern: "require('@data-stores/psql')"
    - pattern: "await import('@data-stores/psql')"
    - pattern: "require('sql-template-strings')"
    - pattern: "await import('sql-template-strings')"
    - pattern: 'sql`$$$`'
examples:
  - code: "import { read } from '@data-stores/psql'"
    isValid: false
    file: 'backend/data-stores/psql/__tests__/schema.test.mts'
  - code: "import sql from 'sql-template-strings'"
    isValid: false
    file: 'backend/data-stores/psql/__tests__/schema.test.mts'
  - code: 'const query = sql`SELECT 1`'
    isValid: false
    file: 'backend/data-stores/psql/__tests__/schema.test.mts'
  - code: "const db = require('@data-stores/psql')"
    isValid: false
    file: 'backend/data-stores/psql/__tests__/schema.test.mts'
  - code: "const db = await import('@data-stores/psql')"
    isValid: false
    file: 'backend/data-stores/psql/__tests__/schema.test.mts'
  - code: "const sql = require('sql-template-strings')"
    isValid: false
    file: 'backend/data-stores/psql/__tests__/schema.test.mts'
  - code: "const sql = await import('sql-template-strings')"
    isValid: false
    file: 'backend/data-stores/psql/__tests__/schema.test.mts'
  - code: "import { read } from '@data-stores/psql'"
    isValid: false
    file: 'backend/data-stores/psql/query-capture.test.mts'
  - code: "import type { SQLStatement } from '@data-stores/psql'"
    isValid: true
    file: 'backend/data-stores/psql/__tests__/schema.test.mts'
  - code: "import { read } from '@data-stores/psql'"
    isValid: true
    file: 'backend/test-helpers/data-stores/psql/schema.mts'
  - code: "import { read } from '@data-stores/psql'"
    isValid: true
    file: 'backend/services/auth/auth.test.mts'
