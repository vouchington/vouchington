id: backend-no-globalthis-fetch
language: Tsx
severity: error
message: 'Backend fetch calls must import fetch from undici and pass an approved external or provider dispatcher'
files:
  - 'backend/**/*.ts'
  - 'backend/**/*.mts'
  - 'backend/**/*.cts'
rule:
  any:
    - pattern: globalThis.fetch
    - pattern: global.fetch
    - all:
        - kind: call_expression
        - pattern: fetch($$$ARGS)
        - not:
            any:
              - pattern: 'fetch($URL, { dispatcher: getExternalRequestDispatcher() })'
              - pattern: 'fetch($URL, { dispatcher: getLongRunningExternalRequestDispatcher() })'
              - pattern: 'fetch($URL, { dispatcher: getProviderRequestDispatcher($PROVIDER) })'
              - pattern: fetch($URL, { dispatcher })
              - pattern: 'fetch($URL, { dispatcher: getExternalRequestDispatcher(), $$$AFTER })'
              - pattern: 'fetch($URL, { dispatcher: getLongRunningExternalRequestDispatcher(), $$$AFTER })'
              - pattern: 'fetch($URL, { dispatcher: getProviderRequestDispatcher($PROVIDER), $$$AFTER })'
              - pattern: fetch($URL, { dispatcher, $$$AFTER })
              - pattern: 'fetch($URL, { $$$BEFORE, dispatcher: getExternalRequestDispatcher() })'
              - pattern: 'fetch($URL, { $$$BEFORE, dispatcher: getLongRunningExternalRequestDispatcher() })'
              - pattern: 'fetch($URL, { $$$BEFORE, dispatcher: getProviderRequestDispatcher($PROVIDER) })'
              - pattern: fetch($URL, { $$$BEFORE, dispatcher })
              - pattern: 'fetch($URL, { $$$BEFORE, dispatcher: getExternalRequestDispatcher(), $$$AFTER })'
              - pattern: 'fetch($URL, { $$$BEFORE, dispatcher: getLongRunningExternalRequestDispatcher(), $$$AFTER })'
              - pattern: 'fetch($URL, { $$$BEFORE, dispatcher: getProviderRequestDispatcher($PROVIDER), $$$AFTER })'
              - pattern: fetch($URL, { $$$BEFORE, dispatcher, $$$AFTER })
    - all:
        - kind: call_expression
        - pattern: fetch($$$ARGS)
        - not:
            inside:
              kind: program
              stopBy: end
              has:
                kind: import_statement
                regex: >-
                  import\s*\{\s*fetch\s*\}\s*from .undici.
                stopBy: end
    - all:
        - kind: call_expression
        - pattern: $UNDICI.fetch($$$ARGS)
        - inside:
            kind: program
            stopBy: end
            has:
              kind: import_statement
              any:
                - pattern: import * as $UNDICI from 'undici'
                - pattern: import $UNDICI from 'undici'
              stopBy: end
        - not:
            any:
              - pattern: '$UNDICI.fetch($URL, { dispatcher: getExternalRequestDispatcher() })'
              - pattern: '$UNDICI.fetch($URL, { dispatcher: getLongRunningExternalRequestDispatcher() })'
              - pattern: '$UNDICI.fetch($URL, { dispatcher: getProviderRequestDispatcher($PROVIDER) })'
              - pattern: $UNDICI.fetch($URL, { dispatcher })
              - pattern: '$UNDICI.fetch($URL, { dispatcher: getExternalRequestDispatcher(), $$$AFTER })'
              - pattern: '$UNDICI.fetch($URL, { dispatcher: getLongRunningExternalRequestDispatcher(), $$$AFTER })'
              - pattern: '$UNDICI.fetch($URL, { dispatcher: getProviderRequestDispatcher($PROVIDER), $$$AFTER })'
              - pattern: $UNDICI.fetch($URL, { dispatcher, $$$AFTER })
              - pattern: '$UNDICI.fetch($URL, { $$$BEFORE, dispatcher: getExternalRequestDispatcher() })'
              - pattern: '$UNDICI.fetch($URL, { $$$BEFORE, dispatcher: getLongRunningExternalRequestDispatcher() })'
              - pattern: '$UNDICI.fetch($URL, { $$$BEFORE, dispatcher: getProviderRequestDispatcher($PROVIDER) })'
              - pattern: $UNDICI.fetch($URL, { $$$BEFORE, dispatcher })
              - pattern: '$UNDICI.fetch($URL, { $$$BEFORE, dispatcher: getExternalRequestDispatcher(), $$$AFTER })'
              - pattern: '$UNDICI.fetch($URL, { $$$BEFORE, dispatcher: getLongRunningExternalRequestDispatcher(), $$$AFTER })'
              - pattern: '$UNDICI.fetch($URL, { $$$BEFORE, dispatcher: getProviderRequestDispatcher($PROVIDER), $$$AFTER })'
              - pattern: $UNDICI.fetch($URL, { $$$BEFORE, dispatcher, $$$AFTER })
    - all:
        - kind: call_expression
        - pattern: $FETCH($$$ARGS)
        - inside:
            kind: program
            stopBy: end
            has:
              kind: import_statement
              any:
                - pattern: import { fetch as $FETCH } from 'undici'
                - pattern: import { fetch as $FETCH, $AFTER } from 'undici'
                - pattern: import { $BEFORE, fetch as $FETCH } from 'undici'
                - pattern: import { $BEFORE, fetch as $FETCH, $AFTER } from 'undici'
              stopBy: end
        - not:
            any:
              - pattern: '$FETCH($URL, { dispatcher: getExternalRequestDispatcher() })'
              - pattern: '$FETCH($URL, { dispatcher: getLongRunningExternalRequestDispatcher() })'
              - pattern: '$FETCH($URL, { dispatcher: getProviderRequestDispatcher($PROVIDER) })'
              - pattern: $FETCH($URL, { dispatcher })
              - pattern: '$FETCH($URL, { dispatcher: getExternalRequestDispatcher(), $$$AFTER })'
              - pattern: '$FETCH($URL, { dispatcher: getLongRunningExternalRequestDispatcher(), $$$AFTER })'
              - pattern: '$FETCH($URL, { dispatcher: getProviderRequestDispatcher($PROVIDER), $$$AFTER })'
              - pattern: $FETCH($URL, { dispatcher, $$$AFTER })
              - pattern: '$FETCH($URL, { $$$BEFORE, dispatcher: getExternalRequestDispatcher() })'
              - pattern: '$FETCH($URL, { $$$BEFORE, dispatcher: getLongRunningExternalRequestDispatcher() })'
              - pattern: '$FETCH($URL, { $$$BEFORE, dispatcher: getProviderRequestDispatcher($PROVIDER) })'
              - pattern: $FETCH($URL, { $$$BEFORE, dispatcher })
              - pattern: '$FETCH($URL, { $$$BEFORE, dispatcher: getExternalRequestDispatcher(), $$$AFTER })'
              - pattern: '$FETCH($URL, { $$$BEFORE, dispatcher: getLongRunningExternalRequestDispatcher(), $$$AFTER })'
              - pattern: '$FETCH($URL, { $$$BEFORE, dispatcher: getProviderRequestDispatcher($PROVIDER), $$$AFTER })'
              - pattern: $FETCH($URL, { $$$BEFORE, dispatcher, $$$AFTER })
examples:
  - code: 'const response = await globalThis.fetch(url)'
    isValid: false
    file: 'backend/services/oauth-apple/index.mts'
  - code: 'const response = await global.fetch(url)'
