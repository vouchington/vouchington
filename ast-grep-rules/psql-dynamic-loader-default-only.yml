id: psql-dynamic-loader-default-only
language: Tsx
severity: error
message: 'dynamically loaded PostgreSQL modules may only export a default function'
files:
  - 'backend/data-stores/psql/config-driven/*.mts'
  - 'backend/data-stores/psql/migrations/*.mts'
ignores:
  - 'backend/data-stores/psql/config-driven/__tests__/**'
  - 'backend/data-stores/psql/config-driven/utils/**'
rule:
  all:
    - kind: export_statement
    - not:
        all:
          - pattern: 'export default $VALUE'
          - has:
              stopBy: neighbor
              any:
                - kind: function_declaration
                - kind: function_expression
                - kind: arrow_function
examples:
  - code: 'export default function generateSql() { return "SELECT 1" }'
    isValid: true
    file: 'backend/data-stores/psql/config-driven/0000-sample.mts'
  - code: 'export default function generateSql(): string { return "SELECT 1" }'
    isValid: true
    file: 'backend/data-stores/psql/config-driven/0000-sample.mts'
  - code: 'export default async function generateSql(): Promise<string> { return "SELECT 1" }'
    isValid: true
    file: 'backend/data-stores/psql/config-driven/0000-sample.mts'
  - code: 'export default async () => "SELECT 1"'
    isValid: true
    file: 'backend/data-stores/psql/migrations/0000-sample.mts'
  - code: 'export default async (): Promise<string> => "SELECT 1"'
    isValid: true
    file: 'backend/data-stores/psql/migrations/0000-sample.mts'
