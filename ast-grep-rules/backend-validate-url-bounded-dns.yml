id: backend-validate-url-bounded-dns
language: Tsx
severity: error
message: >-
  Dependency-injected validateUrl() has no DNS/SSRF resolution timeout unless a `signal` or
  `timeoutMs` option is passed — pass `{ timeoutMs: <5000-or-your-file's-DNS-timeout-constant> }` or
  forward a caller AbortSignal (see backend/services/crawls/crawl-url/safety.mts and #10833). Direct
  ssrf-guard/node imports are enforced by no-mistakes/require-options-on-imported-call in Oxlint.
files:
  - 'backend/**/*.ts'
  - 'backend/**/*.mts'
  - 'backend/**/*.cts'
  - 'lambdas/**/*.ts'
  - 'lambdas/**/*.mts'
  - 'lambdas/**/*.cts'
rule:
  all:
    - kind: call_expression
    - has:
        field: function
        all:
          - any:
              - kind: member_expression
              - kind: subscript_expression
          - has:
              field: object
              kind: identifier
              regex: '^(deps|dependencies)$'
          - any:
              - has:
                  field: property
                  kind: property_identifier
                  regex: '^validateUrl$'
              - has:
                  field: index
                  all:
                    - kind: string
                    - has:
                        kind: string_fragment
                        regex: '^validateUrl$'
    - any:
        - has:
            field: arguments
            pattern:
              context: $CALL($URL)
              selector: arguments
        - has:
            field: arguments
            pattern:
              context: $CALL($URL, {})
              selector: arguments
examples:
  - code: |-
      resolvedAddresses = await deps.validateUrl(actorUri)
    isValid: false
