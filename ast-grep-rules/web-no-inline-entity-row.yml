id: web-no-inline-entity-row
language: Tsx
severity: error
message: 'Use the canonical entity list-item component from docs/requirements/navigation/COMPONENTS.md#canonical-entity-list-item-components instead of rebuilding this entity row inline.'
files:
  - 'web/**/*.tsx'
ignores:
  - 'web/**/*.test.tsx'
  - 'web/**/*.mock.test.tsx'
  - 'web/**/*.stories.tsx'
  # Canonical components and documented exceptions listed in COMPONENTS.md.
  - 'web/components/sources/rss-feed-list-item.tsx'
  - 'web/components/sources/source-list-item.tsx'
  - 'web/components/sources/article-list-item.tsx'
  - 'web/components/sources/video-list-item.tsx'
  - 'web/components/podcasts/podcast-list-item.tsx'
  - 'web/components/podcasts/podcast-show-card.tsx'
  - 'web/components/users/user-list.tsx'
  - 'web/components/users/user-link.tsx'
  - 'web/components/communities/community-card.tsx'
  - 'web/components/communities/community-member-row.tsx'
  - 'web/components/communities/community-list-item-card.tsx'
  - 'web/components/topics/topic-communities-aside-content.tsx'
  - 'web/components/domains/hostname-list-item.tsx'
  - 'web/app/(topics)/domains/compare/page.tsx'
  - 'web/components/referral-links/referral-link-card.tsx'
  - 'web/components/feed/referral-link-feed-card.tsx'
  - 'web/components/notifications/notification-row.tsx'
rule:
  all:
    - any:
        - pattern: '<Card $$$>$$$</Card>'
        - pattern: '<HoverableCard $$$>$$$</HoverableCard>'
        - pattern: '<article $$$>$$$</article>'
        - pattern: '<tr $$$>$$$</tr>'
        - pattern: '<TableRow $$$>$$$</TableRow>'
        # Conservative div shell coverage: catch canonical card/row class strings
        # without treating every layout wrapper <div> as a list-item candidate.
        - all:
            - pattern: '<div $$$>$$$</div>'
            - has:
                stopBy: end
                kind: jsx_attribute
                all:
                  - has:
                      stopBy: neighbor
                      kind: property_identifier
                      regex: '^data-pw$'
                  - has:
                      stopBy: end
                      kind: string_fragment
                      regex: '^referral-link(-feed)?-card$'
        - all:
            - pattern: '<div $$$>$$$</div>'
            - has:
                stopBy: end
                kind: string_fragment
                regex: 'rounded-md border bg-card'
        - all:
            - pattern: '<div $$$>$$$</div>'
            - has:
                stopBy: end
                kind: string_fragment
                regex: 'border-b (p-4|px-3 py-3)'
    - any:
        - has:
            stopBy: end
            pattern: '<RssFeedActionSlot $$$ />'
        - all:
            - has:
                stopBy: end
                pattern: 'userHref($$$)'
            - has:
                stopBy: end
                any:
                  - pattern: '<UserAvatar $$$ />'
                  - pattern: '<EntityBookmarkButton $$$ />'
        - all:
            - has:
                stopBy: end
                pattern: '<UserAvatar $$$ />'
            - has:
                stopBy: end
                any:
                  - pattern: '<Link $$$>$$$</Link>'
                  - pattern: '<a $$$>$$$</a>'
        - all:
            - has:
                stopBy: end
                pattern: 'communityHref($$$)'
            - has:
                stopBy: end
                any:
                  - pattern: '<JoinButton $$$ />'
                  - pattern: '<Badge $$$>Joined</Badge>'
                  - all:
                      - kind: property_identifier
                      - regex: '^(member_count|post_count|list_item_count)$'
        - all:
            - has:
                stopBy: end
                pattern: 'domainHref($$$)'
            - has:
                stopBy: end
                any:
                  - pattern: '<DomainTrustBadge $$$ />'
                  - pattern: '<HostnameVouchDisavowVote $$$ />'
        - all:
            # Key off the canonical referral data-pw marker so div-based
            # ReferralLinkCard and Card-based ReferralLinkFeedCard copies are covered.
            - has:
                stopBy: end
                kind: jsx_attribute
                all:
                  - has:
                      stopBy: neighbor
                      kind: property_identifier
                      regex: '^data-pw$'
                  - has:
                      stopBy: end
                      kind: string_fragment
                      regex: '^referral-link(-feed)?-card$'
            - has:
                stopBy: end
                any:
                  - pattern: '<ExternalLink $$$>$$$</ExternalLink>'
                  - pattern: 'reviewHref($$$)'
        - has:
            stopBy: end
            pattern: '<NotificationIcon $$$ />'
examples:
