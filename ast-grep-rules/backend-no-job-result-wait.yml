id: backend-no-job-result-wait
language: Tsx
severity: error
message: 'Do not wait for a queue job result. Return durable pending state and resume work from the outcome.'
files:
  - 'backend/**/*.mts'
rule:
  any:
    - kind: identifier
      regex: '^enqueue[A-Za-z0-9_]*AndWait$'
    - kind: property_identifier
      regex: '^(addAndWait|waitUntilFinished)$'
    - kind: identifier
      regex: '^(addAndWait|waitUntilFinished)$'
examples:
  - file: backend/queues/example/enqueues.mts
    code: |
      await queue.addAndWait('job', {})
    isValid: false
  - file: backend/workers/example/processors.mts
    code: |
      await job.waitUntilFinished(events)
    isValid: false
  - file: backend/queues/example/enqueues.mts
    code: |
      export async function enqueueTaskAndWait() { return queue.add('job', {}) }
    isValid: false
  - file: backend/queues/example/enqueues.mts
    code: |
      export async function enqueueTask() { return queue.add('job', {}) }
    isValid: true
  - file: web/lib/example.mts
    code: |
      await queue.addAndWait('job', {})
    isValid: true
