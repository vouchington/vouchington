id: test-no-executed-ddl
language: Tsx
severity: error
message: >-
  Tests and helpers do not execute DDL, TRUNCATE, ALTER SYSTEM, pg_sleep, or
  session_replication_role. Inject a write failure with a throwing QueryExecutor.
  Interim ast-grep until no-mistakes statement policy ships
  (jonathanong/no-mistakes#1562, #1563, #1564).
files:
  - '**/*.test.ts'
  - '**/*.test.tsx'
  - '**/*.test.mts'
  - '**/*.spec.ts'
  - '**/*.spec.tsx'
  - '**/*.spec.mts'
  - '**/test-helpers/**/*.ts'
  - '**/test-helpers/**/*.mts'
  - '**/vitest.setup*.ts'
  - '**/vitest.setup*.mts'
  - 'test-helpers/**/*.ts'
  - 'test-helpers/**/*.mts'
# Permanent: these files compare SQL text, reject SQL-looking data, or render
# schema markdown. They do not execute DDL. #2145 does not delete this set.
ignores:
  - 'static-code-analysis/**'
  - '**/*generated-ddl*'
  - 'backend/modules/feed-query-builders/**'
  - 'backend/data-stores/psql/config-driven/**'
  - 'backend/data-stores/psql/schema-snapshot/**'
  - 'backend/data-stores/psql/migration-runner/views.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-notification-push-intents-migration.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-post-admission-reservation-index.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-static-analysis.test.mts'
  - 'backend/scripts/explain-analyze/pruning/database-lifecycle.test.mts'
  - 'backend/services/bedrock-embeddings-batch/entities/shared.test.mts'
  - 'backend/services/copyright-notices/review-target-automated-enforcement.test.mts'
  - 'backend/services/elections-votes/shared/vote-aggregation.test.mts'
  - 'backend/services/posts/get-visible-collection-rows.test.mts'
  - 'backend/services/rss-feeds/discoverability-sql.test.mts'
  # Frozen baseline of executed SQL. Cleanup PRs do not edit it. #2145 deletes it.
  # #2116
  - 'backend/test-helpers/entities/api-keys.mts'
  # #2135
  - 'test-helpers/vitest-isolated-database-case.mts'
  # #2136 pg_sleep
  - 'backend/scripts/explain-analyze/seed-data/post-diagnostics.test.mts'
  - 'backend/test-helpers/entities/contribution-admission-claims.mts'
  - 'backend/test-helpers/entities/notification-push-intents.mts'
  # #2143
  - 'backend/data-stores/psql/__tests__/schema-content-provenance.test.mts'
  - 'backend/data-stores/psql/explain-analyze.test.mts'
  - 'backend/data-stores/psql/migrate.test.mts'
  - 'backend/data-stores/psql/migration-runner/config-driven-statements.test.mts'
  - 'backend/data-stores/psql/migration-runner/monthly-partitions.test.mts'
  - 'backend/data-stores/psql/migration-runner/views.hardening.test.mts'
  - 'backend/test-helpers/data-stores/psql/forced-views.mts'
  - 'backend/test-helpers/data-stores/psql/shared-mutation-trigger.mts'
  - 'backend/test-helpers/data-stores/psql/statement-timeout.mts'
  - 'backend/test-helpers/dsa-statement-build-failure-fixtures.mts'
  - 'backend/test-helpers/entities/membership-refund-reconciliation-schema.mts'
  - 'backend/test-helpers/entities/moderation-transparency-date-reservation.mts'
  - 'backend/test-helpers/injected-failures.mts'
  - 'backend/test-helpers/monthly-partition-retirement-schema.mts'
  - 'backend/test-helpers/monthly-partition-retirement.mts'
  - 'backend/test-helpers/notification-push-pre-capture.mts'
  - 'backend/test-helpers/notification-push-recovery.mts'
  - 'backend/test-helpers/statement-timeout.mts'
  - 'backend/test-helpers/vector-search-recall.mts'
rule:
  any:
    - kind: string
      regex: '(?:CREATE|ALTER|DROP)\s+(?:DATABASE|SCHEMA|TABLE|VIEW|TRIGGER|FUNCTION|PROCEDURE|INDEX|TYPE)|ALTER\s+SYSTEM|(?i:pg_sleep|session_replication_role|\bTRUNCATE\s+(?:TABLE|ONLY)\b)'
    - kind: template_string
      regex: '(?:CREATE|ALTER|DROP)\s+(?:DATABASE|SCHEMA|TABLE|VIEW|TRIGGER|FUNCTION|PROCEDURE|INDEX|TYPE)|ALTER\s+SYSTEM|(?i:pg_sleep|session_replication_role|\bTRUNCATE\s+(?:TABLE|ONLY)\b)'
examples:
  - code: |
      await write(`ALTER TABLE api_keys ADD CONSTRAINT c CHECK (false)`)
    isValid: false
    file: 'backend/services/example-suite-rules.test.mts'
  - code: |
      await query('SELECT pg_sleep(1)')
    isValid: false
    file: 'backend/test-helpers/example-suite-rules.mts'
  - code: |
      const text = 'SELECT id FROM api_keys WHERE id = $1'
    isValid: true
    file: 'backend/services/example-suite-rules.test.mts'
  - code: |
      it('should create database record with pending status', () => {})
    isValid: true
    file: 'backend/services/example-suite-rules.test.mts'
  - code: |
      it('does not truncate short content', () => {})
    isValid: true
    file: 'backend/services/example-suite-rules.test.mts'
  - code: |
      await write(`ALTER TABLE api_keys ADD CONSTRAINT c CHECK (false)`)
    isValid: true
    file: 'static-code-analysis/example-sql-text.test.mts'
