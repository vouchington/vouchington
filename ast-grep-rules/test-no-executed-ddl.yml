id: test-no-executed-ddl
language: Tsx
severity: error
message: >-
  Tests and helpers do not execute DDL, TRUNCATE, ALTER SYSTEM, pg_sleep, or
  session_replication_role. Inject a write failure with a throwing QueryExecutor.
  Interim ast-grep until no-mistakes statement policy ships
  (jonathanong/no-mistakes#1562, #1563, #1564).
files:
  - '**/*.test.ts'
  - '**/*.test.tsx'
  - '**/*.test.mts'
  - '**/*.spec.ts'
  - '**/*.spec.tsx'
  - '**/*.spec.mts'
  - '**/test-helpers/**/*.ts'
  - '**/test-helpers/**/*.mts'
  - '**/vitest.setup*.ts'
  - '**/vitest.setup*.mts'
  - 'test-helpers/**/*.ts'
  - 'test-helpers/**/*.mts'
# Permanent: these files compare SQL text, reject SQL-looking data, or render
# schema markdown. They do not execute DDL. #2145 does not delete this set.
ignores:
  - 'static-code-analysis/**'
  - '**/*generated-ddl*'
  - 'backend/modules/feed-query-builders/**'
  - 'backend/data-stores/psql/config-driven/**'
  - 'backend/data-stores/psql/schema-snapshot/**'
  - 'backend/data-stores/psql/__tests__/schema-post-admission-reservation-index.test.mts'
  - 'backend/data-stores/psql/__tests__/schema-static-analysis.test.mts'
  - 'backend/scripts/explain-analyze/pruning/database-lifecycle.test.mts'
  - 'backend/services/bedrock-embeddings-batch/entities/shared.test.mts'
  - 'backend/services/copyright-notices/review-target-automated-enforcement.test.mts'
  - 'backend/services/elections-votes/shared/vote-aggregation.test.mts'
  - 'backend/services/posts/get-visible-collection-rows.test.mts'
  - 'backend/services/rss-feeds/discoverability-sql.test.mts'
  # Reads pg_indexes.indexdef. The pattern quotes CREATE INDEX and does not execute it.
  - 'backend/test-helpers/entities/membership-refund-reconciliation-schema.mts'
  - 'backend/test-helpers/entities/topics/core.mts'
  # Migration-tool SQL fixtures require sink-aware analysis; tracked by #2145.
  - 'backend/data-stores/psql/migrate.test.mts'
  - 'backend/data-stores/psql/migration-runner/config-driven-statements.test.mts'
  - 'backend/data-stores/psql/migration-runner/migrations.test.mts'
  - 'backend/data-stores/psql/migration-runner/monthly-partitions.test.mts'
rule:
  any:
    - kind: string
      regex: '(?:CREATE(?:\s+(?:OR\s+REPLACE|TEMP|TEMPORARY|UNLOGGED|UNIQUE|MATERIALIZED))*|ALTER|DROP)\s+(?:DATABASE|SCHEMA|TABLE|VIEW|TRIGGER|FUNCTION|PROCEDURE|INDEX|TYPE)|ALTER\s+SYSTEM|(?i:pg_sleep|session_replication_role|\bTRUNCATE\s+(?:TABLE|ONLY)\b)'
    - kind: template_string
      regex: '(?i:(?:CREATE(?:\s+(?:OR\s+REPLACE|TEMP|TEMPORARY|UNLOGGED|UNIQUE|MATERIALIZED))*|ALTER|DROP)\s+(?:DATABASE|SCHEMA|TABLE|VIEW|TRIGGER|FUNCTION|PROCEDURE|INDEX|TYPE)|ALTER\s+SYSTEM|pg_sleep|session_replication_role|\bTRUNCATE\s+(?:TABLE|ONLY)\b)'
