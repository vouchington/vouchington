id: web-no-id-text-input
language: Tsx
severity: error
message: 'Use an autocomplete picker instead of asking users to type a raw entity ID or UUID.'
files:
  - 'web/**/*.tsx'
ignores:
  - 'web/components/ui/**'
  - '**/*.test.tsx'
  - '**/*.spec.tsx'
  - '**/*.stories.tsx'
rule:
  any:
    - all:
        - kind: jsx_attribute
        - regex: '^(placeholder|aria-label)\s*=\s*"[^"]* (ID|UUID)\s*"$'
    - all:
        - kind: jsx_attribute
        - regex: '^(placeholder|aria-label)\s*=\s*''[^'']* (ID|UUID)\s*''$'
    - all:
        - kind: jsx_attribute
        - regex: '^(placeholder|aria-label)\s*=\s*\{\s*"[^"]* (ID|UUID)\s*"\s*\}$'
    - all:
        - kind: jsx_attribute
        - regex: '^(placeholder|aria-label)\s*=\s*\{\s*''[^'']* (ID|UUID)\s*''\s*\}$'
    - all:
        - pattern: '<Label $$$>$TEXT</Label>'
        - regex: ' (ID|UUID)\s*</Label>$'
    - all:
        - pattern: '<FormLabel $$$>$TEXT</FormLabel>'
        - regex: ' (ID|UUID)\s*</FormLabel>$'
    - all:
        - pattern: '<Label $$$>{$TEXT}</Label>'
        - regex: ' (ID|UUID)\s*"\s*\}\s*</Label>$'
    - all:
        - pattern: '<FormLabel $$$>{$TEXT}</FormLabel>'
        - regex: ' (ID|UUID)\s*"\s*\}\s*</FormLabel>$'
    - all:
        - pattern: '<Label $$$>{$TEXT}</Label>'
        - regex: ' (ID|UUID)\s*''\s*\}\s*</Label>$'
    - all:
        - pattern: '<FormLabel $$$>{$TEXT}</FormLabel>'
        - regex: ' (ID|UUID)\s*''\s*\}\s*</FormLabel>$'
    - all:
        - kind: jsx_attribute
        - regex: '^(placeholder|aria-label)\s*=\s*\{\s*`[^`]* (ID|UUID)\s*`\s*\}$'
    - all:
        - pattern: '<Label $$$>{$TEXT}</Label>'
        - regex: ' (ID|UUID)\s*`\s*\}\s*</Label>$'
    - all:
        - pattern: '<FormLabel $$$>{$TEXT}</FormLabel>'
        - regex: ' (ID|UUID)\s*`\s*\}\s*</FormLabel>$'
    - all:
        - kind: jsx_attribute
        - regex: '^(value|defaultValue)\s*=\s*\{\s*[\w$.?!]*(\.id|Id|_id)\s*\}$'
        - inside:
            stopBy: neighbor
            any:
              - kind: jsx_self_closing_element
              - kind: jsx_opening_element
            all:
              - has:
                  field: name
                  regex: '^(Input|input)$'
              - not:
                  has:
                    kind: jsx_attribute
                    regex: '^readOnly$'
              - not:
                  has:
                    kind: jsx_attribute
                    regex: '^type\s*=\s*(["'']hidden["'']|\{\s*["'']hidden["'']\s*\})$'
examples:
  - code: '<Input placeholder="Company topic ID" />'
    isValid: false
    file: 'web/app/page.tsx'
  - code: '<Input placeholder="Topic UUID" />'
    isValid: false
    file: 'web/app/page.tsx'
  - code: "<Input aria-label='User ID' />"
    isValid: false
    file: 'web/app/page.tsx'
  - code: '<Input placeholder={"Company topic ID   "} />'
