    isValid: false
    file: playwright/tests/contracts/all-hook.spec.mts
  - code: "import { test, protectPlaywrightHookTimeouts } from '../../helpers/test.mts';

      const extended = test.extend({}); extended.beforeAll(async () => {});"
    isValid: false
    file: playwright/tests/contracts/all-hook.spec.mts
  - code: "import { test, protectPlaywrightHookTimeouts } from '../../helpers/test.mts';

      function fake(protectPlaywrightHookTimeouts) { test.beforeAll(async () => { protectPlaywrightHookTimeouts(test.info());
      }); }"
    isValid: false
    file: playwright/tests/contracts/all-hook.spec.mts
  - code: "import { test, protectPlaywrightHookTimeouts } from '../../helpers/test.mts';

      const copied = { test }; copied.test['before' + 'All'](async () => {});"
