id: no-analytics-query-unsupported-sql-in-tests
language: Tsx
severity: error
message: 'Analytics query tests must use the unaliased query import and keep SQL compatible with the DuckDB-less JSONL fallback: use equality filters joined by AND, then sort/filter/limit in JS.'
files:
  - 'backend/**/*.test.mts'
rule:
  any:
    - all:
        - kind: call_expression
        - regex: '^\s*(?:await\s+)?query(?:<[\s\S]*>)?\s*\('
        - has:
            stopBy: end
            any:
              - kind: template_string
                regex: '(?i)\b(?:SELECT|WITH)\b'
              - kind: string
                regex: '(?i)\b(?:SELECT|WITH)\b'
        - any:
            - has:
                stopBy: end
                any:
                  - kind: template_string
                    regex: '(?i)\b(?:(?:COUNT|SUM|AVG|MIN|MAX)\s*\(|GROUP\s+BY|ORDER\s+BY|LIMIT|WITH|IN\s*\()'
                  - kind: string
                    regex: '(?i)\b(?:(?:COUNT|SUM|AVG|MIN|MAX)\s*\(|GROUP\s+BY|ORDER\s+BY|LIMIT|WITH|IN\s*\()'
            - not:
                has:
                  stopBy: end
                  any:
                    - kind: template_string
                      regex: '^`\s*(?i:\bSELECT\b)\s+\*\s+(?i:\bFROM\b)\s+"?[a-z_][a-z0-9_]*"?\s+(?i:\bWHERE\b)\s+"?[a-z_][a-z0-9_]*"?\s*=\s*(?:''(?:''''|[^''])*''|0|[1-9]\d*|true|false)(?:\s+(?i:\bAND\b)\s+"?[a-z_][a-z0-9_]*"?\s*=\s*(?:''(?:''''|[^''])*''|0|[1-9]\d*|true|false))*\s*`$'
                    - kind: string
                      regex: '^[''"]\s*(?i:\bSELECT\b)\s+\*\s+(?i:\bFROM\b)\s+"?[a-z_][a-z0-9_]*"?\s+(?i:\bWHERE\b)\s+"?[a-z_][a-z0-9_]*"?\s*=\s*(?:''(?:''''|[^''])*''|0|[1-9]\d*|true|false)(?:\s+(?i:\bAND\b)\s+"?[a-z_][a-z0-9_]*"?\s*=\s*(?:''(?:''''|[^''])*''|0|[1-9]\d*|true|false))*\s*[''"]$'
        - inside:
            kind: program
            stopBy: end
            has:
              kind: import_statement
              regex: 'import\s*\{[\s\S]*?\bquery\b(?:\s+as\s+[A-Za-z_$][\w$]*)?[\s\S]*?\}\s*from [''"]@data-stores/analytics/query[''"]'
              stopBy: end
    - all:
        - kind: import_statement
        - regex: 'import\s*\{[\s\S]*?\bquery\s+as\s+[A-Za-z_$][\w$]*[\s\S]*?\}\s*from [''"]@data-stores/analytics/query[''"]'
    - all:
        - kind: import_statement
        - regex: 'import\s+\*\s+as\s+[A-Za-z_$][\w$]*\s+from [''"]@data-stores/analytics/query[''"]'
examples:
  - code: |-
      import { query } from '@data-stores/analytics/query'
      const rows = await query<Record<string, unknown>>(
        `select * from pg_pool_stats where waiting = '1' order by event_time`,
      )
    isValid: false
    file: 'backend/data-stores/psql/pool-stats-sampler.test.mts'
  - code: |-
      import { query } from '@data-stores/analytics/query'
      const rows = await query<Record<string, unknown>>(
        `SELECT * FROM pg_pool_stats WHERE waiting = ${sentinel} ORDER BY event_time`,
