id: web-crawl-authored-text-requires-lang
language: Tsx
severity: error
message: >-
  CrawlAuthoredText renders original crawled page text beside translated UI
  chrome. Pass lang from the crawl's declared page language. Pass null when
  that language is not known; the text then sets dir="auto" and omits lang.
  Status codes, timestamps, and the language fact stay unmarked.
files:
  - web/**/*.tsx
rule:
  any:
    - all:
        - kind: jsx_self_closing_element
        - has:
            field: name
            kind: identifier
            regex: ^CrawlAuthoredText$
        - not:
            has:
              stopBy: end
              kind: jsx_attribute
              has:
                stopBy: end
                kind: property_identifier
                regex: ^lang$
    - all:
        - kind: jsx_opening_element
        - has:
            field: name
            kind: identifier
            regex: ^CrawlAuthoredText$
        - not:
            has:
              stopBy: end
              kind: jsx_attribute
              has:
                stopBy: end
                kind: property_identifier
                regex: ^lang$
examples:
  - code: |
      <CrawlAuthoredText as="dd" text={crawl.title} />
    isValid: false
    file: web/app/(urls)/url/[urlValue]/crawls/[crawlId]/page.tsx
  - code: |
      <CrawlAuthoredText as="pre" text={crawl.markdown} className="text-sm" />
    isValid: false
    file: web/components/urls/crawl-authored-text.tsx
  - code: |
      <CrawlAuthoredText as="dd" text={crawl.title} lang={crawl.language} />
    isValid: true
    file: web/app/(urls)/url/[urlValue]/crawls/[crawlId]/page.tsx
  - code: |
      <CrawlAuthoredText as="pre" text={crawl.markdown} lang={null} />
    isValid: true
    file: web/components/urls/crawl-authored-text.tsx
  - code: |
      <Section body={<CrawlAuthoredText as="dd" text={title} lang={language} />} />
    isValid: true
    file: web/app/(urls)/url/[urlValue]/crawls/[crawlId]/page.tsx
  - code: |
      <Section body={<CrawlAuthoredText as="pre" text={markdown} />} />
    isValid: false
    file: web/components/urls/crawl-authored-text.tsx
  - code: |
      <CrawlAuthoredText as="pre" text={markdown}></CrawlAuthoredText>
    isValid: false
    file: web/components/urls/crawl-authored-text.tsx
  - code: |
      <CrawlAuthoredText as="pre" text={markdown} lang="ar"></CrawlAuthoredText>
    isValid: true
    file: web/components/urls/crawl-authored-text.tsx
  - code: |
      <CrawlAuthoredText as="dd" text={title} />
    isValid: true
    file: backend/services/crawls/update.tsx
