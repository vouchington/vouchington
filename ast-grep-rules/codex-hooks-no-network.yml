id: codex-hooks-no-network
language: Tsx
severity: error
message: 'Hook policy is local: no gh, no git network subcommands, and no HTTP. Network-backed checks belong in the validators (dev/pr-description.mts, dev/plan-issue.mts) or CI.'
files:
  - 'dev/codex-hooks/**/*.mts'
ignores:
  - 'dev/codex-hooks/**/*.test.mts'
# Self-contained `all` branches instead of top-level `constraints`: constraints filter after `any`
# has already picked its first structurally matching branch, so `execFileSync('git', …)` would be
# claimed by the gh branch, fail its constraint, and never reach the git branches.
utils:
  child-process-call:
    all:
      - kind: call_expression
      - has:
          field: function
          regex: ^(\w+\.)?(execFile|execFileSync|spawn|spawnSync|exec|execSync)$
  network-module:
    regex: ^['"](node:)?(http|https|net)['"]$
rule:
  any:
    - all:
        - matches: child-process-call
        - has:
            field: arguments
            has:
              nthChild: 1
              regex: ^['"`]gh(-stack)?(['"`]|\s)
    - all:
        - matches: child-process-call
        - has:
            field: arguments
            has:
              nthChild: 1
              regex: ^['"`](curl|wget)(['"`]|\s)
    - all:
        - matches: child-process-call
        - has:
            field: arguments
            has:
              nthChild: 1
              regex: ^['"`]git['"`]$
        - has:
            field: arguments
            has:
              kind: string
              regex: ^['"](fetch|ls-remote|pull|push|clone)['"]$
              stopBy: end
    - all:
        - matches: child-process-call
        - has:
            field: arguments
            has:
              nthChild: 1
              regex: ^['"`]git['"`]$
        - has:
            field: arguments
            has:
              nthChild: 2
              regex: ^\[\s*(?:(?:['"`](?:-C|-c|--git-dir|--work-tree|--namespace|--config-env)['"`]\s*,\s*[^,\]]+|['"`](?:-p|--paginate|-P|--no-pager|--no-replace-objects|--no-lazy-fetch|--no-optional-locks|--no-advice|--bare|--exec-path=[^'"`]+|--git-dir=[^'"`]+|--work-tree=[^'"`]+|--namespace=[^'"`]+|--config-env=[^'"`]+)['"`])\s*,\s*)*['"`](remote|submodule)['"`]\s*,\s*(?:['"`](?:-v|--verbose|--quiet)['"`]\s*,\s*)*['"`]update['"`](?:\s*,|\s*\])
    - all:
        - matches: child-process-call
        - has:
            field: arguments
            has:
              nthChild: 1
              regex: ^['"`]git\s+(?:(?:(?:-C|-c|--git-dir|--work-tree|--namespace|--config-env)\s+\S+|(?:-p|--paginate|-P|--no-pager|--no-replace-objects|--no-lazy-fetch|--no-optional-locks|--no-advice|--bare|--exec-path=\S+|--git-dir=\S+|--work-tree=\S+|--namespace=\S+|--config-env=\S+))\s+)*(?:(?:fetch|ls-remote|pull|push|clone)(?:['"`]|\s|$)|(remote|submodule)\s+(?:(?:-v|--verbose|--quiet)\s+)*update(?:['"`]|\s|$))
    - pattern: fetch($$$ARGS)
    - pattern: globalThis.fetch
    - pattern: global.fetch
    - all:
        - any:
            - kind: import_statement
            - kind: export_statement
        - has:
            field: source
            matches: network-module
    - all:
        - kind: call_expression
        - has:
            field: function
            regex: ^(import|require)$
        - has:
            field: arguments
            has:
              nthChild: 1
              matches: network-module
examples:
  - code: |
      import { execFileSync } from 'node:child_process'
      const body = execFileSync('gh', ['issue', 'view', '1'], { encoding: 'utf8' })
    isValid: false
    file: 'dev/codex-hooks/policy/github-workflow.mts'
  - code: |
      import { spawnSync } from 'node:child_process'
      spawnSync('gh-stack', ['view', '--json'])
    isValid: false
    file: 'dev/codex-hooks/policy/github-stack-workflow.mts'
  - code: |
