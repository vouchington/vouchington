id: codex-hooks-no-network
language: Tsx
severity: error
message: 'Hook subprocesses must use the typed local-process boundary; HTTP and direct child_process access are forbidden.'
files:
  - 'dev/codex-hooks/**/*.mts'
ignores:
  - 'dev/codex-hooks/**/*.test.mts'
  - 'dev/codex-hooks/local-process.mts'
utils:
  forbidden-module:
    regex: ^['"`](?:node:)?(?:child_process|http|http2|https|net)['"`]$
rule:
  any:
    - all:
        - kind: identifier
        - regex: ^getBuiltinModule$
    - all:
        - any:
            - kind: import_statement
            - kind: export_statement
        - has:
            field: source
            matches: forbidden-module
    - all:
        - kind: call_expression
        - has:
            field: function
            regex: ^(?:import|require|process\.getBuiltinModule)$
        - has:
            field: arguments
            has:
              nthChild: 1
              matches: forbidden-module
    - pattern: fetch($$$ARGS)
    - pattern: globalThis.fetch
    - pattern: global.fetch
examples:
  - code: |
      import { execFileSync } from 'node:child_process'
      execFileSync('git', ['remote', 'update'])
    isValid: false
    file: 'dev/codex-hooks/policy/github-configured-base.mts'
  - code: |
      import cp, { spawnSync } from 'node:child_process'
      cp.execSync('git fetch')
    isValid: false
    file: 'dev/codex-hooks/policy/github-configured-base.mts'
  - code: |
      const cp = require('child_process')
      cp.execFileSync('gh', ['api', 'repos/o/r'])
    isValid: false
    file: 'dev/codex-hooks/policy/github-configured-base.mts'
  - code: |
      import http from 'node:http'
    isValid: false
    file: 'dev/codex-hooks/policy/core.mts'
  - code: |
      const net = await import('node:net')
    isValid: false
    file: 'dev/codex-hooks/policy/core.mts'
  - code: |
      const childProcess = await import(`node:child_process`)
    isValid: false
    file: 'dev/codex-hooks/policy/core.mts'
  - code: |
      const childProcess = process.getBuiltinModule('node:child_process')
    isValid: false
    file: 'dev/codex-hooks/policy/core.mts'
  - code: |
      import { getBuiltinModule as loadBuiltin } from 'node:process'
      const childProcess = loadBuiltin('node:child_process')
    isValid: false
    file: 'dev/codex-hooks/policy/core.mts'
  - code: |
      import http2 from 'node:http2'
    isValid: false
    file: 'dev/codex-hooks/policy/core.mts'
  - code: |
      const response = await fetch('https://api.github.com/repos/o/r')
    isValid: false
    file: 'dev/codex-hooks/policy/github-workflow.mts'
  - code: |
      const execSync = (command: string) => command
      execSync('local calculation')
      const metadata = { shell: true }
    isValid: true
    file: 'dev/codex-hooks/policy/github-configured-base.mts'
