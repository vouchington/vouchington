id: codex-hooks-no-network
language: Tsx
severity: error
message: 'Hook policy is local: no shell child-process APIs, gh, git network subcommands, or HTTP. Network-backed checks belong in the validators (dev/pr-description.mts, dev/plan-issue.mts) or CI.'
files:
  - 'dev/codex-hooks/**/*.mts'
ignores:
  - 'dev/codex-hooks/**/*.test.mts'
# Self-contained `all` branches instead of top-level `constraints`: constraints filter after `any`
# has already picked its first structurally matching branch, so `execFileSync('git', …)` would be
# claimed by the gh branch, fail its constraint, and never reach the git branches.
utils:
  child-process-call:
    any:
      - all:
          - kind: call_expression
          - has:
              field: function
              regex: ^(execFile|execFileSync|spawn|spawnSync|exec|execSync)$
      - matches: namespace-child-process-call
  namespace-child-process-call:
    all:
      - kind: call_expression
      - any:
          - pattern: $CHILD_PROCESS.execFile($$$ARGS)
          - pattern: $CHILD_PROCESS.execFileSync($$$ARGS)
          - pattern: $CHILD_PROCESS.spawn($$$ARGS)
          - pattern: $CHILD_PROCESS.spawnSync($$$ARGS)
          - pattern: $CHILD_PROCESS.exec($$$ARGS)
          - pattern: $CHILD_PROCESS.execSync($$$ARGS)
      - matches: imports-child-process-namespace
  imports-child-process-namespace:
    inside:
      kind: program
      stopBy: end
      has:
        stopBy: end
        all:
          - kind: import_statement
          - regex: \bfrom\s*['"](?:node:)?child_process['"]
          - any:
              - pattern: import * as $CHILD_PROCESS from '$SOURCE'
              - pattern: import $CHILD_PROCESS from '$SOURCE'
  shell-child-process-call:
    any:
      - matches: named-shell-child-process-call
      - all:
          - matches: namespace-child-process-call
          - any:
              - pattern: $CHILD_PROCESS.exec($$$ARGS)
              - pattern: $CHILD_PROCESS.execSync($$$ARGS)
  named-shell-child-process-call:
    any:
      - all:
          - pattern: exec($$$ARGS)
          - matches: imports-named-exec
      - all:
          - pattern: execSync($$$ARGS)
          - matches: imports-named-exec-sync
      - all:
          - pattern: $EXEC($$$ARGS)
          - matches: imports-aliased-exec
      - all:
          - pattern: $EXEC_SYNC($$$ARGS)
          - matches: imports-aliased-exec-sync
  imports-named-exec:
    inside:
      kind: program
      stopBy: end
      has:
        stopBy: end
        all:
          - kind: import_statement
          - regex: \bfrom\s*['"](?:node:)?child_process['"]
          - has:
              stopBy: end
              kind: import_specifier
              regex: ^exec$
  imports-named-exec-sync:
    inside:
      kind: program
      stopBy: end
      has:
        stopBy: end
        all:
          - kind: import_statement
          - regex: \bfrom\s*['"](?:node:)?child_process['"]
          - has:
              stopBy: end
              kind: import_specifier
              regex: ^execSync$
  imports-aliased-exec:
    inside:
      kind: program
      stopBy: end
      has:
        stopBy: end
        all:
          - kind: import_statement
          - regex: \bfrom\s*['"](?:node:)?child_process['"]
          - has:
              stopBy: end
              kind: import_specifier
              pattern:
                context: "import { exec as $EXEC } from 'child_process'"
                selector: import_specifier
  imports-aliased-exec-sync:
    inside:
      kind: program
      stopBy: end
      has:
        stopBy: end
        all:
          - kind: import_statement
          - regex: \bfrom\s*['"](?:node:)?child_process['"]
          - has:
              stopBy: end
              kind: import_specifier
              pattern:
                context: "import { execSync as $EXEC_SYNC } from 'child_process'"
                selector: import_specifier
  child-process-shell-option:
    all:
      - kind: object
      - has:
          stopBy: neighbor
          all:
            - kind: pair
            - has:
                field: key
                regex: ^(?:shell|['"]shell['"])$
            - has:
                field: value
                not:
                  regex: ^false$
  network-module:
    regex: ^['"](node:)?(http|https|net)['"]$
rule:
  any:
    - matches: shell-child-process-call
    - all:
        - matches: child-process-call
        - any:
            - has:
                field: arguments
                has:
                  nthChild: 2
                  matches: child-process-shell-option
            - has:
                field: arguments
                has:
                  nthChild: 3
                  matches: child-process-shell-option
    - all:
        - matches: child-process-call
        - has:
            field: arguments
            has:
              nthChild: 1
              regex: ^['"`]gh(-stack)?(['"`]|\s)
    - all:
        - matches: child-process-call
        - has:
            field: arguments
            has:
              nthChild: 1
              regex: ^['"`](curl|wget)(['"`]|\s)
    - all:
        - matches: child-process-call
        - has:
            field: arguments
            has:
              nthChild: 1
              regex: ^['"`]git['"`]$
        - has:
            field: arguments
            has:
              kind: string
              regex: ^['"](fetch|ls-remote|pull|push|clone)['"]$
              stopBy: end
    - all:
        - matches: child-process-call
        - has:
            field: arguments
            has:
              nthChild: 1
              regex: ^['"`]git['"`]$
        - has:
            field: arguments
            has:
              nthChild: 2
              regex: ^\[(?:\s|/\*[\s\S]*?\*/|//[^\n]*(?:\n|$))*(?:(?:['"`](?:-C|-c|--git-dir|--work-tree|--namespace|--config-env)['"`](?:\s|/\*[\s\S]*?\*/|//[^\n]*(?:\n|$))*,(?:\s|/\*[\s\S]*?\*/|//[^\n]*(?:\n|$))*(?:['"`][^'"`]*['"`]|[A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*|\[[^\]]+\])*|[^,\]]+)|['"`](?:-p|--paginate|-P|--no-pager|--no-replace-objects|--no-lazy-fetch|--no-optional-locks|--no-advice|--bare|--literal-pathspecs|--glob-pathspecs|--noglob-pathspecs|--icase-pathspecs|--exec-path=[^'"`]+|--git-dir=[^'"`]+|--work-tree=[^'"`]+|--namespace=[^'"`]+|--config-env=[^'"`]+)['"`])(?:\s|/\*[\s\S]*?\*/|//[^\n]*(?:\n|$))*,(?:\s|/\*[\s\S]*?\*/|//[^\n]*(?:\n|$))*)*['"`](remote|submodule)['"`](?:\s|/\*[\s\S]*?\*/|//[^\n]*(?:\n|$))*,(?:\s|/\*[\s\S]*?\*/|//[^\n]*(?:\n|$))*(?:['"`](?:-q|-v|--verbose|--no-verbose|--quiet)['"`](?:\s|/\*[\s\S]*?\*/|//[^\n]*(?:\n|$))*,(?:\s|/\*[\s\S]*?\*/|//[^\n]*(?:\n|$))*)*['"`]update['"`](?:(?:\s|/\*[\s\S]*?\*/|//[^\n]*(?:\n|$))*,|(?:\s|/\*[\s\S]*?\*/|//[^\n]*(?:\n|$))*\])
    - pattern: fetch($$$ARGS)
    - pattern: globalThis.fetch
    - pattern: global.fetch
    - all:
        - any:
            - kind: import_statement
            - kind: export_statement
        - has:
            field: source
            matches: network-module
    - all:
        - kind: call_expression
        - has:
            field: function
            regex: ^(import|require)$
        - has:
            field: arguments
            has:
              nthChild: 1
              matches: network-module
examples:
  - code: |
      import { execFileSync, spawnSync } from 'node:child_process'
      const body = execFileSync('gh', ['issue', 'view', '1'], { encoding: 'utf8' })
    isValid: false
    file: 'dev/codex-hooks/policy/github-workflow.mts'
  - code: |
      import { spawnSync } from 'node:child_process'
