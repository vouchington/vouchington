  referral:
    any:
      - matches: literal
      - matches: transparent
        has:
          matches: referral
rule:
  all:
    - pattern: '$LEFT !== $RIGHT'
    - any:
        - all:
            - has:
                field: left
                matches: topic
            - has:
                field: right
                matches: referral
        - all:
            - has:
                field: right
                matches: topic
            - has:
                field: left
                matches: referral

examples:
  - code: |
      row.topic_type !== 'referral_program'
    isValid: false
    file: web/lib/routes/topic-validation.tsx
  - code: |
      row.topic_type === 'referral_program'
    isValid: true
    file: web/lib/routes/topic-validation.tsx
