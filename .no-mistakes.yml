  - name: reject text primary and foreign keys
    rule: postgres-key-column-types
    scope: repository
    options:
      schemaCatalogPath: backend/data-stores/psql/schema-snapshot/no-mistakes-catalog.json
      allowedTypes:
        [
          uuid,
          bigint,
          boolean,
          bytea,
          integer,
          'numeric(5,4)',
          smallint,
          'timestamp with time zone',
        ]
      allowEnumTypes: true
      allow:
        - object: 'constraint:migrations.migrations_pkey'
          reason: 'owned by the migration runner'

  - name: reject text finite sets
    rule: postgres-finite-text-columns
    scope: repository
    options:
      schemaCatalogPath: backend/data-stores/psql/schema-snapshot/no-mistakes-catalog.json
      columnTypes: [text, 'character varying']
      namePatterns: ['(^|_)(status|state|kind|type|source|category|mode|channel)$']
      allow:
        - object: 'column:activitypub_inbox_activities.activity_type'
          reason: 'ActivityPub sender-defined activity type; see decision 8.'
        - object: 'column:activitypub_inbox_delivery_work_items.claimed_activity_type'
          reason: 'ActivityPub sender-defined activity type; see decision 8.'
        - object: 'column:oauth_authorization_requests.client_state'
          reason: 'OAuth client opaque state is replayed exactly; see decision 8.'
        - object: 'column:session_referral_attributions.utm_source'
          reason: 'UTM source is user-controlled analytics input; see decision 8.'
        - object: 'column:media_types.mime_type'
          reason: 'MIME values are provider-defined lookup keys; see decision 8.'
        - object: 'column:identity_document_types.identity_document_type'
          reason: 'Identity provider document types are externally defined open lookup values; #2513 stores their relational identity as UUID.'
        - object: 'column:stripe_event_types.stripe_event_type'
          reason: 'Stripe event types are provider-defined open lookup values; #2513 stores their relational identity as UUID.'
        - object: 'column:copyright_trusted_flaggers.awarding_member_state'
          reason: 'Two-letter ISO member-state code is an external open standard, not a platform finite enum.'
  - name: reject relational arrays
    rule: postgres-array-columns
    scope: repository
    options:
      schemaCatalogPath: backend/data-stores/psql/schema-snapshot/no-mistakes-catalog.json
      neverAllowElementTypes: [uuid]
      allowEnumElements: true
      allow:
        - object: 'column:hostname_crawler_configurations.content_selectors'
          reason: 'Decision 12 allowed protocol, search, or numeric array: CSS selectors that narrow HTML parsing to specific content areas.'
        - object: 'column:hostname_crawler_configurations.css_selectors_to_remove'
          reason: 'Decision 12 allowed protocol, search, or numeric array: CSS selectors of elements to strip before parsing HTML content.'
        - object: 'column:hostname_crawler_configurations.link_hrefs_to_remove'
          reason: 'Decision 12 allowed protocol, search, or numeric array: Link href values to strip (exact match) before parsing.'
        - object: 'column:hostname_crawler_configurations.link_text_content_to_remove'
          reason: 'Decision 12 allowed protocol, search, or numeric array: Link text values to strip (exact match) before parsing.'
        - object: 'column:oauth_clients.redirect_uris'
          reason: 'Decision 12 allowed protocol, search, or numeric array: Exact validated redirect URIs registered for the client.'
        - object: 'column:post_topic_recommendations.aliases'
          reason: 'Decision 12 allowed protocol, search, or numeric array: Alternative names or aliases for the proposed topic.'
        - object: 'column:referral_program_link_validation_rules.example_urls'
          reason: 'Decision 12 allowed protocol, search, or numeric array: Example URLs for testing the pattern rules.'
        - object: 'column:rss_feeds.unreliable_status_codes'
          reason: 'Decision 12 allowed protocol, search, or numeric array: RSS feed fetch HTTP status codes that should retry instead of soft-deleting this feed. NULL = inherit from hostname. Empty array = no unreliable statuses, overriding hostname defaults.'
        - object: 'column:topics.aliases'
          reason: 'Decision 12 allowed protocol, search, or numeric array: Alternative names for search purposes. Projected by fn_project_topic_aliases from linked topic_aliases.'
        - object: 'column:url_hostnames.unreliable_status_codes'
          reason: 'Decision 12 allowed protocol, search, or numeric array: RSS feed fetch HTTP status codes that should retry instead of soft-deleting feeds for this hostname. NULL = no hostname override. Example: ARRAY[404] for unreliable YouTube feeds.'
        - object: 'column:url_hostnames.web_risk_threat_types'
          reason: 'Decision 12 allowed protocol, search, or numeric array: Google Web Risk threat types returned for the checked URL.'
        - object: 'column:user_passkeys.transports'
          reason: 'Decision 12 allowed protocol, search, or numeric array: Supported transport methods (usb, ble, nfc, internal, etc.).'
        - object: 'column:users.moderation_email_days_of_week'
          reason: 'Decision 12 allowed protocol, search, or numeric array: Days of week for selected-day moderation email cadence, 1=Monday and 7=Sunday.'

  - name: NM-10 table shapes
    rule: postgres-table-shape
    scope: repository
    options:
      schemaCatalogPath: backend/data-stores/psql/schema-snapshot/no-mistakes-catalog.json
      shapes:
        - name: revision-history
          tablePattern: _revisions$
          requiredColumns:
            - name: id
              type: uuid
              nullable: false
            - name: revised_by_id
              type: uuid
              references:
                - users
              onDelete: set null
            - name: revision_type
              nullable: false
            - name: changes
              type: jsonb
              nullable: false
          forbiddenColumns:
            - updated_at
          requiredTriggers:
            - function: fn_reject_mutation
              timing: before
              events:
                - update
                - delete
        - name: change-ledger
          tablePattern: _changes$
          requiredColumns:
            - name: id
              type: uuid
              nullable: false
            - name: change_type
              nullable: false
            - name: changed_by_id
              type: uuid
              references:
                - retained_user_identities
              onDelete: restrict
          forbiddenColumns:
            - updated_at
          requiredTriggers:
            - function: fn_reject_mutation
              timing: before
              events:
                - update
                - delete
        - name: work-queue
          tablePattern: _work_items$
          requiredColumns:
            - name: lease_token
              type: uuid
            - name: lease_expires_at
              type: timestamp with time zone
            - name: available_at
              type: timestamp with time zone
              nullable: false
            - name: attempt_count
              type: integer
              nullable: false
          forbiddenColumns:
            - claim_token
            - claimed_at
            - locked_by
            - leased_until_at
            - processing_attempt_id
        - name: append-only-events
          tablePattern: _events$
          requiredColumns:
            - name: occurred_at
              type: timestamp with time zone
              nullable: false
          forbiddenColumns:
            - updated_at
          requiredTriggers:
            - function: fn_reject_mutation
              timing: before
              events:
                - update
                - delete
        - name: job-cursor
          tablePattern: _cursors$
          primaryKeyTypes:
            - boolean
            - enum
          requiredColumns:
            - namePattern: ^cursor_|_through_at$
            - name: updated_at
              type: timestamp with time zone
              nullable: false
          forbiddenColumns:
            - singleton
        - name: per-target-votes
          tablePattern: _votes$
          requiredColumns:
            - name: id
              type: uuid
              nullable: false
            - name: user_id
              type: uuid
              nullable: false
              references:
                - users
              onDelete: cascade
            - name: score
              type: smallint
            - name: score_is_neutral
            - name: score_is_semantic
            - name: device_id
            - name: ip_address
            - name: session_id
            - name: user_agent_string_id
          forbiddenColumns:
            - relation_table
        - name: relation-votes
          tablePattern: ^relation__.*__votes$
          requiredColumns:
            - name: subject_id
              nullable: false
            - name: entity_relation_id
              nullable: false
      bannedTablePatterns:
        - pattern: _(history|change_logs|audit_logs)$
          message: 'use the R4 shapes: _revisions, _changes, _work_items or _cursors'
      allow:
        - object: table:agent_moderation_votes
          reason: Binary moderation ballots intentionally do not model neutral or semantic score provenance;
  - name: NM-11 status beside lifecycle timestamps
    rule: postgres-status-with-lifecycle-timestamps
    scope: repository
    options:
      schemaCatalogPath: backend/data-stores/psql/schema-snapshot/no-mistakes-catalog.json
      statusColumns:
        - status
        - state
      lifecycleVerbs:
        - approved
        - rejected
        - claimed
        - leased
        - paid
        - bounced
        - completed
        - cancelled
        - canceled
        - failed
        - started
        - finished
        - sent
        - delivered
        - published
        - archived
        - revoked
        - expired
        - resolved
        - dismissed
        - processed
        - dispatched
        - ignored
        - blocked
        - stale
        - exchanged
        - acknowledged
      minLifecycleColumns: 2

  - name: shared web components have Storybook stories
    rule: require-storybook-stories
    projects: [web]
    options:
      stories: ['storybook/**/*.stories.tsx']
      includeAllReactNamedExports: true
      allowComponents:
        'components/sequential-suspense.tsx#SequentialSuspense': >-
          Behavior-only Suspense nesting for async server components, which Storybook cannot render
          client-side; it has no UI of its own.
        'components/service-worker-registrar.tsx#ServiceWorkerRegistrar': >-
          Renders null; it only registers the service worker and push binding in an effect.
        'components/sources/browse-feed-page.tsx#BrowseFeedPage': >-
          Async server component that fetches feeds and the current user; its rendered body is
          covered by the BrowseFeedResults, BrowsePageHeader, and PageWithAside stories.
        'components/users/user-community-relation-route.tsx#UserCommunityRelationRoute': >-
          Async server component that fetches the user's communities; its rendered body is covered by
          the CommunityCard story and the RelationManagementAction stories.
        'components/users/user-rss-feed-route.tsx#UserViewedRssFeedRoute': >-
          Async server component that fetches the viewed feeds; its rendered body is covered by the
          RssFeedListItem and PaginatedUserRssFeedList stories.
        'components/users/user-user-relation-route.tsx#UserUserRelationRoute': >-
          Async server component that fetches the related users and current user; its rendered body
          is covered by the UserList stories.
        'components/users/user-tags-aside.tsx#UserTagsAside': >-
          Async server component that fetches relations and the tag catalog; its rendered body is
          covered by the UserTagsAsideView stories.
        'components/users/user-vouch-election-aside.tsx#UserVouchElectionAside': >-
          Async server component that fetches the vouch context; its rendered body is covered by
          the UserVouchElectionCard stories.
      exclude:
        - 'app/**'
        - 'lib/**'
        - 'storybook/**'
        - 'test-helpers/**'
        # pending backfill batches (#3761): remove each line as its stories land
        - 'components/topics/**'
        - 'components/asides/**'
        - 'components/communities/**'
        - 'components/home/**'
        - 'components/tags/**'
        - 'components/posts/**'
        - 'components/compare/**'
        - 'components/feed/**'

  - name: Actions checkout does not persist credentials
    rule: github-actions-checkout-credentials
    scope: repository
    options:
      defaultBranch: main

  - name: Actions services avoid fixed host ports
    rule: github-actions-docker-host-ports
    scope: repository

  - name: Actions downloads verify integrity
    rule: github-actions-download-integrity
    scope: repository

  - name: checkouts are never sparse
    rule: no-sparse-checkout
    scope: repository

  - name: Actions scripts avoid inline expressions
    rule: github-actions-script-expressions
    scope: repository

  - name: no-mistakes globs match tracked files
    rule: no-mistakes-config
    scope: repository

  - name: web tsconfig aliases map to folders
    rule: tsconfig-alias-folder-mapping
    scope: repository
    options:
      tsconfig: web/tsconfig.json
      baseDir: .
      mappings:
        - prefix: '@'
          root: ''

  # Source: .agents/skills/AGENTS.md line 3, "Author local skills in .agents/skills/<name>/SKILL.md".
  # Nested supporting directories (agents/, references/) belong to their skill and carry no SKILL.md.
  - name: local skills carry a SKILL.md entrypoint
    rule: required-local-docs
    scope: repository
    exclude:
      - .agents/skills/AGENTS.md
      - .agents/skills/*/agents/**
      - .agents/skills/*/references/**
    options:
      roots: [.agents/skills]
      requiredFile: SKILL.md
      codeExtensions: [md]
