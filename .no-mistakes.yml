      traversal: file
      unknownCalls: ignore
      targets:
        - global: setInterval
        - global: setImmediate
        - moduleExport:
            module: node:timers
            export: setInterval
        - moduleExport:
            module: node:timers
            export: setImmediate
        - moduleExport:
            module: node:timers/promises
            export: setInterval
        - moduleExport:
            module: node:timers/promises
            export: setImmediate
        - exact: vi.waitFor
        - exact: vi.waitUntil
        - exact: expect.poll
