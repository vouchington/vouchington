  - name: btree indexes are not a strict prefix of another live index
    rule: postgres-redundant-index
    scope: repository
    options:
      sqlInclude:
        - backend/data-stores/psql/migrations/**/*.sql
      allowDirective: redundant-index-guard-allow
      # 0.48.1 honors later DROP INDEX, so retired prefixes from 0572/0588/0589 no
      # longer need allowlisting. These remaining names are live prefixes of
      # implicit unique/PK composites. Do not drop them in this consume PR.
      allowedIndexes:
        - referral_program_topic_link_validation_rule_sets.idx_referral_program_topic_link_validation_rule_sets__topic_id
        - admin_import_rows.idx_admin_import_rows__batch_id

  - name: enforce PostgreSQL column names and foreign-key semantics
    rule: postgres-column-naming
    scope: repository
    options:
      schemaCatalogPath: backend/data-stores/psql/schema-snapshot/no-mistakes-catalog.json
      typeRules:
        - {
            types: ['timestamp with time zone', 'timestamp without time zone'],
            namePattern: '_at$',
            hint: 'end timestamp columns in _at',
          }
        - {
            types: [date],
            namePattern: '(^day|_on)$',
            hint: 'name date columns day or end them in _on',
          }
        - {
            types: [boolean],
            namePattern: '(^|_)(is|has|can|should)_',
            hint: 'name boolean columns as predicates',
          }
      nameTypeRules:
        - {
            namePattern: '_at$',
            types: ['timestamp with time zone'],
            hint: 'a column ending in _at holds a timestamp with time zone',
          }
        - {
            namePattern: '^cursor_.*_id$',
            types: [uuid],
            hint: 'a keyset cursor holds the swept table uuid primary key',
          }
      ignoreTablePatterns:
        [
          '^(retained_)?relation__[a-z0-9]+(_[a-z0-9]+)*__[a-z0-9]+(_[a-z0-9]+)*__[a-z0-9]+(_[a-z0-9]+)*$',
        ]
      forbiddenColumnNames:
        [
          {
            pattern: '(^|_)table(_name)?$',
            hint: 'a column must not name a table; use one table per target, or an enum',
          },
        ]
      foreignKeys:
        targetSuffixes:
          [{ tables: [users, retained_user_identities], suffixes: [_user_id, _by_id] }]
        targetNames: [{ tablePattern: '^retained_(.+)_identities$', name: '$1' }]
        reservedSuffixes:
          - { suffix: _user_id, types: [uuid], tables: [users, retained_user_identities] }
          - { suffix: _by_id, types: [uuid], tables: [users, retained_user_identities] }
          - {
              suffix: _url,
              types: [text, 'character varying'],
              tables: [urls],
              hint: 'store the URL in urls and reference it',
            }
          - {
              suffix: _uri,
              types: [text, 'character varying'],
              tables: [urls],
              hint: 'store the URL in urls and reference it',
            }
          - {
              suffix: _link,
              types: [text, 'character varying'],
              tables: [urls],
              hint: 'store the URL in urls and reference it',
            }
          - {
              suffix: _endpoint,
              types: [text, 'character varying'],
              tables: [urls],
              hint: 'store the URL in urls and reference it',
            }
        targetMatch: last-word
        allowReferencedColumnName: true
        followCompositeForeignKeys: true
        singular: { people: person, aliases: alias, statuses: status, media: media, data: data }
        requireForeignKey:
          types: [uuid]
          namePattern: '_id$'
          exempt:
            - {
                namePattern: '^cursor_',
                reason: 'Keyset cursor positions may name rows that are already deleted',
              }
            - {
                namePattern: '^sweep_upper_bound_',
                reason: 'Sweep upper bounds fix the end of a keyset sweep and may outlive the row',
              }
            - {
                namePattern: '(^|_)(device|session)_id$',
                reason: 'Device and session ids are issued in signed tokens, not stored in a table',
              }
      allow:
        - object: column:domain_blocklist_sources.url
          reason: 'Decision 13 external blocklist source address; exact URL is input to the downloader.'
        - object: column:urls.url
          reason: 'Decision 13 canonical URL registry text; this is the referenced URL value itself.'
        - object: column:notification_push_intent_subscription_receipts.endpoint
          reason: 'Decision 13 capability-bearing Web Push endpoint retained for exact delivery replay.'
        - object: column:web_push_endpoint_owners.endpoint
          reason: 'Decision 13 capability-bearing Web Push endpoint ownership key.'
        - object: column:web_push_subscriptions.endpoint
          reason: 'Decision 13 capability-bearing Web Push endpoint from the browser protocol.'
        - object: 'column:activitypub_inbox_activities.actor_uri'
          reason: "Decision 13 allowed URL group: The activity's `actor` field (the sending remote actor's ActivityPub id), recorded for operational visibility."
        - object: 'column:activitypub_inbox_delivery_work_items.claimed_actor_uri'
          reason: 'Decision 13 allowed URL group: Untrusted activity actor URI parsed during the network-free request preflight.'
        - object: 'column:bluesky_follow_records.record_uri'
          reason: "Decision 13 allowed URL group: The full AT-URI (at://<follower_did>/app.bsky.graph.follow/<rkey>) returned by createRecord, passed verbatim to deleteRecord on unfollow. Not decomposed into repo/rkey columns \u2014 @atproto/api's Agent.deleteFollow(uri) parses it directly."
        - object: 'column:copyright_notice_targets.hosted_use_url'
          reason: 'Decision 13 allowed URL group: Immutable URL snapshot supplied or resolved for the identified hosted use.'
        - object: 'column:copyright_territorial_notice_receipts.hosted_use_url'
          reason: 'Decision 13 allowed URL group: URL of the hosted use identified in the notice.'
        - object: 'column:crawls.embed_oembed_url'
          reason: "Decision 13 allowed URL group: oEmbed endpoint discovered from this crawl's URL or HTML."
        - object: 'column:membership_purchase_intents.provider_checkout_url'
          reason: 'Decision 13 allowed URL group: Provider checkout URL retained for an exact launch replay.'
        - object: 'column:oauth_authorization_codes.redirect_uri'
          reason: 'Decision 13 allowed URL group: Callback URI bound to the code exchange.'
        - object: 'column:oauth_authorization_requests.redirect_uri'
          reason: 'Decision 13 allowed URL group: Validated callback URI for this authorization request.'
        - object: 'column:oauth_authorizations.redirect_uri'
          reason: 'Decision 13 allowed URL group: Server-selected public provider callback URI; callers cannot supply or override it.'
        - object: 'column:oauth_clients.metadata_url'
          reason: 'Decision 13 allowed URL group: HTTPS URL of the Client ID Metadata Document for a client identified by URL; NULL for clients registered through dynamic client registration.'
        - object: 'column:podcast_shows.cover_art_url'
          reason: 'Decision 13 allowed URL group: Raw <itunes:image href> value. Proxied to /sideload/ at API-response time.'
        - object: 'column:remote_actors.actor_uri'
          reason: "Decision 13 allowed URL group: The remote actor's stable ActivityPub id (e.g. https://remote.example/users/alice)."
        - object: 'column:remote_actors.inbox_url'
