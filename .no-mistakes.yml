  - name: GitHub Actions jobs declare timeout-minutes within budget
    rule: github-actions-job-timeouts
    scope: repository
    options:
      maxMinutes: 10
      rejectStepExceedingJob: true
      allow:
        # Serial setup, dependency, contract, and snapshot steps total 12m; healthy max was 75s
        # across 67 GitHub-hosted successes in #2260.
        - job: '.github/workflows/checks-static.yml#static-backend'
          maxMinutes: 14
        # Serial setup, dependency, image smoke, package build, and package smoke steps total 14m;
        # the healthy ubuntu-24.04-arm run was 53s in #2313.
        - job: '.github/workflows/checks-static.yml#static-lambdas'
          maxMinutes: 15
        # A standalone Playwright run plans shards and produces one shared web build before shards
        # start: setup (5m), shard plan (1m), and the bounded 6m web build sum 12m plus 1m headroom.
        - job: '.github/workflows/tests-playwright.yml#shards'
          maxMinutes: 13
        # A standalone web-integration run prepares its matrix and shared web build before shards
        # start: setup (5m) and the bounded 6m web build sum 11m plus 2m for the unbounded steps.
        - job: '.github/workflows/tests-web-integration.yml#prep'
          maxMinutes: 13
        # setup-node-pnpm (5m) plus the strictly serial sweep engine (20m) sum 25m; cap adds
        # buffer for the unbounded checkout/workspace-restore steps ahead of them. See #11280.
        - job: '.github/workflows/cleanup-artifacts.yml#cleanup-sweep'
          maxMinutes: 26
        # 14, not 15: ubuntu-slim enforces a hard 15-minute platform cap, and a job that reaches
        # it is killed by the platform rather than cancelled by GitHub, so nothing that runs on
        # cancellation gets a chance to. The work itself is a handful of GitHub API calls either
        # way (checkout 2m + prune 10m budget).
        - job: '.github/workflows/ghcr-cleanup.yml#cleanup'
          maxMinutes: 14
        # Backend validation and publication share one build path; the 30m cap preserves the
        # measured build/smoke/scan margin plus the 8m-capped GHCR publication step. See #31.
        - job: '.github/workflows/publish-backend-images.yml#build'
          maxMinutes: 30
        # Web validation and publication share one build path; the 25m cap preserves the
        # measured build/smoke/scan margin plus the 8m-capped GHCR publication step.
        - job: '.github/workflows/publish-web-images.yml#build'
          maxMinutes: 25
        # Healthy maximum was 219 seconds across 558 GitHub-hosted successes in #2260; independent
        # step deadlines remain diagnostic guards, while this is the fail-fast end-to-end cap.
        - job: '.github/workflows/tests-web-api.yml#web-api-tests'
          maxMinutes: 27
        # Three serial initialize modes and disposable services retain their additive budget;
        # healthy max was 97 seconds across 78 GitHub-hosted successes in #2260.
        - job: '.github/workflows/initialize-smoke-test.yml#initialize-smoke-test'
          maxMinutes: 23
        # Healthy maximum was 442 seconds across 75 GitHub-hosted successes in #2260.
        - job: '.github/workflows/static-code-analysis.yml#static-code-analysis'
          maxMinutes: 24
        # Healthy maximum was 150 seconds across 80 GitHub-hosted successes in #2260.
        - job: '.github/workflows/static-code-analysis.yml#no-mistakes'
          maxMinutes: 20
        # Healthy maximum was 347 seconds across 555 GitHub-hosted successes in #2260.
        - job: '.github/workflows/storybook.yml#storybook'
          maxMinutes: 30
        # Existing backend-credentialed budget; no #2260 change.
        - job: '.github/workflows/tests-backend-credentialed.yml#backend-credentialed-tests'
          maxMinutes: 20
        # Healthy maximum was 134 seconds across 65 GitHub-hosted successes in #2260.
        - job: '.github/workflows/tests-backend-modules.yml#backend-modules'
          maxMinutes: 26
        # Existing backend-unit budget; no #2260 change.
        - job: '.github/workflows/tests-backend-unit.yml#backend-tests'
          maxMinutes: 29
        # Healthy maximum was 87 seconds across 37 GitHub-hosted successes in #2260.
        - job: '.github/workflows/tests-cloudflare-worker.yml#cloudflare-worker-tests'
          maxMinutes: 20
        # Additive retry/upload step budgets sum 11m; healthy maximum was 91 seconds across 22
        # GitHub-hosted successes in #2260.
        - job: '.github/workflows/tests-lambdas.yml#lambdas-tests'
          maxMinutes: 13
        # Fail-safe for backend/browser setup plus the bounded 6m web build before the sharded browser runtime begins.
        - job: '.github/workflows/tests-playwright.yml#playwright-tests'
          maxMinutes: 23
        # Fail-safe for backend/browser setup plus the bounded 6m web build before credentialed browser setup and execution begin.
        - job: '.github/workflows/tests-playwright-credentialed.yml#playwright-credentialed-tests'
          maxMinutes: 13
        # Healthy maximum was 78 seconds across 81 GitHub-hosted successes in #2260.
        - job: '.github/workflows/tests-portability.yml#portability-linux'
          maxMinutes: 20
        # Step budgets sum ~23m; real max ~1.3m (n=24) via proxy data. See #8078.
        - job: '.github/workflows/tests-postgres-schema.yml#postgres-schema-tests'
          maxMinutes: 20
        # Healthy maximum was 345 seconds across 75 GitHub-hosted successes in #2260.
        - job: '.github/workflows/tests-tooling.yml#tooling'
          maxMinutes: 27
        # Healthy maximum was 100 seconds across 81 GitHub-hosted successes in #2260.
        - job: '.github/workflows/tests-ts-shared.yml#ts-shared'
          maxMinutes: 20
        # Fail-safe ceiling for setup/test/GitHub-artifact-upload steps, retained from the
        # pre-revert coverage-transport budget less the 7m cut from the bounded web build step.
        - job: '.github/workflows/tests-web-integration.yml#web-integration-tests'
          maxMinutes: 19
        # Healthy max was 381 seconds (the test step 337) across 1,552 GitHub-hosted successes in #2260.
        - job: '.github/workflows/tests-web.yml#web-tests'
          maxMinutes: 30

  - name: tracked TypeScript files belong to a tsconfig program
    rule: tsconfig-file-coverage
    scope: repository
    options:
      allow:
        - path: test-helpers/vitest.setup.storybook-browser-guard.mts
          reason: >-
            Content-free redirect shim so no-mistakes can resolve web-storybook-browser's
            setupFiles literal to a real repo-root path; Vitest never executes this copy
            (see test-helpers/tsconfig.json's exclude comment). Its real logic is
            web/.storybook/vitest.setup.ts, typechecked under web/tsconfig.json. See #8876.
      auxiliaryConfigs:
        - path: web/tsconfig.dependency-cruiser.json
          reason: >-
            Path-alias resolver config consumed only by web/.dependency-cruiser.cjs; never
            passed to tsc directly. See #9225.

  - name: lychee version pin matches mise
    rule: version-pin-consistency
    scope: repository
    options:
      sourceFile: .mise.toml
      sourceKey: tools.aqua:lycheeverse/lychee
      anchors:
        - file: .github/actions/setup-lychee/action.yml
          pattern: 'LYCHEE_VERSION:\s*(\d+\.\d+\.\d+)'
          label: lychee

  - name: gitleaks version pin matches mise
    rule: version-pin-consistency
    scope: repository
    options:
      sourceFile: .mise.toml
      sourceKey: tools.aqua:gitleaks/gitleaks
      anchors:
        - file: .github/workflows/gitleaks.yml
          pattern: 'GITLEAKS_VERSION:\s*(\d+\.\d+\.\d+)'
          label: gitleaks

  - name: workflow tests do not restate timeout-minutes literals
    rule: github-actions-test-timeout-literals
    scope: repository
    options:
      allow:
        - file: .github/workflows/docs-publish.test.mts
          text: "'timeout-minutes': 10,"
          reason: The exact job timeout is part of the immutable documentation-artifact contract.

  - name: setup-aws steps pair caller and nested timeouts
    rule: github-actions-action-timeout-pair
    scope: repository
    options:
      uses:
        - ./.github/actions/setup-aws
        - aws-actions/configure-aws-credentials@
      stepTimeoutMinutes: 2
      nestedInput: action-timeout-s
      nestedTimeoutSeconds: 90
      forbidNestedInComposite: true

