  - name: GitHub Actions jobs declare timeout-minutes within budget
    rule: github-actions-job-timeouts
    scope: repository
    options:
      maxMinutes: 10
      rejectStepExceedingJob: true
      allow:
        # 20m end-to-end fail-fast ceiling covers real max 10.5m (n=36); Docker build/publish steps fail earlier at 10m/5m. See #8078 and #8825.
        - job: '.github/workflows/build-backend.yml#build'
          maxMinutes: 20
        # 15m end-to-end fail-fast ceiling covers build, publish, smoke, scan, static extraction, and artifact upload; Docker build/publish steps fail earlier at 10m/5m. See #8078 and #8825.
        - job: '.github/workflows/build-web.yml#build'
          maxMinutes: 15
        # Static backend setup, dependency, and typecheck step budgets sum 12m; cap adds runner-overhead buffer. See PR #8489.
        - job: '.github/workflows/checks-static.yml#static-backend'
          maxMinutes: 15
        # Static Cloudflare setup, retry install, typecheck, smoke, and dry-run budgets sum 17m; cap adds buffer. See PR #8489.
        - job: '.github/workflows/checks-static.yml#static-cloudflare'
          maxMinutes: 20
        # Static lambdas setup, typecheck, depcruise, smoke, and diagnostics step budgets sum 15m; cap adds buffer. See PR #8489.
        - job: '.github/workflows/checks-static.yml#static-lambdas'
          maxMinutes: 18
        # Static web setup, retry install, pages-router, dependency, typecheck, build, and smoke budgets sum 29m; cap adds buffer. See PR #8489.
        - job: '.github/workflows/checks-static.yml#static-web'
          maxMinutes: 35
        # Fail-safe ceiling covering checkout/setup/validation plus headroom for the GitHub-artifact
        # coverage download and merge, including a 5m sharded-artifact fallback.
        - job: '.github/workflows/ci-test-coverage.yml#test-coverage'
          maxMinutes: 14
        # Fail-safe ceiling covering checkout/setup/validation plus headroom for the GitHub-artifact
        # coverage download and merge, including a 5m sharded-artifact fallback.
        - job: '.github/workflows/ci-tests-processing.yml#tests-processing'
          maxMinutes: 14
        # setup-node-pnpm (5m) plus the strictly serial sweep engine (20m) sum 25m; cap adds
        # buffer for the unbounded checkout/workspace-restore steps ahead of them. See #11280.
        - job: '.github/workflows/cleanup-artifacts.yml#cleanup-sweep'
          maxMinutes: 26
        # 14, not 15: ubuntu-slim enforces a hard 15-minute platform cap, and a job that reaches
        # it is killed by the platform rather than cancelled by GitHub, so nothing that runs on
        # cancellation gets a chance to. The work itself is a handful of GitHub API calls either
        # way (checkout 2m + prune 10m budget).
        - job: '.github/workflows/ghcr-cleanup.yml#cleanup'
          maxMinutes: 14
        # Same build path as build-backend.yml#build (20m, see above) plus an 8m-capped GHCR
        # publish step; 30m adds checkout/runner-overhead buffer over that 28m sum. See #31.
        - job: '.github/workflows/publish-backend-images.yml#build'
          maxMinutes: 30
        # Same build path as build-web.yml#build (15m, see above) plus an 8m-capped GHCR publish
        # step; 25m adds checkout/runner-overhead buffer over that 23m sum.
        - job: '.github/workflows/publish-web-images.yml#build'
          maxMinutes: 25
        # Backend setup (5m), migration (3m), a 5m Vitest watchdog, report persistence, and headroom
        # for the GitHub-artifact coverage upload, retained from the pre-revert coverage-transport
        # budget. The outer cap is fail-safe, not a runtime target.
        - job: '.github/workflows/tests-web-api.yml#web-api-tests'
          maxMinutes: 27
        # The bounded initializer may consume 18m before the trusted supervisor gives Codex 105m; the 150m outer ceiling leaves 27m for setup, transcript upload, completion bundling, and failure diagnostics. A successful shepherd reached 103m38s; run 30189230576 proved that unsupervised worker death requires a hard outer ceiling.
        - job: '.github/workflows/codex-dispatch.yml#codex'
          maxMinutes: 150
        # The credential-free validator includes one bounded 8m immutable-runtime install plus cheap local checks inside bubblewrap; 35m leaves checkout, exact-patch rebase, and diagnostics headroom without expanding publisher write authority.
        - job: '.github/workflows/codex-dispatch.yml#trusted-completion-validator'
          maxMinutes: 35
        # Step budgets across worktree prep (1) + three ./dev/initialize passes (5 each, monorepo/backend/web) + Postgres provisioning (5) + always() cleanup (5) sum 26m; cap adds buffer for the unbounded checkout/setup-node/corepack steps ahead of them. See #10850.
        - job: '.github/workflows/initialize-smoke-test.yml#initialize-smoke-test'
          maxMinutes: 30
        # Remaining lint/typecheck/knip/depcruise step budgets plus setup-node-pnpm; the 25m
        # route-selector --check moved to no-mistakes-owned.
        - job: '.github/workflows/static-code-analysis.yml#static-code-analysis'
          maxMinutes: 50
        # setup-node-pnpm (5m) + mise (3m) + no-mistakes check (10m) + topology (5m) +
        # route-selector --check (25m) plus checkout/drain headroom. Cap must exceed the 25m step.
        - job: '.github/workflows/static-code-analysis.yml#no-mistakes-owned'
          maxMinutes: 55
        # Unexercised 30m GH-Pages build plus a ~20m test-retry watchdog budget. See #8078.
        - job: '.github/workflows/storybook.yml#storybook'
          maxMinutes: 94
        # Fail-safe ceiling for setup/test/GitHub-artifact-upload steps, retained from the
        # pre-revert coverage-transport budget.
        - job: '.github/workflows/tests-backend-credentialed.yml#backend-credentialed-tests'
          maxMinutes: 20
        # Fail-safe ceiling for setup/test/GitHub-artifact-upload steps, retained from the
        # pre-revert coverage-transport budget.
        - job: '.github/workflows/tests-backend-modules.yml#backend-modules'
          maxMinutes: 22
        # Fail-safe ceiling for setup/test/GitHub-artifact-upload steps, retained from the
        # pre-revert coverage-transport budget.
        - job: '.github/workflows/tests-backend-unit.yml#backend-tests'
          maxMinutes: 29
        # Fail-safe ceiling for setup/test/GitHub-artifact-upload steps, retained from the
        # pre-revert coverage-transport budget.
        - job: '.github/workflows/tests-cloudflare-worker.yml#cloudflare-worker-tests'
          maxMinutes: 17
        # Step budgets sum ~27m; real max 2.72m (n=30), cap must cover the steps. See #8078.
        - job: '.github/workflows/tests-lambdas.yml#lambdas-tests'
          maxMinutes: 37
        # A strict Next build may spend 5m acquiring the host admission lock plus the bounded build/drain window before the sharded browser runtime begins.
        - job: '.github/workflows/tests-playwright.yml#playwright-tests'
          maxMinutes: 35
        # A strict Next build may spend 5m acquiring the host admission lock plus the bounded build/drain window before credentialed browser setup and execution begin.
        - job: '.github/workflows/tests-playwright-credentialed.yml#playwright-credentialed-tests'
          maxMinutes: 25
        # Fail-safe ceiling for setup/test/GitHub-artifact-upload steps, retained from the
        # pre-revert coverage-transport budget.
        - job: '.github/workflows/tests-portability.yml#portability-linux'
          maxMinutes: 17
        # Fail-safe ceiling for setup/test/GitHub-artifact-upload steps, retained from the
        # pre-revert coverage-transport budget.
        - job: '.github/workflows/tests-portability.yml#portability-macos'
          maxMinutes: 17
        # Step budgets sum ~23m; real max ~1.3m (n=24) via proxy data. See #8078.
        - job: '.github/workflows/tests-postgres-schema.yml#postgres-schema-tests'
          maxMinutes: 20
        # Fail-safe ceiling for setup/test/GitHub-artifact-upload steps, retained from the
        # pre-revert coverage-transport budget.
        - job: '.github/workflows/tests-tooling.yml#tooling'
          maxMinutes: 32
        # Fail-safe ceiling for setup/test/GitHub-artifact-upload steps, retained from the
        # pre-revert coverage-transport budget.
        - job: '.github/workflows/tests-ts-shared.yml#ts-shared'
          maxMinutes: 17
        # Fail-safe ceiling for setup/test/GitHub-artifact-upload steps, retained from the
        # pre-revert coverage-transport budget.
        - job: '.github/workflows/tests-web-integration.yml#web-integration-tests'
          maxMinutes: 26
        # Raised from 24m alongside the "Run web tests" step's 10m -> 20m watchdog bump: on
        # GitHub-hosted ubuntu-latest (2 vCPUs) with coverage instrumentation enabled, real failing
        # shards were killed at the step's prior 10m ceiling without ever completing, so neither
        # number has an observed-completion basis yet. 32m leaves 12m of headroom over the 20m step
        # for setup-node-pnpm plus the coverage/blob upload and report-persistence steps that
        # follow; tune both down once a passing run reports a real per-shard duration.
        - job: '.github/workflows/tests-web.yml#web-tests'
          maxMinutes: 32

  - name: tracked TypeScript files belong to a tsconfig program
    rule: tsconfig-file-coverage
    scope: repository
    options:
      allow:
        - path: test-helpers/vitest.setup.storybook-browser-guard.mts
          reason: >-
            Content-free redirect shim so no-mistakes can resolve web-storybook-browser's
            setupFiles literal to a real repo-root path; Vitest never executes this copy
            (see test-helpers/tsconfig.json's exclude comment). Its real logic is
            web/.storybook/vitest.setup.ts, typechecked under web/tsconfig.json. See #8876.
      auxiliaryConfigs:
        - path: web/tsconfig.dependency-cruiser.json
          reason: >-
            Path-alias resolver config consumed only by web/.dependency-cruiser.cjs; never
            passed to tsc directly. See #9225.

  - name: lychee version pin matches mise
    rule: version-pin-consistency
    scope: repository
    options:
      sourceFile: .mise.toml
      sourceKey: tools.aqua:lycheeverse/lychee
      anchors:
        - file: .github/actions/setup-lychee/action.yml
          pattern: 'LYCHEE_VERSION:\s*(\d+\.\d+\.\d+)'
          label: lychee

  - name: gitleaks version pin matches mise
    rule: version-pin-consistency
    scope: repository
    options:
      sourceFile: .mise.toml
      sourceKey: tools.aqua:gitleaks/gitleaks
      anchors:
        - file: .github/workflows/gitleaks.yml
          pattern: 'GITLEAKS_VERSION:\s*(\d+\.\d+\.\d+)'
          label: gitleaks

  - name: no raw ephemeral port 0 binds
    rule: no-raw-ephemeral-port
    scope: repository
    options:
      allow:
        - ci/runner-port-policy.mts
        - ts-shared/utils/ephemeral-ports.mts
      message: use ci/allocate-browser-safe-ports.py, listenOnRunnerUnreservedEphemeralPort(), or @ts-shared/utils/ephemeral-ports's listenOnEphemeralPort()

  - name: workflow tests do not restate timeout-minutes literals
    rule: github-actions-test-timeout-literals
    scope: repository

  - name: setup-aws steps pair caller and nested timeouts
    rule: github-actions-action-timeout-pair
    scope: repository
    options:
      uses:
        - ./.github/actions/setup-aws
        - aws-actions/configure-aws-credentials@
      stepTimeoutMinutes: 2
      nestedInput: action-timeout-s
      nestedTimeoutSeconds: 90
      forbidNestedInComposite: true

  - name: btree indexes are not a strict prefix of another live index
    rule: postgres-redundant-index
    scope: repository
    options:
      sqlInclude:
        - backend/data-stores/psql/migrations/**/*.sql
      allowDirective: redundant-index-guard-allow
      # 0.48.1 honors later DROP INDEX, so retired prefixes from 0572/0588/0589 no
      # longer need allowlisting. These remaining names are live prefixes of
      # implicit unique/PK composites. Do not drop them in this consume PR.
      allowedIndexes:
        - topics__referral_program_link_validations.idx_topics__referral_program_validations__referral_program_id
        - admin_import_rows.idx_admin_import_rows__batch_id
