  # finite-set-consistency enforces the basic set-equality invariants from
  # finite-enum-ripple-guard.mts (topicTypes backend/web/SQL, PostType/SQL).
  # Slug-property consistency, factory-arg validation, and route-config
  # structural checks remain in the repo-local parser (Voucha-specific logic).
  - name: topicTypes cross-surface set consistency
    rule: finite-set-consistency
    scope: repository
    options:
      sets:
        - name: backendTopicTypes
          file: backend/types/entities/topic.mts
          kind: ts-const-object-keys
          target: topicTypes
        - name: webTopicTypes
          file: web/types/topics.ts
          kind: ts-const-object-keys
          target: topicTypes
        - name: sqlTopicTypes
          file: backend/data-stores/psql/migrations/0060-00-00-topics-taxonomy.sql
          kind: sql-enum
          target: topic_types
      comparisons:
        - left: backendTopicTypes
          right: webTopicTypes
        - left: backendTopicTypes
          right: sqlTopicTypes

  - name: copyright timeline audience SQL enum consistency
    rule: finite-set-consistency
    scope: repository
    options:
      sets:
        - name: copyrightTimelineEventAudiences
          file: backend/services/copyright-notices/timeline-visibility.mts
          kind: ts-const-object-keys
          target: copyrightTimelineEventAudience
        - name: copyrightLifecycleEventTypes
          file: backend/data-stores/psql/migrations/0634-00-00-copyright-notices.sql
          kind: sql-enum
          target: copyright_notice_lifecycle_change_types
      comparisons:
        - left: copyrightTimelineEventAudiences
          right: copyrightLifecycleEventTypes

  - name: PostType SQL enum consistency
    rule: finite-set-consistency
    scope: repository
    options:
      sets:
        - name: postTypes
          file: backend/types/entities/post.mts
          kind: ts-string-union
          target: PostType
        - name: sqlPostTypes
          file: backend/data-stores/psql/migrations/0070-00-00-posts-feed-content.sql
          kind: sql-enum
          target: post_types
      comparisons:
        - left: postTypes
          right: sqlPostTypes

  # finite-set-consistency equal-set for Claude skill discovery:
  # every .agents/skills/<name>/SKILL.md ↔ .claude/skills/<name>.
  - name: Claude skill discovery set consistency
    rule: finite-set-consistency
    scope: repository
    options:
      sets:
        - name: agentSkills
          kind: path-regex-capture
          pattern: '^\.agents/skills/(?<value>[^/]+)/SKILL\.md$'
        - name: claudeSkillDiscovery
          kind: path-regex-capture
          pattern: '^\.claude/skills/(?<value>[^/]+)$'
      comparisons:
        - left: agentSkills
          right: claudeSkillDiscovery

