ci:
  actionDirs:
    - .github/actions
  workflowDirs:
    - .github/workflows
    - ci/no-mistakes-workflows

projects:
  web:
    type: nextjs
    root: web

  web-app:
    type: nextjs
    root: web/app

  web-components:
    type: library
    root: web/components

  web-lib:
    type: library
    root: web/lib

  backend:
    type: server
    root: backend
    routes:
      - api/**
      - sitemap/**
      - md/**
    queues:
      enqueues:
        - queues/*/enqueues.mts
        - queues/*/enqueues/*.mts
      workers:
        - workers/*/**

  cloudflare-worker:
    type: cloudflare-workers
    root: cloudflare-worker

  ci-playwright:
    type: tests
    root: ci/playwright

  ci-transient-retry:
    type: tests
    root: ci/transient-retry

  github-actions:
    type: tests
    root: .github

  dev-initialize:
    type: tests
    root: dev
    include:
      - initialize*

checks:
  commands:
    - name: typecheck-backend
      command: [pnpm, exec, tsc, --noEmit, --incremental, --project, backend/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-backend-email
      command: [pnpm, exec, tsc, --noEmit, --incremental, --project, email-templates/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-web
      command:
        [bash, -c, 'cd web && pnpm exec next typegen && pnpm exec tsc --noEmit --incremental']
      fileArgs: none
      always: true
    - name: typecheck-lambdas
      command: [pnpm, exec, tsc, --noEmit, --incremental, --project, lambdas/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-cloudflare-worker
      command:
        [pnpm, exec, tsc, --noEmit, --incremental, --project, cloudflare-worker/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-scripts
      command: [pnpm, exec, tsc, --noEmit, --incremental, --project, tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-ts-shared
      command: [pnpm, exec, tsc, --noEmit, --incremental, --project, ts-shared/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-playwright
      command: [pnpm, exec, tsc, --noEmit, --incremental, --project, playwright/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-test-helpers
      command: [pnpm, exec, tsc, --noEmit, --incremental, --project, test-helpers/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-integration-tests
      command:
        [pnpm, exec, tsc, --noEmit, --incremental, --project, integration-tests/tsconfig.json]
      fileArgs: none
      always: true

tests:
  playwright:
    configs: playwright.config.mts
    navigationHelpers: [navigateTo]
    ignoreRoutes:
      - /landing/:idOrUsername
      - /landing/:idOrUsername/:slug
    routeCoverageSources:
      - framework: vitest
        project: web-integration
        include: ['integration-tests/web/**/*.mts']
        routes:
          - /bank-account/:id/settings/source
          - /card/:id/settings/source
          - /copyright/counter-notice
          - /copyright/designated-agent
          - /copyright/repeat-infringer-policy
          - /healthz
          - /referral-program/:id/settings/source
          - /rewards-program-status/:id/settings/source
          - /rewards-program/:id/settings/source
          - /topic/:id/settings/source
          - /user/:idOrUsername/communities/proxy-following
          - /user/:idOrUsername/communities/proxy-muted
          - /user/:idOrUsername/communities/saved
          - /user/:idOrUsername/domains/blocked
          - /user/:idOrUsername/domains/muted
          - /user/:idOrUsername/posts/following
          - /user/:idOrUsername/posts/hidden
          - /user/:idOrUsername/posts/saved
          - /user/:idOrUsername/rss-feed-items/hidden
          - /user/:idOrUsername/rss-feed-items/saved
          - /user/:idOrUsername/rss-feed-items/viewed
          - /user/:idOrUsername/rss-feeds/muted
          - /user/:idOrUsername/topics/blocked
          - /user/:idOrUsername/topics/dismissed-recommendations
          - /user/:idOrUsername/topics/muted
          - /user/:idOrUsername/topics/viewed
          - /user/:idOrUsername/users/dismissed-recommendations
        helpers:
          - module: integration-tests/web/helpers/client.mts
            export: WebIntegrationClient
            method: request
            urlArgument: 0
          - module: integration-tests/web/helpers/client.mts
            export: WebIntegrationClient
            method: loadPage
            urlArgument: 0
    projects:
      setup:
        include:
          - playwright/setup/**/*.setup.mts
      chromium:
        include:
          - playwright/tests/**/*.spec.mts
      support-tests:
        include:
          - ci/playwright/**/*.test.mts
          - playwright/helpers/**/*.test.mts
    coverage:
      routes: true
      selectors: true
    selectors:
      testIds:
        - data-pw
        - data-testid
      componentTestIds:
        dataPw: data-pw
      htmlIds: false
      wrappers:
        - module: playwright/helpers/aside-locator.mts
          export: getAsideLocator
          testIdArgument: 1
        - module: playwright/helpers/authenticated-manager-page.mts
          export: assertManagerHeading
          testIdArgument: 1
        - module: playwright/helpers/authenticated-manager-page.mts
          export: assertSeededName
          testIdArgument: 1
        - module: playwright/helpers/authenticated-manager-page.mts
          export: assertExactValue
          testIdArgument: 1
        - module: playwright/helpers/authenticated-manager-page.mts
          export: assertContainedValue
          testIdArgument: 1
        - module: playwright/helpers/authenticated-manager-page.mts
          export: assertManagerControlVisible
          testIdArgument: 1
        - module: playwright/helpers/authenticated-manager-page.mts
          export: assertFirstManagerControlVisible
          testIdArgument: 1
        - module: playwright/helpers/authenticated-manager-page.mts
          export: clickFirstManagerControl
          testIdArgument: 1
        - module: playwright/helpers/authenticated-manager-page.mts
          export: clickManagerControl
          testIdArgument: 1
        - module: playwright/helpers/authenticated-manager-page.mts
          export: clearManagerInputWithFill
          testIdArgument: 1
        - module: playwright/helpers/authenticated-manager-page.mts
          export: clearManagerInputWithSelectAll
          testIdArgument: 1
        - module: playwright/helpers/semantic-vote.mts
          export: chooseVote
          testIdArgument: 1
        - module: playwright/helpers/semantic-vote.mts
          export: voteBinaryChoice
          testIdArgument: 1
        - module: playwright/helpers/semantic-vote.mts
          export: voteChoice
          testIdArgument: 1
        - module: playwright/helpers/semantic-vote.mts
          export: voteChoiceGroup
          testIdArgument: 1
        - module: playwright/helpers/semantic-vote.mts
          export: voteClear
          testIdArgument: 1
        - module: playwright/helpers/semantic-vote.mts
          export: voteTrigger
          testIdArgument: 1
        - module: playwright/helpers/semantic-vote.mts
          export: userSignalChoice
          testIdArgument: 1
    selectorRoots:
      - web/app
      - web/components
      - web/lib/navigation
      - web/lib/podcast-player
      - web/lib/routes
    selectorExclude:
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - '**/*.stories.ts'
      - '**/*.stories.tsx'
      - '**/__tests__/**'
      - '**/*.mock.test.tsx'
  vitest:
    configs: vitest.config.mts
    projects:
      web:
        include:
          - web/**/*.test.ts
          - web/**/*.test.tsx
        exclude:
          - '**/node_modules/**'
          - '**/.git/**'
          - web/.next/**
          - web/storybook/**
      backend-aws:
        integration_suites:
          aws:
            - aws
      backend-bedrock:
        integration_suites:
          bedrock:
            - bedrock
      backend-openai:
        integration_suites:
          openai:
            - openai
      backend-openrouter:
        integration_suites:
          openrouter:
            - openrouter
      backend-stripe:
        integration_suites:
          stripe:
            - stripe

rules:
  - name: GitHub Actions uses pins
    rule: github-actions-pinned-hash
    scope: repository

  - name: test sources do not embed exact Git revisions
    rule: no-test-git-sha
    scope: repository
    include:
      - '**/*.test.*'
      - '**/*.spec.*'
      - '**/*.stories.*'
      - '**/*.fixture.*'
      - '**/*.fixtures.*'
      - '**/test/**'
      - '**/tests/**'
      - '**/Tests/**'
      - '**/__tests__/**'
      - '**/__snapshots__/**'
      - '**/fixture/**'
      - '**/fixtures/**'
      - '**/__fixtures__/**'
      - '**/integration-tests/**'
      - '**/test-helpers/**'
      - '**/test-support.*'
      - '**/*-fixture.*'
      - '**/*-fixtures.*'
      - '**/*-test-helper.*'
      - '**/*-test-helpers.*'
      - '**/*-test-scripts.*'
      - '**/*-test-support.*'
      - 'web/storybook/**'
    exclude:
      - '**/packages.lock.json'
      - '**/package-lock.json'
      - '**/pnpm-lock.yaml'
      - '**/yarn.lock'
      - '**/Cargo.lock'
      - '**/Package.resolved'
  - name: Vitest tests do not invoke real timers
    rule: forbidden-calls
    scope: repository
    options:
      roots:
        - vitest: true
      traversal: file
      unknownCalls: ignore
      targets:
        - global: setTimeout
        - moduleExport:
            module: node:timers
            export: setTimeout
        - moduleExport:
            module: node:timers/promises
            export: setTimeout

  - name: Playwright tests do not invoke fixed sleeps
    rule: forbidden-calls
    scope: repository
    options:
      roots:
        - playwright: true
      traversal: file
      unknownCalls: ignore
      targets:
        - global: setTimeout
        - terminal: waitForTimeout
        - moduleExport:
            module: node:timers
            export: setTimeout
        - moduleExport:
            module: node:timers/promises
            export: setTimeout

  - name: Vitest tests do not poll or wait on timers
    rule: forbidden-calls
    scope: repository
