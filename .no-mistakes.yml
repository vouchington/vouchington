        - object: table:migrations
          reason: 'The migration runner owns this internal ledger.'
        - object: column:migrations.checksum
          reason: 'The checksum is migration-runner integrity metadata.'

  - name: runtime DML omits trigger-maintained updated_at
    rule: postgres-no-generated-column-writes
