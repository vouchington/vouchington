        - files:
            - pnpm-workspace.yaml
          bannedKeys:
            - patchedDependencies
            - allowUnusedPatches
          valueAssertions:
            - key: minimumReleaseAge
              kind: positive-number
            - key: dangerouslyAllowAllBuilds
              kind: boolean
            - key: strictDepBuilds
              kind: boolean
            - key: minimumReleaseAgeExclude
              kind: string-array
            - key: allowBuilds
              kind: record-of-boolean

  - name: root oxlintrc override globs and bind ban
    rule: structured-config-policy
    scope: repository
    options:
      policies:
        - files:
            - .oxlintrc.json
          valueAssertions:
            - key: overrides.[].files.[]
              kind: string-prefix
              prefix: '**/'
            - key: overrides.[].files.[]
              kind: not-single-file
            - key: rules.no-restricted-properties.0
              kind: equals
              value: error
            - key: rules.no-restricted-properties.[]
              kind: object-shape
              match: any
              requiredKeys: [message]
              forbiddenKeys: [object]
              requiredValues:
                property: bind
            - key: overrides.[].rules.no-restricted-properties.[]
              kind: object-shape
              match: any
              requiredKeys: [message]
              forbiddenKeys: [object]
              requiredValues:
                property: bind
        - files:
            - '**/.oxlintrc.json'
          when:
            - key: extends
          valueAssertions:
            - kind: ancestor-override-subset
            - key: plugins
              kind: equals-file
              file: .oxlintrc.json
              fromKey: plugins
