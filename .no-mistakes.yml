  - name: tracked package.json files are workspace members
    rule: package-json-workspace-coverage
    scope: repository
    options:
      requireNamedPackage: true
      packageRoots:
        - .agents
        - .claude
        - .codex
        - .cursor
        - .github
        - .grok
        - .husky
        - .opencode
        - .pr-shepherd
        - api-fixtures
        - articles
        - ast-grep-rules
        - backend
        - ci
        - cloudflare-worker
        - dev
        - docs
        - email-templates
        - integration-tests
        - lambdas
        - localization
        - monitors
        - playwright
        - seed
        - static-code-analysis
        - test-helpers
        - ts-shared
        - web

  - name: package manifests use the repository field shape
    rule: package-json-required-fields
    scope: repository
    options:
      requireScopedName: true
      unscopedNameExceptions: [voucha, web]

  - name: scoped package manifests are private unlicensed modules
    rule: package-json-required-fields
    scope: repository
    exclude:
      - package.json
      - web/package.json
    options:
      private: true
      type: module
      license: UNLICENSED

  - name: package entrypoints are declared when index.mts exists
    rule: package-json-required-fields
    scope: repository
    exclude:
      - package.json
      - backend/scripts/package.json
      - web/package.json
    options:
      mainWhenFileExists: index.mts

  - name: nested workspaces exactly cover ts-shared dependencies
    rule: package-json-nested-workspace-coverage
    scope: repository
    options:
      roots:
        - backend
        - web
        - cloudflare-worker
        - lambdas/*
      dependencyNamePrefixes:
        - '@ts-shared/'

  - name: package-owned validation dependencies and canonical names
    rule: structured-config-policy
    scope: repository
    options:
      policies:
        - files: [package.json]
          requiredKeys:
            - devDependencies.vitest
            - devDependencies.jsdom
        - files: [email-templates/package.json]
          requiredKeys: [devDependencies.vitest]
        - files: [lambdas/image-resize/package.json]
          requiredKeys: [devDependencies.@typescript/native]
        - files: [cloudflare-worker/package.json]
          requiredKeys:
            - devDependencies.@typescript/native
            - devDependencies.vitest
          valueAssertions:
            - key: name
              kind: equals
              value: '@voucha/cloudflare-worker'
        - files: [web/package.json]
          requiredKeys: [devDependencies.jsdom]

  - name: workspace package dependency graph has no cycles
    rule: workspace-package-cycles
    scope: repository

  - name: lightweight entrypoints must not reach worker-cpu-only modules
    rule: forbidden-dependencies
    scope: repository
    options:
      roots:
        - backend/entrypoints/api/serve.mts
        - backend/entrypoints/worker-io/serve.mts
      forbiddenModules:
        - sharp
        - sharp/**
        - '@jongleberry/vurst-ai'
        - '@jongleberry/vurst-ai/**'

  - name: api entrypoint must not reach worker-only npm modules
    rule: forbidden-dependencies
    scope: repository
    options:
      roots:
        - backend/entrypoints/api/serve.mts
      forbiddenModules:
        - web-push
        - web-push/**
        - pg-copy-streams
        - pg-copy-streams/**
        - '@aws-sdk/client-bedrock'
        - '@aws-sdk/client-bedrock/**'

  - name: api workspace closure excludes worker-only packages
    rule: forbidden-workspace-closure
    scope: repository
    options:
      packages:
        - '@entrypoints/api'
      forbidden:
        - sharp
        - '@jongleberry/vurst-ai'
        - web-push
        - '@entrypoints/worker-cpu'
      dependencyTypes:
        - dependencies
        - optionalDependencies
      lockfile: pnpm-lock.yaml

  - name: worker-io workspace closure excludes worker-cpu-only packages
    rule: forbidden-workspace-closure
    scope: repository
    options:
      packages:
        - '@entrypoints/worker-io'
      forbidden:
        - sharp
        - '@jongleberry/vurst-ai'
        - '@entrypoints/worker-cpu'
      dependencyTypes:
        - dependencies
        - optionalDependencies
      lockfile: pnpm-lock.yaml

  - name: production entrypoint closures exclude agent-blackboard
    rule: forbidden-workspace-closure
    scope: repository
    options:
      packages:
        - '@entrypoints/api'
        - '@entrypoints/worker-cpu'
        - '@entrypoints/worker-io'
      forbidden:
        - agent-blackboard
      dependencyTypes:
        - dependencies
        - optionalDependencies
      lockfile: pnpm-lock.yaml

  - name: Production dependency declarations
    rule: production-dependency-declarations
    scope: repository
    options:
      workspaceRoots: [backend, ts-shared]
      allowedFields: [dependencies, optionalDependencies, peerDependencies]
      testFilePatterns:
        - '**/__tests__/**'
        - '**/*.test.*'
        - '**/*.d.*ts' # declaration files: no runtime imports, so excluded from the check
        - '**/test-helpers/**'
        - '**/*test-helpers.mts'

  - name: tracked code files are not empty placeholders
    rule: no-empty-or-comments-only-files
    scope: repository
    options:
      extensions:
        - .ts
        - .mts
        - .cts
        - .tsx
        - .js
        - .jsx
        - .mjs
        - .cjs
        - .sql
        - .rs
        - .css
      intentionallyEmpty:
        - backend/modules/rss-feed-cover-art/index.mts
        - backend/queues/openai-embeddings/setup.mts
        - backend/queues/openai-moderation/setup.mts

  - name: TypeScript extension policy
    rule: file-extension-policy
    scope: repository
    options:
      allowlist:
        - .dependency-cruiser.cjs
        - backend/.dependency-cruiser.cjs
        - backend/dependency-cruiser-rules/api-fixtures-typescript-reachability.cjs
        - backend/dependency-cruiser-rules/data-stores-primary.cjs
        - backend/dependency-cruiser-rules/data-stores-secondary.cjs
        - backend/dependency-cruiser-rules/entity-relations-build-insert-query.cjs
        - backend/dependency-cruiser-rules/package-boundaries.cjs
        - backend/dependency-cruiser-rules/workspace-package-relative-import-boundaries.cjs
        - lambdas/.dependency-cruiser.cjs
        - web/.dependency-cruiser.cjs
        - web/next.config.ts
        - web/postcss.config.mjs
        - web/public/service-worker.js
        - web/public/service-worker-push.js
      scopes:
        - path: backend
          bannedExtensions: [.js, .mjs, .cjs, .cts, .ts]
        - path: lambdas
          bannedExtensions: [.js, .mjs, .cjs, .cts, .ts]
        - path: cloudflare-worker
          bannedExtensions: [.js, .mjs, .cjs, .cts, .ts]
        - path: playwright
          bannedExtensions: [.js, .mjs, .cjs, .cts, .ts]
        - path: web
          bannedExtensions: [.js, .mjs, .cjs, .cts]

  - name: backend local owner docs
    rule: required-local-docs
    scope: repository
    options:
      roots:
        - backend/agents
        - backend/api/v1
        - backend/data-stores
        - backend/entrypoints
        - backend/modules
        - backend/queues
        - backend/services
        - backend/workers
      requiredFile: README.md
      codeExtensions:
        - ts
        - mts
        - cts
        - js
        - jsx
        - mjs
        - cjs
        - tsx
        - rs
        - lua
        - sql
      testExcludePatterns:
        - '*.test.*'
        - '*.spec.*'
        - __tests__

  - name: API docs include performance section
    rule: required-doc-section
    scope: repository
    options:
      glob: backend/api/v1/**/README.md
      requiredHeading: '## Performance'

  - name: git identity is not mutated by repo scripts
    rule: no-git-identity-mutation
    scope: repository
    options:
      excludePaths:
        - .github/workflows/runner-policy.test.mts
      conditionallyAllowedWorkflows:
        - .github/workflows/pnpm-dedupe.yml

  - name: shell scripts pass shellcheck
    rule: shellcheck-runner
    scope: repository
    options:
      shellFiles:
        - ci/lint-links.sh
        - ci/check-needs-results.sh
        - ci/coverage-artifacts.sh
        - ci/with-node-test-options
      shebangDirs:
        - .
      trackedOnly: true
      shellcheck:
        severity: warning

  - name: backend queue worker package layout
    rule: strict-package-layout
    scope: repository
    options:
      testFilePatterns:
        - '*.test.mts'
        - '*.spec.mts'
        - '*.generated.test.mts'
      testDirName: __tests__
      packages:
        - root: backend/queues
          sourceExtension: .mts
          allowedRootFiles:
            - package.json
            - config.mts
            - maintenance-config.mts
            - queue-names.mts
            - types.mts
            - queues.mts
            - enqueues.mts
          allowedSubdirs:
            - enqueues
            - payload
        - root: backend/workers
          sourceExtension: .mts
          allowedRootFiles:
            - package.json
            - types.mts
            - workers.mts
            - processors.mts
            - test-support.mts
          allowedSubdirs:
            - workers
            - processors

  - name: backend agent test coverage
    rule: require-test-per-subdir
    scope: repository
    options:
      roots: [backend/agents]
      testGlob: '*.test.mts'
      directChild: true

  - name: backend package required files
    rule: require-files-in-subdirs
    scope: repository
    options:
      packages:
        - root: backend/queues
          requiredFiles: [package.json, config.mts, queues.mts]
          requireAnyOf:
            - [enqueues.mts, 'enqueues/*.mts']
        - root: backend/workers
          requiredFiles: [package.json]
          requireAnyOf:
            - [workers.mts, 'workers/*.mts']
        - root: backend/services
          requiredFiles: [package.json, index.mts]
        - root: backend/agents
          requiredFiles: [package.json, index.mts]
        - root: backend/data-stores
          requiredFiles: [package.json, index.mts]
        - root: backend/modules
          requiredFiles: [package.json, index.mts]
        - root: backend/entrypoints
          requiredFiles: [package.json, serve.mts]

  # finite-set-consistency enforces the basic set-equality invariants from
  # finite-enum-ripple-guard.mts (topicTypes backend/web/SQL, PostType/SQL).
  # Slug-property consistency, factory-arg validation, and route-config
  # structural checks remain in the repo-local parser (Voucha-specific logic).
  - name: topicTypes cross-surface set consistency
    rule: finite-set-consistency
    scope: repository
    options:
      sets:
        - name: backendTopicTypes
          file: backend/types/entities/topic.mts
          kind: ts-const-object-keys
          target: topicTypes
        - name: webTopicTypes
          file: web/types/topics.ts
          kind: ts-const-object-keys
