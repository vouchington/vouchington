        - object: 'column:oauth_authorization_server_events.client_id'
          reason: 'Decision 14 immutable OAuth audit id.'
        - object: 'column:oauth_authorization_server_events.grant_id'
          reason: 'Decision 14 immutable OAuth audit id.'
        - object: 'column:oauth_authorization_server_events.refresh_token_family_id'
          reason: 'Decision 14 immutable OAuth audit id.'
        - object: 'column:oauth_native_session_token_mints.access_token_id'
