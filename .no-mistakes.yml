      importSpecifier: '@data-stores/psql'
      executorFactoryNames: [beginTransaction, beginBoundedTransaction]
      executorTypeNames: [TransactionQuery, QueryExecutor, PoolClient, QueryOptions]
      include:
        - backend/**/*.{ts,mts,js}
      exclude:
        - '**/*.test.*'
        - '**/__tests__/**'
        - '**/test-helpers/**'
      sqlInclude:
        - backend/data-stores/psql/views/**/*.sql
      schemaCatalogPath: backend/data-stores/psql/schema-snapshot/no-mistakes-catalog.json
      maxColumns: 0
      checkReturning: true
      # Interpolated templates can't be parsed. This matches the other embedded-SQL rules.
      unanalyzableSql: ignore

  - name: topics queries keep the active-topic filter
    rule: postgres-required-predicates
    scope: repository
    options:
      importSpecifier: '@data-stores/psql'
      executorFactoryNames: [beginTransaction, beginBoundedTransaction]
      executorTypeNames: [TransactionQuery, QueryExecutor, PoolClient, QueryOptions]
      include:
        - backend/**/*.{ts,mts,js}
      exclude:
        - '**/*.test.*'
        - '**/__tests__/**'
        - '**/test-helpers/**'
        - backend/scripts/**
      # Same skip as postgres-sql-shape-policy: interpolated templates are not
      # recoverable. Parsed `topics` queries still fail-closed; lifecycle
      # exceptions use no-mistakes-disable-file.
      unanalyzableSql: ignore
      relations:
        - table: topics
          require:
            - deleted_at IS NULL
            - merged_into_topic_id IS NULL

