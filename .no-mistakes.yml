ci:
  actionDirs:
    - .github/actions
  workflowDirs:
    - .github/workflows
    - ci/no-mistakes-workflows

projects:
  web:
    type: nextjs
    root: web

  web-app:
    type: nextjs
    root: web/app

  web-components:
    type: library
    root: web/components

  web-lib:
    type: library
    root: web/lib

  backend:
    type: server
    root: backend
    routes:
      - api/**
      - sitemap/**
      - md/**
    queues:
      enqueues:
        - queues/*/enqueues.mts
        - queues/*/enqueues/*.mts
      workers:
        - workers/*/**

  cloudflare-worker:
    type: cloudflare-workers
    root: cloudflare-worker

  ci-playwright:
    type: tests
    root: ci/playwright

  ci-transient-retry:
    type: tests
    root: ci/transient-retry

  github-actions:
    type: tests
    root: .github

  dev-initialize:
    type: tests
    root: dev
    include:
      - initialize*

checks:
  commands:
    - name: typecheck-backend
      command: [pnpm, exec, tsc, --noEmit, --incremental, --project, backend/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-backend-email
      command: [pnpm, exec, tsc, --noEmit, --incremental, --project, email-templates/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-web
      command:
        [bash, -c, 'cd web && pnpm exec next typegen && pnpm exec tsc --noEmit --incremental']
      fileArgs: none
      always: true
    - name: typecheck-lambdas
      command: [pnpm, exec, tsc, --noEmit, --incremental, --project, lambdas/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-cloudflare-worker
      command:
        [pnpm, exec, tsc, --noEmit, --incremental, --project, cloudflare-worker/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-scripts
      command: [pnpm, exec, tsc, --noEmit, --incremental, --project, tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-ts-shared
      command: [pnpm, exec, tsc, --noEmit, --incremental, --project, ts-shared/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-playwright
      command: [pnpm, exec, tsc, --noEmit, --incremental, --project, playwright/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-test-helpers
      command: [pnpm, exec, tsc, --noEmit, --incremental, --project, test-helpers/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-integration-tests
      command:
        [pnpm, exec, tsc, --noEmit, --incremental, --project, integration-tests/tsconfig.json]
      fileArgs: none
      always: true

tests:
  playwright:
    configs: playwright.config.mts
    projects:
      setup:
        include:
          - playwright/setup/**/*.setup.mts
      chromium:
        include:
          - playwright/tests/**/*.spec.mts
      support-tests:
        include:
          - ci/playwright/**/*.test.mts
          - playwright/helpers/**/*.test.mts
    coverage:
      routes: false
      selectors: true
    selectors:
      testIds:
        - data-pw
        - data-testid
      componentTestIds:
        dataPw: data-pw
      htmlIds: false
      wrappers:
        - module: playwright/helpers/aside-locator.mts
          export: getAsideLocator
          testIdArgument: 1
        - module: playwright/helpers/semantic-vote.mts
          export: chooseVote
          testIdArgument: 1
        - module: playwright/helpers/semantic-vote.mts
          export: voteBinaryChoice
          testIdArgument: 1
        - module: playwright/helpers/semantic-vote.mts
          export: voteChoice
          testIdArgument: 1
        - module: playwright/helpers/semantic-vote.mts
          export: voteChoiceGroup
          testIdArgument: 1
        - module: playwright/helpers/semantic-vote.mts
          export: voteClear
          testIdArgument: 1
        - module: playwright/helpers/semantic-vote.mts
          export: voteTrigger
          testIdArgument: 1
        - module: playwright/helpers/semantic-vote.mts
          export: userSignalChoice
          testIdArgument: 1
    selectorRoots:
      - web/app
      - web/components
      - web/lib/navigation
      - web/lib/podcast-player
      - web/lib/routes
    selectorExclude:
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - '**/*.stories.ts'
      - '**/*.stories.tsx'
      - '**/__tests__/**'
      - '**/*.mock.test.tsx'
  vitest:
    configs: vitest.config.mts
    projects:
      web:
        include:
          - web/**/*.test.ts
          - web/**/*.test.tsx
        exclude:
          - '**/node_modules/**'
          - '**/.git/**'
          - web/.next/**
          - web/storybook/**
      backend-aws:
        integration_suites:
          aws:
            - aws
      backend-bedrock:
        integration_suites:
          bedrock:
            - bedrock
      backend-openai:
        integration_suites:
          openai:
            - openai

test_plan:
  playwright:
    fullSuiteTriggers:
      ignoreChangedTests:
        - vitest
      triggers:
        - name: root-config
          paths:
            - package.json
            - cloudflare-worker/wrangler.local.jsonc
            - playwright.config.*
            - playwright/config/**
            - playwright/setup/**
            - ci/test-plan.mts
            - ci/setup-web-integration.mts
            - '!**/*.test.*'
            - '!**/*.mock.test.*'
            - '!**/__tests__/**'
            - '!playwright/tests/**'
      projects:
        cloudflare-worker:
          - src/**/*.mts
          - '!src/**/*.test.mts'
          - '!src/**/*.mock.test.mts'
          - '!src/**/__tests__/**'
          - '!src/**/test-helpers/**'
          - '!src/auth/test-*.mts'
        web:
          - next.config.*
          - proxy.*
        ci-playwright:
          - '**'
          - '!**/*.test.*'
          - '!**/__tests__/**'
        github-actions:
          - workflows/tests-playwright.yml
          - actions/build-web-targets/**
          - actions/setup-playwright/**
          - actions/setup-node-pnpm/**
    environments:
      # Regression #9440: `direct` has no budget, while
      # the fan-out-capable groups (`coverage`, `dependencies`) each carry their own scoped budget
      # instead of a shared env-level `limit`.
      prePush:
        exclude:
          - playwright/tests/storybook/**
          - playwright/credentialed/**
        groups:
          - type: direct
          - type: coverage
            limit:
              percent: 1
          - type: dependencies
            limit:
              percent: 1
      pullRequest:
        globalConfigFallback: false
        exclude:
          - playwright/credentialed/**
        groups:
          - type: direct
          - type: coverage
          - type: dependencies
          - type: sample
            limit:
              percent: 1
            sampleWhenLimited: true
      credentialed:
        include:
          - playwright/credentialed/**
        groups:
          - type: direct
          - type: coverage
          - type: dependencies
          - type: sample
            limit:
              percent: 100
      main:
        all: true
  vitest:
    fullSuiteTriggers:
      ignoreChangedTests:
        - vitest
      triggers:
        - name: root-config
          paths:
            - package.json
            - vitest.config.mts
            - test-helpers/vitest-config/**
        - name: api-contracts
          paths:
            - api-fixtures/v1/openapi.json
            - api-fixtures/v1/schema-lock.json
            - backend/api/v1/**
          targets:
            - backend-test-helpers
        - name: workspace-package-boundaries
          paths:
            - api-fixtures/package.json
            - backend/**/*.mts
            - backend/**/*.ts
            - backend/**/package.json
            - ts-shared/**/*.mts
            - ts-shared/**/package.json
            - pnpm-workspace.yaml
            - static-code-analysis/docker-deploy/**
          targets:
            - docker-deploy
        - name: postgres-resources
          paths:
            - backend/data-stores/psql/migrations/**/*.sql
            - backend/data-stores/psql/config-driven/**/*.sql
            - backend/data-stores/psql/config-driven/**/*.mts
          targets:
            - backend/analytics-integration
            - backend-data-stores
            - backend-postgres-schema
            - backend-mocks
            - backend-aws
            - backend-openai
            - web-api
            - web-integration
        - name: agent-tools-docs
          paths:
            - docs/overview/architecture/agent-tools/**
          targets:
            - backend-docs-freshness
        - name: automation-prompt-docs
          paths:
            - docs/prompts/**
          targets:
            - github-actions
            - ci-tools
            - dev-tools
        - name: agent-skill-docs
          paths:
            - .agents/skills/**
          targets:
            - github-actions
            - ci-tools
            - dev-tools
            - static-analysis-tools
        - name: localization-email-residuals
          paths:
            - email-templates/**
            - ts-shared/ui-messages/**
            - dev/localization/**
          targets:
            - backend-email-templates
        - name: ci-inventory-config
          paths:
            - .no-mistakes.yml
            - .github/ci-path-filters.yml
            - .github/workflows/ci-detect-changes.yml
            - .github/workflows/main-checks.yml
          targets:
            - github-actions
            - ci-tools
    environments:
      # Regression #9440: `direct` is bounded by what the
      # developer actually edited in the push, so it must never share a budget with the
      # fan-out-capable `dependencies` group -- a shared budget can silently drop test files the
      # developer directly edited from the plan.
      prePush:
        exclude:
          - '**/*.openai*.test.mts'
          - '**/*.bedrock*.test.mts'
          - '**/*.stripe.test.mts'
        groups:
          - type: direct
          - type: dependencies
            limit:
              percent: 1
      pullRequest:
        globalConfigFallback: false
        groups:
          - type: direct
          - type: dependencies
          - type: sample
            limit:
              percent: 1
            sampleWhenLimited: true

rules:
  - name: GitHub Actions uses pins
    rule: github-actions-pinned-hash
    scope: repository

  - name: test sources do not embed exact Git revisions
    rule: no-test-git-sha
    scope: repository
    include:
      - '**/*.test.*'
      - '**/*.spec.*'
      - '**/*.stories.*'
      - '**/*.fixture.*'
      - '**/*.fixtures.*'
      - '**/test/**'
      - '**/tests/**'
      - '**/Tests/**'
      - '**/__tests__/**'
      - '**/__snapshots__/**'
      - '**/fixture/**'
      - '**/fixtures/**'
      - '**/__fixtures__/**'
      - '**/integration-tests/**'
      - '**/test-helpers/**'
      - '**/test-support.*'
      - '**/*-fixture.*'
      - '**/*-fixtures.*'
      - '**/*-test-helper.*'
      - '**/*-test-helpers.*'
      - '**/*-test-scripts.*'
      - '**/*-test-support.*'
      - 'web/storybook/**'
    exclude:
      - '**/packages.lock.json'
      - '**/package-lock.json'
      - '**/pnpm-lock.yaml'
      - '**/yarn.lock'
      - '**/Cargo.lock'
      - '**/Package.resolved'
  - name: GitHub Actions does not use sparse checkout
    rule: no-sparse-checkout
    scope: repository
    options:
      include:
        - '.github/workflows/**'
        - '.github/actions/**'
        - 'ci/no-mistakes-workflows/**'

  - name: Vitest tests do not invoke real timers
    rule: forbidden-calls
    scope: repository
    options:
      roots:
        - vitest: true
      traversal: file
      unknownCalls: ignore
      targets:
        - global: setTimeout
        - moduleExport:
            module: node:timers
            export: setTimeout
        - moduleExport:
            module: node:timers/promises
            export: setTimeout

  - name: Playwright tests do not invoke fixed sleeps
    rule: forbidden-calls
    scope: repository
    options:
      roots:
        - playwright: true
      traversal: file
      unknownCalls: ignore
      targets:
        - global: setTimeout
        - terminal: waitForTimeout
        - moduleExport:
            module: node:timers
            export: setTimeout
        - moduleExport:
            module: node:timers/promises
            export: setTimeout

  - name: Configuration paths reference tracked repository content
    rule: config-path-references
    scope: repository
    options:
      presets:
        - no-mistakes
        - oxlintrc
        - knip
        - dependabot
        - sgconfig
        - syncpack
        - coverage-rules
        - pnpm-workspace-filters

  - name: TypeScript compiler gate coverage
    rule: tsconfig-gate-coverage
    scope: repository
    options:
      allowProjects:
        web/tsconfig.dependency-cruiser.json: Used only by dependency-cruiser, not as a compiler program.

  - name: web unique exports
    rule: unique-exports
    projects:
      - web-app
      - web-components
      - web-lib

  - name: web no Next.js API routes
    rule: nextjs-no-api-routes
    projects:
      - web
    # Operational browser bootstrap, not an application API. The exact web fallback keeps
    # web-first and Worker-first deploys compatible while the Worker owns the steady-state response.
    exclude:
      - web/app/runtime-sentry-config.js/route.ts

  - name: web no Next.js caching
    rule: nextjs-no-caching
    projects:
      - web

  - name: web no unmocked dynamic imports
    rule: test-no-unmocked-dynamic-imports
    tests:
      vitest:
        - web

  - name: web Playwright selector coverage
    rule: playwright-coverage
    projects:
      - web

  - name: web unique Playwright test IDs
    rule: playwright-unique-test-ids
    projects:
      - web

  - name: web unique HTML IDs
    rule: playwright-unique-html-ids
    projects:
      - web

  # Flags getByRole/getByLabel/getByText only when the app source has the same
  # static copy next to a data-pw. i18n `t(...)` copy is invisible, so those
  # locators stay silent without suppressions (#9503).
  - name: web Playwright prefer test-id locators
    rule: playwright-prefer-test-id-locators
    projects:
      - web
    tests:
      playwright:
        - chromium

  - name: agent docs max size
    rule: agents-md-max-size
    scope: repository
    options:
      maxLines: 180
      maxChars: 12000
      advisoryCharsRemaining: 500

  - name: developer Markdown is reachable from agent instructions
    rule: markdown-reachability
    scope: repository
    include:
      - '**/*.md'
    exclude:
      - '**/CLAUDE.md'
      - articles/**
      - '**/fixtures/**/*.md'
      - '**/__fixtures__/**/*.md'
      - '**/snapshots/**/*.md'
      - '**/__snapshots__/**/*.md'
      - '**/test-fixtures/**/*.md'
      - '**/test-cases/**/*.md'
      - '**/__test-cases__/**/*.md'
      - '**/testcases/**/*.md'
      - '**/__testcases__/**/*.md'
    options:
      rootFilenames: [CLAUDE.md]
      indexFilenames: [README.md]
      maxDepth: 2

  - name: scheduled job manifests are registered in the API catalog
    rule: required-entrypoint-reachability
    scope: repository
    options:
      sourceGlobs:
        - backend/queues/*/enqueues/schedules.mts
      entrypoints:
        - backend/api/v1/mq/scheduled-job-manifests.mts
      maxDepth: 1

  - name: scheduled job manifests are registered in a worker runtime
    rule: required-entrypoint-reachability
    scope: repository
    options:
      sourceGlobs:
        - backend/queues/*/enqueues/schedules.mts
      entrypoints:
        - backend/entrypoints/worker-cpu/schedule-definitions.mts
        - backend/entrypoints/worker-io/definitions.mts
      maxDepth: 1

  - name: worker modules are registered in a runtime definition root
    rule: required-entrypoint-reachability
    scope: repository
    exclude:
      - backend/workers/**/*.test.mts
      - backend/workers/**/__tests__/**
    options:
      sourceGlobs:
        - backend/workers/*/workers.mts
        - backend/workers/*/workers/*.mts
      entrypoints:
        - backend/entrypoints/worker-cpu/worker-definitions.mts
        - backend/entrypoints/worker-io/worker-definitions.mts
        - backend/entrypoints/worker-io/sqs-consumer-definitions.mts
        - backend/worker-runtime/universal-workers.mts
      maxDepth: 2

  # `register-*.mts` under services/ is by convention a side-effect registrar and nothing else;
  # a future file matching this name that is not one must be renamed, not excluded.
  - name: service registrars are wired into the registration root
    rule: required-entrypoint-reachability
    scope: repository
    exclude: ['**/*.test.mts', '**/__tests__/**']
    options:
      sourceGlobs:
        - backend/services/*/register-*.mts
        - backend/services/*/*/register-*.mts
      entrypoints:
        - backend/service-registrations/index.mts
      maxDepth: 1

  # One instance per entrypoint: with exactly one `entrypoints` entry the assertion is unambiguous
  # regardless of the rule's multi-entrypoint ("any" vs. "all") semantics.
  - name: api entrypoint loads service registrations
    rule: required-entrypoint-reachability
    scope: repository
    options:
      sourceGlobs:
        - backend/service-registrations/index.mts
      entrypoints:
        - backend/entrypoints/api/index.mts
      maxDepth: 1

  - name: worker-cpu entrypoint loads service registrations
    rule: required-entrypoint-reachability
    scope: repository
    options:
      sourceGlobs:
        - backend/service-registrations/index.mts
      entrypoints:
        - backend/entrypoints/worker-cpu/index.mts
      maxDepth: 1

  - name: worker-io entrypoint loads service registrations
    rule: required-entrypoint-reachability
    scope: repository
    options:
      sourceGlobs:
        - backend/service-registrations/index.mts
      entrypoints:
        - backend/entrypoints/worker-io/index.mts
      maxDepth: 1

  - name: seed entrypoint loads service registrations
    rule: required-entrypoint-reachability
    scope: repository
    options:
      sourceGlobs:
        - backend/service-registrations/index.mts
      entrypoints:
        - backend/scripts/seed/index.mts
      maxDepth: 1

  - name: large Markdown has a focused visual structure
    rule: markdown-structure-budget
    scope: repository
    include:
      - '**/*.md'
    exclude:
      - '**/CLAUDE.md'
      - articles/**
      - '**/fixtures/**/*.md'
      - '**/__fixtures__/**/*.md'
      - '**/snapshots/**/*.md'
      - '**/__snapshots__/**/*.md'
      - '**/test-fixtures/**/*.md'
      - '**/test-cases/**/*.md'
      - '**/__test-cases__/**/*.md'
      - '**/testcases/**/*.md'
      - '**/__testcases__/**/*.md'
    options:
      maxLines: 180
      maxChars: 12000
      maxTables: 1
      maxMermaid: 1

  - name: integration tests do not call mock helpers
    rule: forbidden-calls
    scope: repository
    include:
      - integration-tests/**/*.mts
    options:
      roots:
        - vitest: true
      traversal: file
      unknownCalls: ignore
      targets:
        - exact: vi.mock
        - exact: vi.doMock
        - exact: vi.importMock
        - exact: vi.fn
        - exact: vi.spyOn
        - exact: vi.stubGlobal
        - exact: jest.mock
        - exact: jest.doMock

  - name: integration tests use real dependencies
    rule: integration-test-no-mocks
    scope: repository
    include:
      - integration-tests/**/*.mts
    options:
      forbiddenModules:
        - msw
        - nock
        - sinon

  - name: test email fixtures use voucha test domain
    rule: test-email-domain-policy
    scope: repository
    include:
      - '**/*.test.*'
      - '**/*.spec.*'
      - '**/__tests__/**'
      - '**/__snapshots__/**'
      - '**/fixtures/**'
      - backend/test-helpers/**
      - backend/scripts/seeds/playwright-test-data/**
      - web/test-helpers/**
      - test-helpers/**
      - integration-tests/**
      - playwright/**
    options:
      bannedDomains:
        - example.com
      allowedEmailPatterns:
        - '(?i)^tests(?:\+[a-z0-9._%${}-]+|%2b[a-z0-9._%${}-]+)(?:@|%40)voucha\.ai$'
      replacement: tests+<hash>@voucha.ai
      extensions:
        - .cjs
        - .css
        - .csv
        - .cts
        - .html
        - .js
        - .json
        - .jsonc
        - .md
        - .mjs
        - .mts
        - .sql
        - .ts
        - .tsx
        - .txt
        - .xml
        - .yml
        - .yaml

  - name: markdown link filename text matches target
    rule: markdown-link-display-text
    scope: repository
    include:
      - '**/*.md'

  - name: Next.js middleware files are renamed to proxy
    rule: banned-renamed-files
    scope: repository
    options:
      scope: web
      bannedBasenames:
        - name: middleware
          message: rename middleware.{ts,mts,js} to proxy.ts (Next.js 16+)
      extensions:
        - .ts
        - .mts
        - .js

  - name: no webpack config files
    rule: banned-renamed-files
    scope: repository
    options:
      bannedBasenames:
        - name: webpack.config
          message: >-
            webpack config files are not allowed; this project uses Turbopack for
            Next.js and Vite for Storybook
      extensions:
        - .js
        - .cjs
        - .mjs
        - .ts
        - .mts
        - .cts

  - name: repository package-manager lockfiles
    rule: lockfile-allowlist
    scope: repository
    options:
      allowed:
        - pnpm-lock.yaml
        - integration-tests/*/pnpm-lock.yaml
      bannedBasenames:
        - package-lock.json
        - npm-shrinkwrap.json
        - yarn.lock
        - bun.lock
        - bun.lockb

  - name: banned repository paths
    rule: banned-paths
    scope: repository
    options:
      bannedPaths:
        - glob: '*/*/**/test-helpers/**'
          message: Test helpers must live under test-helpers/** or <top-level>/test-helpers/**.
        - glob: '**/test-helper/**'
          message: Test helpers must live under test-helpers/** or <top-level>/test-helpers/**.
        - glob: '**/test-support/**'
          message: Test helpers must live under test-helpers/** or <top-level>/test-helpers/**.
        - glob: '**/test-utils/**'
          message: Test helpers must live under test-helpers/** or <top-level>/test-helpers/**.
        - glob: '**/testutils/**'
          message: Test helpers must live under test-helpers/** or <top-level>/test-helpers/**.
        - glob: '**/test-utilities/**'
          message: Test helpers must live under test-helpers/** or <top-level>/test-helpers/**.
        - glob: '**/testutilities/**'
          message: Test helpers must live under test-helpers/** or <top-level>/test-helpers/**.
        - glob: '**/testing-helper/**'
          message: Test helpers must live under test-helpers/** or <top-level>/test-helpers/**.
        - glob: '**/testing-helpers/**'
          message: Test helpers must live under test-helpers/** or <top-level>/test-helpers/**.
        - glob: swift-clients/**
          message: Native Swift source belongs in vouchington/vouchington-clients
        - glob: dotnet-clients/**
          message: Native .NET source belongs in vouchington/vouchington-clients
        - glob: ci/coverage-dotnet-lcov-merge.mts
          message: Native .NET coverage tooling belongs in vouchington/vouchington-clients
        - glob: ci/coverage-dotnet-lcov-runs.mts
          message: Native .NET coverage tooling belongs in vouchington/vouchington-clients
        - glob: ci/__fixtures__/stale-dotnet-app.mts
          message: Native .NET fixtures belong in vouchington/vouchington-clients
        - glob: ci/swift-source-offset.mts
          message: Native Swift coverage tooling belongs in vouchington/vouchington-clients
        - glob: ci/swift-resolved-pin-delta.mts
          message: Native Swift dependency tooling belongs in vouchington/vouchington-clients
        - glob: ci/swift-resolved-pin-delta.test.mts
          message: Native Swift dependency tooling belongs in vouchington/vouchington-clients
        - glob: dev/actions-runner-health/**
          message: Runner host health tooling belongs in vouchington-machines
        - glob: dev/setup-local-macos
          message: Host setup belongs in vouchington-machines
        - glob: dev/setup-local-linux
