  - name: DML must not write PostgreSQL generated columns
    rule: postgres-no-generated-column-writes
    scope: repository
    severity: error
    options:
      unanalyzableSql: ignore
      importSpecifier: '@data-stores/psql'
      executorFactoryNames: [beginTransaction, beginBoundedTransaction]
      executorTypeNames: [TransactionQuery, QueryExecutor, PoolClient, QueryOptions]
      # 0.46.1 peels DO $tag$ bodies for pairing engines. This rule may still
      # skip chr()-encoded statements. extraGeneratedColumns stays only for
      # config-driven tables whose DDL is TypeScript.
      sqlInclude:
        - backend/data-stores/psql/migrations/**/*.sql
      include:
        - backend/**/*.{ts,mts,tsx,js,sql}
        - integration-tests/**/*.{ts,mts,tsx,js,sql}
        - playwright/**/*.{ts,mts,tsx,js,sql}
