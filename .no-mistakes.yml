  - name: GitHub Actions uses pins
    rule: github-actions-pinned-hash
    scope: repository

  - name: test sources do not embed exact Git revisions
    rule: no-test-git-sha
    scope: repository
    include:
      - '**/*.test.*'
      - '**/*.spec.*'
      - '**/*.stories.*'
      - '**/*.fixtures.*'
      - '**/tests/**'
      - '**/__tests__/**'
      - '**/__snapshots__/**'
      - '**/integration-tests/**'
      - '**/test-helpers/**'
      - '**/test-support.*'
      - '**/*-fixture.*'
      - '**/*-fixtures.*'
      - '**/*-test-helper.*'
      - '**/*-test-support.*'
      - 'web/storybook/**'
    exclude:
      - '**/pnpm-lock.yaml'
  - name: Only canonical API routes may start an SSE response
    rule: forbidden-calls
    scope: repository
    # The AST-grep call-inventory rule also catches raw calls through unresolved dynamic imports.
    message: >-
      New SSE routes must join the reviewed route inventory before calling startSSE.
    exclude:
      - 'backend/api/**/__tests__/**'
      - 'backend/api/**/*.test.mts'
      - 'backend/api/v1/admin/article-syncs.mts'
      - 'backend/api/v1/admin/index-routes/snapshot-stream.mts'
      - 'backend/api/v1/images/index-routes/images-by-imageid-state-stream-get.mts'
      - 'backend/api/v1/mq/index-routes/mq-stream-get.mts'
      - 'backend/api/v1/my/imports/stream.mts'
      - 'backend/api/v1/users/data-request.mts'
    options:
      roots:
        - glob:
            - 'backend/api/**/*.mts'
      traversal: file
      unknownCalls: ignore
      targets:
        - function:
            file: backend/api/sse-helpers.mts
            symbol: startSSE

  - name: Durable app-owned IDs in creation paths use UUIDv7
    rule: forbidden-calls
    scope: repository
    message: >-
      randomUUID()/v4() are reserved for temporary markers, tokens, and other opaque non-durable values; mint durable app-owned IDs as UUIDv7.
    options:
      roots:
        - file: backend/services/bedrock-embeddings-batch/orchestrator/create.mts
        - file: backend/services/admin-imports/seed-csvs.mts
        - file: backend/api/v1/posts/posts-routes/posts-create-post.mts
        - file: backend/api/v1/communities/posts-honeypot-response.mts
      traversal: direct
      unknownCalls: ignore
      targets:
        - exact: crypto.randomUUID
        - moduleExport:
            module: node:crypto
            export: randomUUID
        - moduleExport:
            module: crypto
            export: randomUUID
        - moduleExport:
            module: uuid
            export: v4

  - name: Tests use the shared database
    rule: forbidden-calls
    scope: repository
    message: >-
      Tests must use the shared dirty database and scope fixtures to their own rows; isolated database cases are forbidden.
    options:
      roots:
        - vitest: true
        - playwright: true
      traversal: file
      unknownCalls: ignore
      targets:
        - terminal: runIsolatedDatabaseCase

  - name: Vitest tests do not invoke real timers
    rule: forbidden-calls
    scope: repository
    options:
      roots:
        - vitest: true
      traversal: file
      unknownCalls: ignore
      targets:
        - global: setTimeout
        - moduleExport:
            module: node:timers
            export: setTimeout
        - moduleExport:
            module: node:timers/promises
            export: setTimeout

  - name: Playwright tests do not invoke fixed sleeps
    rule: forbidden-calls
    scope: repository
    options:
      roots:
        - playwright: true
      traversal: file
      unknownCalls: ignore
      targets:
        - global: setTimeout
        - terminal: waitForTimeout
        - moduleExport:
            module: node:timers
            export: setTimeout
        - moduleExport:
            module: node:timers/promises
            export: setTimeout

  - name: Vitest tests do not poll or wait on timers
    rule: forbidden-calls
    scope: repository
    # Remaining polling violations are tracked by #2145.
    exclude:
      - 'backend/services/elections-votes/entity-relation/publication-capture.test.mts'
      - 'backend/services/elections-votes/entity-relation/vote-stats-publication-lock.test.mts'
