ci:
  actionDirs:
    - .github/actions
  workflowDirs:
    - .github/workflows
    - ci/no-mistakes-workflows

projects:
  web:
    type: nextjs
    root: web

  web-app:
    type: nextjs
    root: web/app

  web-components:
    type: library
    root: web/components

  web-lib:
    type: library
    root: web/lib

  backend:
    type: server
    root: backend
    routes:
      - api/**
      - sitemap/**
      - md/**
    queues:
      enqueues:
        - queues/*/enqueues.mts
        - queues/*/enqueues/*.mts
      workers:
        - workers/*/**

  cloudflare-worker:
    type: cloudflare-workers
    root: cloudflare-worker

  ci-playwright:
    type: tests
    root: ci/playwright

  ci-transient-retry:
    type: tests
    root: ci/transient-retry

  github-actions:
    type: tests
    root: .github

  dev-initialize:
    type: tests
    root: dev
    include:
      - initialize*

checks:
  commands:
    - name: typecheck-backend
      command: [pnpm, exec, tsc, --noEmit, --incremental, --project, backend/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-backend-email
      command: [pnpm, exec, tsc, --noEmit, --incremental, --project, email-templates/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-web
      command:
        [bash, -c, 'cd web && pnpm exec next typegen && pnpm exec tsc --noEmit --incremental']
      fileArgs: none
      always: true
    - name: typecheck-lambdas
      command: [pnpm, exec, tsc, --noEmit, --incremental, --project, lambdas/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-cloudflare-worker
      command:
        [pnpm, exec, tsc, --noEmit, --incremental, --project, cloudflare-worker/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-scripts
      command: [pnpm, exec, tsc, --noEmit, --incremental, --project, tsconfig.json]
      fileArgs: none
      always: true
    # Scheduler sources feed the operator API fixture projection.
    - name: api-fixtures-scheduled-jobs
      command: [pnpm, run, api-fixtures:check]
      fileArgs: none
      include:
        - 'backend/queues/**/enqueues/schedules.mts'
        - 'backend/services/queue-monitoring/scheduled-jobs-registry.mts'
        - 'backend/services/queue-monitoring/scheduled-job-manifests.mts'
    - name: typecheck-ts-shared
      command: [pnpm, exec, tsc, --noEmit, --incremental, --project, ts-shared/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-playwright
      command: [pnpm, exec, tsc, --noEmit, --incremental, --project, playwright/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-test-helpers
      command: [pnpm, exec, tsc, --noEmit, --incremental, --project, test-helpers/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-integration-tests
      command:
        [pnpm, exec, tsc, --noEmit, --incremental, --project, integration-tests/tsconfig.json]
      fileArgs: none
      always: true
    # CI-only static gates (#3015): `check` runs the repository rules, but impacted-checks would
    # otherwise list only typechecks and tests. Each command mirrors its owning workflow step.
    - name: dependency-cruise-web
      command:
        [
          pnpm,
          exec,
          depcruise,
          --config,
          web/.dependency-cruiser.cjs,
          --output-type,
          err,
          --cache,
          --cache-strategy,
          content,
          web,
        ]
      fileArgs: none
      include:
        - 'web/**'
        - 'ts-shared/**'
        - package.json
        - pnpm-lock.yaml
    - name: ast-grep-rules
      command: [pnpm, run, ast-grep]
      fileArgs: none
      always: true
    - name: knip-unused-files
      command: [pnpm, exec, knip, --treat-config-hints-as-errors]
      fileArgs: none
      always: true
    - name: no-mistakes-rules
      command: [pnpm, run, no-mistakes]
      fileArgs: none
      always: true
    - name: lint-links-internal
      command: [./ci/lint-links.sh, --offline]
      fileArgs: none
      always: true
    - name: repo-node-static-checks
      command:
        - node
        - static-code-analysis/run-node-checks.mts
        - --checks
        - config-inventory-policy,repo-file-policy,scc-complexity,targeted-guardrails,dependency-license-policy
      fileArgs: none
      always: true
    - name: live-repository-policies
      command: [node, ci/check-repository-policy-scans.mts]
      fileArgs: none
      always: true
    - name: backend-dependency-boundaries
      command: [pnpm, run, dep-cruise:backend]
      fileArgs: none
      include:
        - 'backend/**/*.mts'
        - 'backend/**/*.cjs'
        - 'ts-shared/**/*.ts'
        - '**/package.json'
        - pnpm-lock.yaml
      exclude:
        - '**/*.test.mts'
        - '**/test-helpers/**'
    - name: knip-production-exports
      command: [pnpm, run, knip:production-exports]
      fileArgs: none
      include:
        - 'backend/**/*.mts'
        - '**/package.json'
        - knip.jsonc
      exclude:
        - '**/*.test.mts'
        - '**/test-helpers/**'
    # CI lints the whole repository (#3505); appending only the changed files keeps the listed
    # local command cheap. It cannot append their dependents, which before-pushing adds.
    - name: oxlint-type-aware
      command: [pnpm, exec, oxlint, --type-aware, --deny-warnings]
      fileArgs: append
      include:
        - '**/*.ts'
        - '**/*.tsx'
        - '**/*.mts'
        - '**/*.cts'

