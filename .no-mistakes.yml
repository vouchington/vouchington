# Export spellings verified against @data-stores/psql and the named Glide clients.
# Reviewed existing per-item calls are tracked by #2523; remediation removes allow entries.
effects:
  postgres:
    functions: [executeHandlerWithCursorInBatches]
    targets:
      - { module: '@data-stores/psql', export: read }
      - { module: '@data-stores/psql', export: write }
      - { module: '@data-stores/psql', export: query }
      - { module: '@data-stores/psql/clients', export: query }
      - { module: '@data-stores/psql', export: createAsyncGeneratorFromCursor }
      - { module: '@data-stores/psql/cursors', export: createAsyncGeneratorFromCursor }
    returnedExecutors:
      - { module: '@data-stores/psql', export: beginTransaction }
      - { module: '@data-stores/psql', export: beginBoundedTransaction }
      - { module: '@data-stores/psql/setup', export: beginTransaction }
      - { module: '@data-stores/psql/setup', export: beginBoundedTransaction }
      - { module: '@voucha/test-helpers', export: beginTransaction }
      - { module: '@voucha/test-helpers', export: beginBoundedTransaction }
      - { module: '../index.mts', export: beginTransaction }
      - { module: '../setup.mts', export: beginTransaction }
      - { module: './setup.mts', export: beginTransaction }
      - { module: './setup.mts', export: beginBoundedTransaction }
      - { module: '../data-stores/psql/setup.mts', export: beginTransaction }
      - { module: '../../../backend/data-stores/psql/index.mts', export: beginTransaction }
      - { module: './index.mts', export: beginTransaction }
      - { module: './index.mts', export: beginBoundedTransaction }
      - { module: './transactions.mts', export: beginTransaction }
      - { module: './transactions.mts', export: beginBoundedTransaction }
    typedExecutors:
      - { module: '@vouchington/postgres', export: TransactionQuery }
      - { module: '@vouchington/postgres', export: QueryExecutor }
    returnedMembers:
      - { module: '@data-stores/psql', export: writePool.connect, member: query }
      - { module: '@data-stores/psql', export: advisoryLockPool.connect, member: query }
      - { module: '@data-stores/psql', export: readPool.connect, member: query }
      - { module: '@data-stores/psql/setup', export: advisoryLockPool.connect, member: query }
      - { module: './setup.mts', export: writePool.connect, member: query }
      - { module: './setup.mts', export: advisoryLockPool.connect, member: query }
      - { module: './setup.mts', export: readPool.connect, member: query }
      - { module: '../setup.mts', export: writePool.connect, member: query }
      - { module: './index.mts', export: readPool.connect, member: query }
      - { module: '@vouchington/postgres', export: connectWithRetry, member: query }
    # Structural/indexed query types, callbacks, and option fallbacks still need this spelling.
    transactionFunctions: [query]
    batchFunctions: [pipelineBatch]
  valkey:
    targets:
      - {
          module: '@services/ai-usage/accounting-uncertainty.mts',
          export: getAccountingUncertaintySource,
        }
      - {
          module: '@services/ai-usage/accounting-uncertainty.mts',
          export: latchAccountingUncertainty,
        }
      - { module: '@services/valkey-admin/diagnostics.mts', export: collectValkeyDiagnostics }
    functions:
