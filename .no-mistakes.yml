  - name: multi-row FOR UPDATE locks have a deterministic order
    rule: postgres-lock-ordering
    scope: repository
    severity: error
    options:
      unanalyzableSql: ignore
      importSpecifier: '@data-stores/psql'
      executorFactoryNames: [beginTransaction, beginBoundedTransaction]
      executorTypeNames: [TransactionQuery, QueryExecutor, PoolClient, QueryOptions]
      # Without a catalog every IN/ANY filter reads as multi-row, so this entry fails closed on locks
      # the catalog entry below proves single-row. It scans only what that entry excludes; the
      # catalog entry also requires deterministic ordering for everything else.
      include:
        - backend/**/fixtures/**
        - backend/**/*test-helper*.*
        - backend/**/*test-support.*
        - backend/**/*fixture*.*
        - backend/**/scripts/**
        - backend/data-stores/psql/config-driven/**/*seed*.mts
        - backend/data-stores/psql/config-driven/0080-00-01-publisher-type-topics.mts
      exclude:
        - '**/*.test.*'
        - '**/test-helpers/**'
        - '**/__tests__/**'
      safeDirective: deadlock-safe

  - name: production PostgreSQL writers acquire conflicts in catalog order
    rule: postgres-conflict-ordering
    scope: repository
    options:
      importSpecifier: '@data-stores/psql'
      executorFactoryNames: [beginTransaction, beginBoundedTransaction]
      executorTypeNames: [TransactionQuery, QueryExecutor, PoolClient, QueryOptions]
      schemaCatalogPath: backend/data-stores/psql/schema-snapshot/no-mistakes-catalog.json
      sqlInclude:
        - backend/data-stores/psql/config-driven/**/*.sql
      executorNames: [query, write]
      unanalyzableSql: ignore
      include:
        - backend/**/*.mts
        - backend/**/*.ts
      exclude:
        - '**/*.test.*'
        - '**/test-helpers/**'
        - '**/__tests__/**'
        - '**/fixtures/**'
        - '**/*test-helper*.*'
        - '**/*test-support.*'
        - '**/*fixture*.*'
        - '**/scripts/**'
        - backend/data-stores/psql/config-driven/**/*seed*.mts
        - backend/data-stores/psql/config-driven/**/*seed*.sql
        - backend/data-stores/psql/config-driven/0080-00-01-publisher-type-topics.mts
        - backend/data-stores/psql/config-driven/0080-00-02-publisher-type-relations.sql
      safeDirective: deadlock-safe

  - name: production PostgreSQL locks use catalog key prefixes
    rule: postgres-lock-ordering
    scope: repository
    severity: error
    options:
      unanalyzableSql: ignore
      importSpecifier: '@data-stores/psql'
      executorFactoryNames: [beginTransaction, beginBoundedTransaction]
      executorTypeNames: [TransactionQuery, QueryExecutor, PoolClient, QueryOptions]
      schemaCatalogPath: backend/data-stores/psql/schema-snapshot/no-mistakes-catalog.json
      sqlInclude:
