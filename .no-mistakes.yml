    scope: repository
    options:
      schemaCatalogPath: backend/data-stores/psql/schema-snapshot/no-mistakes-catalog.json
      objects: [table, view, materialized-view, column]
      # These patterns carry forward COMMENT_EXEMPT_COLUMN_NAMES and
      # COMMENT_EXEMPT_COLUMN_PATTERNS from the replaced live-DB helper.
      exemptColumnNamePatterns:
        - '^(id|created_at|updated_at|created_by_id|updated_by_id|deleted_at|deleted_by_id)$'
