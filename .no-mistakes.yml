    options:
      sqlInclude:
        - backend/data-stores/psql/migrations/**/*.sql

  - name: foreign keys declare an explicit ON DELETE action
    rule: postgres-require-fk-on-delete
    scope: repository
    options:
      sqlInclude:
        - backend/data-stores/psql/migrations/**/*.sql

  - name: added foreign keys and checks use named constraints
    rule: postgres-require-named-constraints
    scope: repository
    options:
      sqlInclude:
        - backend/data-stores/psql/migrations/**/*.sql

  - name: config-driven SQL does not contain schema DDL
    rule: postgres-sql-statement-policy
    scope: repository
    options:
      sqlInclude:
        - backend/data-stores/psql/config-driven/**/*.sql

  - name: executed INSERTs stay replay-safe
    rule: postgres-idempotent-insert
    scope: repository
    options:
      sqlInclude:
        - backend/data-stores/psql/config-driven/**/*.sql
      include:
        - backend/data-stores/psql/config-driven/**/*.{ts,mts,js,sql}
      exclude:
        - '**/*.test.*'
        - '**/__tests__/**'
        - '**/test-helpers/**'
      scanEmbedded: true
      replaySafeTriggerFunctions:
        - fn_update_updated_at
        - fn_lock_agent_moderation_transparency_agent
      triggerWrittenColumns:
        fn_update_updated_at: [updated_at]

  - name: do not wrap set operations in correlated EXISTS
    rule: postgres-sql-shape-policy
    scope: repository
    options:
      sqlInclude:
        - backend/data-stores/psql/config-driven/**/*.sql
      include:
        - backend/**/*.{ts,mts,js}
      exclude:
        - '**/*.test.*'
        - '**/__tests__/**'
        - '**/test-helpers/**'
        - backend/scripts/**
      # Skip dynamically interpolated executor SQL. The deleted topics-active-filter
      # and EXISTS-shape guards only judged recoverable SQL; fail would flag every
      # composed `read`/`write` wrapper. Parsed queries still fail-closed.
      unanalyzableSql: ignore

  - name: topics queries keep the active-topic filter
    rule: postgres-required-predicates
    scope: repository
    options:
      include:
        - backend/**/*.{ts,mts,js}
      exclude:
        - '**/*.test.*'
        - '**/__tests__/**'
        - '**/test-helpers/**'
        - backend/scripts/**
      # Same skip as postgres-sql-shape-policy: interpolated templates are not
      # recoverable. Parsed `topics` queries still fail-closed; lifecycle
      # exceptions use no-mistakes-disable-file.
      unanalyzableSql: ignore
      relations:
        - table: topics
          require:
            - deleted_at IS NULL
            - merged_into_topic_id IS NULL

