    include:
      - integration-tests/**/*.mts
    options:
      roots:
        - vitest: true
      traversal: file
      unknownCalls: ignore
      targets:
        - exact: vi.mock
        - exact: vi.doMock
        - exact: vi.importMock
        - exact: vi.fn
        - exact: vi.spyOn
        - exact: vi.stubGlobal
        - exact: jest.mock
        - exact: jest.doMock

  - name: integration tests use real dependencies
    rule: integration-test-no-mocks
    scope: repository
    include:
      - integration-tests/**/*.mts
    options:
      forbiddenModules:
        - msw
        - nock
        - sinon

  - name: test email fixtures use voucha test domain
    rule: test-email-domain-policy
    scope: repository
    include:
      - '**/*.test.*'
      - '**/*.spec.*'
      - '**/__tests__/**'
      - '**/__snapshots__/**'
      - '**/fixtures/**'
      - backend/test-helpers/**
      - backend/scripts/seeds/playwright-test-data/**
      - web/test-helpers/**
      - test-helpers/**
      - integration-tests/**
      - playwright/**
    options:
      bannedDomains:
        - example.com
      allowedEmailPatterns:
        - '(?i)^tests(?:\+[a-z0-9._%${}-]+|%2b[a-z0-9._%${}-]+)(?:@|%40)voucha\.ai$'
      replacement: tests+<hash>@voucha.ai
      extensions:
        - .cjs
        - .css
        - .csv
        - .cts
        - .html
        - .js
        - .json
        - .jsonc
        - .md
        - .mjs
        - .mts
        - .sql
        - .ts
        - .tsx
        - .txt
        - .xml
        - .yml
        - .yaml

