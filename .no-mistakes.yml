  - name: Vitest tests do not run live no-mistakes analysis
    rule: forbidden-calls
    scope: repository
    options:
      roots:
        - vitest: true
      # This reviewed mock test replaces no-mistakes, so it is not a traversal root.
      excludeRoots:
        - 'static-code-analysis/i18n-extract/route-selector-map.mock.test.mts'
      traversal: transitive
      unknownCalls: ignore
      targets:
        - moduleExport: { module: no-mistakes, export: analyzeProject }
