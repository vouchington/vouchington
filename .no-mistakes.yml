    options:
      maxLines: 180
      maxChars: 3000
      advisoryCharsRemaining: 250

  - name: developer Markdown is reachable from agent instructions
    rule: markdown-reachability
    scope: repository
    include:
      - '**/*.md'
    exclude:
      - '**/AGENTS.md'
      - articles/**
    options:
      rootFilenames: [AGENTS.md]
      indexFilenames: [README.md, SCHEDULED.md]
      maxDepth: 3

  # Each concern entrypoint must load the actual Valkey shutdown owner independently.
  - name: Valkey pubsub loads its shutdown owner
    rule: required-entrypoint-reachability
    scope: repository
    options:
