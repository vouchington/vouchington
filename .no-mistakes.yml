rules:
  - name: Per-item PostgreSQL and Valkey effects
    rule: query-reached-per-item
    scope: repository
    exclude: ['**/*.test.*', '**/*.spec.*', '**/__tests__/**', '**/test-helpers/**']
    options:
      effects: [postgres, valkey]
      allow:
        # Each capped retention page locks, deletes, and checkpoints in one transaction.
        # A per-page PostgreSQL effect is required; the loop is bounded by maxBatches.
        - { file: backend/services/data-retention/cleanup-auth-sessions.mts, callee: 'cleanupPage' }
        - { file: backend/api/mcp-route-rate-limit-helpers.mts, callee: 'checkRouteRateLimit' }
        - {
            file: backend/scripts/backfill-rss-feed-item-source-publications.mts,
            callee: 'backfillRssFeedItemSourcePublications',
          }
        - {
            file: backend/scripts/backfill-rss-feed-item-source-publications.mts,
            callee: 'hasRssFeedItemSourcesMissingPublication',
          }
        # The standalone RSS preflight replays a finite three-feed fixture and keeps each feed's
        # production hard-delete transaction; batching would bypass that owned-row cleanup contract.
        - { file: backend/scripts/check-rss-feed-crawl-tiers.mts, callee: 'hardDeleteRssFeedById' }
        # The standalone contract advances one owned feed through 18 fixed UTC/SLA states and
        # queries after each update to observe the production selector at each exact boundary.
        - { file: backend/scripts/rss-crawl-tier-contract.mts, callee: 'updateRssFeedTiming' }
        - { file: backend/scripts/rss-crawl-tier-contract.mts, callee: 'getRssFeedsToFetch' }
        # The native MV preflight constructs owned assertion fixtures and observes sequential
        # states. The tied-feed count follows the original 0.2% population threshold, while
        # the hashtag fixtures use finite literal case sets; these are not production item loops.
        - {
            file: backend/scripts/native-mv-contracts/crawl-tiers.mts,
            callee: 'setLocalRssFeedOwningTopicVoteScore',
          }
        - {
            file: backend/scripts/native-mv-contracts/hashtag-author-deletion.mts,
            callee: 'createPost',
          }
        - {
            file: backend/scripts/native-mv-contracts/hashtag-author-deletion.mts,
            callee: 'approveTestPost',
          }
        - {
            file: backend/scripts/native-mv-contracts/hashtag-community.mts,
            callee: 'createTestUser',
          }
        - {
            file: backend/scripts/native-mv-contracts/hashtag-community.mts,
            callee: 'createTestPost',
          }
        - {
            file: backend/scripts/native-mv-contracts/hashtag-community.mts,
            callee: 'createTopHashtagPostSourceForTest',
