name: Backend Credentialed Tests

on:
  workflow_call:
    inputs:
      trusted_secret_context:
        description: 'Whether this run may use repository secrets and OIDC roles'
        required: false
        type: boolean
        default: false
    secrets:
      LIGHTPANDA_TOKEN:
        required: false
      OPENAI_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      AWS_TEST_ROLE_ARN:
        required: false
  workflow_dispatch:
    inputs:
      trusted_secret_context:
        description: 'Whether this run may use repository secrets and OIDC roles'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  actions: read

env:
  NODE_ENV: test

jobs:
  backend-credentialed-tests:
    if: ${{ inputs.trusted_secret_context }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: us-west-2
      BEDROCK_AWS_REGION: us-east-1
      REQUIRE_BEDROCK_INTEGRATION: ''
      VITEST_MAX_WORKERS: '3'
      VITEST_DIAGNOSTICS: ${{ vars.VITEST_DIAGNOSTICS == '1' && '1' || '0' }}

    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c max_connections=300 -c log_min_messages=log'
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 1s
          --tmpfs /var/lib/postgresql:rw,size=1g

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/start-valkey
        timeout-minutes: 2
      - uses: ./.github/actions/setup-backend
        id: setup-backend
        timeout-minutes: 6
      - name: Check backend credentialed test credentials
        id: credentials
        timeout-minutes: 1
        env:
          AWS_TEST_ROLE_ARN: ${{ secrets.AWS_TEST_ROLE_ARN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LIGHTPANDA_TOKEN: ${{ secrets.LIGHTPANDA_TOKEN }}
        run: |
          lightpanda_token=${LIGHTPANDA_TOKEN:-}
          if [[ -z "${lightpanda_token//[[:space:]]/}" ]]; then
            echo '::warning::LIGHTPANDA_TOKEN is missing; the selected Lightpanda cloud test will report its credential failure.'
          fi
          if [ -z "${AWS_TEST_ROLE_ARN:-}" ]; then
            echo "::warning::AWS_TEST_ROLE_ARN is not set — AWS and Bedrock tests will not run."
          fi
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::warning::OPENAI_API_KEY is not set — OpenAI tests will not run."
          fi
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::warning::OPENROUTER_API_KEY is not set — OpenRouter tests will not run."
          fi
          if [ -n "${AWS_TEST_ROLE_ARN:-}" ]; then
            echo 'has_aws=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_aws=false' >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.credentials.outputs.has_aws == 'true' }}
        uses: vouchington/vouchington-tooling/.github/actions/setup-aws@0e848b873d1e3302ea54141537b94bc7fbbd05fe # v0.66.0
        timeout-minutes: 2
        with:
          role-arn: ${{ secrets.AWS_TEST_ROLE_ARN }}
          aws-region: us-west-2
          action-timeout-s: 90
      - name: Set service ports
        timeout-minutes: 1
        run: |
          echo "DATABASE_URL=postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
      - working-directory: backend
        id: migrate
        run: node data-stores/psql/migrate.mts
        timeout-minutes: 3
      - name: Run backend credentialed tests
        id: credentialed-tests
        env:
          GIT_COMMIT: ${{ github.sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LIGHTPANDA_TOKEN: ${{ secrets.LIGHTPANDA_TOKEN }}
          CI_PROJECT: backend-credentialed
          VITEST_CI_REPORTERS: run
          VITEST_JUNIT_OUTPUT_FILE: backend-credentialed-test-report.junit.xml
          VITEST_COVERAGE_ENABLED: 'false'
        run: |
          pnpm exec ./ci/with-node-test-options vitest run --bail=3 --project backend-aws --project backend-bedrock --project backend-openai --project backend-openrouter --project backend-lightpanda
        timeout-minutes: 8
      - name: Upload backend credentialed JUnit report
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: backend-credentialed-junit
          path: backend-credentialed-test-report.junit.xml
          retention-days: 1
          if-no-files-found: warn
      - name: Mint Anthropic federation token
        id: anthropic-token
        # Branch runs only: the federation rule matches branch refs (the merge queue and nightly),
        # not pull-request runs, so Anthropic credentialed tests skip on PRs. One exchange per job,
        # never per Vitest worker: GitHub's OIDC token is single-use and the minted token lasts
        # about 10 minutes, longer than the Anthropic test step. It runs after the other providers'
        # tests, whatever their outcome, so a failed exchange cannot hide their results and a
        # failing provider cannot hide this one. It needs the migrated database only because the
        # Anthropic tests do.
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.migrate.outcome == 'success' }}
        timeout-minutes: 1
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          oidc_response=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://api.anthropic.com")
          oidc_token=$(jq -er .value <<<"$oidc_response")
          echo "::add-mask::${oidc_token}"
          exchange_body=$(jq -n \
            --arg assertion "$oidc_token" \
            --arg federation_rule_id "$ANTHROPIC_FEDERATION_RULE_ID" \
            --arg organization_id "$ANTHROPIC_ORGANIZATION_ID" \
            --arg service_account_id "$ANTHROPIC_SERVICE_ACCOUNT_ID" \
            --arg workspace_id "$ANTHROPIC_WORKSPACE_ID" \
            '{grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer", $assertion, $federation_rule_id, $organization_id, $service_account_id, $workspace_id}')
          # integrity-check: skip reason=authenticated-token-exchange-not-an-artifact-download
          exchange_response=$(curl -sS --fail-with-body https://api.anthropic.com/v1/oauth/token \
            -H 'content-type: application/json' -d "$exchange_body")
          access_token=$(jq -er .access_token <<<"$exchange_response")
          echo "::add-mask::${access_token}"
          echo "ANTHROPIC_AUTH_TOKEN=${access_token}" >> "$GITHUB_ENV"
      - name: Run Anthropic credentialed tests
        id: anthropic-tests
        # Branch runs only, whenever the federation token was minted, whether or not the other
        # providers' tests passed. The Anthropic tests fail without a credential like every other
        # credentialed test, so pull-request runs never select them.
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.anthropic-token.outcome == 'success' }}
        env:
          GIT_COMMIT: ${{ github.sha }}
          CI_PROJECT: backend-credentialed
          VITEST_CI_REPORTERS: run
          VITEST_JUNIT_OUTPUT_FILE: backend-credentialed-anthropic-test-report.junit.xml
          VITEST_COVERAGE_ENABLED: 'false'
        run: |
          pnpm exec ./ci/with-node-test-options vitest run --bail=3 --project backend-anthropic
        timeout-minutes: 4
      - name: Upload Anthropic credentialed JUnit report
        if: ${{ !cancelled() && steps.anthropic-tests.outcome != 'skipped' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: backend-credentialed-anthropic-junit
          path: backend-credentialed-anthropic-test-report.junit.xml
          retention-days: 1
          if-no-files-found: warn
      - name: Report non-gating smoke check failure
        # These are smoke checks against the live providers; they do not gate the `backend` check.
        # The failed job stays red so a failure remains visible, and so does the Nightly run.
        if: ${{ failure() && (steps.credentials.outcome == 'failure' || steps.credentialed-tests.outcome == 'failure' || steps.anthropic-token.outcome == 'failure' || steps.anthropic-tests.outcome == 'failure') }}
        timeout-minutes: 1
        run: |
          message='Live provider smoke checks failed. They do not gate the backend check: recorded-response fixture tests in the unit suites gate request construction and response handling. See docs/development/tests.md#live-provider-smoke-checks.'
          echo "::warning title=Live provider smoke check failed::${message}"
          {
            echo '### Live provider smoke checks failed'
            echo
            echo "${message}"
          } >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: ./.github/actions/valkey-logs
        timeout-minutes: 1
