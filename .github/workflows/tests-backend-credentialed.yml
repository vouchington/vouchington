name: Backend Credentialed Tests

# Per-PR real-AWS (S3) check. The paid live providers (Bedrock, OpenAI, OpenRouter, Anthropic,
# Lightpanda) run from `tests-backend-live-providers.yml` on dispatch and nightly only.

on:
  workflow_call:
    inputs:
      trusted_secret_context:
        description: 'Whether this run may use repository secrets and OIDC roles'
        required: false
        type: boolean
        default: false
      prepared_database:
        description: 'Use the prepared backend PostgreSQL artifact from the caller'
        required: false
        type: boolean
        default: false
    secrets:
      AWS_TEST_ROLE_ARN:
        required: false
  workflow_dispatch:
    inputs:
      trusted_secret_context:
        description: 'Whether this run may use repository secrets and OIDC roles'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

env:
  NODE_ENV: test

jobs:
  prepare-postgres:
    if: ${{ inputs.trusted_secret_context && !inputs.prepared_database }}
    uses: ./.github/workflows/prepare-postgres.yml
    permissions:
      actions: read
      contents: read

  backend-credentialed-tests:
    if: ${{ !cancelled() && !failure() && inputs.trusted_secret_context }}
    needs: [prepare-postgres]
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: us-west-2
      VITEST_MAX_WORKERS: '3'
      VITEST_DIAGNOSTICS: ${{ vars.VITEST_DIAGNOSTICS == '1' && '1' || '0' }}

    services:
      postgres:
        image: ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c max_connections=300 -c log_min_messages=log'
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 1s
          --tmpfs /var/lib/postgresql:rw,size=1g

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/start-valkey
        timeout-minutes: 2
      - uses: ./.github/actions/setup-backend
        id: setup-backend
        timeout-minutes: 6
      - name: Check backend credentialed test credentials
        id: credentials
        timeout-minutes: 1
        env:
          AWS_TEST_ROLE_ARN: ${{ secrets.AWS_TEST_ROLE_ARN }}
        run: |
          if [ -n "${AWS_TEST_ROLE_ARN:-}" ]; then
            echo 'has_aws=true' >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AWS_TEST_ROLE_ARN is not set — AWS tests will not run."
            echo 'has_aws=false' >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.credentials.outputs.has_aws == 'true' }}
        uses: vouchington/vouchington-tooling/.github/actions/setup-aws@c81f9b19a7fe0fb0f18ca9f6454e83325c6969c2 # v0.78.0
        timeout-minutes: 2
        with:
          role-arn: ${{ secrets.AWS_TEST_ROLE_ARN }}
          aws-region: us-west-2
          action-timeout-s: 90
      - name: Set service ports
        timeout-minutes: 1
        run: |
          echo "DATABASE_URL=postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        timeout-minutes: 2
        with:
          name: backend-postgres-${{ github.run_id }}
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Restore prepared PostgreSQL database
        id: restore-database
        timeout-minutes: 3
        run: |
          docker run --rm --network host -i \
            ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62 \
            pg_restore --dbname="$DATABASE_URL" --exit-on-error --no-owner --no-privileges \
            < "$RUNNER_TEMP/backend-postgres.dump"
      - name: Run backend credentialed tests
        id: credentialed-tests
        env:
          GIT_COMMIT: ${{ github.sha }}
          CI_PROJECT: backend-credentialed
          VITEST_CI_REPORTERS: run
          VITEST_JUNIT_OUTPUT_FILE: backend-credentialed-test-report.junit.xml
          VITEST_COVERAGE_ENABLED: 'false'
        run: |
          pnpm exec ./ci/with-node-test-options vitest run --bail=3 --project backend-aws
        timeout-minutes: 8
      - name: Upload backend credentialed JUnit report
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: backend-credentialed-junit
          path: backend-credentialed-test-report.junit.xml
          retention-days: 1
          if-no-files-found: warn
      - name: Report non-gating smoke check failure
        # A smoke check against real AWS; it does not gate the `backend` check. The failed job stays
        # red so a failure remains visible, and so does the Nightly run.
        if: ${{ failure() && (steps.credentials.outcome == 'failure' || steps.credentialed-tests.outcome == 'failure') }}
        timeout-minutes: 1
        run: |
          message='Real AWS smoke check failed. It does not gate the backend check: recorded-response fixture tests in the unit suites gate request construction and response handling. See docs/development/tests.md#live-provider-smoke-checks.'
          echo "::warning title=Live provider smoke check failed::${message}"
          {
            echo '### Real AWS smoke check failed'
            echo
            echo "${message}"
          } >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: ./.github/actions/valkey-logs
        timeout-minutes: 1
