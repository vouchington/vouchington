name: Backend Credentialed Tests

on:
  workflow_call:
    inputs:
      trusted_secret_context:
        description: 'Whether this run may use repository secrets and OIDC roles'
        required: false
        type: boolean
        default: false
      publish_coverage:
        description: 'Whether to publish LCOV for a same-run PR coverage consumer'
        required: false
        type: boolean
        default: false
      upload_vitest_blob_artifact:
        description: 'Whether to upload Vitest blob artifacts to GitHub as a fallback'
        required: false
        type: boolean
        default: false
      full_suite:
        description: 'Run the complete configured projects instead of selected test files'
        type: boolean
        default: true
      selected_test_files:
        description: 'Space-delimited selected test files when full_suite is false'
        type: string
        default: ''
    secrets:
      OPENAI_API_KEY:
        required: false
      STRIPE_SECRET_KEY:
        required: false
      AWS_TEST_ROLE_ARN:
        required: false
  workflow_dispatch:
    inputs:
      trusted_secret_context:
        description: 'Whether this run may use repository secrets and OIDC roles'
        required: false
        type: boolean
        default: true
      upload_vitest_blob_artifact:
        description: 'Whether to upload Vitest blob artifacts to GitHub as a fallback'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  actions: read

env:
  NODE_ENV: test

jobs:
  backend-credentialed-tests:
    if: ${{ inputs.trusted_secret_context }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: us-west-2
      BEDROCK_AWS_REGION: us-east-1
      REQUIRE_BEDROCK_INTEGRATION: ''

    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c max_connections=300'
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql:rw,size=1g
      valkey:
        image: valkey/valkey-bundle:9.1.0@sha256:16004aceeb7a1246e2d1bb85d353e38120eb440951cb7d0c971b6d63fda5b3d7
        ports:
          - 6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /data:rw,size=64m

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.publish_coverage && 0 || 1 }}
      - uses: ./.github/actions/setup-backend
        id: setup-backend
        timeout-minutes: 6
      - name: Check backend credentialed test credentials
        id: credentials
        timeout-minutes: 1
        env:
          AWS_TEST_ROLE_ARN: ${{ secrets.AWS_TEST_ROLE_ARN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          if [ -z "${AWS_TEST_ROLE_ARN:-}" ]; then
            echo "::warning::AWS_TEST_ROLE_ARN is not set — AWS and Bedrock tests will not run."
          fi
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::warning::OPENAI_API_KEY is not set — OpenAI tests will not run."
          fi
          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "::warning::STRIPE_SECRET_KEY is not set — Stripe tests will not run."
          fi
          if [ -z "${AWS_TEST_ROLE_ARN:-}" ] && [ -z "${OPENAI_API_KEY:-}" ] && [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "::error::None of AWS_TEST_ROLE_ARN, OPENAI_API_KEY, or STRIPE_SECRET_KEY is set. At least one must be configured."
            exit 1
          fi
          if [ -n "${AWS_TEST_ROLE_ARN:-}" ]; then
            echo 'has_aws=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_aws=false' >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.credentials.outputs.has_aws == 'true' }}
        uses: ./.github/actions/setup-aws
        timeout-minutes: 2
        with:
          role-arn: ${{ secrets.AWS_TEST_ROLE_ARN }}
      - uses: ./.github/actions/load-runner-env
        with:
          VITEST_MAX_WORKERS: ${{ vars.VITEST_MAX_WORKERS }}
      - name: Set service ports
        timeout-minutes: 1
        run: |
          echo "DATABASE_URL=postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
          echo "VALKEY_URL=redis://localhost:${{ job.services.valkey.ports['6379'] }}" >> "$GITHUB_ENV"
      - working-directory: backend
        run: node data-stores/psql/migrate.mts
        timeout-minutes: 3
      - name: Run backend credentialed tests
        env:
          GIT_COMMIT: ${{ github.sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          CI_PROJECT: backend-credentialed
          VITEST_CI_REPORTERS: run
          VITEST_JUNIT_OUTPUT_FILE: backend-credentialed-test-report.junit.xml
          VITEST_BLOB_OUTPUT_FILE: .vitest-reports/backend-credentialed.json
          VITEST_SELECTED_FILES: ${{ !inputs.full_suite && inputs.selected_test_files || '' }}
          VITEST_COVERAGE_ENABLED: ${{ inputs.publish_coverage && 'true' || 'false' }}
        run: |
          # VITEST_SELECTED_FILES is newline-delimited (vouchington-tooling/gha-selected-files's
          # encodeSelectedFiles). A quoted read loop plus a quoted array expansion
          # preserve paths containing spaces or shell glob metacharacters, replacing the
          # previous unquoted $VITEST_SELECTED_FILES word-splitting/glob-expansion. A
          # blank-line guard (mirroring decodeSelectedFiles's blank filter) is required:
          # `<<<` always appends a trailing newline, so an empty VITEST_SELECTED_FILES
          # (the full-suite case) still yields one empty-string read, which must not
          # become a stray positional arg. This avoids `mapfile` (bash 4.0+) since
          # self-hosted runner shells are not guaranteed to be bash 4+.
          FILES=()
          while IFS= read -r file; do
            if [ -n "$file" ]; then FILES+=("$file"); fi
          done <<< "$VITEST_SELECTED_FILES"
          pnpm exec ./ci/with-node-test-options vitest run --bail=3 --project backend-aws --project backend-bedrock --project backend-openai --project backend-stripe "${FILES[@]}"
        timeout-minutes: 8
      - name: Preserve full backend-credentialed LCOV for Codecov
        if: ${{ !cancelled() && inputs.publish_coverage }}
        shell: bash
        run: |
          if [ -f coverage/lcov.info ]; then
            mkdir -p coverage-full
            cp coverage/lcov.info coverage-full/lcov.info
          fi
      - name: Stamp backend-credentialed coverage provenance
        id: coverage-stamp-1
        timeout-minutes: 1
        if: ${{ !cancelled() && inputs.publish_coverage }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node ci/coverage-manifest.mts patch "backend-credentialed" "$(node -p "JSON.parse(require('node:fs').readFileSync('node_modules/vitest/package.json','utf8')).version")"
      - name: Upload backend-credentialed vitest blob to GitHub (fallback)
        id: vitest-blob-fallback-1
        if: ${{ !cancelled() && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-blob
        with:
          suite: backend-credentialed
      - name: Upload backend-credentialed vitest blob to GitHub (fallback attempt 2)
        id: vitest-blob-fallback-1-retry
        if: ${{ !cancelled() && inputs.upload_vitest_blob_artifact && steps.vitest-blob-fallback-1.outcome == 'failure' }}
        timeout-minutes: 3
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-blob
        with:
          suite: backend-credentialed
          name-suffix: -retry
      - name: Require a persisted backend-credentialed vitest blob
        id: vitest-blob-outcome-1
        if: ${{ !cancelled() && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        env:
          FAMILY: vitest-blob
          SUITE: backend-credentialed
          FIRST_OUTCOME: ${{ steps.vitest-blob-fallback-1.outcome }}
          RETRY_OUTCOME: ${{ steps.vitest-blob-fallback-1-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - name: Persist backend-credentialed Vitest report attempt (attempt 1)
        id: vitest-report-attempt-1
        if: ${{ always() && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-report-attempt
        with:
          suite: backend-credentialed
      - name: Persist backend-credentialed Vitest report attempt (attempt 2)
        id: vitest-report-attempt-1-retry
        if: ${{ always() && inputs.upload_vitest_blob_artifact && steps.vitest-report-attempt-1.outcome == 'failure' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-report-attempt
        with:
          suite: backend-credentialed
          name-suffix: -retry
      - name: Assert backend-credentialed Vitest report attempt persisted
        id: vitest-report-attempt-1-outcome
        if: ${{ !cancelled() && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        env:
          FAMILY: vitest-report-attempt
          SUITE: backend-credentialed
          FIRST_OUTCOME: ${{ steps.vitest-report-attempt-1.outcome }}
          RETRY_OUTCOME: ${{ steps.vitest-report-attempt-1-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - name: Upload backend-credentialed coverage pair to GitHub (fallback attempt 1)
        id: coverage-fallback-1-1
        if: ${{ !cancelled() && inputs.publish_coverage && steps.coverage-stamp-1.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-coverage-pair
        with:
          suite: backend-credentialed
      - name: Upload backend-credentialed coverage pair to GitHub (fallback attempt 2)
        id: coverage-fallback-2-1
        if: ${{ !cancelled() && inputs.publish_coverage && steps.coverage-stamp-1.outcome == 'success' && steps.coverage-fallback-1-1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-coverage-pair
        with:
          suite: backend-credentialed
          name-suffix: -retry
      - name: Require a persisted backend-credentialed coverage pair
        id: coverage-outcome-1
        if: ${{ !cancelled() && inputs.publish_coverage && steps.coverage-stamp-1.outcome == 'success' }}
        timeout-minutes: 1
        env:
          FAMILY: coverage-pair
          SUITE: backend-credentialed
          FIRST_OUTCOME: ${{ steps.coverage-fallback-1-1.outcome }}
          RETRY_OUTCOME: ${{ steps.coverage-fallback-2-1.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - name: Upload full backend-credentialed LCOV to GitHub (informational)
        if: ${{ !cancelled() && inputs.publish_coverage && steps.coverage-stamp-1.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-full-lcov
        with:
          suite: backend-credentialed
