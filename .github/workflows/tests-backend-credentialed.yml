name: Backend Credentialed Tests

on:
  workflow_call:
    inputs:
      trusted_secret_context:
        description: 'Whether this run may use repository secrets and OIDC roles'
        required: false
        type: boolean
        default: false
      publish_coverage:
        description: 'Whether to collect coverage and publish the full LCOV for the area coverage gate and Codecov'
        required: false
        type: boolean
        default: false
    secrets:
      OPENAI_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      STRIPE_SECRET_KEY:
        required: false
      AWS_TEST_ROLE_ARN:
        required: false
  workflow_dispatch:
    inputs:
      trusted_secret_context:
        description: 'Whether this run may use repository secrets and OIDC roles'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  actions: read

env:
  NODE_ENV: test

jobs:
  backend-credentialed-tests:
    if: ${{ inputs.trusted_secret_context }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: us-west-2
      BEDROCK_AWS_REGION: us-east-1
      REQUIRE_BEDROCK_INTEGRATION: ''
      VITEST_MAX_WORKERS: '3'

    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c max_connections=300 -c log_min_messages=log'
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 1s
          --tmpfs /var/lib/postgresql:rw,size=1g
      valkey:
        image: valkey/valkey-bundle:9.1.0@sha256:16004aceeb7a1246e2d1bb85d353e38120eb440951cb7d0c971b6d63fda5b3d7
        ports:
          - 6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 1s
          --tmpfs /data:rw,size=64m

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-backend
        id: setup-backend
        timeout-minutes: 6
      - name: Check backend credentialed test credentials
        id: credentials
        timeout-minutes: 1
        env:
          AWS_TEST_ROLE_ARN: ${{ secrets.AWS_TEST_ROLE_ARN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          if [ -z "${AWS_TEST_ROLE_ARN:-}" ]; then
            echo "::warning::AWS_TEST_ROLE_ARN is not set — AWS and Bedrock tests will not run."
          fi
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::warning::OPENAI_API_KEY is not set — OpenAI tests will not run."
          fi
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::warning::OPENROUTER_API_KEY is not set — OpenRouter tests will not run."
          fi
          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "::warning::STRIPE_SECRET_KEY is not set — Stripe tests will not run."
          fi
          if [ -z "${AWS_TEST_ROLE_ARN:-}" ] && [ -z "${OPENAI_API_KEY:-}" ] && [ -z "${OPENROUTER_API_KEY:-}" ] && [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "::error::No credentialed backend test secret is set. At least one must be configured."
            exit 1
          fi
          if [ -n "${AWS_TEST_ROLE_ARN:-}" ]; then
            echo 'has_aws=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_aws=false' >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.credentials.outputs.has_aws == 'true' }}
        uses: ./.github/actions/setup-aws
        timeout-minutes: 2
        with:
          role-arn: ${{ secrets.AWS_TEST_ROLE_ARN }}
      - name: Mint Anthropic federation token
        # Branch runs only: the federation rule matches branch refs (the merge queue and nightly),
        # not pull-request runs, so Anthropic credentialed tests skip on PRs. One exchange per job,
        # never per Vitest worker: GitHub's OIDC token is single-use and the minted token lasts
        # about 10 minutes, longer than the credentialed test step.
        if: ${{ github.event_name != 'pull_request' }}
        timeout-minutes: 1
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          oidc_response=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://api.anthropic.com")
          oidc_token=$(jq -er .value <<<"$oidc_response")
          echo "::add-mask::${oidc_token}"
          exchange_body=$(jq -n \
            --arg assertion "$oidc_token" \
            --arg federation_rule_id "$ANTHROPIC_FEDERATION_RULE_ID" \
            --arg organization_id "$ANTHROPIC_ORGANIZATION_ID" \
            --arg service_account_id "$ANTHROPIC_SERVICE_ACCOUNT_ID" \
            --arg workspace_id "$ANTHROPIC_WORKSPACE_ID" \
            '{grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer", $assertion, $federation_rule_id, $organization_id, $service_account_id, $workspace_id}')
          # integrity-check: skip reason=authenticated-token-exchange-not-an-artifact-download
          exchange_response=$(curl -sS --fail-with-body https://api.anthropic.com/v1/oauth/token \
            -H 'content-type: application/json' -d "$exchange_body")
          access_token=$(jq -er .access_token <<<"$exchange_response")
          echo "::add-mask::${access_token}"
          echo "ANTHROPIC_AUTH_TOKEN=${access_token}" >> "$GITHUB_ENV"
      - name: Set service ports
        timeout-minutes: 1
        run: |
          echo "DATABASE_URL=postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
          echo "VALKEY_URL=redis://localhost:${{ job.services.valkey.ports['6379'] }}" >> "$GITHUB_ENV"
      - working-directory: backend
        run: node data-stores/psql/migrate.mts
        timeout-minutes: 3
      - name: Run backend credentialed tests
        env:
          GIT_COMMIT: ${{ github.sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          CI_PROJECT: backend-credentialed
          VITEST_CI_REPORTERS: run
          VITEST_JUNIT_OUTPUT_FILE: backend-credentialed-test-report.junit.xml
          VITEST_COVERAGE_ENABLED: ${{ inputs.publish_coverage && 'true' || 'false' }}
        run: |
          pnpm exec ./ci/with-node-test-options vitest run --bail=3 --project backend-aws --project backend-bedrock --project backend-openai --project backend-openrouter --project backend-stripe
        timeout-minutes: 8
      - name: Run Anthropic credentialed tests
        # Branch runs only, after the federation token step. The Anthropic tests fail without a
        # credential like every other credentialed test, so pull-request runs never select them.
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GIT_COMMIT: ${{ github.sha }}
          CI_PROJECT: backend-credentialed
          VITEST_CI_REPORTERS: run
          VITEST_JUNIT_OUTPUT_FILE: backend-credentialed-anthropic-test-report.junit.xml
          VITEST_COVERAGE_ENABLED: 'false'
        run: |
          pnpm exec ./ci/with-node-test-options vitest run --bail=3 --project backend-anthropic
        timeout-minutes: 4
      - name: Preserve full backend-credentialed LCOV
        if: ${{ !cancelled() && inputs.publish_coverage }}
        shell: bash
        run: |
          if [ -f coverage/lcov.info ]; then
            mkdir -p coverage-full
            cp coverage/lcov.info coverage-full/lcov.info
          fi
      - name: Upload full backend-credentialed LCOV to GitHub (attempt 1)
        id: full-lcov-1
        if: ${{ inputs.publish_coverage }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-full-lcov
        with:
          suite: backend-credentialed
      - name: Upload full backend-credentialed LCOV to GitHub (attempt 2)
        id: full-lcov-1-retry
        if: ${{ inputs.publish_coverage && steps.full-lcov-1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-full-lcov
        with:
          suite: backend-credentialed
          name-suffix: -retry
      - name: Require a persisted full backend-credentialed LCOV
        id: full-lcov-outcome-1
        if: ${{ inputs.publish_coverage }}
        timeout-minutes: 1
        env:
          FAMILY: full-lcov
          SUITE: backend-credentialed
          FIRST_OUTCOME: ${{ steps.full-lcov-1.outcome }}
          RETRY_OUTCOME: ${{ steps.full-lcov-1-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
