name: Storybook

on:
  workflow_call:
    inputs:
      cancel_in_progress:
        description: 'Whether newer Storybook runs should cancel older runs for the same concurrency group'
        required: false
        type: boolean
        default: false
      publish_prefix:
        description: 'Target selector for the published Storybook build'
        required: false
        type: string
        default: main
      checkout_ref:
        description: 'Git ref or SHA to check out before building Storybook'
        required: false
        type: string
        default: ''
      concurrency_key:
        description: >-
          Stable concurrency-group key used when cancel_in_progress is true, independent of
          static publishing; falls back to publish_prefix when unset so a stale run for the same
          caller still cancels.
        required: false
        type: string
        default: ''
      publish_coverage:
        description: 'Whether to publish LCOV for a same-run PR coverage consumer'
        required: false
        type: boolean
        default: false
      upload_vitest_blob_artifact:
        description: 'Whether to upload Vitest blob artifacts to GitHub as a fallback'
        required: false
        type: boolean
        default: false
      selected_test_files:
        description: >-
          Newline-delimited (vouchington-tooling/gha-selected-files) web-storybook-browser story files to
          run instead of the full project; empty runs every story (fail-open default)
        required: false
        type: string
        default: ''
      browser_test_mode:
        description: 'Browser Vitest mode: full, selected, or empty'
        type: string
        default: full
  workflow_dispatch:
    inputs:
      publish_prefix:
        description: 'Target selector for the published Storybook build'
        required: false
        type: string
        default: main
      cancel_in_progress:
        description: 'Whether newer Storybook runs should cancel older runs for the same concurrency group'
        required: false
        type: boolean
        default: false
      checkout_ref:
        description: 'Git ref or SHA to check out before building Storybook'
        required: false
        type: string
        default: ''
      concurrency_key:
        description: >-
          Stable concurrency-group key used when cancel_in_progress is true, independent of
          static publishing; falls back to publish_prefix when unset so a stale run for the same
          caller still cancels.
        required: false
        type: string
        default: ''
      upload_vitest_blob_artifact:
        description: 'Whether to upload Vitest blob artifacts to GitHub as a fallback'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.cancel_in_progress && (inputs.concurrency_key || inputs.publish_prefix) || inputs.checkout_ref || github.sha }}-${{ inputs.cancel_in_progress && 'cancel' || 'queue' }}
  cancel-in-progress: ${{ inputs.cancel_in_progress }}

# This reusable workflow executes PR-controlled code with contents read only and never touches
# the Cloudflare Pages token. Exact same-repository dependency bots may run tests here too. Only
# dispatch-completed-deploy.yml sends successful main-storybook source metadata to private infrastructure,
# in its own job with its own checkout — this workflow never runs that step.
permissions:
  contents: read

jobs:
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 94
    # No write permissions here: this job checks out and runs PR-controlled code.
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: ./.github/actions/load-runner-env
        with:
          VITEST_MAX_WORKERS: ${{ vars.VITEST_MAX_WORKERS }}
      - uses: ./.github/actions/setup-node-pnpm
        timeout-minutes: 5
      - name: Run Storybook snapshots
        env:
          VITEST_CI_REPORTERS: run
          VITEST_JUNIT_OUTPUT_FILE: storybook-test-report.junit.xml
          VITEST_BLOB_OUTPUT_FILE: .vitest-reports/web-storybook.json
          VITEST_COVERAGE_ENABLED: ${{ inputs.publish_coverage && 'true' || 'false' }}
        run: VITEST_COVERAGE_SCOPE=web-storybook pnpm exec ./ci/with-node-test-options vitest run --bail=3 --project web-storybook --project web-storybook-component-coverage
        timeout-minutes: 3
      - name: Preserve full web-storybook LCOV for Codecov
        if: ${{ !cancelled() && inputs.publish_coverage }}
        shell: bash
        run: |
          if [ -f coverage/lcov.info ]; then
            mkdir -p coverage-full
            cp coverage/lcov.info coverage-full/lcov.info
          fi
      - name: Stamp web-storybook coverage provenance
        id: coverage-stamp-1
        timeout-minutes: 1
        if: ${{ !cancelled() && inputs.publish_coverage }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node ci/coverage-manifest.mts patch "web-storybook" "$(node -p "JSON.parse(require('node:fs').readFileSync('node_modules/vitest/package.json','utf8')).version")"
      - name: Upload web-storybook vitest blob to GitHub (fallback)
        id: vitest-blob-fallback-1
        if: ${{ !cancelled() && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-blob
        with:
          suite: web-storybook
      - name: Upload web-storybook vitest blob to GitHub (fallback attempt 2)
        id: vitest-blob-fallback-1-retry
        if: ${{ !cancelled() && inputs.upload_vitest_blob_artifact && steps.vitest-blob-fallback-1.outcome == 'failure' }}
        timeout-minutes: 3
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-blob
        with:
          suite: web-storybook
          name-suffix: -retry
      - name: Require a persisted web-storybook vitest blob
        id: vitest-blob-outcome-1
        if: ${{ !cancelled() && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        env:
          FAMILY: vitest-blob
          SUITE: web-storybook
          FIRST_OUTCOME: ${{ steps.vitest-blob-fallback-1.outcome }}
          RETRY_OUTCOME: ${{ steps.vitest-blob-fallback-1-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - name: Persist web-storybook Vitest report attempt (attempt 1)
        id: vitest-report-attempt-1
        if: ${{ always() && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-report-attempt
        with:
          suite: web-storybook
      - name: Persist web-storybook Vitest report attempt (attempt 2)
        id: vitest-report-attempt-1-retry
        if: ${{ always() && inputs.upload_vitest_blob_artifact && steps.vitest-report-attempt-1.outcome == 'failure' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-report-attempt
        with:
          suite: web-storybook
          name-suffix: -retry
      - name: Assert web-storybook Vitest report attempt persisted
        id: vitest-report-attempt-1-outcome
        if: ${{ !cancelled() && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        env:
          FAMILY: vitest-report-attempt
          SUITE: web-storybook
          FIRST_OUTCOME: ${{ steps.vitest-report-attempt-1.outcome }}
          RETRY_OUTCOME: ${{ steps.vitest-report-attempt-1-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - name: Upload web-storybook coverage pair to GitHub (fallback attempt 1)
        id: coverage-fallback-1-1
        if: ${{ !cancelled() && inputs.publish_coverage && steps.coverage-stamp-1.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-coverage-pair
        with:
          suite: web-storybook
      - name: Upload web-storybook coverage pair to GitHub (fallback attempt 2)
        id: coverage-fallback-2-1
        if: ${{ !cancelled() && inputs.publish_coverage && steps.coverage-stamp-1.outcome == 'success' && steps.coverage-fallback-1-1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-coverage-pair
        with:
          suite: web-storybook
          name-suffix: -retry
      - name: Require a persisted web-storybook coverage pair
        id: coverage-outcome-1
        if: ${{ !cancelled() && inputs.publish_coverage && steps.coverage-stamp-1.outcome == 'success' }}
        timeout-minutes: 1
        env:
          FAMILY: coverage-pair
          SUITE: web-storybook
          FIRST_OUTCOME: ${{ steps.coverage-fallback-1-1.outcome }}
          RETRY_OUTCOME: ${{ steps.coverage-fallback-2-1.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - name: Upload full web-storybook LCOV to GitHub (informational)
        if: ${{ !cancelled() && inputs.publish_coverage && steps.coverage-stamp-1.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-full-lcov
        with:
          suite: web-storybook
      - name: Install Playwright Chromium
        if: ${{ inputs.browser_test_mode != 'empty' }}
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 5
      - name: Clear stale coverage before browser run
        if: ${{ inputs.browser_test_mode != 'empty' }}
        run: rm -f coverage/lcov.info .vitest-reports/*.json
      - name: Run Storybook browser tests
        if: ${{ inputs.browser_test_mode != 'empty' }}
        env:
          VITEST_CI_REPORTERS: run
          VITEST_JUNIT_OUTPUT_FILE: storybook-browser-test-report.junit.xml
          VITEST_BLOB_OUTPUT_FILE: .vitest-reports/web-storybook-browser.json
          VITEST_STORYBOOK_BROWSER: '1'
          VITEST_STORYBOOK_BROWSER_MAX_WORKERS: ${{ vars.VITEST_STORYBOOK_BROWSER_MAX_WORKERS || '1' }}
          STORYBOOK_BROWSER_COVERAGE: ${{ inputs.publish_coverage && '1' || '0' }}
          # load-runner-env (above) already exported VITEST_MAX_WORKERS=4 into the job env for the
          # snapshot step's headless pool. This step's own worker count must win here: without this
          # override, vitest's config resolution unconditionally clobbers the project's
          # parseStorybookBrowserMaxWorkers() value with the stale job-wide 4, running 4 concurrent
          # headless Chromium instances against a runner sized for one.
          VITEST_MAX_WORKERS: ${{ vars.VITEST_STORYBOOK_BROWSER_MAX_WORKERS || '1' }}
          VITEST_SELECTED_FILES: ${{ inputs.selected_test_files }}
        run: pnpm exec ./ci/run-storybook-browser-tests.mts
        # The runner owns one monotonic 300-second session budget across at most three startup
        # attempts. Semantic module progress disables retry and distinguishes active browser work
        # from a pre-test startup failure. Leave one workflow minute for process-group cleanup.
        timeout-minutes: 6
      - name: Upload bounded Storybook browser diagnostics
        if: ${{ failure() && inputs.browser_test_mode != 'empty' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          overwrite: true
          name: browser-debug-log-storybook
          path: storybook-browser-diagnostics.log
          retention-days: 1
          if-no-files-found: ignore
      - name: Preserve full web-storybook-browser LCOV for Codecov
        if: ${{ !cancelled() && inputs.browser_test_mode != 'empty' && inputs.publish_coverage }}
        shell: bash
        run: |
          if [ -f coverage/lcov.info ]; then
            mkdir -p coverage-full
            cp coverage/lcov.info coverage-full/lcov.info
          fi
      - name: Stamp web-storybook-browser coverage provenance
        id: coverage-stamp-2
        timeout-minutes: 1
        if: ${{ !cancelled() && inputs.browser_test_mode != 'empty' && inputs.publish_coverage }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node ci/coverage-manifest.mts patch "web-storybook-browser" "$(node -p "JSON.parse(require('node:fs').readFileSync('node_modules/vitest/package.json','utf8')).version")"
      - name: Upload web-storybook-browser vitest blob to GitHub (fallback)
        id: vitest-blob-fallback-2
        if: ${{ !cancelled() && inputs.browser_test_mode != 'empty' && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-blob
        with:
          suite: web-storybook-browser
      - name: Upload web-storybook-browser vitest blob to GitHub (fallback attempt 2)
        id: vitest-blob-fallback-2-retry
        if: ${{ !cancelled() && inputs.browser_test_mode != 'empty' && inputs.upload_vitest_blob_artifact && steps.vitest-blob-fallback-2.outcome == 'failure' }}
        timeout-minutes: 3
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-blob
        with:
          suite: web-storybook-browser
          name-suffix: -retry
      - name: Require a persisted web-storybook-browser vitest blob
        id: vitest-blob-outcome-2
        if: ${{ !cancelled() && inputs.browser_test_mode != 'empty' && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        env:
          FAMILY: vitest-blob
          SUITE: web-storybook-browser
          FIRST_OUTCOME: ${{ steps.vitest-blob-fallback-2.outcome }}
          RETRY_OUTCOME: ${{ steps.vitest-blob-fallback-2-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - name: Persist web-storybook-browser Vitest report attempt (attempt 1)
        id: vitest-report-attempt-2
        if: ${{ always() && inputs.browser_test_mode != 'empty' && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-report-attempt
        with:
          suite: web-storybook-browser
      - name: Persist web-storybook-browser Vitest report attempt (attempt 2)
        id: vitest-report-attempt-2-retry
        if: ${{ always() && inputs.browser_test_mode != 'empty' && inputs.upload_vitest_blob_artifact && steps.vitest-report-attempt-2.outcome == 'failure' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-report-attempt
        with:
          suite: web-storybook-browser
          name-suffix: -retry
      - name: Assert web-storybook-browser Vitest report attempt persisted
        id: vitest-report-attempt-2-outcome
        if: ${{ !cancelled() && inputs.browser_test_mode != 'empty' && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        env:
          FAMILY: vitest-report-attempt
          SUITE: web-storybook-browser
          FIRST_OUTCOME: ${{ steps.vitest-report-attempt-2.outcome }}
          RETRY_OUTCOME: ${{ steps.vitest-report-attempt-2-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - name: Upload web-storybook-browser coverage pair to GitHub (fallback attempt 1)
        id: coverage-fallback-1-2
        if: ${{ !cancelled() && inputs.browser_test_mode != 'empty' && inputs.publish_coverage && steps.coverage-stamp-2.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-coverage-pair
        with:
          suite: web-storybook-browser
      - name: Upload web-storybook-browser coverage pair to GitHub (fallback attempt 2)
        id: coverage-fallback-2-2
        if: ${{ !cancelled() && inputs.browser_test_mode != 'empty' && inputs.publish_coverage && steps.coverage-stamp-2.outcome == 'success' && steps.coverage-fallback-1-2.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-coverage-pair
        with:
          suite: web-storybook-browser
          name-suffix: -retry
      - name: Require a persisted web-storybook-browser coverage pair
        id: coverage-outcome-2
        if: ${{ !cancelled() && inputs.browser_test_mode != 'empty' && inputs.publish_coverage && steps.coverage-stamp-2.outcome == 'success' }}
        timeout-minutes: 1
        env:
          FAMILY: coverage-pair
          SUITE: web-storybook-browser
          FIRST_OUTCOME: ${{ steps.coverage-fallback-1-2.outcome }}
          RETRY_OUTCOME: ${{ steps.coverage-fallback-2-2.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - name: Upload full web-storybook-browser LCOV to GitHub (informational)
        if: ${{ !cancelled() && inputs.browser_test_mode != 'empty' && inputs.publish_coverage && steps.coverage-stamp-2.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-full-lcov
        with:
          suite: web-storybook-browser
