name: Storybook

on:
  workflow_call:
    inputs:
      cancel_in_progress:
        description: 'Whether newer Storybook runs should cancel older runs for the same concurrency group'
        required: false
        type: boolean
        default: false
      publish_prefix:
        description: 'Target selector for the published Storybook build'
        required: false
        type: string
        default: main
      checkout_ref:
        description: 'Git ref or SHA to check out before building Storybook'
        required: false
        type: string
        default: ''
      concurrency_key:
        description: >-
          Stable concurrency-group key used when cancel_in_progress is true, independent of
          static publishing; falls back to publish_prefix when unset so a stale run for the same
          caller still cancels.
        required: false
        type: string
        default: ''
      publish_coverage:
        description: 'Whether to collect coverage and publish the full LCOV for the area coverage gate and Codecov'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish_prefix:
        description: 'Target selector for the published Storybook build'
        required: false
        type: string
        default: main
      cancel_in_progress:
        description: 'Whether newer Storybook runs should cancel older runs for the same concurrency group'
        required: false
        type: boolean
        default: false
      checkout_ref:
        description: 'Git ref or SHA to check out before building Storybook'
        required: false
        type: string
        default: ''
      concurrency_key:
        description: >-
          Stable concurrency-group key used when cancel_in_progress is true, independent of
          static publishing; falls back to publish_prefix when unset so a stale run for the same
          caller still cancels.
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.cancel_in_progress && (inputs.concurrency_key || inputs.publish_prefix) || inputs.checkout_ref || github.sha }}-${{ inputs.cancel_in_progress && 'cancel' || 'queue' }}
  cancel-in-progress: ${{ inputs.cancel_in_progress }}

# This reusable workflow executes PR-controlled code with contents read only and never touches
# the Cloudflare Pages token. Exact same-repository dependency bots may run tests here too. Only
# dispatch-completed-deploy.yml sends successful main-storybook source metadata to private infrastructure,
# in its own job with its own checkout — this workflow never runs that step.
permissions:
  contents: read

jobs:
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 94
    # No write permissions here: this job checks out and runs PR-controlled code.
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: ./.github/actions/setup-node-pnpm
        timeout-minutes: 5
      - name: Run Storybook snapshots
        env:
          VITEST_CI_REPORTERS: run
          VITEST_JUNIT_OUTPUT_FILE: storybook-test-report.junit.xml
          VITEST_COVERAGE_ENABLED: ${{ inputs.publish_coverage && 'true' || 'false' }}
        run: VITEST_COVERAGE_SCOPE=web-storybook pnpm exec ./ci/with-node-test-options vitest run --bail=3 --project web-storybook --project web-storybook-component-coverage
        timeout-minutes: 3
      - name: Preserve full web-storybook LCOV
        if: ${{ !cancelled() && inputs.publish_coverage }}
        shell: bash
        run: |
          if [ -f coverage/lcov.info ]; then
            mkdir -p coverage-full
            cp coverage/lcov.info coverage-full/lcov.info
          fi
      - name: Upload full web-storybook LCOV to GitHub (attempt 1)
        id: full-lcov-1
        if: ${{ inputs.publish_coverage }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-full-lcov
        with:
          suite: web-storybook
      - name: Upload full web-storybook LCOV to GitHub (attempt 2)
        id: full-lcov-1-retry
        if: ${{ inputs.publish_coverage && steps.full-lcov-1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-full-lcov
        with:
          suite: web-storybook
          name-suffix: -retry
      - name: Require a persisted full web-storybook LCOV
        id: full-lcov-outcome-1
        if: ${{ inputs.publish_coverage }}
        timeout-minutes: 1
        env:
          FAMILY: full-lcov
          SUITE: web-storybook
          FIRST_OUTCOME: ${{ steps.full-lcov-1.outcome }}
          RETRY_OUTCOME: ${{ steps.full-lcov-1-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - name: Install Playwright Chromium
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 5
      - name: Clear stale coverage before browser run
        run: rm -f coverage/lcov.info
      - name: Run Storybook browser tests
        env:
          VITEST_CI_REPORTERS: run
          VITEST_JUNIT_OUTPUT_FILE: storybook-browser-test-report.junit.xml
          VITEST_STORYBOOK_BROWSER: '1'
          VITEST_STORYBOOK_BROWSER_MAX_WORKERS: '1'
          STORYBOOK_BROWSER_COVERAGE: ${{ inputs.publish_coverage && '1' || '0' }}
          # Browser mode remains serial despite the two-worker CI fallback.
          VITEST_MAX_WORKERS: '1'
        run: |
          VITEST_STORYBOOK_BROWSER_API_PORT=$(python3 ci/allocate-browser-safe-ports.py 1)
          export VITEST_STORYBOOK_BROWSER_API_PORT
          pnpm exec ./ci/run-storybook-browser-tests.mts
        # The runner owns one monotonic 300-second session budget across at most three startup
        # attempts. Semantic module progress disables retry and distinguishes active browser work
        # from a pre-test startup failure. Leave one workflow minute for process-group cleanup.
        timeout-minutes: 6
      - name: Upload bounded Storybook browser diagnostics
        if: ${{ failure() }}
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          overwrite: true
          name: browser-debug-log-storybook
          path: storybook-browser-diagnostics.log
          retention-days: 1
          if-no-files-found: ignore
      - name: Preserve full web-storybook-browser LCOV
        if: ${{ !cancelled() && inputs.publish_coverage }}
        shell: bash
        run: |
          if [ -f coverage/lcov.info ]; then
            mkdir -p coverage-full
            cp coverage/lcov.info coverage-full/lcov.info
          fi
      - name: Upload full web-storybook-browser LCOV to GitHub (attempt 1)
        id: full-lcov-2
        if: ${{ inputs.publish_coverage }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-full-lcov
        with:
          suite: web-storybook-browser
      - name: Upload full web-storybook-browser LCOV to GitHub (attempt 2)
        id: full-lcov-2-retry
        if: ${{ inputs.publish_coverage && steps.full-lcov-2.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-full-lcov
        with:
          suite: web-storybook-browser
          name-suffix: -retry
      - name: Require a persisted full web-storybook-browser LCOV
        id: full-lcov-outcome-2
        if: ${{ inputs.publish_coverage }}
        timeout-minutes: 1
        env:
          FAMILY: full-lcov
          SUITE: web-storybook-browser
          FIRST_OUTCOME: ${{ steps.full-lcov-2.outcome }}
          RETRY_OUTCOME: ${{ steps.full-lcov-2-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
