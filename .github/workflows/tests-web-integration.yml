name: Web Integration Tests

on:
  workflow_call:
    outputs:
      shard-total:
        value: ${{ jobs.prep.outputs.shard-total }}
    inputs:
      publish_coverage:
        description: 'Whether to publish LCOV for a same-run PR coverage consumer'
        required: false
        type: boolean
        default: false
      upload_vitest_blob_artifact:
        description: 'Whether to upload Vitest blob artifacts to GitHub as a fallback'
        required: false
        type: boolean
        default: false
      full_suite:
        description: 'Run every shard with no test-file narrowing (default for main and workflow_dispatch)'
        type: boolean
        default: true
      run_tests:
        description: 'Run Vitest in the web-integration shard runner'
        type: boolean
        default: true
      shared_build_available:
        description: 'A preceding job in this run produced the shared web build'
        type: boolean
        default: false
      shard_total_override:
        description: 'Explicit shard count for a selected run'
        required: false
        type: string
        default: ''
      selected_test_files:
        description: 'Newline-delimited selected test files (vouchington-tooling/gha-selected-files) to run instead of the full project when full_suite is false'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run Vitest in the web-integration shard runner'
        type: boolean
        default: true
      upload_vitest_blob_artifact:
        description: 'Whether to upload Vitest blob artifacts to GitHub as a fallback'
        required: false
        type: boolean
        default: false
      shard_total_override:
        description: 'Explicit shard count for a selected run'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

env:
  NODE_ENV: test

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      shard-matrix: ${{ steps.shards.outputs.matrix }}
      shard-total: ${{ steps.shards.outputs.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Resolve web-integration shard total
        id: shard-total
        env:
          SHARD_TOTAL_OVERRIDE: ${{ inputs.shard_total_override }}
        run: node ci/vitest/shard-total.mts test-web-integration
      - uses: ./.github/actions/make-shard-matrix
        id: shards
        with:
          total: ${{ steps.shard-total.outputs.shard-total }}
      - uses: ./.github/actions/setup-node-pnpm
        if: ${{ !inputs.shared_build_available && steps.shards.outputs.total != '1' }}
        timeout-minutes: 5
      - uses: ./.github/actions/build-web-targets
        if: ${{ !inputs.shared_build_available && steps.shards.outputs.total != '1' }}
        timeout-minutes: 13
        with:
          artifact-suffix: web-integration-producer
          shared-build-cache-mode: producer
          web-build-fs-cache-enabled: ${{ vars.WEB_BUILD_FS_CACHE_ENABLED }}

  web-integration-tests:
    needs: [prep]
    runs-on: ubuntu-latest
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prep.outputs.shard-matrix) }}

    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c max_connections=300 -c log_min_messages=log'
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql:rw,size=1g
      valkey:
        image: valkey/valkey-bundle:9.1.0@sha256:16004aceeb7a1246e2d1bb85d353e38120eb440951cb7d0c971b6d63fda5b3d7
        ports:
          - 6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /data:rw,size=64m

    steps:
      - name: Set service ports
        run: |
          echo "DATABASE_URL=postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
          echo "VALKEY_URL=redis://localhost:${{ job.services.valkey.ports['6379'] }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/fetch-base-ref
        if: ${{ inputs.publish_coverage }}

      - uses: ./.github/actions/setup-backend
        id: setup-backend
        timeout-minutes: 12

      - working-directory: backend
        run: node data-stores/psql/migrate.mts
        timeout-minutes: 3

      - uses: ./.github/actions/build-web-targets
        timeout-minutes: 13
        with:
          artifact-suffix: web-integration-${{ matrix.shard }}
          shared-build-cache-mode: consumer
          web-build-fs-cache-enabled: ${{ vars.WEB_BUILD_FS_CACHE_ENABLED }}

      - name: Run web integration tests
        if: ${{ inputs.run_tests }}
        env:
          IMAGE_ORIGIN: http://127.0.0.1:3100
          CI_PROJECT: web-integration
          CI_SHARD: ${{ matrix.shard }}/${{ needs.prep.outputs.shard-total }}
          VITEST_CI_REPORTERS: run
          VITEST_COVERAGE_ENABLED: ${{ inputs.publish_coverage && 'true' || 'false' }}
          VITEST_JUNIT_OUTPUT_FILE: web-integration-shard-${{ matrix.shard }}.junit.xml
          VITEST_BLOB_OUTPUT_FILE: .vitest-reports/web-integration-shard-${{ matrix.shard }}.json
          FULL_SUITE: ${{ inputs.full_suite }}
          SELECTED_TEST_FILES: ${{ inputs.selected_test_files }}
        run: |
          # SELECTED_TEST_FILES is newline-delimited (vouchington-tooling/gha-selected-files's
          # encodeSelectedFiles). A quoted read loop plus a quoted array expansion below
          # preserve paths containing spaces or shell glob metacharacters. This avoids
          # `mapfile` (bash 4.0+) to stay portable to macOS `/bin/bash` 3.2.
          FILES=()
          if [ "${FULL_SUITE:-true}" != "true" ]; then
            if [ -z "$SELECTED_TEST_FILES" ]; then
              FILES=("NO_TESTS_MATCHING_SELECTION")
            else
              while IFS= read -r file; do
                if [ -n "$file" ]; then FILES+=("$file"); fi
              done <<< "$SELECTED_TEST_FILES"
            fi
          fi
          pnpm exec ./ci/with-node-test-options vitest run --bail=3 --project web-integration --shard ${{ matrix.shard }}/${{ needs.prep.outputs.shard-total }} --passWithNoTests "${FILES[@]}"
        # Fewer, longer-running shards (see ci/vitest/project-ownership.mts) push real per-shard
        # test-execution time higher than the old <5m-per-shard target tolerated; this watchdog
        # now matches the repo's 10-minute-hard-ceiling CI runtime target instead of the stale 5m.
        timeout-minutes: 10

      - name: Preserve full web-integration-shard-${{ matrix.shard }} LCOV for Codecov
        if: ${{ !cancelled() && inputs.run_tests && inputs.publish_coverage }}
        shell: bash
        run: |
          if [ -f coverage/lcov.info ]; then
            mkdir -p coverage-full
            cp coverage/lcov.info coverage-full/lcov.info
          fi
      - name: Stamp web-integration-shard-${{ matrix.shard }} coverage provenance
        id: coverage-stamp-1
        timeout-minutes: 1
        if: ${{ !cancelled() && inputs.run_tests && inputs.publish_coverage }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_SHARD: ${{ matrix.shard }}/${{ needs.prep.outputs.shard-total }}
        run: node ci/coverage-manifest.mts patch "web-integration-shard-${{ matrix.shard }}" "$(node -p "JSON.parse(require('node:fs').readFileSync('node_modules/vitest/package.json','utf8')).version")"
      - name: Upload web-integration-shard-${{ matrix.shard }} vitest blob to GitHub (fallback)
        id: vitest-blob-fallback-1
        if: ${{ !cancelled() && inputs.run_tests && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-blob
        with:
          suite: web-integration-shard-${{ matrix.shard }}
      - name: Upload web-integration-shard-${{ matrix.shard }} vitest blob to GitHub (fallback attempt 2)
        id: vitest-blob-fallback-1-retry
        if: ${{ !cancelled() && inputs.run_tests && inputs.upload_vitest_blob_artifact && steps.vitest-blob-fallback-1.outcome == 'failure' }}
        timeout-minutes: 3
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-blob
        with:
          suite: web-integration-shard-${{ matrix.shard }}
          name-suffix: -retry
      - name: Require a persisted web-integration-shard-${{ matrix.shard }} vitest blob
        id: vitest-blob-outcome-1
        if: ${{ !cancelled() && inputs.run_tests && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        env:
          FAMILY: vitest-blob
          SUITE: web-integration-shard-${{ matrix.shard }}
          FIRST_OUTCOME: ${{ steps.vitest-blob-fallback-1.outcome }}
          RETRY_OUTCOME: ${{ steps.vitest-blob-fallback-1-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - name: Persist web-integration-shard-${{ matrix.shard }} Vitest report attempt (attempt 1)
        id: vitest-report-attempt-1
        if: ${{ always() && inputs.run_tests && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-report-attempt
        with:
          suite: web-integration-shard-${{ matrix.shard }}
      - name: Persist web-integration-shard-${{ matrix.shard }} Vitest report attempt (attempt 2)
        id: vitest-report-attempt-1-retry
        if: ${{ always() && inputs.run_tests && inputs.upload_vitest_blob_artifact && steps.vitest-report-attempt-1.outcome == 'failure' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-report-attempt
        with:
          suite: web-integration-shard-${{ matrix.shard }}
          name-suffix: -retry
      - name: Assert web-integration-shard-${{ matrix.shard }} Vitest report attempt persisted
        id: vitest-report-attempt-1-outcome
        if: ${{ !cancelled() && inputs.run_tests && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        env:
          FAMILY: vitest-report-attempt
          SUITE: web-integration-shard-${{ matrix.shard }}
          FIRST_OUTCOME: ${{ steps.vitest-report-attempt-1.outcome }}
          RETRY_OUTCOME: ${{ steps.vitest-report-attempt-1-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - name: Upload web-integration-shard-${{ matrix.shard }} coverage pair to GitHub (fallback attempt 1)
        id: coverage-fallback-1-1
        if: ${{ !cancelled() && inputs.run_tests && inputs.publish_coverage && steps.coverage-stamp-1.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-coverage-pair
        with:
          suite: web-integration-shard-${{ matrix.shard }}
      - name: Upload web-integration-shard-${{ matrix.shard }} coverage pair to GitHub (fallback attempt 2)
        id: coverage-fallback-2-1
        if: ${{ !cancelled() && inputs.run_tests && inputs.publish_coverage && steps.coverage-stamp-1.outcome == 'success' && steps.coverage-fallback-1-1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-coverage-pair
        with:
          suite: web-integration-shard-${{ matrix.shard }}
          name-suffix: -retry
      - name: Require a persisted web-integration-shard-${{ matrix.shard }} coverage pair
        id: coverage-outcome-1
        if: ${{ !cancelled() && inputs.run_tests && inputs.publish_coverage && steps.coverage-stamp-1.outcome == 'success' }}
        timeout-minutes: 1
        env:
          FAMILY: coverage-pair
          SUITE: web-integration-shard-${{ matrix.shard }}
          FIRST_OUTCOME: ${{ steps.coverage-fallback-1-1.outcome }}
          RETRY_OUTCOME: ${{ steps.coverage-fallback-2-1.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - name: Upload full web-integration-shard-${{ matrix.shard }} LCOV to GitHub (informational)
        if: ${{ !cancelled() && inputs.run_tests && inputs.publish_coverage && steps.coverage-stamp-1.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-full-lcov
        with:
          suite: web-integration-shard-${{ matrix.shard }}
      - name: Upload web integration artifacts
        if: failure()
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          overwrite: true
          name: web-integration-shard-${{ matrix.shard }}-artifacts
          path: integration-tests/web/artifacts/
          retention-days: 1
