name: EXPLAIN ANALYZE

on:
  workflow_call:
    inputs:
      prepared_database:
        description: 'Use the prepared backend PostgreSQL artifact from the caller'
        required: false
        type: boolean
        default: false
      publish_coverage:
        description: Collect and publish native EXPLAIN and migration LCOV for backend coverage
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare-postgres:
    if: ${{ !inputs.prepared_database }}
    uses: ./.github/workflows/prepare-postgres.yml
    permissions:
      actions: read
      contents: read

  # Seed the shared corpus once and hand every shard a copy of its data directory. Each shard used to
  # reseed the identical corpus itself (136s to 243s per shard on 2026-11-09), so one slow runner
  # could fail any shard and every shard paid for the seed.
  seed-explain:
    needs: [prepare-postgres]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    # Setup, restore, the crawl-tier check, both seeds, the data directory archive and its uploads.
    timeout-minutes: 20
    outputs:
      anchor-date: ${{ steps.anchor.outputs.date }}
    env:
      S3_BUCKET_IMAGES: test-images
      S3_BUCKET_IMAGE_UPLOADS: test-image-uploads
      S3_BUCKET_SITEMAPS: test-sitemaps
      S3_BUCKET_RENDERS: test-renders
      S3_BUCKET_ASSETS: test-assets
      S3_BUCKET_CRAWLS: test-crawls
      S3_BUCKET_USER_EXPORTS: test-user-exports
      S3_BUCKET_QUARANTINE: test-quarantine
      S3_BUCKET_BEDROCK_BATCH: test-bedrock-batch

    services:
      postgres:
        image: ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          # work_mem is intentionally undeclared everywhere else in this repo — Aurora Serverless
          # v2 (production) auto-tunes it from live ACU capacity, so there is no fixed production
          # value to mirror. This gate is the one place that needs a *fixed* value: it asserts a
          # zero-tolerance disk-spill/temp-I/O baseline, and until now it ran against Postgres's
          # stock 4MB default instead of a value this harness chose. Pinning work_mem removes that
          # one undeclared input; it does not claim to control every input that decides
          # spill-vs-no-spill (seed-data volume and planner statistics still vary run to run). 32MB
          # is picked from real evidence, not target-fit to make the gate pass: the actual failing
          # run (workflow run 33651571167) recorded getPostFeedIds:heavy* external-merge disk sorts
          # of 4504-5688kB — 32MB is ~6x that observed worst case, enough margin for seed-data
          # growth, while staying trivially safe against max_connections=300 (work_mem is per
          # sort/hash node, not per connection, and this harness runs scenarios serially through a
          # small pool). Raising work_mem reduces spill pressure for a given plan, but it also feeds
          # the planner's cost model, so it is possible in principle for a higher work_mem to make a
          # different plan cheaper; a new resource-pressure fingerprint after this change would be a
          # real finding to investigate, not assumed impossible.
          #
          # explain-analyze.mts also issues `SET LOCAL work_mem` per capture (EXPLAIN_WORK_MEM),
          # before PREPARE, so planning and execution agree even for a forced generic plan. This
          # server-level default still matters: it covers db:migrate, explain:seed, and any
          # planning outside the capture transaction, which the per-capture SET LOCAL does not
          # reach. Keep the two values equal — see #11081.
          POSTGRES_INITDB_ARGS: '-c max_connections=300 -c log_min_messages=log -c work_mem=32MB'
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 1s

    steps:
      - name: Set service ports
        timeout-minutes: 1
        run: |
          echo "DATABASE_URL=postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
      - name: Pin the EXPLAIN seed anchor day
        id: anchor
        # seed.mts and run.mts are separate node processes, now in separate jobs, that must derive
        # the same seeded ids. Choose the day once and pass it to every shard so a boundary falling
        # between them cannot give them different ids (#2110). The day is the UTC day 960 minutes
        # ago (SEED_ANCHOR_LAG_MS): its noon plus the largest seed offset has passed.
        timeout-minutes: 1
        run: |
          day="$(date -u -d '-960 minutes' +%Y-%m-%d)"
          echo "EXPLAIN_SEED_ANCHOR_DATE=$day" >> "$GITHUB_ENV"
          echo "date=$day" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
      - uses: ./.github/actions/start-valkey
        timeout-minutes: 2
      - uses: ./.github/actions/setup-backend
        id: setup-backend
        timeout-minutes: 5
      - uses: ./.github/actions/download-artifact
        timeout-minutes: 2
        with:
          name: backend-postgres-${{ github.run_id }}
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Restore prepared PostgreSQL database
        timeout-minutes: 3
        run: |
          docker run --rm --network host -i \
            ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62 \
            pg_restore --dbname="$DATABASE_URL" --exit-on-error --no-owner --no-privileges \
            < "$RUNNER_TEMP/backend-postgres.dump"
      - name: Check native RSS crawl tier snapshot and dispatch
        # It needs the unseeded database: its owned feeds must reach the bounded dispatch pages.
        # Its coverage joins the merged native LCOV through the main shard.
        timeout-minutes: 2
        env:
          NODE_DISABLE_COMPILE_CACHE: '1'
          NODE_V8_COVERAGE: ${{ github.workspace }}/backend/scripts/explain-analyze/output/pruning-v8
          VOUCHA_STORED_SECRET_ENCRYPTION_KEYS: fake-explain-analyze-ci-key:raw32:this fake test key is not secret
        run: node backend/scripts/check-rss-feed-crawl-tiers.mts
      - name: Seed development data
        # The copyright seed encrypts its review rows and hashes thread references.
        env:
          VOUCHA_STORED_SECRET_ENCRYPTION_KEYS: fake-explain-analyze-ci-key:raw32:this fake test key is not secret
          VOUCHA_OTP_TOKEN_HASH_SECRET: this is a fake explain-analyze CI OTP HMAC secret
        run: node backend/scripts/seeds/dev-seed.mts
        timeout-minutes: 3
      - name: Seed EXPLAIN data with resource samples
        # Ten seeds on 2026-11-09 (runs 42592728690 to 42597072815) took 136s to 243s, and the
        # slow runners clustered at 233s to 240s. Runs 42595278183 and 42597072815 were killed by
        # the 4 minute limit at 243s after "Seed complete." printed. Six minutes is about 1.5
        # times the slow-runner time. This job seeds once; each shard starts on a copy of its data
        # directory.
        timeout-minutes: 6
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          VOUCHA_STORED_SECRET_ENCRYPTION_KEYS: fake-explain-analyze-ci-key:raw32:this fake test key is not secret
        run: source "$GITHUB_WORKSPACE/.github/workflows/explain-analyze-seed-with-resource-samples.sh"
      - name: Stop and archive seeded PostgreSQL data directory
        # Stops the service container; no later step in this job uses the database.
        timeout-minutes: 4
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          PG_IMAGE: ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        run: .github/workflows/explain-analyze-seeded-data-directory.sh save
      - name: Upload seeded PostgreSQL data directory
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: explain-seeded-postgres-${{ github.run_id }}
          path: ${{ runner.temp }}/explain-seeded/explain-seeded-pgdata.tar.zst
          if-no-files-found: error
          # The archive is already zstd-compressed.
          compression-level: 0
          retention-days: 1
      - name: Upload crawl tier check coverage
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: explain-seed-coverage-${{ github.run_id }}
          path: backend/scripts/explain-analyze/output/pruning-v8/
          if-no-files-found: error
          retention-days: 1
      - name: Upload seed diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: explain-seed-diagnostics
          path: |
            backend/scripts/explain-analyze/output/seed-resources.txt
            backend/scripts/explain-analyze/output/seed-posts.jsonl
          retention-days: 1
      - if: failure()
        uses: ./.github/actions/valkey-logs
        timeout-minutes: 1

  # Every shard starts PostgreSQL on a copy of the seeded data directory, so the shared corpus,
  # its physical layout and its planner statistics are identical.
  # The ordinary scenarios run in one fixed order that explain-shards.mts and
  # run-ordered-scenarios.mts cut into the contiguous segments `main`, `main-2`, `main-3` and
  # `main-4`; `partition` runs only the partitioned comment fixture and `hn-scale` runs only the
  # million-post Hacker News fixture. The segments are sized so every shard stays under the 10 minute
  # performance ceiling, far from the runner timeout that once ejected a group.
  # The `explain-analyze-gates` job merges all shards and enforces the plan gates, so
  # `backend.yml` still needs one result.
  explain-analyze:
    name: explain-analyze (${{ matrix.shard }})
    needs: [seed-explain]
    if: ${{ !cancelled() && needs.seed-explain.result == 'success' }}
    runs-on: ubuntu-latest
    # About 1.5 minutes of setup and data directory transfer plus a step of at most 10 minutes on
    # a slow runner; the partition and hn-scale shards fit the same cap (see their steps).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [main, main-2, main-3, main-4, partition, hn-scale]
    env:
      S3_BUCKET_IMAGES: test-images
      S3_BUCKET_IMAGE_UPLOADS: test-image-uploads
      S3_BUCKET_SITEMAPS: test-sitemaps
      S3_BUCKET_RENDERS: test-renders
      S3_BUCKET_ASSETS: test-assets
      S3_BUCKET_CRAWLS: test-crawls
      S3_BUCKET_USER_EXPORTS: test-user-exports
      S3_BUCKET_QUARANTINE: test-quarantine
      S3_BUCKET_BEDROCK_BATCH: test-bedrock-batch
      EXPLAIN_SEED_ANCHOR_DATE: ${{ needs.seed-explain.outputs.anchor-date }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
      - uses: ./.github/actions/start-valkey
        timeout-minutes: 2
      - uses: ./.github/actions/setup-backend
        id: setup-backend
        timeout-minutes: 5
      - uses: ./.github/actions/download-artifact
        timeout-minutes: 3
        with:
          name: explain-seeded-postgres-${{ github.run_id }}
          path: ${{ runner.temp }}/explain-seeded
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Start PostgreSQL on the seeded data directory
        # A step container, not a service: services start before any step can supply the data.
        timeout-minutes: 4
        env:
          PG_IMAGE: ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        run: .github/workflows/explain-analyze-seeded-data-directory.sh start
      - name: Add crawl tier check coverage
        # The seed job ran the check against the unseeded database; one shard carries its coverage.
        if: ${{ matrix.shard == 'main' }}
        timeout-minutes: 2
        uses: ./.github/actions/download-artifact
        with:
          name: explain-seed-coverage-${{ github.run_id }}
          path: backend/scripts/explain-analyze/output/pruning-v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Run ordinary EXPLAIN scenarios
        if: ${{ startsWith(matrix.shard, 'main') }}
        # Each segment of the ordinary scenarios took 4.7 to 5.4 minutes in the run that measured
        # them (the unsplit step took 19.4 minutes); 10 minutes leaves headroom for a slow runner.
        timeout-minutes: 10
        run: node backend/scripts/explain-analyze/run.mts
        env:
          EXPLAIN_SHARD: ${{ matrix.shard }}
          NODE_DISABLE_COMPILE_CACHE: '1'
          # Both canonical native runners append stock V8 records to the existing native coverage input.
          NODE_V8_COVERAGE: ${{ github.workspace }}/backend/scripts/explain-analyze/output/pruning-v8
          EXPLAIN_PLAN_CACHE_MODE: compare
          VOUCHA_STORED_SECRET_ENCRYPTION_KEYS: fake-explain-analyze-ci-key:raw32:this fake test key is not secret
          # The invite-redeem scenario hashes its fixture invite code.
          VOUCHA_OTP_TOKEN_HASH_SECRET: this is a fake explain-analyze CI OTP HMAC secret
      - name: Run partitioned comment fixture scenarios
        if: ${{ matrix.shard == 'partition' }}
        # Seeding the partitioned fixture and capturing its plans took 5.3 minutes on the slow run
        # 42533590490; 12 minutes covers a runner twice as slow.
        timeout-minutes: 12
        run: node backend/scripts/explain-analyze/run.mts
        env:
          EXPLAIN_SHARD: partition
          NODE_DISABLE_COMPILE_CACHE: '1'
          NODE_V8_COVERAGE: ${{ github.workspace }}/backend/scripts/explain-analyze/output/pruning-v8
          EXPLAIN_PLAN_CACHE_MODE: compare
          VOUCHA_STORED_SECRET_ENCRYPTION_KEYS: fake-explain-analyze-ci-key:raw32:this fake test key is not secret
          VOUCHA_OTP_TOKEN_HASH_SECRET: this is a fake explain-analyze CI OTP HMAC secret
      - name: Run million-post Hacker News scale scenarios
        if: ${{ matrix.shard == 'hn-scale' }}
        # Seeding about a million posts and capturing cold and warm plans took about 6.5 minutes in
        # the run that measured it; 12 minutes covers a runner nearly twice as slow.
        timeout-minutes: 12
        run: node backend/scripts/explain-analyze/run.mts
        env:
          EXPLAIN_SHARD: hn-scale
          NODE_DISABLE_COMPILE_CACHE: '1'
          NODE_V8_COVERAGE: ${{ github.workspace }}/backend/scripts/explain-analyze/output/pruning-v8
          EXPLAIN_PLAN_CACHE_MODE: compare
          VOUCHA_STORED_SECRET_ENCRYPTION_KEYS: fake-explain-analyze-ci-key:raw32:this fake test key is not secret
          VOUCHA_OTP_TOKEN_HASH_SECRET: this is a fake explain-analyze CI OTP HMAC secret
      - name: Prove pruning on migrated explicit partitions
        # The proof builds its own database, so one shard owns it; the lighter shard takes it.
        if: ${{ matrix.shard == 'partition' }}
        timeout-minutes: 3
        env:
          NODE_DISABLE_COMPILE_CACHE: '1'
          NODE_V8_COVERAGE: ${{ github.workspace }}/backend/scripts/explain-analyze/output/pruning-v8
        run: node backend/scripts/explain-analyze/pruning/run.mts
      - name: Upload EXPLAIN ANALYZE results
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: explain-analyze-results-${{ matrix.shard }}
          path: backend/scripts/explain-analyze/output/
          retention-days: 1
      - if: failure()
        uses: ./.github/actions/valkey-logs
        timeout-minutes: 1
      - name: Print PostgreSQL logs
        # A step container prints nothing at teardown, unlike the former service container.
        if: failure()
        continue-on-error: true
        timeout-minutes: 1
        run: docker logs explain-postgres 2>&1 | tail -n 200

  # Plan gates, the seq-scan and resource-pressure baselines, and native coverage need every
  # scenario, so they run once over the merged shard results.
  explain-analyze-gates:
    needs: [explain-analyze]
    # prepare-postgres is skipped when the caller supplies the database, and a skipped ancestor
    # would otherwise skip this job silently while the workflow stays green.
    if: ${{ !cancelled() && needs.explain-analyze.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
      - uses: ./.github/actions/setup-backend
        timeout-minutes: 5
      - uses: ./.github/actions/download-artifact
        # Covers the listing wait below: the artifact listing can lag the shards' uploads (#5673).
        timeout-minutes: 4
        with:
          pattern: explain-analyze-results-*
          # Keep in step with the explain-analyze matrix; explain-analyze-gates.test.mts enforces it.
          expected-names: >-
            explain-analyze-results-main explain-analyze-results-main-2
            explain-analyze-results-main-3 explain-analyze-results-main-4
            explain-analyze-results-partition explain-analyze-results-hn-scale
          wait-timeout-seconds: '150'
          path: ${{ runner.temp }}/explain-shards
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Merge shard results and require every scenario
        timeout-minutes: 2
        run: node backend/scripts/explain-analyze/merge-shard-results.mts "$RUNNER_TEMP/explain-shards"
      - name: Enforce plan gates and write job summary
        timeout-minutes: 2
        run: node backend/scripts/explain-analyze/analyze.mts >> "$GITHUB_STEP_SUMMARY"
      - name: Convert native EXPLAIN and pruning coverage
        timeout-minutes: 2
        run: source "$GITHUB_WORKSPACE/.github/workflows/explain-analyze-convert-native-coverage.sh"
      - name: Preserve full native migration LCOV
        if: ${{ inputs.publish_coverage }}
        timeout-minutes: 1
        run: |
          mkdir -p coverage-full
          cp backend/scripts/explain-analyze/output/retirement-coverage/lcov.info coverage-full/lcov.info
      - name: Upload full native migration LCOV (attempt 1)
        id: full-lcov-1
        if: ${{ inputs.publish_coverage }}
        continue-on-error: true
        timeout-minutes: 3
        uses: vouchington/vouchington-tooling/.github/actions/upload-full-lcov@e4f21b79d1398af8dd76c70f0775ded58f0c4f80 # v2.0.1
        with:
          suite: backend-native-migrations
      - name: Upload full native migration LCOV (attempt 2)
        id: full-lcov-1-retry
        if: ${{ inputs.publish_coverage && steps.full-lcov-1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: vouchington/vouchington-tooling/.github/actions/upload-full-lcov@e4f21b79d1398af8dd76c70f0775ded58f0c4f80 # v2.0.1
        with:
          suite: backend-native-migrations
          name-suffix: -retry
      - name: Require persisted native migration LCOV
        if: ${{ inputs.publish_coverage }}
        timeout-minutes: 1
        env:
          FAMILY: full-lcov
          SUITE: backend-native-migrations
          FIRST_OUTCOME: ${{ steps.full-lcov-1.outcome }}
          RETRY_OUTCOME: ${{ steps.full-lcov-1-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - name: Upload EXPLAIN ANALYZE results
        # The merged run keeps the artifact name that scheduled prompts and tools read.
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: explain-analyze-results
          path: backend/scripts/explain-analyze/output/
          retention-days: 1
