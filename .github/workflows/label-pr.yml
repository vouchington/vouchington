name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@4785f63496e0b00a2518c9129a57920d7450b683 # v1.0.0
    with:
      configuration-path: .github/labeler.yml
