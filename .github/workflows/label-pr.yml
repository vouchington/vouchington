name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@715ee5feea88a3a616d33ce9365987ba58a8849e # v3.5.3
    with:
      configuration-path: .github/labeler.yml
