name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@273d313fc952c000baa7ee36056ca0e403666581 # v3.6.4
    with:
      configuration-path: .github/labeler.yml
