name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@6737be4e624b133e3c514cfc3bd83398f4301c9b # v0.87.0
    with:
      configuration-path: .github/labeler.yml
