name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@6ffe465bf7013a854fe9e64a8184b4c7cd2f3cc0 # v0.54.0
    with:
      configuration-path: .github/labeler.yml
