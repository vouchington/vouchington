name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@4f206c4ea9fc28003c896b1cf1b77ab6f7130242 # v0.55.0
    with:
      configuration-path: .github/labeler.yml
