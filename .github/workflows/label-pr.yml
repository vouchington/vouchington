name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@cf42c05d97191291fd71ffce3c979da4f3ff0145 # v3.0.1
    with:
      configuration-path: .github/labeler.yml
