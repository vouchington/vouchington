name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@342444cffceccb5ea0c1fca9d264be6af79d9fd5 # v0.83.0
    with:
      configuration-path: .github/labeler.yml
