name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@804d6274d71329823f0416182debcdf681f350dd # v0.80.1
    with:
      configuration-path: .github/labeler.yml
