name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@8a48840ca216dfaa119d6cacd2789cb3c0dcdba1 # v2.0.0
    with:
      configuration-path: .github/labeler.yml
