name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@0e848b873d1e3302ea54141537b94bc7fbbd05fe # v0.66.0
    with:
      configuration-path: .github/labeler.yml
