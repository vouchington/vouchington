name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@c81f9b19a7fe0fb0f18ca9f6454e83325c6969c2 # v0.78.0
    with:
      configuration-path: .github/labeler.yml
