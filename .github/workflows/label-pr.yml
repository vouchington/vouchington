name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@587aba5d3c208c86523968bacee37f401a08e7b8 # v3.7.0
    with:
      configuration-path: .github/labeler.yml
