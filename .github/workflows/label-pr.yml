name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@9430c3ba680eb5db4e051ad302e7e9c971ea6953 # v0.87.1
    with:
      configuration-path: .github/labeler.yml
