name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@9296610eabc6d4cdeaea6dd5b318df7abda64acb # v0.72.3
    with:
      configuration-path: .github/labeler.yml
