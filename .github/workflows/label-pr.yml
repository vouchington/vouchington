name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@e4f21b79d1398af8dd76c70f0775ded58f0c4f80 # v2.0.1
    with:
      configuration-path: .github/labeler.yml
