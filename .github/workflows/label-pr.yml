name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@f7169f51576c21f4e640582fec4a70b77a717b78 # v0.80.2
    with:
      configuration-path: .github/labeler.yml
