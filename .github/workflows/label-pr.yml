name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@f0f8a576e3dc51bb38c1bca80d2046c5124637a2 # v0.67.0
    with:
      configuration-path: .github/labeler.yml
