name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@324c8741aa605d4c28897dcfcce17cc8f56ff08a # v3.10.0
    with:
      configuration-path: .github/labeler.yml
