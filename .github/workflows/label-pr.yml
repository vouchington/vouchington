name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@95129ce4ac652ea4adf29635b91e42de2557c502 # v3.6.2
    with:
      configuration-path: .github/labeler.yml
