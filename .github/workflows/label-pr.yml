name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@feaaab5f6bb8e49407264b5cc6720447d6f21d35 # v3.9.0
    with:
      configuration-path: .github/labeler.yml
