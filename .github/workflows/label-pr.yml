name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@90e878e740edd47d19dae5d0dd28866afd719a01 # v0.85.3
    with:
      configuration-path: .github/labeler.yml
