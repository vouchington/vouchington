name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@437ba0ced5a5c1f9380d84a606611abd208f1e7b # v3.5.0
    with:
      configuration-path: .github/labeler.yml
