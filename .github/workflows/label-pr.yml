name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@102b3d948645b8f6ad9fc361d8681bfc55081551 # v0.85.1
    with:
      configuration-path: .github/labeler.yml
