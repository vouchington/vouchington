name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@bd89d56c941ff4aa3b3c09edf1eb597ab93f1718 # v0.85.2
    with:
      configuration-path: .github/labeler.yml
