name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@8cfdeb003ffee9d8e4c20cc6f71e4c00377e3727 # v3.0.0
    with:
      configuration-path: .github/labeler.yml
