name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@f6bc8f897aa97a8d6346dc2a49ab10e21a377c88 # v3.4.0
    with:
      configuration-path: .github/labeler.yml
