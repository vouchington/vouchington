name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: vouchington/vouchington-tooling/.github/workflows/label-pr.yml@abdf0163718e038ab2c9499274dd85b4f65e7b19 # v3.11.0
    with:
      configuration-path: .github/labeler.yml
