name: Cancel Dequeued Merge Group Runs

# When the merge queue removes a pull request without merging it, GitHub never runs checks for that
# entry again, so nothing replaces its merge-group runs and they keep holding hosted runners. This
# workflow cancels the still-active ones across every workflow when the queue reports the removal.
# Cancel Replaced Merge Group Runs covers the other half: entries rebuilt behind a removed one.
# See docs/development/ci/workflows/reference-merge-queue-run-cancellation.md.
#
# `pull_request_target` `dequeued` is the documented removal trigger (Merge Queue Ejection uses it
# too); `merge_group` `destroyed` is not documented for Actions. The job runs from main's workflow
# file and checks out nothing: the pull-request number and reason reach the script only through
# `env:`. It is never a required check, so a failure cannot eject a queue entry.
#
# The reason allowlist is the non-merge values of the webhook's `reason` enum, minus CI_TIMEOUT:
# the ejection triage inspects the failed or timed-out runs, and a timed-out run is still running
# at dequeue time. Cancelling it would replace the evidence with `cancelled`. For the same reason
# a run that already holds a failed job is kept. A merged pull request is never touched.
#
# A run is cancelled only when its branch starts with this pull request's queue prefix and its id
# is lower than this run's. GitHub reuses a queue branch name when a pull request is re-enqueued
# onto the same parent commit, so only run order separates old runs from the fresh entry's runs.

on:
  pull_request_target:
    types: [dequeued]
    branches: [main]

permissions: {}

jobs:
  cancel:
    permissions:
      actions: write
      pull-requests: read
    uses: vouchington/vouchington-tooling/.github/workflows/cancel-dequeued-merge-group-runs.yml@6ffe465bf7013a854fe9e64a8184b4c7cd2f3cc0 # v0.54.0
    with:
      queue-base: main
