name: Static Code Analysis

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      docs_only:
        description: Skip TypeScript, lint, and graph checks on docs-only pull requests.
        type: boolean
        required: false
        default: false
  workflow_dispatch:

concurrency:
  group: static-code-analysis-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static-code-analysis:
    runs-on: [self-hosted]
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - name: Restore workspace cleaner
        shell: bash
        run: |
          rm -rf -- .github/actions/clean-workspace/action.yml ci/curl-to.sh ci/exec-vouchington-gha.sh package.json pnpm-lock.yaml
          git archive --format=tar HEAD -- .github/actions/clean-workspace/action.yml ci/curl-to.sh ci/exec-vouchington-gha.sh package.json pnpm-lock.yaml | tar -x
      - uses: ./.github/actions/clean-workspace
      - uses: ./.github/actions/load-runner-env
      - uses: ./.github/actions/setup-node-pnpm
        timeout-minutes: 5
        with:
          runner-lifecycle: persistent
      - name: Typecheck scripts
        if: ${{ inputs.docs_only != true }}
        shell: bash
        run: pnpm exec tsc --noEmit --project tsconfig.json
        timeout-minutes: 2
      - name: Typecheck ts-shared
        if: ${{ inputs.docs_only != true }}
        shell: bash
        run: pnpm exec tsc --noEmit --project ts-shared/tsconfig.json
        timeout-minutes: 2
      - name: Typecheck playwright
        if: ${{ inputs.docs_only != true }}
        shell: bash
        run: pnpm exec tsc --noEmit --project playwright/tsconfig.json
        timeout-minutes: 2
      - name: Typecheck test-helpers
        if: ${{ inputs.docs_only != true }}
        shell: bash
        run: pnpm exec tsc --noEmit --project test-helpers/tsconfig.json
        timeout-minutes: 2
      - name: Typecheck integration-tests
        if: ${{ inputs.docs_only != true }}
        shell: bash
        run: pnpm exec tsc --noEmit --project integration-tests/tsconfig.json
        timeout-minutes: 3
      - name: Install CI tools via mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        # cache: false — actions/cache hangs on self-hosted runners (see RUNNERS.md);
        # ~/.local/share/mise persists across runs via workspace preservation instead.
        with:
          cache: false
        timeout-minutes: 3
      - run: bash ci/with-heavy-slot.sh pnpm exec oxlint --type-aware --deny-warnings
        if: ${{ inputs.docs_only != true }}
        timeout-minutes: 5
      - name: ast-grep
        if: ${{ inputs.docs_only != true }}
        run: pnpm run ast-grep
        timeout-minutes: 3
      - run: pnpm exec syncpack lint && pnpm exec syncpack format --check
        if: ${{ inputs.docs_only != true }}
        timeout-minutes: 2
      - name: Repo Node static checks
        if: ${{ inputs.docs_only != true }}
        run: node static-code-analysis/run-node-checks.mts --checks config-inventory-policy,repo-file-policy,scc-complexity,targeted-guardrails
        timeout-minutes: 5
      - name: Docs-only repo file policy
        if: ${{ inputs.docs_only == true }}
        run: node static-code-analysis/run-node-checks.mts --checks repo-file-policy,targeted-guardrails,config-inventory-policy
        timeout-minutes: 5
      - name: Check native localization resources
        if: ${{ inputs.docs_only != true }}
        run: node dev/native-localization.mts --validate
        timeout-minutes: 2
      - name: Check localization catalog format
        if: ${{ inputs.docs_only != true }}
        run: pnpm exec vouchington-localization format --check --source localization/catalog
        timeout-minutes: 2
      - name: Check Vitest ownership table
        if: ${{ inputs.docs_only != true }}
        run: node ci/vitest/generate-ownership-table.mts --check
        timeout-minutes: 2
      - name: dependency-cruiser
        if: ${{ inputs.docs_only != true }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node static-code-analysis/run-tooling-dependency-cruiser.mts --cache
          pnpm exec depcruise --config .dependency-cruiser.cjs --output-type err --cache --cache-strategy content --do-not-follow "^(?!playwright/tests/)" playwright/tests
      - name: Build backend email templates
        if: ${{ inputs.docs_only != true }}
        # Required by knip below, which resolves the `@email-templates/core`
        # package export target (`./dist/index.mjs`). The backend
        # `postinstall` script builds this workspace package. Build it
        # explicitly so knip sees the package export target even if a prior
        # install or workspace clean left the generated output absent.
        working-directory: email-templates
        run: pnpm run build
        timeout-minutes: 1
        # No --cache: self-hosted runners persist their working directory across runs
        # (see RUNNERS.md), so a stale node_modules/.cache/knip from a prior commit can
        # report a false "unused file" here. CI skips the cache entirely since an
        # uncached run is well under this step's timeout.
      - run: pnpm exec knip --treat-config-hints-as-errors
        if: ${{ inputs.docs_only != true }}
        timeout-minutes: 5
      - run: pnpm run knip:production-exports
        if: ${{ inputs.docs_only != true }}
        timeout-minutes: 5
      - run: pnpm exec oxfmt --check
        timeout-minutes: 2
      - run: selene --config selene.toml backend/services/jwt-session/scripts
        if: ${{ inputs.docs_only != true }}
        timeout-minutes: 2
      - name: Verify no dependency changes needed
        timeout-minutes: 1
        run: |
          if ! git diff --exit-code; then
            echo "::error::Static analysis produced changes. Run the documented local checks and commit the results."
            git diff --stat
            exit 1
          fi

  no-mistakes-owned:
    needs: [static-code-analysis]
    runs-on: [self-hosted]
    timeout-minutes: 55
    concurrency:
      group: no-mistakes-invocation
      cancel-in-progress: false
      queue: max

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - name: Restore workspace cleaner
        shell: bash
        run: |
          rm -rf -- .github/actions/clean-workspace/action.yml ci/curl-to.sh ci/exec-vouchington-gha.sh package.json pnpm-lock.yaml
          git archive --format=tar HEAD -- .github/actions/clean-workspace/action.yml ci/curl-to.sh ci/exec-vouchington-gha.sh package.json pnpm-lock.yaml | tar -x
      - uses: ./.github/actions/clean-workspace
      - uses: ./.github/actions/load-runner-env
      - uses: ./.github/actions/setup-node-pnpm
        timeout-minutes: 5
        with:
          runner-lifecycle: persistent
      - name: Install CI tools via mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        # cache: false — actions/cache hangs on self-hosted runners (see RUNNERS.md);
        # ~/.local/share/mise persists across runs via workspace preservation instead.
        with:
          cache: false
        timeout-minutes: 3
      - name: Run no-mistakes
        run: pnpm exec no-mistakes --timeout 0 --lock-timeout 0 check --tsconfig tsconfig.json
        timeout-minutes: 10
      - name: Check live workflow topology
        if: ${{ inputs.docs_only != true }}
        run: node ci/check-live-workflow-topology.mts
        timeout-minutes: 5
      - name: Check web route localization selector map
        if: ${{ inputs.docs_only != true }}
        run: node static-code-analysis/i18n-extract/route-selector-map.mts --check
        timeout-minutes: 25
      - name: Verify no dependency changes needed
        timeout-minutes: 1
        run: |
          if ! git diff --exit-code; then
            echo "::error::Static analysis produced changes. Run the documented local checks and commit the results."
            git diff --stat
            exit 1
          fi
