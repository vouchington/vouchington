name: Static Code Analysis

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-code-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      contents: read
      issues: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the baseline check diffs a pull request against HEAD^1
        timeout-minutes: 1
      - uses: ./.github/actions/setup-node-pnpm
        timeout-minutes: 5
      - name: Check query-profile baseline issues are open
        # Pull requests and merge groups run it only when the baseline file changes. Scheduled and
        # manual runs always run it, so an issue closed elsewhere is still caught.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node backend/test-helpers/api/request-query-profile-open-issues.mts
        timeout-minutes: 1
      - name: Build backend email templates
        # Backend resolves the @email-templates/core package through its generated dist export.
        working-directory: email-templates
        run: pnpm run build
        timeout-minutes: 1
      - name: Typecheck scripts
        shell: bash
        run: pnpm exec tsc --noEmit --project tsconfig.json
        timeout-minutes: 2
      - name: Typecheck ts-shared
        shell: bash
        run: pnpm exec tsc --noEmit --project ts-shared/tsconfig.json
        timeout-minutes: 2
      - name: Typecheck playwright
        shell: bash
        run: pnpm exec tsc --noEmit --project playwright/tsconfig.json
        timeout-minutes: 2
      - name: Typecheck test-helpers
        shell: bash
        run: pnpm exec tsc --noEmit --project test-helpers/tsconfig.json
        timeout-minutes: 2
      - name: Typecheck integration-tests
        shell: bash
        run: pnpm exec tsc --noEmit --project integration-tests/tsconfig.json
        timeout-minutes: 3
      - name: Typecheck backend and email templates
        shell: bash
        run: pnpm exec tsc --noEmit --incremental --project backend/tsconfig.json && pnpm exec tsc --noEmit --project email-templates/tsconfig.json
        timeout-minutes: 3
      - name: Typecheck web
        working-directory: web
        shell: bash
        run: pnpm exec next typegen && pnpm exec tsc --noEmit --incremental
        timeout-minutes: 3
        env:
          NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'
          ALLOW_TURNSTILE_TEST_KEY: 'true'
      - name: Typecheck lambdas
        shell: bash
        run: pnpm exec tsc --noEmit --project lambdas/tsconfig.json
        timeout-minutes: 3
      - name: Typecheck Cloudflare Worker
        shell: bash
        run: pnpm exec tsc --noEmit --project cloudflare-worker/tsconfig.json
        timeout-minutes: 2
      - name: Install CI tools via mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        # Repository cache policy permits only the pnpm store and Playwright browsers.
        with:
          cache: false
        timeout-minutes: 3
      - run: pnpm exec oxlint --type-aware --deny-warnings
        timeout-minutes: 5
      - name: ast-grep
        run: pnpm run ast-grep
        timeout-minutes: 3
      - name: jscpd clone-size threshold
        run: pnpm exec jscpd .
        timeout-minutes: 3

      - name: jscpd dead-code baseline
        run: pnpm run jscpd:dead-code
        timeout-minutes: 3
      - run: pnpm exec syncpack lint && pnpm exec syncpack format --check
        timeout-minutes: 2
      - name: Repo Node static checks
        run: node static-code-analysis/run-node-checks.mts --checks config-inventory-policy,repo-file-policy,scc-complexity,targeted-guardrails,dependency-license-policy
        timeout-minutes: 5
      - name: Check live repository policies
        run: node ci/check-repository-policy-scans.mts
        timeout-minutes: 2
      - name: Check native localization resources
        run: node ci/check-live-native-resources.mts
        timeout-minutes: 2
      - name: Compile local development localization catalog
        run: node dev/localization/local-catalog.mts
        timeout-minutes: 2
      - name: Check localization catalog format
        run: pnpm exec vouchington-localization format --check --source localization/catalog
        timeout-minutes: 2
      - name: Check effective Vitest timeout admission
        run: node ci/check-effective-vitest-timeouts.mts
        timeout-minutes: 2
      - name: dependency-cruiser
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node static-code-analysis/run-tooling-dependency-cruiser.mts --cache
          pnpm exec depcruise --config .dependency-cruiser.cjs --output-type err --cache --cache-strategy content --do-not-follow "^(?!playwright/tests/)" playwright/tests
      - run: pnpm exec knip --treat-config-hints-as-errors
        timeout-minutes: 5
      - run: pnpm run knip:production-exports
        timeout-minutes: 5
      - run: pnpm exec oxfmt --check
        timeout-minutes: 2
      - run: pnpm run selene
        timeout-minutes: 2
      - name: Verify no dependency changes needed
        timeout-minutes: 1
        run: |
          if ! git diff --exit-code; then
            echo "::error::Static analysis produced changes. Run the documented local checks and commit the results."
            git diff --stat
            exit 1
          fi

  no-mistakes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
      - uses: ./.github/actions/setup-node-pnpm
        timeout-minutes: 5
      - name: Install CI tools via mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        # Repository cache policy permits only the pnpm store and Playwright browsers.
        with:
          cache: false
        timeout-minutes: 3
      - name: Check finite analyzer fixture deadlines
        run: ./ci/run-with-timeout.sh 20 5 node ci/check-analyzer-fixture-budget.mts
        timeout-minutes: 1
      - name: Run no-mistakes
        run: pnpm exec no-mistakes --timeout 0 --lock-timeout 0 check
        timeout-minutes: 6
      - name: Check Storybook component coverage
        run: >-
          pnpm exec vouchington story-coverage
          --root .
          --component-root web/components/
          --story-root web/storybook/
          --alias @/=web/
          --source-extension .tsx
          --source-extension .ts
          --component-extension .tsx
          --marker "['\"]data-pw['\"]|data-pw="
          --story-pattern "[.]stories[.](ts|tsx)$"
          --exclusions web/storybook/__tests__/component-story-exclusions.json
          --exclusions-label web/storybook/__tests__/component-story-exclusions.json
        timeout-minutes: 2
      - name: Check schema generation guard fixtures
        run: node ci/check-schema-generation-guard-fixtures.mts
        timeout-minutes: 2
      - name: Check no-mistakes use in Vitest tests
        run: node ci/check-no-mistakes-test-policy.mts
        timeout-minutes: 1
      - name: Check live workflow topology
        run: node ci/check-live-workflow-topology.mts
        timeout-minutes: 3
      - name: Check web route localization selector map
        run: node static-code-analysis/i18n-extract/route-selector-map.mts --check --diagnostics
        timeout-minutes: 2
      - name: Check live web route localization bounds
        run: node ci/check-live-web-route-localization.mts
        timeout-minutes: 4
      - name: Check Storybook browser optimizeDeps
        run: node ci/check-storybook-browser-optimize-deps.mts
        timeout-minutes: 2
      - name: Check classifier golden set imports
        run: node ci/check-classifier-golden-imports.mts
        timeout-minutes: 2
      - name: Verify no dependency changes needed
        timeout-minutes: 1
        run: |
          if ! git diff --exit-code; then
            echo "::error::Static analysis produced changes. Run the documented local checks and commit the results."
            git diff --stat
            exit 1
          fi
