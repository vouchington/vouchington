name: Automation Fix Issue

# Triggered when an authorized user comments /fix on any issue.
# Dispatches Auto Harness to investigate the issue, implement a fix, and open a PR.
# If the Harness agent finds the fix ambiguous, it posts the options as a comment on the
# source issue and opens a draft PR, then exits — a human reviews before merging.

on:
  issue_comment:
    types: [created]

concurrency:
  group: fix-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Validate /fix trigger
    if: >-
      vars.HARNESS_DISPATCH_ENABLED == 'true' &&
      vars.HARNESS_FIX_ISSUE_ENABLED == 'true' &&
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '/fix')
    runs-on: ubuntu-slim
    timeout-minutes: 4
    permissions:
      contents: read
      issues: write
    outputs:
      accepted: ${{ steps.authorize.outputs.authorized == 'true' && steps.extract-fix.outputs.accepted }}
      fix_request: ${{ steps.extract-fix.outputs.fix_request }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - id: authorize
        timeout-minutes: 1
        uses: vouchington/vouchington-tooling/.github/actions/comment-command-authorize@1d787d0f6ebffa0a81cdc763fad6af7531593cc3 # v0.71.0

      - name: Extract /fix request
        timeout-minutes: 2
        id: extract-fix
        if: steps.authorize.outputs.authorized == 'true'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail

          escape_command() {
            local value="$1"
            value="${value//'%'/'%25'}"
            value="${value//$'\r'/'%0D'}"
            value="${value//$'\n'/'%0A'}"
            printf '%s' "$value"
          }

          COMMENT_BODY_FILE="$(mktemp)"
          REQUEST_FILE="$(mktemp)"
          FOUND_FILE="$(mktemp)"
          printf '%s' "$COMMENT_BODY" > "$COMMENT_BODY_FILE"
          echo "accepted=false" >> "$GITHUB_OUTPUT"

          COMMAND="$(head -n 1 "$COMMENT_BODY_FILE" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [[ "$COMMAND" != "/fix" ]]; then
            echo "Ignoring comment whose first line is not the standalone /fix command."
            exit 0
          fi

          awk -v found_file="$FOUND_FILE" '
            BEGIN { found = 0 }
            {
              if (found) {
                print
                next
              }

              search = $0
              offset = 0
              while ((pos = index(search, "/fix")) > 0) {
                absolute = offset + pos
                before = substr($0, 1, absolute - 1)
                after = substr($0, absolute + length("/fix"))
                if (before ~ /(^|[[:space:]])$/ && after ~ /^($|[[:space:]])/) {
                  sub(/^[[:space:]]+/, "", after)
                  if (after != "") print after
                  found = 1
                  next
                }
                offset += pos + length("/fix") - 1
                search = substr($0, offset + 1)
              }
            }
            END {
              if (found) {
                print "found" > found_file
              }
            }
          ' "$COMMENT_BODY_FILE" > "$REQUEST_FILE"

          if [[ ! -s "$FOUND_FILE" ]]; then
            COMMENT_LENGTH="$(wc -c < "$COMMENT_BODY_FILE" | tr -d '[:space:]')"
            PREVIEW="$(tr '\r\n' '  ' < "$COMMENT_BODY_FILE" | cut -c 1-160)"
            echo "::error::Unable to extract exact /fix command from issue comment. comment_id=$COMMENT_ID comment_length=$COMMENT_LENGTH preview=$(escape_command "$PREVIEW")"
            {
              echo "## /fix extraction failed"
              echo
              echo "- Comment id: $COMMENT_ID"
              echo "- Comment length: $COMMENT_LENGTH"
              echo "- Preview: \`$PREVIEW\`"
              echo
              echo "The comment matched the workflow gate but did not contain an exact \`/fix\` command token."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          "$GITHUB_WORKSPACE/ci/write-github-multiline-output.sh" fix_request < "$REQUEST_FILE"
          echo "accepted=true" >> "$GITHUB_OUTPUT"

      - name: Acknowledge
        timeout-minutes: 2
        if: steps.extract-fix.outputs.accepted == 'true'
        uses: vouchington/vouchington-tooling/.github/actions/comment-command-acknowledge@1d787d0f6ebffa0a81cdc763fad6af7531593cc3 # v0.71.0
        with:
          command: /fix

  render-prompt:
    name: Render automation prompt
    needs: [gate]
    if: needs.gate.outputs.accepted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      prompt: ${{ steps.render.outputs.prompt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1

      - uses: ./.github/actions/setup-node-pnpm
        timeout-minutes: 5

      - name: Capture trusted issue context
        timeout-minutes: 2
        uses: vouchington/vouchington-tooling/.github/actions/issue-comment-context@1d787d0f6ebffa0a81cdc763fad6af7531593cc3 # v0.71.0
        with:
          number: ${{ github.event.issue.number }}

      - name: Prepare prompt variables
        timeout-minutes: 2
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REQUEST_BODY: ${{ needs.gate.outputs.fix_request }}
        run: |
          set -euo pipefail
          printf '%s' "$ISSUE_TITLE" > issue-title.txt
          printf '%s' "$REQUEST_BODY" > request-body.txt

      - name: Render prompt
        timeout-minutes: 2
        id: render
        uses: jonathanong/auto-harness/actions/harness-render-prompt@8325525ec675f738a3969cb92ce20477f38dcf71 # v1.0.2
        with:
          template: docs/prompts/automation/fix-issue.md
          merge-authority-doc: docs/development/merge-authority.md
          vars: |
            ISSUE_NUMBER=${{ github.event.issue.number }}
            ISSUE_URL=${{ github.event.issue.html_url }}
            TRIGGER_COMMENT_ID=${{ github.event.comment.id }}
          var-files: |
            ISSUE_TITLE=issue-title.txt
            REQUEST_BODY=request-body.txt
            ISSUE_CONTEXT=issue-context.json

  dispatch:
    name: Harness dispatch
    needs: [gate, render-prompt]
    if: needs.gate.outputs.accepted == 'true'
    uses: vouchington/vouchington-tooling/.github/workflows/harness-dispatch.yml@f0f8a576e3dc51bb38c1bca80d2046c5124637a2 # v0.67.0
    permissions:
      contents: read
    secrets:
      HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
    with:
      surface-gate: HARNESS_FIX_ISSUE_ENABLED
      agent-ref: ${{ github.sha }}
      expected-head-sha: ${{ github.sha }}
      concurrency-id: vouchington:fix:${{ github.event.issue.number }}
      publish-contract: fix-issue
      publish-base-ref: main
      publish-title-suffix: '(fixes #${{ github.event.issue.number }})'
      publish-duplicate-key: 'fixes #${{ github.event.issue.number }}'
      pr-label: automation:auto-fix
      issue-number: ${{ github.event.issue.number }}
      trigger-comment-id: ${{ github.event.comment.id }}
      slack-source: |
        *Source:* `/fix` on issue #${{ github.event.issue.number }}
        *Issue:* ${{ github.event.issue.html_url }}
        *Issue title:* ${{ github.event.issue.title }}
      prompt: ${{ needs.render-prompt.outputs.prompt }}

  comment-session:
    name: Comment session link
    needs: [gate, dispatch]
    if: >-
      needs.gate.outputs.accepted == 'true' &&
      needs.dispatch.result == 'success' &&
      needs.dispatch.outputs.session-url != ''
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: vouchington/vouchington-tooling/.github/actions/comment-harness-session@f0f8a576e3dc51bb38c1bca80d2046c5124637a2 # v0.67.0
        timeout-minutes: 1
        with:
          target: ${{ github.event.issue.number }}
          session-id: ${{ needs.dispatch.outputs.session-id }}
          session-url: ${{ needs.dispatch.outputs.session-url }}

  escalate:
    name: Comment failure on issue
    needs: [gate, render-prompt, dispatch]
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      needs.gate.outputs.accepted == 'true' &&
      (
        needs.render-prompt.result == 'failure' ||
        needs.render-prompt.result == 'cancelled' ||
        (needs.dispatch.result == 'failure' || needs.dispatch.result == 'cancelled')
      )
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
      SESSION_ID: ${{ needs.dispatch.outputs.session-id }}
    steps:
      - name: Revalidate trigger comment
        timeout-minutes: 1
        uses: vouchington/vouchington-tooling/.github/actions/comment-command-authorize@1d787d0f6ebffa0a81cdc763fad6af7531593cc3 # v0.71.0
        with:
          mode: revalidate
          issue-number: ${{ github.event.issue.number }}

      - name: Comment failure on source issue
        timeout-minutes: 2
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" --jq \
            'select(.state == "open") | .number' | grep -qx "$ISSUE_NUMBER"
          COMMENT_JSON="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$TRIGGER_COMMENT_ID")"
          COMMAND="$(jq -r '.body | split("\n")[0]' <<< "$COMMENT_JSON" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [[ "$COMMAND" != "/fix" ]]; then
            echo "Suppressing failure comment because the triggering /fix command is no longer valid."
            exit 0
          fi

          THIS_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          BODY="/fix run failed — auto-fix could not complete.

          **Auto-fix run:** $THIS_RUN_URL"

          if [[ -n "$SESSION_ID" ]]; then
            BODY="$BODY
          **Harness session:** $SESSION_ID"
          fi

          BODY="$BODY

          Please investigate manually or re-comment \`/fix\` to retry."

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "$BODY"
