    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
        timeout-minutes: 5
      - name: Select Vitest tests
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node ci/vitest/ci-select.mts
      - name: Upload Vitest test plan
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          overwrite: true
          name: vitest-test-plan
          path: |
            vitest-test-plan.json
            vitest-test-plan.md
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload CI topology impact
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          overwrite: true
          name: ci-topology-impact
          path: |
            ci-topology-impact.json
            ci-topology-impact.md
          if-no-files-found: ignore
          retention-days: 1
