name: Main CI (cloudflare-worker)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-cloudflare-worker.yml'
      - '.github/workflows/main-cloudflare-worker/build.sh'
      - '.github/workflows/tests-cloudflare-worker.yml'
      - '.github/workflows/checks-static.yml'
      - '.github/workflows/checks-static-*.sh'
      - '.github/actions/**'
      - 'ci/build-infra/validate-shared-build-cache-mode.sh'
      - 'ci/build-infra/validate-restored-web-targets.sh'
      - 'ci/build-infra/build-web-targets.sh'
      - 'ci/build-infra/start-valkey.sh'
      - 'cloudflare-worker/**'
      - 'backend/config/**'
      - 'ci/cloudflare-worker-staging-*.mts'
      - 'ci/write-private-json.mts'
      - 'ts-shared/**'
      - 'vitest.config.mts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

concurrency:
  group: main-cloudflare-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-cloudflare-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 1
      - uses: vouchington/vouchington-tooling/.github/actions/setup-node-pnpm@e4f21b79d1398af8dd76c70f0775ded58f0c4f80 # v2.0.1
        timeout-minutes: 3
        with:
          deadline-seconds: '150'
      - name: Build and validate the Cloudflare Worker bundle
        timeout-minutes: 5
        run: source .github/workflows/main-cloudflare-worker/build.sh
      - name: Publish the Cloudflare Worker bundle
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cloudflare-worker-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery
          if-no-files-found: error
          retention-days: 1
          overwrite: true
