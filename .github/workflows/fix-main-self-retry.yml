name: Fix Main Self Retry

# Watches Automation Fix Main's own completed runs and reruns known-transient failures once,
# through the same ci/transient-retry/ catalogue Fix Main applies to the workflows it monitors.
# This workflow must never appear in fix-main.yml's on.workflow_run.workflows list (that would be
# an unbounded run chain) and must never gain a push-on-main trigger (which would force it into
# fix-main's own subscription list via the fix-main.dispatch.test.mts regression test). Nothing
# watches this workflow back.

on:
  workflow_run:
    workflows: [Automation Fix Main]
    types: [completed]
    branches: [main]

concurrency:
  group: fix-main-self-retry-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retry:
    name: Retry transient self-failure
    if: >-
      vars.HARNESS_DISPATCH_ENABLED == 'true' &&
      vars.HARNESS_FIX_MAIN_ENABLED == 'true' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      checks: read
      contents: read
    outputs:
      disposition: ${{ steps.disposition.outputs.disposition }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: vouchington/vouchington-tooling/.github/actions/setup-node-pnpm@90e878e740edd47d19dae5d0dd28866afd719a01 # v0.85.3
        timeout-minutes: 5
        with:
          deadline-seconds: '270'
          install-scripts: 'false'
      - name: Revalidate source run
        timeout-minutes: 2
        id: source-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node ci/source-run-state.mts
      - name: Decide transient retry
        timeout-minutes: 2
        id: decide
        if: steps.source-state.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node ci/transient-retry/decide.mts
      - name: Rerun failed jobs on transient match
        timeout-minutes: 2
        id: rerun-failed-jobs
        if: >-
          steps.source-state.outputs.current == 'true' &&
          steps.decide.outputs.decision == 'rerun'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          MATCHED_RULE: ${{ steps.decide.outputs.matched_rule }}
        run: |
          echo "Matched rule: $MATCHED_RULE"
          gh run rerun --repo "$GITHUB_REPOSITORY" --failed "$SOURCE_RUN_ID"
      - name: Check original escalation
        timeout-minutes: 2
        id: escalate-state
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: bash --noprofile --norc -e -o pipefail ci/automation-inline/self-retry-escalation-state.sh
      - name: Set disposition output
        timeout-minutes: 2
        id: disposition
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source-state.outcome }}
          SOURCE_CURRENT: ${{ steps.source-state.outputs.current }}
          DECISION: ${{ steps.decide.outputs.decision }}
          FAILED_JOBS_RERUN_OUTCOME: ${{ steps.rerun-failed-jobs.outcome }}
          ESCALATE_STATE_OUTCOME: ${{ steps.escalate-state.outcome }}
          ESCALATE_CONCLUSION: ${{ steps.escalate-state.outputs.conclusion }}
        run: bash --noprofile --norc -e -o pipefail ci/automation-inline/self-retry-disposition.sh

  escalate-retry-failure:
    name: Escalate unconfirmed self-retry
    needs: [retry]
    if: always() && needs.retry.result != 'skipped' && needs.retry.outputs.disposition != 'handled'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Escalate to human — open or update issue
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          FIX_MAIN_RUN_ID: ${{ github.event.workflow_run.id }}
          FIX_MAIN_RUN_URL: ${{ github.event.workflow_run.html_url }}
          FIX_MAIN_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          gh api --method GET -H 'Accept: application/vnd.github.raw+json' "repos/${GITHUB_REPOSITORY}/contents/ci/automation-inline/self-retry-escalate.sh?ref=${GITHUB_SHA:?Missing trusted workflow SHA}" > "$RUNNER_TEMP/self-retry-escalate.sh"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/self-retry-escalate.sh"
