name: Sync Articles

on:
  push:
    branches:
      - main
    paths:
      - 'articles/**'
      - 'backend/services/articles/**'
      - '.github/workflows/sync-articles.yml'
      - '.github/workflows/sync-articles-package-delivery.sh'

permissions:
  contents: read

concurrency:
  group: sync-articles-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Package and validate article delivery
        timeout-minutes: 2
        run: source "$GITHUB_WORKSPACE/.github/workflows/sync-articles-package-delivery.sh"
      - name: Upload article delivery
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: articles-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          overwrite: true
