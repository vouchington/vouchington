name: Web Tests

on:
  workflow_call:
    outputs:
      shard-total:
        value: ${{ jobs.prep.outputs.shard-total }}
    inputs:
      publish_coverage:
        description: 'Whether to collect coverage and publish the full LCOV for the area coverage gate and Codecov'
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prep:
    # Same ARM64 pool as the shards it gates, so the critical path does not wait in the x64 queue first.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      shard-matrix: ${{ steps.shards.outputs.matrix }}
      shard-total: ${{ steps.shards.outputs.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-node-pnpm
        timeout-minutes: 5
      - name: Resolve web shard total
        id: shard-total
        env:
          FILES_PER_SHARD_OVERRIDE: ${{ vars.TEST_WEB_FILES_PER_SHARD }}
        run: node ci/vitest/shard-total.mts test-web
      - uses: ./.github/actions/make-shard-matrix
        id: shards
        with:
          total: ${{ steps.shard-total.outputs.shard-total }}

  web-tests:
    needs: [prep]
    # Native ARM64 matches the production image architecture and draws from a separate hosted pool.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      # Pure web Vitest shards use all four vCPUs on public GitHub-hosted runners (x64 and ARM64).
      VITEST_MAX_WORKERS: '4'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prep.outputs.shard-matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-node-pnpm
        timeout-minutes: 5
      - name: Run web tests
        env:
          CI_PROJECT: web
          CI_SHARD: ${{ matrix.shard }}/${{ needs.prep.outputs.shard-total }}
          VITEST_CI_REPORTERS: run
          VITEST_COVERAGE_ENABLED: ${{ inputs.publish_coverage && 'true' || 'false' }}
          VITEST_JUNIT_OUTPUT_FILE: web-shard-${{matrix.shard}}.junit.xml
        run: pnpm exec ./ci/with-node-test-options vitest run --bail=3 --project web --shard ${{ matrix.shard }}/${{ needs.prep.outputs.shard-total }}
        # Fewer, longer-running shards (see ci/vitest/project-ownership.mts) need a watchdog
        # distinct from the sub-ten-minute job KPI. This job owns a four-worker candidate on public
        # 4-vCPU runners; retain or retune it only after candidate-run KPI evidence.
        timeout-minutes: 16
      - name: Upload web-shard-${{ matrix.shard }} JUnit report
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          overwrite: true
          name: web-test-report-shard-${{ matrix.shard }}
          path: web-shard-${{matrix.shard}}.junit.xml
          retention-days: 1
          if-no-files-found: warn
      - name: Preserve full web-shard-${{ matrix.shard }} LCOV
        if: ${{ !cancelled() && inputs.publish_coverage }}
        shell: bash
        run: |
          if [ -f coverage/lcov.info ]; then
            mkdir -p coverage-full
            cp coverage/lcov.info coverage-full/lcov.info
          fi
      - name: Upload full web-shard-${{ matrix.shard }} LCOV to GitHub (attempt 1)
        id: full-lcov-1
        if: ${{ inputs.publish_coverage }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-full-lcov
        with:
          suite: web-shard-${{ matrix.shard }}
      - name: Upload full web-shard-${{ matrix.shard }} LCOV to GitHub (attempt 2)
        id: full-lcov-1-retry
        if: ${{ inputs.publish_coverage && steps.full-lcov-1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-full-lcov
        with:
          suite: web-shard-${{ matrix.shard }}
          name-suffix: -retry
      - name: Require a persisted full web-shard-${{ matrix.shard }} LCOV
        id: full-lcov-outcome-1
        if: ${{ inputs.publish_coverage }}
        timeout-minutes: 1
        env:
          FAMILY: full-lcov
          SUITE: web-shard-${{ matrix.shard }}
          FIRST_OUTCOME: ${{ steps.full-lcov-1.outcome }}
          RETRY_OUTCOME: ${{ steps.full-lcov-1-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
