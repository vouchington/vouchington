name: Playwright Credentialed Tests

on:
  workflow_call:
    inputs:
      trusted_secret_context:
        description: 'Whether this run may use repository secrets and OIDC roles'
        required: false
        type: boolean
        default: false
      event-name:
        description: Triggering workflow event name
        type: string
        required: false
        default: ''
    secrets:
      AWS_TEST_ROLE_ARN:
        required: false
      S3_BUCKET_IMAGES:
        required: false
      S3_BUCKET_IMAGE_UPLOADS:
        required: false
  workflow_dispatch:
    inputs:
      trusted_secret_context:
        description: 'Whether this run may use repository secrets and OIDC roles'
        required: false
        type: boolean
        default: true
      event-name:
        description: Triggering workflow event name
        type: string
        required: false
        default: ''

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  # Use a unique prefix so this group doesn't collide with the CI orchestrator run.
  # In a called reusable workflow, github.workflow is the CALLER's name ("CI"), so
  # using github.workflow here would produce the same group as ci.yml and they'd
  # cancel each other. tests-playwright.yml uses the same pattern.
  group: playwright-credentialed-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ inputs.event-name == 'pull_request' }}

env:
  NODE_ENV: test
  AWS_REGION: us-west-2
  API_KEY_CHECKSUM_SECRET: this is a fake Playwright CI API key checksum secret
  VOUCHA_OTP_TOKEN_HASH_SECRET: this is a fake Playwright CI OTP HMAC secret
  VOUCHA_STORED_SECRET_ENCRYPTION_KEYS: fake-playwright-ci-key:raw32:this fake test key is not secret

jobs:
  playwright-credentialed-tests:
    if: ${{ inputs.trusted_secret_context }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      NEXT_PUBLIC_ASSET_PREFIX: http://localhost
      PLAYWRIGHT_MAX_WORKERS: '3'
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c max_connections=300'
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql:rw,size=1g
      valkey:
        image: valkey/valkey-bundle:9.1.0@sha256:16004aceeb7a1246e2d1bb85d353e38120eb440951cb7d0c971b6d63fda5b3d7
        ports:
          - 6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /data:rw,size=64m

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set service ports
        timeout-minutes: 1
        run: |
          echo "DATABASE_URL=postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
          echo "VALKEY_URL=redis://localhost:${{ job.services.valkey.ports['6379'] }}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Activate pnpm via corepack
        timeout-minutes: 2
        run: bash "$GITHUB_WORKSPACE/ci/activate-pnpm.sh"
      - name: Resolve pnpm store path
        id: pnpm-store
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "lockfile-hash=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            echo "lockfile-hash=$(shasum -a 256 pnpm-lock.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-store.outputs.lockfile-hash }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - name: pnpm install
        timeout-minutes: 5
        run: |
          bash "$GITHUB_WORKSPACE/ci/pnpm-install.sh" \
            --runner-lifecycle ephemeral-full \
            --install-scripts true \
            --command-timeout-seconds 0
      - name: Allocate ports
        timeout-minutes: 1
        run: |
          # Hold every allocated port until its consumer binds. Print-and-exit
          # leaves a minutes-long gap through setup/build that other host
          # processes can occupy (issue #9270).
          set -euo pipefail
          HOLD_DIR="${RUNNER_TEMP}/voucha-port-hold"
          mkdir -p "$HOLD_DIR/release"
          PORTS=$(python3 ci/allocate-browser-safe-ports.py 4 --hold --hold-dir "$HOLD_DIR" --workspace "$GITHUB_WORKSPACE")
          read -r PORT NEXT_PORT IMAGE_LAMBDA_PORT WORKER_PORT <<< "$PORTS"
          if [ -z "$PORT" ] || [ -z "$NEXT_PORT" ] || [ -z "$IMAGE_LAMBDA_PORT" ] || [ -z "$WORKER_PORT" ]; then
            echo "::error::Failed to allocate ports"
            exit 1
          fi
          echo "PORT_HOLD_DIR=$HOLD_DIR" >> "$GITHUB_ENV"
          python3 ci/allocate-browser-safe-ports.py --check --hold-dir "$HOLD_DIR" --workspace "$GITHUB_WORKSPACE"
          {
            echo "PORT=$PORT"
            echo "NEXT_PORT=$NEXT_PORT"
            echo "IMAGE_LAMBDA_PORT=$IMAGE_LAMBDA_PORT"
            echo "WORKER_PORT=$WORKER_PORT"
          } >> "$GITHUB_ENV"
      - name: Confirm port holder
        timeout-minutes: 1
        run: python3 ci/allocate-browser-safe-ports.py --check --hold-dir "$PORT_HOLD_DIR" --workspace "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup-backend
        id: setup-backend
        timeout-minutes: 8
      - name: Check credentialed test prerequisites
        id: credentials
        timeout-minutes: 1
        env:
          AWS_TEST_ROLE_ARN: ${{ secrets.AWS_TEST_ROLE_ARN }}
          S3_BUCKET_IMAGES: ${{ secrets.S3_BUCKET_IMAGES }}
          S3_BUCKET_IMAGE_UPLOADS: ${{ secrets.S3_BUCKET_IMAGE_UPLOADS }}
        run: |
          if [ -z "${AWS_TEST_ROLE_ARN:-}" ]; then
            echo "::error::AWS_TEST_ROLE_ARN is not set — S3 CORS guard (image-upload spec) cannot run. Configure the AWS_TEST_ROLE_ARN repository secret."
            exit 1
          fi
          if [ -z "${S3_BUCKET_IMAGES:-}" ]; then
            echo "::error::S3_BUCKET_IMAGES is not set — image-upload specs cannot run. Configure the S3_BUCKET_IMAGES repository secret."
            exit 1
          fi
          if [ -z "${S3_BUCKET_IMAGE_UPLOADS:-}" ]; then
            echo "::error::S3_BUCKET_IMAGE_UPLOADS is not set — image-upload specs cannot run. Configure the S3_BUCKET_IMAGE_UPLOADS repository secret."
            exit 1
          fi
          echo "S3_BUCKET_IMAGES=$S3_BUCKET_IMAGES" >> "$GITHUB_ENV"
          echo "S3_BUCKET_IMAGE_UPLOADS=$S3_BUCKET_IMAGE_UPLOADS" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-aws
        timeout-minutes: 2
        with:
          role-arn: ${{ secrets.AWS_TEST_ROLE_ARN }}
      - name: Set image origin
        run: echo "IMAGE_ORIGIN=http://localhost:$IMAGE_LAMBDA_PORT" >> "$GITHUB_ENV"
      - name: Write Cloudflare Worker dev vars
        timeout-minutes: 1
        run: |
          CF_WORKER_SECRET=$(openssl rand -hex 32)
          CSP_BROWSER_UPLOAD_ORIGINS="$(jq --compact-output --null-input \
            --arg images_bucket "$S3_BUCKET_IMAGES" \
            --arg uploads_bucket "$S3_BUCKET_IMAGE_UPLOADS" \
            '[
              "https://\($images_bucket).s3.us-west-2.amazonaws.com",
              "https://\($images_bucket).s3.dualstack.us-west-2.amazonaws.com",
              "https://\($uploads_bucket).s3.us-west-2.amazonaws.com",
              "https://\($uploads_bucket).s3.dualstack.us-west-2.amazonaws.com"
            ]')"
          cat > cloudflare-worker/.dev.vars << EOF
          BACKEND_ORIGIN=http://localhost:$PORT
          WEB_ORIGIN=http://localhost:$NEXT_PORT
          CSP_ASSET_ORIGIN=http://localhost
          CSP_BROWSER_UPLOAD_ORIGINS=$CSP_BROWSER_UPLOAD_ORIGINS
          CF_WORKER_SECRET=$CF_WORKER_SECRET
          EOF
          echo "CF_WORKER_SECRET=$CF_WORKER_SECRET" >> "$GITHUB_ENV"
      - name: Run database migrations
        working-directory: backend
        run: node data-stores/psql/migrate.mts
        timeout-minutes: 3
      - uses: ./.github/actions/setup-playwright
        timeout-minutes: 8
      - uses: ./.github/actions/build-web-targets
        timeout-minutes: 13
        with:
          web-build-fs-cache-enabled: ${{ vars.WEB_BUILD_FS_CACHE_ENABLED }}
      - name: Compile localization catalog
        timeout-minutes: 3
        run: |
          if [ -d /dev/shm ]; then
            export TMPDIR=/dev/shm
            sqlite_path="/dev/shm/filaments-catalog-$$.sqlite"
          else
            sqlite_path="${RUNNER_TEMP}/filaments-catalog.sqlite"
          fi
          echo "Compiling localization catalog to $sqlite_path"
          node --experimental-strip-types backend/services/localization/compile-cli.mts --source localization/catalog --output "$sqlite_path"
          echo "LOCALIZATION_SQLITE_PATH=$sqlite_path" >> "$GITHUB_ENV"
      - name: Run Playwright credentialed tests
        id: run-playwright-credentialed
        timeout-minutes: 8
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-report.junit.xml
          # The direct artifact-upload step below uploads this directory after the test command.
          # It flows to lambdas/dev-server.mts's listenWithRetry
          # (via playwright/config/shared-config.mts's webServer env) so it can capture
          # bind-time collision evidence at the moment of EADDRINUSE, when the process
          # holding the port is still alive — the post-hoc step below runs only after
          # Playwright has already torn down its webServer process group.
          BROWSER_PORT_DIAGNOSTICS_DIR: ${{ runner.temp }}/browser-port-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          pnpm exec ./ci/with-node-test-options playwright test --config playwright.credentialed.config.mts && test_exit=0 || test_exit=$?
          # `trace: 'on-first-retry'` (playwright/config/shared-config.mts, shared by this
          # config) writes a trace.zip only for a test's first retry attempt, so its presence
          # under test-results/ is a direct signal that something retried in this run -- a
          # flake if the retry then passed, a confirmed failure otherwise. Same rationale as
          # the sharded tests-playwright.yml job's run-playwright step.
          if find test-results -name 'trace.zip' -print -quit 2>/dev/null | grep -q .; then
            echo "retried=true" >> "${GITHUB_OUTPUT:-/dev/null}"
          else
            echo "retried=false" >> "${GITHUB_OUTPUT:-/dev/null}"
          fi
          exit "$test_exit"
      - name: Stop port holder
        if: ${{ always() }}
        timeout-minutes: 1
        continue-on-error: true
        run: |
          if [ -n "${PORT_HOLD_DIR:-}" ]; then
            python3 ci/allocate-browser-safe-ports.py --stop --hold-dir "$PORT_HOLD_DIR" --workspace "$GITHUB_WORKSPACE"
          fi
      - name: Upload browser port diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-port-diagnostics-playwright-credentialed-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-port-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          if-no-files-found: warn
          overwrite: true
          retention-days: 1
      - name: Upload JUnit test results
        # Same reasoning as tests-playwright.yml's uploads (issue #51): cleanup-artifacts fans
        # in whenever the whole run goes green and would delete this artifact right back out
        # from under a bare `!cancelled()`, on precisely the flaky-then-passed runs worth
        # diagnosing. Gate on an actual failure or a confirmed retry instead.
        if: ${{ !cancelled() && (failure() || steps.run-playwright-credentialed.outputs.retried == 'true') }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          overwrite: true
          name: playwright-credentialed-junit
          path: test-report.junit.xml
          retention-days: 1
          if-no-files-found: ignore
