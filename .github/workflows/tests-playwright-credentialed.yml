name: Playwright Credentialed Tests

on:
  workflow_call:
    inputs:
      trusted_secret_context:
        description: 'Whether this run may use repository secrets and OIDC roles'
        required: false
        type: boolean
        default: false
    secrets:
      AWS_TEST_ROLE_ARN:
        required: false
      S3_BUCKET_IMAGES:
        required: false
      S3_BUCKET_IMAGE_UPLOADS:
        required: false
  workflow_dispatch:
    inputs:
      trusted_secret_context:
        description: 'Whether this run may use repository secrets and OIDC roles'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  actions: read

env:
  NODE_ENV: test
  AWS_REGION: us-west-2
  API_KEY_CHECKSUM_SECRET: this is a fake Playwright CI API key checksum secret
  VOUCHA_OTP_TOKEN_HASH_SECRET: this is a fake Playwright CI OTP HMAC secret
  VOUCHA_STORED_SECRET_ENCRYPTION_KEYS: fake-playwright-ci-key:raw32:this fake test key is not secret

jobs:
  playwright-credentialed-tests:
    if: ${{ inputs.trusted_secret_context }}
    # Consumer of the shared web build; its cache key includes runner.arch, so it matches the producer.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 13
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      PLAYWRIGHT_MAX_WORKERS: '3'
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c max_connections=300 -c log_min_messages=log'
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 1s
          --tmpfs /var/lib/postgresql:rw,size=1g
      valkey:
        image: valkey/valkey-bundle:9.1.0@sha256:16004aceeb7a1246e2d1bb85d353e38120eb440951cb7d0c971b6d63fda5b3d7
        ports:
          - 6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 1s
          --tmpfs /data:rw,size=64m

    steps:
      - name: Capture current job deadline
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          timing_file="$RUNNER_TEMP/credentialed-job-timing.json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$timing_file"
          python3 - "$timing_file" <<'PYCODE'
          import datetime, json, math, os, sys
          with open(sys.argv[1]) as source:
              payload = json.load(source)
          jobs = payload.get("jobs")
          count = payload.get("total_count")
          if type(count) is not int or not isinstance(jobs, list) or count != len(jobs) or not 1 <= count <= 100:
              raise SystemExit("::error::Incomplete current-attempt job timing response")
          expected_job = os.environ["GITHUB_JOB"]
          matches = [job for job in jobs if isinstance(job, dict)
                     and job.get("runner_name") == os.environ["RUNNER_NAME"]
                     and (job.get("name") == expected_job or job.get("name", "").endswith(" / " + expected_job))]
          if len(matches) != 1:
              raise SystemExit("::error::Current job timing identity is missing or ambiguous")
          job = matches[0]
          if (type(job.get("id")) is not int or job["id"] <= 0
                  or type(job.get("runner_id")) is not int or job["runner_id"] <= 0
                  or job.get("run_id") != int(os.environ["GITHUB_RUN_ID"])
                  or job.get("run_attempt") != int(os.environ["GITHUB_RUN_ATTEMPT"])
                  or job.get("status") != "in_progress"):
              raise SystemExit("::error::Current job timing metadata is invalid")
          started = job.get("started_at")
          if not isinstance(started, str):
              raise SystemExit("::error::Current job start timestamp is missing")
          start = datetime.datetime.fromisoformat(started.replace("Z", "+00:00"))
          if start.tzinfo is None or start.utcoffset() != datetime.timedelta(0):
              raise SystemExit("::error::Current job start timestamp must be UTC")
          now = datetime.datetime.now(datetime.timezone.utc).timestamp()
          epoch = start.timestamp()
          if not math.isfinite(epoch) or epoch <= 0 or epoch > now:
              raise SystemExit("::error::Current job start timestamp is invalid or in the future")
          deadline = math.floor(epoch) + 13 * 60
          if deadline - now <= 130:
              raise SystemExit("::error::Insufficient job time for credentialed tests and cleanup")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"CREDENTIALED_JOB_DEADLINE_EPOCH={deadline}\n")
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set service ports
        timeout-minutes: 1
        run: |
          echo "DATABASE_URL=postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
          echo "VALKEY_URL=redis://localhost:${{ job.services.valkey.ports['6379'] }}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-backend
        id: setup-backend
        timeout-minutes: 8
      - name: Allocate ports
        timeout-minutes: 1
        run: |
          # One call keeps every app port distinct.
          set -euo pipefail
          PORTS=$(python3 ci/allocate-browser-safe-ports.py 4)
          read -r PORT NEXT_PORT IMAGE_LAMBDA_PORT WORKER_PORT <<< "$PORTS"
          if [ -z "$PORT" ] || [ -z "$NEXT_PORT" ] || [ -z "$IMAGE_LAMBDA_PORT" ] || [ -z "$WORKER_PORT" ]; then
            echo "::error::Failed to allocate ports"
            exit 1
          fi
          {
            echo "PORT=$PORT"
            echo "NEXT_PORT=$NEXT_PORT"
            echo "IMAGE_LAMBDA_PORT=$IMAGE_LAMBDA_PORT"
            echo "WORKER_PORT=$WORKER_PORT"
          } >> "$GITHUB_ENV"
      - name: Check credentialed test prerequisites
        id: credentials
        timeout-minutes: 1
        env:
          AWS_TEST_ROLE_ARN: ${{ secrets.AWS_TEST_ROLE_ARN }}
          S3_BUCKET_IMAGES: ${{ secrets.S3_BUCKET_IMAGES }}
          S3_BUCKET_IMAGE_UPLOADS: ${{ secrets.S3_BUCKET_IMAGE_UPLOADS }}
        run: |
          if [ -z "${AWS_TEST_ROLE_ARN:-}" ]; then
            echo "::error::AWS_TEST_ROLE_ARN is not set — S3 CORS guard (image-upload spec) cannot run. Configure the AWS_TEST_ROLE_ARN repository secret."
            exit 1
          fi
          if [ -z "${S3_BUCKET_IMAGES:-}" ]; then
            echo "::error::S3_BUCKET_IMAGES is not set — image-upload specs cannot run. Configure the S3_BUCKET_IMAGES repository secret."
            exit 1
          fi
          if [ -z "${S3_BUCKET_IMAGE_UPLOADS:-}" ]; then
            echo "::error::S3_BUCKET_IMAGE_UPLOADS is not set — image-upload specs cannot run. Configure the S3_BUCKET_IMAGE_UPLOADS repository secret."
            exit 1
          fi
          echo "S3_BUCKET_IMAGES=$S3_BUCKET_IMAGES" >> "$GITHUB_ENV"
          echo "S3_BUCKET_IMAGE_UPLOADS=$S3_BUCKET_IMAGE_UPLOADS" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-aws
        timeout-minutes: 2
        with:
          role-arn: ${{ secrets.AWS_TEST_ROLE_ARN }}
      - name: Set image origin
        run: echo "IMAGE_ORIGIN=http://localhost:$IMAGE_LAMBDA_PORT" >> "$GITHUB_ENV"
      - name: Write Cloudflare Worker dev vars
        timeout-minutes: 1
        run: |
          CF_WORKER_SECRET=$(openssl rand -hex 32)
          CSP_BROWSER_UPLOAD_ORIGINS="$(jq --compact-output --null-input \
            --arg images_bucket "$S3_BUCKET_IMAGES" \
            --arg uploads_bucket "$S3_BUCKET_IMAGE_UPLOADS" \
            '[
              "https://\($images_bucket).s3.us-west-2.amazonaws.com",
              "https://\($images_bucket).s3.dualstack.us-west-2.amazonaws.com",
              "https://\($uploads_bucket).s3.us-west-2.amazonaws.com",
              "https://\($uploads_bucket).s3.dualstack.us-west-2.amazonaws.com"
            ]')"
          cat > cloudflare-worker/.dev.vars << EOF
          BACKEND_ORIGIN=http://localhost:$PORT
          WEB_ORIGIN=http://localhost:$NEXT_PORT
          CSP_BROWSER_UPLOAD_ORIGINS=$CSP_BROWSER_UPLOAD_ORIGINS
          CF_WORKER_SECRET=$CF_WORKER_SECRET
          EOF
          echo "CF_WORKER_SECRET=$CF_WORKER_SECRET" >> "$GITHUB_ENV"
      - name: Run database migrations
        working-directory: backend
        run: node data-stores/psql/migrate.mts
        timeout-minutes: 3
      - uses: ./.github/actions/setup-playwright
        timeout-minutes: 8
      - uses: ./.github/actions/build-web-targets
        timeout-minutes: 6
        with:
          shared-build-cache-mode: consumer
          web-build-fs-cache-enabled: ${{ vars.WEB_BUILD_FS_CACHE_ENABLED }}
      - name: Compile localization catalog
        timeout-minutes: 3
        run: |
          if [ -d /dev/shm ]; then
            export TMPDIR=/dev/shm
            sqlite_path="/dev/shm/vouchington-catalog-$$.sqlite"
          else
            sqlite_path="${RUNNER_TEMP}/vouchington-catalog.sqlite"
          fi
          echo "Compiling localization catalog to $sqlite_path"
          node backend/services/localization/compile-cli.mts --source localization/catalog --output "$sqlite_path"
          echo "LOCALIZATION_SQLITE_PATH=$sqlite_path" >> "$GITHUB_ENV"
      - name: Run Playwright credentialed tests
        id: run-playwright-credentialed
        timeout-minutes: 8
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-report.junit.xml
        run: |
          set -euo pipefail
          # Leave 10s for reaping, 60s for upload, and 60s for shell/post-step work.
          deadline="${CREDENTIALED_JOB_DEADLINE_EPOCH:?Missing validated job deadline}"
          if [[ ! "$deadline" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid validated job deadline"
            exit 1
          fi
          remaining=$((deadline - $(date +%s) - 130))
          if [ "$remaining" -le 0 ]; then
            echo "::error::Insufficient remaining job time; credentialed command was not started"
            exit 1
          fi
          command_budget=420
          if [ "$remaining" -lt "$command_budget" ]; then command_budget="$remaining"; fi
          python3 "$GITHUB_WORKSPACE/ci/run-bounded.py" "$command_budget" pnpm exec ./ci/with-node-test-options playwright test --config playwright.credentialed.config.mts && test_exit=0 || test_exit=$?
          # `trace: 'on-first-retry'` (playwright/config/shared-config.mts, shared by this
          # config) writes a trace.zip only for a test's first retry attempt, so its presence
          # under test-results/ is a direct signal that something retried in this run -- a
          # flake if the retry then passed, a confirmed failure otherwise. Same rationale as
          # the sharded tests-playwright.yml job's run-playwright step.
          if find test-results -name 'trace.zip' -print -quit 2>/dev/null | grep -q .; then
            echo "retried=true" >> "${GITHUB_OUTPUT:-/dev/null}"
          else
            echo "retried=false" >> "${GITHUB_OUTPUT:-/dev/null}"
          fi
          exit "$test_exit"
      - name: Upload JUnit test results
        # Preserve failed and flaky-then-passed evidence without uploading on every green run.
        # Gate on an actual failure or a confirmed retry rather than bare `!cancelled()`.
        if: ${{ !cancelled() && (failure() || steps.run-playwright-credentialed.outputs.retried == 'true') }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          overwrite: true
          name: playwright-credentialed-junit
          path: test-report.junit.xml
          retention-days: 1
          if-no-files-found: ignore
