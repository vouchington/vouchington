name: Playwright Credentialed Tests

on:
  workflow_call:
    inputs:
      trusted_secret_context:
        description: 'Whether this run may use repository secrets and OIDC roles'
        required: false
        type: boolean
        default: false
    secrets:
      AWS_TEST_ROLE_ARN:
        required: false
      S3_BUCKET_IMAGES:
        required: false
      S3_BUCKET_IMAGE_UPLOADS:
        required: false
  workflow_dispatch:
    inputs:
      trusted_secret_context:
        description: 'Whether this run may use repository secrets and OIDC roles'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  actions: read

env:
  NODE_ENV: test
  AWS_REGION: us-west-2
  API_KEY_CHECKSUM_SECRET: this is a fake Playwright CI API key checksum secret
  VOUCHA_OTP_TOKEN_HASH_SECRET: this is a fake Playwright CI OTP HMAC secret
  VOUCHA_STORED_SECRET_ENCRYPTION_KEYS: fake-playwright-ci-key:raw32:this fake test key is not secret

jobs:
  playwright-credentialed-tests:
    if: ${{ inputs.trusted_secret_context }}
    # Consumer of the shared web build; its cache key includes runner.arch, so it matches the producer.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 13
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      LINGUA_RS_SKIP_DOWNLOAD: '1'
      PLAYWRIGHT_MAX_WORKERS: '3'
    services:
      postgres:
        image: ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c max_connections=300 -c log_min_messages=log'
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 1s
          --tmpfs /var/lib/postgresql:rw,size=1g

    steps:
      - name: Capture current job deadline
        timeout-minutes: 1
        # no-mistakes-disable-next-line github-actions-max-inline-script-lines: Runs before checkout; capture the original job start and deadline before repository setup.
        run: |
          set -euo pipefail
          # The jobs list lags runner assignment, so the deadline uses this
          # step's clock. timeout-minutes still starts at assignment; the
          # Playwright step's 130s reserve covers that startup gap.
          now=$(date +%s)
          deadline=$((now + 13 * 60))
          echo "CREDENTIALED_JOB_DEADLINE_EPOCH=${deadline}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        timeout-minutes: 3
      - uses: ./.github/actions/start-valkey
        timeout-minutes: 2
      - name: Set service ports
        timeout-minutes: 1
        run: |
          echo "DATABASE_URL=postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-backend
        id: setup-backend
        timeout-minutes: 8
      - name: Allocate ports
        timeout-minutes: 1
        run: source "$GITHUB_WORKSPACE/.github/workflows/tests-playwright-credentialed-allocate-ports.sh"
      - name: Check credentialed test prerequisites
        id: credentials
        timeout-minutes: 1
        env:
          AWS_TEST_ROLE_ARN: ${{ secrets.AWS_TEST_ROLE_ARN }}
          S3_BUCKET_IMAGES: ${{ secrets.S3_BUCKET_IMAGES }}
          S3_BUCKET_IMAGE_UPLOADS: ${{ secrets.S3_BUCKET_IMAGE_UPLOADS }}
        run: source "$GITHUB_WORKSPACE/.github/workflows/tests-playwright-credentialed-check-credentialed-test-prerequisites.sh"
      - uses: vouchington/vouchington-tooling/.github/actions/setup-aws@e4f21b79d1398af8dd76c70f0775ded58f0c4f80 # v2.0.1
        timeout-minutes: 2
        with:
          role-arn: ${{ secrets.AWS_TEST_ROLE_ARN }}
          aws-region: us-west-2
          action-timeout-s: 90
      - name: Set image origin
        timeout-minutes: 1
        run: echo "IMAGE_ORIGIN=http://localhost:$IMAGE_LAMBDA_PORT" >> "$GITHUB_ENV"
      - name: Write Cloudflare Worker dev vars
        timeout-minutes: 1
        run: source "$GITHUB_WORKSPACE/.github/workflows/tests-playwright-credentialed-write-cloudflare-worker-dev-vars.sh"
      - name: Run database migrations
        working-directory: backend
        run: node data-stores/psql/migrate.mts
        timeout-minutes: 3
      - uses: vouchington/vouchington-tooling/.github/actions/setup-playwright@e4f21b79d1398af8dd76c70f0775ded58f0c4f80 # v2.0.1
        timeout-minutes: 8
      - uses: ./.github/actions/build-web-targets
        timeout-minutes: 9
        with:
          shared-build-cache-mode: consumer
          web-build-fs-cache-enabled: ${{ vars.WEB_BUILD_FS_CACHE_ENABLED }}
      - name: Compile localization catalog
        timeout-minutes: 3
        run: source "$GITHUB_WORKSPACE/.github/workflows/tests-playwright-credentialed-compile-localization-catalog.sh"
      - name: Clear stale credentialed Playwright JUnit report
        timeout-minutes: 1
        run: rm -f test-report.junit.xml
      - name: Run Playwright credentialed tests
        id: run-playwright-credentialed
        timeout-minutes: 8
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-report.junit.xml
        run: source "$GITHUB_WORKSPACE/.github/workflows/tests-playwright-credentialed-run-playwright-credentialed-tests.sh"
      - name: Upload JUnit test results
        # Retain passing test counts for no-skip evidence as well as failures and retries.
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: playwright-credentialed-junit
          path: test-report.junit.xml
          retention-days: 1
          if-no-files-found: ignore
      - name: Report non-gating smoke check failure
        # These specs run against real cloud resources (S3 uploads, the image lambda); they do not
        # gate the `web` check. The failed job stays red so a failure remains visible, and so does
        # the Nightly run.
        if: ${{ failure() && steps.run-playwright-credentialed.outcome == 'failure' }}
        timeout-minutes: 1
        run: source "$GITHUB_WORKSPACE/.github/workflows/tests-playwright-credentialed-report-non-gating-smoke-check-failure.sh"
      - if: ${{ failure() && steps.checkout.outcome == 'success' }}
        uses: ./.github/actions/valkey-logs
        timeout-minutes: 1
