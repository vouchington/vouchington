name: Main CI (lambdas)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-lambdas.yml'
      - '.github/workflows/main-lambdas/build.sh'
      - '.github/workflows/tests-lambdas.yml'
      - '.github/workflows/checks-static.yml'
      - '.github/workflows/checks-static-*.sh'
      - '.github/actions/**'
      - 'lambdas/**'
      - 'ts-shared/url-signing/**'
      - 'ts-shared/utils/**'
      - 'vitest.config.mts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

concurrency:
  group: main-lambdas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-image-resize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 1
      - uses: vouchington/vouchington-tooling/.github/actions/setup-node-pnpm@bd89d56c941ff4aa3b3c09edf1eb597ab93f1718 # v0.85.2
        timeout-minutes: 3
        with:
          deadline-seconds: '150'
      - name: Build and validate the image-resize deployment package
        timeout-minutes: 4
        run: source .github/workflows/main-lambdas/build.sh
      - name: Publish the image-resize deployment package
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-resize-lambda-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery/image-resize.zip
          if-no-files-found: error
          retention-days: 1
          overwrite: true
