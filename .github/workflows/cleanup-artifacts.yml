name: Cleanup Artifacts

# Deletes intermediate CI artifacts once they are no longer needed so the
# account stays under its billed Actions storage cap. Area workflows leave full LCOV
# available for patch coverage and independent Codecov uploads. The scheduled sweep catches:
#
#   - cancelled delete-classified artifacts (rapid-push concurrency cancellation), which become
#     sweep-eligible once their `created_at` is over 6 hours old
#   - intermediates such as playwright-otel output
#
# See ci/cleanup-artifacts-patterns.json for the shared classification policy,
# and ci/cleanup-artifacts.mts for scheduled sweep logic. See also
# AUTHORING.md's "Artifact Rerun Safety" section for why cancelled artifacts wait for a later
# 6-hourly sweep after that eligibility threshold, while `failure`, `timed_out`, and
# `action_required` artifacts remain until GitHub expiration. An unavailable run lookup skips that
# sweep and is retried later. A failed-jobs rerun may still need sibling artifacts from the original
# attempt.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: cleanup-artifacts-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup-sweep:
    name: Sweep stale artifacts
    runs-on: ubuntu-latest
    # Job ceiling must exceed the sum of step budgets: setup-node-pnpm (5 min) + the sweep engine
    # itself (20 min), plus headroom for checkout/workspace-restore.
    timeout-minutes: 26
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
        timeout-minutes: 5
      - name: Sweep artifacts older than 6 hours
        timeout-minutes: 20
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ci/cleanup-artifacts.mts sweep --older-than-hours 6
