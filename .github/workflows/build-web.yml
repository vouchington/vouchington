name: Build Web Implementation

on:
  workflow_call:
    inputs:
      trusted_secret_context:
        description: 'Whether this run may use repository secrets and OIDC roles'
        required: false
        type: boolean
        default: false
    secrets:
      AWS_TEST_ROLE_ARN:
        required: true
concurrency:
  group: build-web-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  build:
    if: ${{ inputs.trusted_secret_context }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      IMAGE_REPOSITORY: voucha-validation
      SHA_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          clean: false

      - name: Restore workspace cleaner
        shell: bash
        run: |
          rm -rf -- .github/actions/clean-workspace/action.yml ci/curl-to.sh ci/exec-vouchington-gha.sh package.json pnpm-lock.yaml
          git archive --format=tar HEAD -- .github/actions/clean-workspace/action.yml ci/curl-to.sh ci/exec-vouchington-gha.sh package.json pnpm-lock.yaml | tar -x
      - uses: ./.github/actions/clean-workspace
        with:
          deepen: 'true'
      - uses: ./.github/actions/setup-aws
        timeout-minutes: 2
        with:
          role-arn: ${{ secrets.AWS_TEST_ROLE_ARN }}

      - name: Lint Dockerfile
        timeout-minutes: 2
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          config: .hadolint.yaml
          dockerfile: web/Dockerfile

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        timeout-minutes: 2

      - name: Docker metadata
        id: meta
        timeout-minutes: 1
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_REPOSITORY }}/web
          tags: |
            type=sha,prefix=sha-,format=long

      - name: Inject .next/cache into BuildKit cache mount
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {
              "web-next-cache": {
                "target": "/app/web/.next/cache"
              }
            }

      - name: Build Docker image
        timeout-minutes: 10
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: web/Dockerfile
          load: true
          push: false
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=web-arm64
          cache-to: type=gha,scope=web-arm64,mode=max
          build-args: |
            NEXT_PUBLIC_GIT_COMMIT=${{ github.sha }}
            NEXT_PUBLIC_ASSET_PREFIX=${{ vars.NEXT_PUBLIC_ASSET_PREFIX }}
            STRIP_TEST_IDS=true
        env:
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'

      - name: Report Docker image size
        timeout-minutes: 1
        continue-on-error: true
        env:
          IMAGE_TAG: ${{ env.SHA_TAG }}
        run: |
          set -euo pipefail
          IMAGE="$IMAGE_REPOSITORY/web:$IMAGE_TAG"
          IMAGE_BYTES=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          IMAGE_SIZE=$(numfmt --to=iec-i --suffix=B "$IMAGE_BYTES")
          echo "Web image size: $IMAGE_SIZE ($IMAGE_BYTES bytes)"
          {
            echo "## Docker Image Size"
            echo ""
            echo "- Image: \`$IMAGE\`"
            echo "- Size: \`$IMAGE_SIZE\` ($IMAGE_BYTES bytes)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Activate pnpm via corepack
        timeout-minutes: 2
        run: bash "$GITHUB_WORKSPACE/ci/activate-pnpm.sh"
      - name: Install localization smoke dependencies
        timeout-minutes: 5
        run: bash ci/pnpm-install.sh --runner-lifecycle ephemeral-full --install-scripts true
      - name: Run Docker smoke test
        timeout-minutes: 5
        env:
          IMAGE_TAG: ${{ env.SHA_TAG }}
        run: |
          set -euo pipefail
          IMAGE="$IMAGE_REPOSITORY/web:$IMAGE_TAG"
          PORTS=$(python3 ci/allocate-browser-safe-ports.py 2)
          read -r PORT BACKEND_PORT <<< "$PORTS"
          echo "BROWSER_ALLOCATED_PORTS=$PORTS" >> "$GITHUB_ENV"
          SMOKE_TMP_DIR=$(mktemp -d "${RUNNER_TEMP}/web-image-smoke.XXXXXX")
          cleanup() {
            if [ -n "${CONTAINER:-}" ]; then
              docker stop "$CONTAINER" >/dev/null 2>&1 || true
              docker rm "$CONTAINER" >/dev/null 2>&1 || true
            fi
            if [ -n "${BACKEND_PID:-}" ]; then
              kill "$BACKEND_PID" 2>/dev/null || true
              wait "$BACKEND_PID" 2>/dev/null || true
            fi
            rm -rf "$SMOKE_TMP_DIR"
          }
          trap cleanup EXIT
          node web/test-helpers/compile-localization-smoke-catalog.mts "$SMOKE_TMP_DIR/catalog.sqlite"
          LOCALIZATION_SQLITE_PATH="$SMOKE_TMP_DIR/catalog.sqlite" \
            node web/test-helpers/localization-smoke-backend.mts "$BACKEND_PORT" 0.0.0.0 > "$SMOKE_TMP_DIR/backend.log" 2>&1 &
          BACKEND_PID=$!
          for i in $(seq 1 30); do
            if curl --max-time 2 -fsS "http://127.0.0.1:$BACKEND_PORT/health" >/dev/null 2>&1; then break; fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              cat "$SMOKE_TMP_DIR/backend.log"
              exit 1
            fi
            sleep 0.2
          done
          if ! curl --max-time 2 -fsS "http://127.0.0.1:$BACKEND_PORT/health" >/dev/null; then
            cat "$SMOKE_TMP_DIR/backend.log"
            exit 1
          fi
          CONTAINER=$(docker run -d -p "$PORT:3000" --add-host=host.docker.internal:host-gateway \
            -e API_BASE_URL="http://host.docker.internal:$BACKEND_PORT" \
            -e HOSTNAME=eni-test-fargate.ecs.internal -e ALLOW_TURNSTILE_TEST_KEY=true \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN -e AWS_REGION "$IMAGE")
          echo "Waiting for web server to be ready (max 30s)..."
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:$PORT/" >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "✗ Web server did not respond within 30s"
              docker logs "$CONTAINER"
              exit 1
            fi
            sleep 0.5
          done

          HTML_OUTPUT=$(curl -sS "http://localhost:$PORT/")
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "http://localhost:$PORT/")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "✗ / returned HTTP $HTTP_CODE"
            docker logs "$CONTAINER"
            exit 1
          fi
          echo "✓ / returned 200"

          HEALTH_HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "http://localhost:$PORT/healthz")
          if [ "$HEALTH_HTTP_CODE" != "200" ]; then
            echo "✗ /healthz returned HTTP $HEALTH_HTTP_CODE"
            docker logs "$CONTAINER"
            exit 1
          fi
          echo "✓ /healthz returned 200"

          # Mirror the ECS container health check: probe loopback *inside* the container.
          # This catches HOSTNAME bind mismatches — the ECS health check runs inside the
          # container and connects to 127.0.0.1:3000, not through the published host port.
          docker exec "$CONTAINER" node -e "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          echo "✓ /healthz loopback (ECS health-check path) returned 200"

          # Assert that test attributes are successfully stripped in production builds
          if echo "$HTML_OUTPUT" | grep -qE 'data-(pw|testid)='; then
            echo "✗ HTML output contains unstripped test attributes (data-pw or data-testid) in production build"
            exit 1
          fi
          echo "✓ / returned 200 and test attributes are successfully stripped"

      - name: Diagnose browser port collision
        if: ${{ failure() && env.BROWSER_ALLOCATED_PORTS != '' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/diagnose-browser-port-collision
        with:
          ports: ${{ env.BROWSER_ALLOCATED_PORTS }}
          artifact-suffix: web

      - name: Install Trivy
        id: install-trivy
        timeout-minutes: 3
        continue-on-error: true
        env:
          # renovate: datasource=github-releases depName=aquasecurity/trivy extractVersion=^v(?<version>.*)$
          TRIVY_VERSION: 0.71.2
        run: |
          set -euo pipefail
          if trivy --version 2>/dev/null | grep -q "$TRIVY_VERSION"; then
            echo "trivy $TRIVY_VERSION already installed"
            exit 0
          fi
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) os="macOS"; arch="ARM64" ;;
            Darwin-x86_64) os="macOS"; arch="64bit" ;;
            Linux-aarch64|Linux-arm64) os="Linux"; arch="ARM64" ;;
            Linux-x86_64) os="Linux"; arch="64bit" ;;
            *) echo "Unsupported platform: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          BASE_URL="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          ARCHIVE="trivy_${TRIVY_VERSION}_${os}-${arch}.tar.gz"
          TRIVY_ARCHIVE="${RUNNER_TEMP:-/tmp}/${ARCHIVE}"
          source "$GITHUB_WORKSPACE/ci/curl-to.sh"
          ci_download_to "${BASE_URL}/${ARCHIVE}" "$TRIVY_ARCHIVE" --retry 3 --retry-all-errors
          CHECKSUMS="${RUNNER_TEMP:-/tmp}/trivy_${TRIVY_VERSION}_checksums.txt"
          ci_download_to "${BASE_URL}/trivy_${TRIVY_VERSION}_checksums.txt" "$CHECKSUMS" --retry 3 --retry-all-errors
          EXPECTED=$(grep "${ARCHIVE}" "$CHECKSUMS" | awk '{print $1}')
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${EXPECTED}  $TRIVY_ARCHIVE" | sha256sum -c -
          else
            echo "${EXPECTED}  $TRIVY_ARCHIVE" | shasum -a 256 -c -
          fi
          tar -xzf "$TRIVY_ARCHIVE" -C "${RUNNER_TEMP:-/tmp}" trivy
          mv "${RUNNER_TEMP:-/tmp}/trivy" "$HOME/.local/bin/trivy"
          chmod +x "$HOME/.local/bin/trivy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm -f "$TRIVY_ARCHIVE" "$CHECKSUMS"

      - name: Trivy install guard
        if: ${{ !cancelled() && steps.install-trivy.outcome != 'skipped' }}
        timeout-minutes: 1
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            echo "✗ Trivy was not installed — container scans cannot run." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Prepare Trivy database
        timeout-minutes: 3
        run: ./ci/prepare-trivy-db.sh

      - name: Scan OS packages in web image with Trivy
        timeout-minutes: 10
        env:
          IMAGE_TAG: ${{ env.SHA_TAG }}
          TRIVY_FINDINGS_EXIT_CODE: '10'
        run: |
          set -euo pipefail
          image="$IMAGE_REPOSITORY/web:$IMAGE_TAG"
          trivy_exit=0
          trivy image \
            --scanners vuln \
            --quiet \
            --pkg-types os \
            --skip-db-update \
            --exit-code "$TRIVY_FINDINGS_EXIT_CODE" \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --ignorefile .trivyignore.yaml \
            --format table \
            --table-mode detailed \
            --output trivy-web-os-table.txt \
            "$image" 2> trivy-web-os-stderr.txt || trivy_exit=$?
          if [ "$trivy_exit" -eq "$TRIVY_FINDINGS_EXIT_CODE" ]; then
            echo "::error title=Trivy OS vulnerability findings::CRITICAL/HIGH fixable OS vulnerabilities were found in $image."
            {
              echo "## Trivy OS Package Scan — Web"
              echo ""
              echo "⚠️ CRITICAL/HIGH fixable OS vulnerabilities were found."
              echo ""
              echo '```'
              cat trivy-web-os-table.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat trivy-web-os-table.txt
            exit "$trivy_exit"
          elif [ "$trivy_exit" -ne 0 ]; then
            echo "::error title=Trivy scanner error::Trivy could not complete the OS package scan for $image (exit $trivy_exit)."
            echo "✗ Trivy scanner error while scanning OS packages in $image (exit $trivy_exit)"
            cat trivy-web-os-stderr.txt >&2
            exit "$trivy_exit"
          fi

      - name: Generate web SBOM
        timeout-minutes: 5
        env:
          IMAGE_TAG: ${{ env.SHA_TAG }}
        run: |
          # Gating already happened in "Scan OS packages in web image with Trivy" above; this step
          # only runs once that step has passed, so an exit-code/severity filter
          # here can never trigger. Keep the SBOM free of vulnerability filters so it
          # remains a complete OS and language package component inventory for the
          # uploaded artifact, not a truncated gate report.
          trivy image \
            --quiet \
            --skip-db-update \
            --exit-code 0 \
            --format cyclonedx \
            --output sbom-web.cdx.json \
            "$IMAGE_REPOSITORY/web:$IMAGE_TAG"

      - name: Upload Trivy artifacts
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-web-${{ github.sha }}
          path: |
            trivy-web-os-table.txt
            trivy-web-os-stderr.txt
            sbom-web.cdx.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 1
