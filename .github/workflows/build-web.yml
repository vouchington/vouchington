name: Build Web Implementation

on:
  workflow_call:
    inputs:
      trusted_secret_context:
        description: 'Whether this run may use repository secrets and OIDC roles'
        required: false
        type: boolean
        default: false
    secrets:
      AWS_TEST_ROLE_ARN:
        required: false
concurrency:
  group: build-web-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      IMAGE_REPOSITORY: voucha-validation
      SHA_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-aws
        if: ${{ inputs.trusted_secret_context }}
        timeout-minutes: 2
        with:
          role-arn: ${{ secrets.AWS_TEST_ROLE_ARN }}

      - name: Configure inert AWS credentials
        if: ${{ !inputs.trusted_secret_context }}
        run: |
          {
            echo 'AWS_ACCESS_KEY_ID=merge-group-validation'
            echo 'AWS_SECRET_ACCESS_KEY=merge-group-validation'
            echo 'AWS_SESSION_TOKEN=merge-group-validation'
            echo 'AWS_REGION=us-west-2'
          } >> "$GITHUB_ENV"

      - uses: ./.github/actions/build-web-images
        with:
          next-public-asset-prefix: ${{ vars.NEXT_PUBLIC_ASSET_PREFIX }}
