name: Build Web Implementation

on:
  workflow_call:
    inputs:
      trusted_secret_context:
        description: 'Whether this run may use repository secrets and OIDC roles'
        required: false
        type: boolean
        default: false
    secrets:
      AWS_TEST_ROLE_ARN:
        required: true
concurrency:
  group: build-web-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  build:
    if: ${{ inputs.trusted_secret_context }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      IMAGE_REPOSITORY: voucha-validation
      SHA_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-aws
        timeout-minutes: 2
        with:
          role-arn: ${{ secrets.AWS_TEST_ROLE_ARN }}

      - uses: ./.github/actions/build-web-images
        with:
          next-public-asset-prefix: ${{ vars.NEXT_PUBLIC_ASSET_PREFIX }}

      - name: Diagnose browser port collision
        if: ${{ failure() && env.BROWSER_ALLOCATED_PORTS != '' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/diagnose-browser-port-collision
        with:
          ports: ${{ env.BROWSER_ALLOCATED_PORTS }}
          artifact-suffix: web
