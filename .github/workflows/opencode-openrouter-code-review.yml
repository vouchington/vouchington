name: OpenCode OpenRouter Code Review

on:
  pull_request:
    # closed and converted_to_draft are included only so their run enters the concurrency group
    # below and coalesces away a still-queued review. closed needs an explicit if: exclusion below
    # since draft stays false; converted_to_draft needs none because the event's
    # pull_request.draft is already true by the time it fires, which the existing draft == false
    # check already excludes.
    types: [opened, reopened, ready_for_review, synchronize, closed, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: opencode-openrouter-code-review-${{ github.event.pull_request.number }}
  # Queued reviews for the same PR coalesce to the latest commit; an already-running review is
  # never cancelled, only a still-queued one is superseded by a newer push.
  cancel-in-progress: false

jobs:
  opencode-openrouter-review:
    if: >-
      vars.OPENCODE_OPENROUTER_CODE_REVIEW_ENABLED == 'true' &&
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    concurrency:
      group: opencode-openrouter-review-fleet-admission
      # Repo-wide cap: only 1 run of this reviewer executes at a time across all PRs, so the
      # shared 4-runner "Code Review" pool never oversubscribes. queue: max (FIFO) so a distinct
      # PR's request is only delayed, never silently dropped by coalescing — same rationale as
      # harness-dispatch-fleet-admission in fix-issue.yml and its siblings.
      queue: max
      cancel-in-progress: false
    uses: vouchington/vouchington-tooling/.github/workflows/opencode-code-review.yml@37587cbcd959b9f94ae3efe254d422890b0c15c8 # v0.16.1
    permissions:
      actions: read
      checks: write # both callee jobs declare it; a caller cannot grant less than the callee requests
      contents: read
      issues: read
      pull-requests: write
    with:
      provider: openrouter
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      pr_number: ${{ github.event.pull_request.number }}
      runs_on: '["self-hosted","Linux","X64","Docker","Code Review"]'
      # Lowered from 60: successful runs complete in 1.5-8min, and failures (rate-limit) surface in
      # under 5 minutes. No longer sharing a workflow run with opencode-zen-review (#11267), so this
      # value only needs to cover this reviewer's own worst case.
      timeout_minutes: '15'
    secrets:
      code_review_api_key: ${{ secrets.OPENROUTER_FREE_API_KEY }}
