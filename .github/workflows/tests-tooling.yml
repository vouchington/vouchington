name: Tooling Tests

on:
  workflow_call:
    inputs:
      publish_coverage:
        description: 'Whether to collect coverage and publish the full LCOV for the area coverage gate and Codecov'
        required: false
        type: boolean
        default: false
      publish_coverage_pair:
        description: 'Whether to also publish the sparse coverage pair for the ci.yml Patch Coverage consumer'
        required: false
        type: boolean
        default: false
      upload_vitest_blob_artifact:
        description: 'Whether to upload Vitest blob artifacts to GitHub as a fallback'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      upload_vitest_blob_artifact:
        description: 'Whether to upload Vitest blob artifacts to GitHub as a fallback'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/fetch-base-ref
      - uses: ./.github/actions/setup-backend
        id: setup-backend
        timeout-minutes: 10
      - name: Install Gitleaks for scanner fixtures
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          install_args: gitleaks
        timeout-minutes: 3
      - name: Run tooling tests
        env:
          VITEST_CI_REPORTERS: run
          VITEST_JUNIT_OUTPUT_FILE: tooling-test-report.junit.xml
          VITEST_BLOB_OUTPUT_FILE: .vitest-reports/tooling.json
          VITEST_COVERAGE_ENABLED: ${{ inputs.publish_coverage && 'true' || 'false' }}
        run: node ci/tooling-test-runner.mts --workflow-projects --bail=3
        timeout-minutes: 16
      - name: Preserve full tooling LCOV
        if: ${{ !cancelled() && inputs.publish_coverage }}
        shell: bash
        run: |
          if [ -f coverage/lcov.info ]; then
            mkdir -p coverage-full
            cp coverage/lcov.info coverage-full/lcov.info
          fi
      - name: Stamp tooling coverage provenance
        id: coverage-stamp-1
        timeout-minutes: 1
        if: ${{ !cancelled() && inputs.publish_coverage_pair }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node ci/coverage-manifest.mts patch "tooling" "$(node -p "JSON.parse(require('node:fs').readFileSync('node_modules/vitest/package.json','utf8')).version")"
      - name: Upload tooling vitest blob to GitHub (fallback)
        id: vitest-blob-fallback-1
        if: ${{ !cancelled() && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-blob
        with:
          suite: tooling
      - name: Upload tooling vitest blob to GitHub (fallback attempt 2)
        id: vitest-blob-fallback-1-retry
        if: ${{ !cancelled() && inputs.upload_vitest_blob_artifact && steps.vitest-blob-fallback-1.outcome == 'failure' }}
        timeout-minutes: 3
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-blob
        with:
          suite: tooling
          name-suffix: -retry
      - name: Require a persisted tooling vitest blob
        id: vitest-blob-outcome-1
        if: ${{ !cancelled() && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        env:
          FAMILY: vitest-blob
          SUITE: tooling
          FIRST_OUTCOME: ${{ steps.vitest-blob-fallback-1.outcome }}
          RETRY_OUTCOME: ${{ steps.vitest-blob-fallback-1-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - name: Persist tooling Vitest report attempt (attempt 1)
        id: vitest-report-attempt-1
        if: ${{ always() && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-report-attempt
        with:
          suite: tooling
      - name: Persist tooling Vitest report attempt (attempt 2)
        id: vitest-report-attempt-1-retry
        if: ${{ always() && inputs.upload_vitest_blob_artifact && steps.vitest-report-attempt-1.outcome == 'failure' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-report-attempt
        with:
          suite: tooling
          name-suffix: -retry
      - name: Assert tooling Vitest report attempt persisted
        id: vitest-report-attempt-1-outcome
        if: ${{ !cancelled() && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        env:
          FAMILY: vitest-report-attempt
          SUITE: tooling
          FIRST_OUTCOME: ${{ steps.vitest-report-attempt-1.outcome }}
          RETRY_OUTCOME: ${{ steps.vitest-report-attempt-1-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - name: Upload tooling coverage pair to GitHub (fallback attempt 1)
        id: coverage-fallback-1-1
        if: ${{ !cancelled() && inputs.publish_coverage_pair && steps.coverage-stamp-1.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-coverage-pair
        with:
          suite: tooling
      - name: Upload tooling coverage pair to GitHub (fallback attempt 2)
        id: coverage-fallback-2-1
        if: ${{ !cancelled() && inputs.publish_coverage_pair && steps.coverage-stamp-1.outcome == 'success' && steps.coverage-fallback-1-1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-coverage-pair
        with:
          suite: tooling
          name-suffix: -retry
      - name: Require a persisted tooling coverage pair
        id: coverage-outcome-1
        if: ${{ !cancelled() && inputs.publish_coverage_pair && steps.coverage-stamp-1.outcome == 'success' }}
        timeout-minutes: 1
        env:
          FAMILY: coverage-pair
          SUITE: tooling
          FIRST_OUTCOME: ${{ steps.coverage-fallback-1-1.outcome }}
          RETRY_OUTCOME: ${{ steps.coverage-fallback-2-1.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - name: Upload full tooling LCOV to GitHub (attempt 1)
        id: full-lcov-1
        if: ${{ inputs.publish_coverage }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-full-lcov
        with:
          suite: tooling
      - name: Upload full tooling LCOV to GitHub (attempt 2)
        id: full-lcov-1-retry
        if: ${{ inputs.publish_coverage && steps.full-lcov-1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-full-lcov
        with:
          suite: tooling
          name-suffix: -retry
      - name: Require a persisted full tooling LCOV
        id: full-lcov-outcome-1
        if: ${{ inputs.publish_coverage }}
        timeout-minutes: 1
        env:
          FAMILY: full-lcov
          SUITE: tooling
          FIRST_OUTCOME: ${{ steps.full-lcov-1.outcome }}
          RETRY_OUTCOME: ${{ steps.full-lcov-1-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"

  i18n-route-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-backend
        timeout-minutes: 10
      - name: Run i18n route bounds
        run: pnpm exec ./ci/with-node-test-options vitest run --bail=3 --project i18n-route-bounds
        timeout-minutes: 8
