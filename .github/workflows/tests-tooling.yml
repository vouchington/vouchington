name: Tooling Tests

on:
  workflow_call:
    inputs:
      run_tooling:
        description: 'Whether to run the regular tooling suite alongside i18n route bounds'
        required: false
        type: boolean
        default: true
      publish_coverage:
        description: 'Whether to collect coverage and publish the full LCOV for the area coverage gate and Codecov'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run_tooling:
        description: 'Whether to run the regular tooling suite alongside i18n route bounds'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  tooling:
    if: inputs.run_tooling
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-backend
        id: setup-backend
        timeout-minutes: 5
      - name: Install Gitleaks and Lychee for tooling tests
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
          install_args: aqua:gitleaks/gitleaks aqua:lycheeverse/lychee
        timeout-minutes: 3
      - name: Verify Gitleaks and Lychee are active for tooling tests
        run: gitleaks version && lychee --version
        timeout-minutes: 1
      - name: Run tooling tests
        env:
          VITEST_CI_REPORTERS: run
          VITEST_JUNIT_OUTPUT_FILE: tooling-test-report.junit.xml
          VITEST_COVERAGE_ENABLED: ${{ inputs.publish_coverage && 'true' || 'false' }}
        run: node ci/tooling-test-runner.mts --workflow-projects --bail=3
        timeout-minutes: 8
      - name: Upload tooling JUnit report
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          overwrite: true
          name: tooling-junit
          path: tooling-test-report.junit.xml
          retention-days: 1
          if-no-files-found: warn
      - name: Preserve full tooling LCOV
        if: ${{ !cancelled() && inputs.publish_coverage }}
        shell: bash
        run: |
          if [ -f coverage/lcov.info ]; then
            mkdir -p coverage-full
            cp coverage/lcov.info coverage-full/lcov.info
          fi
      - name: Upload full tooling LCOV to GitHub (attempt 1)
        id: full-lcov-1
        if: ${{ inputs.publish_coverage }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-full-lcov
        with:
          suite: tooling
      - name: Upload full tooling LCOV to GitHub (attempt 2)
        id: full-lcov-1-retry
        if: ${{ inputs.publish_coverage && steps.full-lcov-1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-full-lcov
        with:
          suite: tooling
          name-suffix: -retry
      - name: Require a persisted full tooling LCOV
        id: full-lcov-outcome-1
        if: ${{ inputs.publish_coverage }}
        timeout-minutes: 1
        env:
          FAMILY: full-lcov
          SUITE: tooling
          FIRST_OUTCOME: ${{ steps.full-lcov-1.outcome }}
          RETRY_OUTCOME: ${{ steps.full-lcov-1-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"

  i18n-route-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-backend
        timeout-minutes: 10
      - name: Run i18n route bounds
        run: pnpm exec ./ci/with-node-test-options vitest run --bail=3 --project i18n-route-bounds
        timeout-minutes: 8
