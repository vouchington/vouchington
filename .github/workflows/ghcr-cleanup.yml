name: GHCR Cleanup

# Reaps old runtime image versions. Merge groups publish ghcr.io/<owner>/<package>:sha-<commit>
# for backend and web, and main publishes only the images a merge group did not. GHCR is only a
# transfer medium: vouchington-infra copies each deployed main revision into ECR by digest, and
# both deployment and rollback read from ECR, so deleting an old GHCR version cannot affect a
# running service.
#
# Retention policy is supplied by the published vouchington-tooling script.

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete the selected versions instead of listing them'
        required: false
        type: boolean
        default: false

concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-slim
    # 11, not 15: slim enforces a hard 15-minute platform cap, and a job that reaches it is
    # killed by the platform rather than cancelled by GitHub, so nothing that runs on
    # cancellation gets a chance to. The package install and registry reads are bounded below.
    timeout-minutes: 11
    permissions:
      contents: read
      # Write includes the read access required for OCI manifest inspection.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          # The policy classifies each image by whether main reaches its commit, so it needs main's
          # full history even when an operator dispatches from another branch.
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@363be39a57dfa5801e05c6e0c549d622a376cf15 # v7
        timeout-minutes: 1
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Resolve pnpm version
        id: pnpm-version
        uses: vouchington/vouchington-tooling/.github/actions/resolve-pnpm-version@6569fcf1d4e98120ba0b06654767ea91ed8fb159 # v0.76.0
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        timeout-minutes: 1
        with:
          node-version-file: 'false'
          install: false
          cache: false
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Install published tooling scripts
        timeout-minutes: 2
        run: ci/install-vouchington-tooling.sh "$RUNNER_TEMP/vouchington-tooling" package.json

      - name: Prune published container package versions
        timeout-minutes: 9
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_OWNER_TYPE: org
          GHCR_PACKAGES: api worker-cpu worker-io web
          GHCR_KEEP_MAIN: '30'
          GHCR_UNMERGED_MIN_AGE_DAYS: '7'
          # A scheduled run prunes. A manual run lists what it would prune unless asked otherwise,
          # so an operator can see the effect before causing it.
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          set -euo pipefail
          if [ "$APPLY" = 'true' ]; then
            bash "$RUNNER_TEMP/vouchington-tooling/node_modules/vouchington-tooling/scripts/gha/ghcr-package-retention.sh" --main-history --apply
          else
            bash "$RUNNER_TEMP/vouchington-tooling/node_modules/vouchington-tooling/scripts/gha/ghcr-package-retention.sh" --main-history --dry-run
          fi
