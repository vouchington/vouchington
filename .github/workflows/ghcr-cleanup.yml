name: GHCR Cleanup

# Keeps the newest 30 main-reachable runtime versions, prunes older main versions and eligible old
# queue images, and protects uncertain content. See docs/development/ci.md for the policy.

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete the selected versions instead of listing them'
        required: false
        type: boolean
        default: false

concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # Preserve the cleanup workflow's existing 14-minute outer ceiling.
    timeout-minutes: 14
    permissions:
      contents: read
      # Deleting a package version requires write, not read.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Log in to GHCR
        timeout-minutes: 1
        env:
          GHCR_PASSWORD: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: printf '%s' "$GHCR_PASSWORD" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Prune published container package versions
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_PASSWORD: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          # A scheduled run prunes. A manual run lists what it would prune unless asked otherwise,
          # so an operator can see the effect before causing it.
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          set -euo pipefail
          if [ "$APPLY" = 'true' ]; then
            ./ci/ghcr-package-retention.sh --apply
          else
            ./ci/ghcr-package-retention.sh --dry-run
          fi

      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io >/dev/null 2>&1 || true
