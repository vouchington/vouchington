name: Record CI state

on:
  workflow_call:
    inputs:
      producer-results: { required: true, type: string }
      tested-sha: { required: true, type: string }
      head-sha: { required: true, type: string }
      pr-number: { required: true, type: string }
      processing-result: { required: true, type: string }
      deferred: { required: true, type: string }

permissions: {}

jobs:
  record-state:
    runs-on: [self-hosted]
    timeout-minutes: 1
    permissions: {}
    env:
      BASH_ENV: /dev/null
    steps:
      - name: Record producer state
        shell: bash
        env:
          PRODUCER_RESULTS: ${{ inputs.producer-results }}
          TESTED_SHA: ${{ inputs.tested-sha }}
          HEAD_SHA: ${{ inputs.head-sha }}
          PR_NUMBER: ${{ inputs.pr-number }}
          PROCESSING_RESULT: ${{ inputs.processing-result }}
          DEFERRED: ${{ inputs.deferred }}
        run: |
          jq -ce \
            --arg tested "$TESTED_SHA" \
            --arg head "$HEAD_SHA" \
            --argjson pr "$PR_NUMBER" \
            --arg processing "$PROCESSING_RESULT" \
            --argjson deferred "$DEFERRED" \
            '{version:"ci-state:v1", prNumber:$pr, headSha:$head, testedSha:$tested, processingResult:$processing, deferred:$deferred, producers: with_entries(.value |= .result)}' \
            <<< "$PRODUCER_RESULTS" > "$RUNNER_TEMP/ci-state.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        continue-on-error: true
        with:
          name: ci-state-${{ inputs.tested-sha }}
          path: ${{ runner.temp }}/ci-state.json
          retention-days: 1
          overwrite: true
