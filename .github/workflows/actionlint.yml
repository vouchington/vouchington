name: GitHub Actions Static Analysis

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
      - '.github/actionlint.yaml'
      - '.github/actionlint.yml'
      - '.github/zizmor.yml'
      - '.github/zizmor.yaml'
      - '.mise.toml'
      - 'ci/curl-to.sh'
      - 'ci/exec-vouchington-gha.sh'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    uses: vouchington/vouchington-tooling/.github/workflows/actionlint.yml@6737be4e624b133e3c514cfc3bd83398f4301c9b # v0.87.0
