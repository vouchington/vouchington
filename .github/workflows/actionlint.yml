name: GitHub Actions Static Analysis

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
      - '.github/actionlint.yaml'
      - '.github/actionlint.yml'
      - '.github/zizmor.yml'
      - '.github/zizmor.yaml'
      - '.mise.toml'
      - 'ci/curl-to.sh'
      - 'ci/exec-vouchington-gha.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
      - '.github/actionlint.yaml'
      - '.github/actionlint.yml'
      - '.github/zizmor.yml'
      - '.github/zizmor.yaml'
      - '.mise.toml'
      - 'ci/curl-to.sh'
      - 'ci/exec-vouchington-gha.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install CI tools via mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        # cache: false — actions/cache hangs on self-hosted runners;
        # ~/.local/share/mise persists across runs via workspace preservation instead.
        with:
          cache: false
        timeout-minutes: 3

      - name: Run actionlint
        # actionlint 1.7.12 does not yet recognize GitHub's concurrency.queue field.
        run: actionlint -ignore 'unexpected key "queue" for "concurrency" section'

      - name: Audit GitHub Actions security
        run: zizmor --offline --min-severity high --min-confidence high .
        timeout-minutes: 2
