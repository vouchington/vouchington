name: Publish Web Images

on:
  workflow_call:
    inputs:
      trusted_secret_context:
        description: 'Whether this run may use repository secrets and OIDC roles'
        required: false
        type: boolean
        default: false
    secrets:
      AWS_TEST_ROLE_ARN:
        required: true
      SENTRY_AUTH_TOKEN:
        required: false

# Pull requests only validate the image. A merge group publishes and attests it as advisory work: a
# registry or attestation failure there must not eject unrelated queued PRs. A main push reuses the
# merge group's image and builds only if it is missing or unattested. The build job has no
# permissions declaration, so it inherits whatever the caller granted: read-only for a PR, write for
# a merge group or main. The resolver asks for read access only.
#
# There is no concurrency block because each run publishes only its own immutable sha-<commit> tag.

jobs:
  resolve-main-images:
    if: >-
      inputs.trusted_secret_context &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      packages: read
    outputs:
      missing_targets: ${{ steps.resolve.outputs.missing_targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false

      - name: Authenticate GHCR
        timeout-minutes: 1
        env:
          REGISTRY_PASSWORD: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_PASSWORD" | docker login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin

      - name: Resolve merge-queue web image
        id: resolve
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/resolve-published-images.sh web

      - name: Log out of GHCR
        timeout-minutes: 1
        if: ${{ always() }}
        run: docker logout ghcr.io >/dev/null 2>&1 || true

  build:
    needs: resolve-main-images
    if: >-
      !cancelled() &&
      inputs.trusted_secret_context &&
      (
        (github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/')) ||
        (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/')) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.resolve-main-images.result == 'success' && needs.resolve-main-images.outputs.missing_targets != '[]')
      )
    runs-on: ubuntu-24.04-arm
    # The publish path runs everything a validation run does and then pushes the web image to
    # GHCR, so it gets its own ceiling rather than shaving the validation path's margin to fit.
    timeout-minutes: 23
    env:
      IMAGE_REPOSITORY: voucha-validation
      SHA_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: vouchington/vouchington-tooling/.github/actions/setup-aws@e4f21b79d1398af8dd76c70f0775ded58f0c4f80 # v2.0.1
        timeout-minutes: 2
        with:
          role-arn: ${{ secrets.AWS_TEST_ROLE_ARN }}
          aws-region: us-west-2
          action-timeout-s: 90

      # Only a publishing run uploads source maps and names a Sentry release.
      - uses: ./.github/actions/build-web-images
        timeout-minutes: 12
        with:
          next-public-asset-prefix: ${{ vars.NEXT_PUBLIC_ASSET_PREFIX }}
          sentry-auth-token: ${{ (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && secrets.SENTRY_AUTH_TOKEN || '' }}
          sentry-source-map-upload: ${{ (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && secrets.SENTRY_AUTH_TOKEN != '' && 'true' || 'false' }}
          sentry-release: ${{ (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && github.sha || '' }}

      # Deliberately the last build step in the job. Everything published here has already passed the
      # Docker smoke test and the Trivy CRITICAL/HIGH gate, so the image that reaches the registry
      # is the image that was tested -- which is the whole point of publishing from this
      # repository rather than rebuilding somewhere else.
      #
      # The image is pushed from the local daemon rather than built with a registry output, which
      # would upload it before any of those checks had run.
      - name: Publish validated web image to GHCR
        id: publish
        continue-on-error: ${{ github.event_name == 'merge_group' }}
        # success() is explicit rather than implicit: this is a publication gate, and a reader
        # should not have to know that GitHub ANDs it in for conditions without a status function.
        if: ${{ success() && (github.event_name == 'merge_group' || github.event_name == 'push') }}
        timeout-minutes: 5
        env:
          GHCR_NAMESPACE: ghcr.io/${{ github.repository_owner }}
          IMAGE_TAG: ${{ env.SHA_TAG }}
          REGISTRY_PASSWORD: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: bash --noprofile --norc -e -o pipefail .github/actions/build-web-images/publish-image.sh

      - name: Attest web image provenance
        id: attest-web
        continue-on-error: ${{ github.event_name == 'merge_group' }}
        timeout-minutes: 2
        if: ${{ success() && steps.publish.outputs.web_digest != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/web
          subject-digest: ${{ steps.publish.outputs.web_digest }}
          create-storage-record: false
          push-to-registry: true

      # continue-on-error hides the failure from the job result, so surface it as an annotation.
      - name: Report advisory merge-group publication failure
        timeout-minutes: 1
        if: ${{ always() && github.event_name == 'merge_group' && (steps.publish.outcome == 'failure' || steps.attest-web.outcome == 'failure') }}
        run: echo "::warning::Merge-group GHCR publication or attestation failed; main rebuilds any image that is missing or unattested before deploy."

      - name: Log out of GHCR
        timeout-minutes: 1
        if: ${{ always() }}
        run: docker logout ghcr.io >/dev/null 2>&1 || true
