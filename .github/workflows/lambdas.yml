name: Lambdas

# Area workflow: when `changes` selects the Lambdas area, its static checks gate the full Lambdas
# suite. The `lambdas` job is the required check; it passes when the area is skipped. nightly.yml
# calls this workflow for the full run. See docs/development/ci.md.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  workflow_call:
  workflow_dispatch:

# A literal prefix: under workflow_call, github.workflow names the caller, which would collide the
# area calls nightly.yml makes.
concurrency:
  group: lambdas-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  changes:
    uses: ./.github/workflows/ci-detect-changes.yml
    permissions:
      contents: read
      pull-requests: read

  static-lambdas:
    needs: [changes]
    if: needs.changes.outputs.area-lambdas == 'true'
    uses: ./.github/workflows/checks-static.yml
    with:
      lambdas: true
    permissions:
      actions: read
      contents: read

  test-lambdas:
    needs: [static-lambdas]
    uses: ./.github/workflows/tests-lambdas.yml
    with:
      publish_coverage: true
    permissions:
      actions: read
      contents: read

  coverage:
    needs: [static-lambdas, test-lambdas]
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.static-lambdas.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/ci-area-coverage.yml
    with:
      area: lambdas
    permissions:
      actions: read
      contents: read

  # Informational; the `lambdas` gate does not wait on it.
  codecov:
    needs: [test-lambdas]
    if: ${{ !cancelled() && needs.test-lambdas.result == 'success' }}
    uses: ./.github/workflows/ci-upload-codecov.yml
    with:
      uploads: >-
        [{"flag":"lambdas","pattern":"lcov-full-lambdas*"}]
    permissions:
      actions: read
      contents: read
      id-token: write

  lambdas:
    name: lambdas
    if: ${{ !cancelled() || github.event_name == 'merge_group' }}
    needs: [changes, static-lambdas, test-lambdas, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASH_ENV: /dev/null
    permissions:
      contents: read
    steps:
      - uses: vouchington/vouchington-tooling/.github/actions/ci-required-result-gate@e4f21b79d1398af8dd76c70f0775ded58f0c4f80 # v2.0.1
        timeout-minutes: 1
        with:
          results: >-
            {"changes":{"result":"${{ needs.changes.result }}"},"static-lambdas":{"result":"${{ needs.static-lambdas.result }}"},"test-lambdas":{"result":"${{ needs.test-lambdas.result }}"},"coverage":{"result":"${{ needs.coverage.result }}"}}

  # Merge-group fail fast: when a gate-feeding suite fails, cancel this run so the required gate
  # fails on that job now instead of after the slowest suite. These jobs check out nothing and run no
  # repository code, so the `actions: write` token never meets pull-request-controlled content. See
  # docs/development/ci/workflows/reference-merge-queue-fail-fast.md.

  cancel-test-lambdas:
    needs: [test-lambdas]
    if: ${{ failure() && needs.test-lambdas.result == 'failure' && github.event_name == 'merge_group' }}
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Cancel the merge-group run so the queue ejects this entry now
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          output=$(gh api --method POST "repos/$GH_REPO/actions/runs/$RUN_ID/cancel" 2>&1) && exit 0
          [[ "$output" == *"HTTP 409"* ]] && echo "::warning::Run $RUN_ID already finished: $output" && exit 0
          echo "$output" >&2; exit 1
