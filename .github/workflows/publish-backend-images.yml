name: Publish Backend Images

on:
  workflow_call:
    inputs:
      trusted_secret_context:
        description: 'Whether this run may use repository secrets and OIDC roles'
        required: false
        type: boolean
        default: false
    secrets:
      AWS_TEST_ROLE_ARN:
        required: true

# Pull requests only validate the images. Merge groups publish and attest them. A main push reuses
# the merge group's images and builds only the ones that are missing. The build job has no
# permissions declaration, so it inherits whatever the caller granted: read-only for a PR, write for
# a merge group or main. The resolver asks for read access only.
#
# There is no concurrency block because each run publishes only its own immutable sha-<commit> tags.

jobs:
  resolve-main-images:
    if: >-
      inputs.trusted_secret_context &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      missing_targets: ${{ steps.resolve.outputs.missing_targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate GHCR
        timeout-minutes: 1
        env:
          REGISTRY_PASSWORD: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_PASSWORD" | docker login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin

      - name: Resolve merge-queue backend images
        id: resolve
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/resolve-published-images.sh backend

      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io >/dev/null 2>&1 || true

  build:
    needs: resolve-main-images
    if: >-
      !cancelled() &&
      inputs.trusted_secret_context &&
      (
        (github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/')) ||
        (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/')) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.resolve-main-images.result == 'success' && needs.resolve-main-images.outputs.missing_targets != '[]')
      )
    runs-on: ubuntu-24.04-arm
    # The publish path runs everything a validation run does and then pushes ~1.3 GiB to GHCR, so
    # it gets its own ceiling rather than shaving the validation path's margin to fit. #31 moved
    # this job from 8 vCPU to 2 at the same 20-minute ceiling, so that margin is thinner than it
    # looks and is not the place to find room for a registry push.
    timeout-minutes: 30
    services:
      valkey:
        image: valkey/valkey-bundle:9.1.0@sha256:16004aceeb7a1246e2d1bb85d353e38120eb440951cb7d0c971b6d63fda5b3d7
        ports:
          - 6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 1s
    env:
      IMAGE_REPOSITORY: voucha-validation
      SHA_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-aws
        timeout-minutes: 2
        with:
          role-arn: ${{ secrets.AWS_TEST_ROLE_ARN }}

      - id: build
        uses: ./.github/actions/build-backend-images

      # Deliberately the last build step in the job. Everything published here has already passed the
      # API, worker-cpu and worker-io smoke tests and the Trivy CRITICAL/HIGH gate, so the image
      # that reaches the registry is the image that was tested -- which is the whole point of
      # publishing from this repository rather than rebuilding somewhere else.
      #
      # The images are pushed from the local daemon rather than built with a registry output,
      # which would upload them before any of those checks had run.
      - name: Publish validated backend images to GHCR
        id: publish
        # success() is explicit rather than implicit: this is a publication gate, and a reader
        # should not have to know that GitHub ANDs it in for conditions without a status function.
        if: ${{ success() && (github.event_name == 'merge_group' || github.event_name == 'push') }}
        timeout-minutes: 8
        env:
          ACTIVE_WORKER_IMAGES: ${{ steps.build.outputs.active_worker_images }}
          GHCR_NAMESPACE: ghcr.io/${{ github.repository_owner }}
          IMAGE_TAG: ${{ env.SHA_TAG }}
          MISSING_TARGETS: ${{ needs.resolve-main-images.outputs.missing_targets }}
          REGISTRY_PASSWORD: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail

          # A main push publishes only what the merge group did not; a merge group publishes all.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            targets=$(jq -r '.[]' <<<"$MISSING_TARGETS")
          else
            targets="api $ACTIVE_WORKER_IMAGES"
          fi

          printf '%s' "$REGISTRY_PASSWORD" |
            docker login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin

          {
            echo "## Published backend images"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          for target in $targets; do
            local_image="$IMAGE_REPOSITORY/$target:$IMAGE_TAG"
            remote_image="$GHCR_NAMESPACE/$target:$IMAGE_TAG"
            docker tag "$local_image" "$remote_image"

            # The digest is read back from the push output rather than from `docker image
            # inspect`, whose RepoDigests can carry entries for other repositories.
            push_output=$(docker push "$remote_image")
            printf '%s\n' "$push_output"
            digest=$(printf '%s\n' "$push_output" |
              sed -n 's/.*[[:space:]]digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | head -1)
            if [ -z "$digest" ]; then
              echo "::error::$remote_image was pushed but no digest could be read back."
              exit 1
            fi

            case "$target" in
              api) output_name=api_digest ;;
              worker-cpu) output_name=worker_cpu_digest ;;
              worker-io) output_name=worker_io_digest ;;
              *) echo "::error::Unexpected backend image target: $target" ; exit 1 ;;
            esac
            printf '%s=%s\n' "$output_name" "$digest" >> "$GITHUB_OUTPUT"

            echo "✓ published $remote_image ($digest)"
            echo "- \`$remote_image\` — \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Attest api image provenance
        if: ${{ success() && steps.publish.outputs.api_digest != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/api
          subject-digest: ${{ steps.publish.outputs.api_digest }}
          create-storage-record: false
          push-to-registry: true

      - name: Attest worker-cpu image provenance
        if: ${{ success() && steps.publish.outputs.worker_cpu_digest != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/worker-cpu
          subject-digest: ${{ steps.publish.outputs.worker_cpu_digest }}
          create-storage-record: false
          push-to-registry: true

      - name: Attest worker-io image provenance
        if: ${{ success() && steps.publish.outputs.worker_io_digest != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/worker-io
          subject-digest: ${{ steps.publish.outputs.worker_io_digest }}
          create-storage-record: false
          push-to-registry: true

      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io >/dev/null 2>&1 || true
