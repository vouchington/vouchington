name: CI Codecov upload

on:
  workflow_call:

permissions: {}

jobs:
  upload-codecov:
    name: Codecov
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - id: codecov-checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download full LCOV artifacts from GitHub
        id: download-full-lcov
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: lcov-full-*
          path: ./lcov-full-fallback
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Upload full LCOV to Codecov (informational)
        if: "!cancelled() && steps.codecov-checkout.outcome == 'success' && steps.download-full-lcov.outcome == 'success'"
        continue-on-error: true
        timeout-minutes: 3
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: ./lcov-full-fallback
          disable_search: false
          fail_ci_if_error: false
          use_oidc: true
