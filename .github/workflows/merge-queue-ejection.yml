name: Automation Merge Queue Ejection
run-name: 'Merge queue ejection #${{ github.event.pull_request.number }} (${{ github.event.reason }})'

# Triggered when the merge queue removes a pull request because its merge-group CI failed or timed
# out. Dispatches one queue-wide Auto Harness session: an ejection while it is queued or running
# joins it instead of starting another. The session triages every untriaged ejection of the last
# day from main, groups them by root cause, and explains each stack layer removed with them. Per
# root cause it fixes a flaky test in a new PR, files a CI or architecture issue, or comments its
# analysis on the ejected PRs. The session never changes an ejected PR.
#
# pull_request_target runs this file from main with main's GITHUB_SHA. The escalation job checks
# out only github.workflow_sha to source this workflow's trusted shell body. No job checks out,
# installs, or executes pull-request content; PR fields reach the session only as prompt text.

on:
  pull_request_target:
    types: [dequeued]
    branches: [main]

concurrency:
  group: merge-queue-ejection-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render-prompt:
    name: Render automation prompt
    if: >-
      vars.HARNESS_DISPATCH_ENABLED == 'true' &&
      vars.HARNESS_MERGE_QUEUE_EJECTION_ENABLED == 'true' &&
      contains(fromJSON('["CI_FAILURE","CI_TIMEOUT"]'), github.event.reason)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      prompt: ${{ steps.render.outputs.prompt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: vouchington/vouchington-tooling/.github/actions/setup-node-pnpm@102b3d948645b8f6ad9fc361d8681bfc55081551 # v0.85.1
        timeout-minutes: 5
        with:
          deadline-seconds: '270'

      - name: Render prompt
        timeout-minutes: 2
        id: render
        uses: jonathanong/auto-harness/actions/harness-render-prompt@8325525ec675f738a3969cb92ce20477f38dcf71 # v1.0.2
        with:
          template: docs/prompts/automation/merge-queue-ejection.md
          merge-authority-doc: docs/development/merge-authority.md
          var-files: |
            CI_FAILURE_CORE=docs/prompts/automation/ci-failure-core.md
          vars: |
            REPOSITORY=${{ github.repository }}
            PR_NUMBER=${{ github.event.pull_request.number }}
            PR_URL=${{ github.event.pull_request.html_url }}
            PR_HEAD_SHA=${{ github.event.pull_request.head.sha }}
            REASON=${{ github.event.reason }}
            MAIN_SHA=${{ github.sha }}

  dispatch:
    name: Harness dispatch
    needs: [render-prompt]
    uses: vouchington/vouchington-tooling/.github/workflows/harness-dispatch.yml@102b3d948645b8f6ad9fc361d8681bfc55081551 # v0.85.1
    permissions:
      contents: read
    secrets:
      HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
    with:
      surface-gate: HARNESS_MERGE_QUEUE_EJECTION_ENABLED
      agent-ref: ${{ github.sha }}
      expected-head-sha: ${{ github.sha }}
      concurrency-id: vouchington:mq-eject
      completion-mode: pr-issue-or-comment
      publish-contract: merge-queue-ejection
      publish-base-ref: main
      pr-label: automation:auto-fix
      slack-source: |
        *Source:* merge queue removed PR #${{ github.event.pull_request.number }} (`${{ github.event.reason }}`); the session triages every untriaged ejection
        *Seed pull request:* ${{ github.event.pull_request.html_url }}
        *Main tip:* `${{ github.sha }}`
      prompt: ${{ needs.render-prompt.outputs.prompt }}

  comment-session:
    name: Comment session link
    needs: [dispatch]
    if: needs.dispatch.result == 'success' && needs.dispatch.outputs.session-url != ''
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: vouchington/vouchington-tooling/.github/actions/comment-harness-session@102b3d948645b8f6ad9fc361d8681bfc55081551 # v0.85.1
        timeout-minutes: 1
        with:
          target: ${{ github.event.pull_request.number }}
          session-id: ${{ needs.dispatch.outputs.session-id }}
          session-url: ${{ needs.dispatch.outputs.session-url }}

  escalate:
    name: Comment failure on pull request
    needs: [render-prompt, dispatch]
    if: >-
      always() &&
      (
        needs.render-prompt.result == 'failure' ||
        needs.render-prompt.result == 'cancelled' ||
        needs.dispatch.result == 'failure' ||
        needs.dispatch.result == 'cancelled'
      )
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REASON: ${{ github.event.reason }}
      SESSION_ID: ${{ needs.dispatch.outputs.session-id }}
      DISPATCH_RESULT: ${{ needs.dispatch.result }}
      THIS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Comment failure on the ejected pull request
        timeout-minutes: 1
        run: source .github/workflows/merge-queue-ejection/escalate.sh
