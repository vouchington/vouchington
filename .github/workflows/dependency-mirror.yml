name: CI dependency mirror

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-dependency-mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 29
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: main
          persist-credentials: false

      - name: Install checksum-verified regctl
        timeout-minutes: 2
        env:
          REGCTL_PATH: ${{ runner.temp }}/regctl-v0.11.7-linux-amd64
        run: source "$GITHUB_WORKSPACE/.github/workflows/dependency-mirror-install-regctl.sh"

      - name: Stage and publish reviewed image digests
        timeout-minutes: 26
        env:
          REGCTL: ${{ runner.temp }}/regctl-v0.11.7-linux-amd64
          GHCR_TOKEN: ${{ github.token }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: source "$GITHUB_WORKSPACE/.github/workflows/dependency-mirror-publish.sh"

      - name: Report mirror failure
        if: failure()
        timeout-minutes: 1
        run: |
          echo '::error::CI dependency mirror failed; inspect the failed stage before adopting or changing any consumed digest.'
          echo 'CI dependency mirror failed. The approved digest tags were not advanced for any failed image.' >> "$GITHUB_STEP_SUMMARY"
