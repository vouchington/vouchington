name: Static Checks

# Area-gated, non-Vitest gates (dependency-cruiser, `next build`, smoke,
# `wrangler --dry-run`) lifted out of the per-area Vitest workflows so they run
# independently of the sharded Vitest jobs. API fixture snapshot regeneration belongs
# to the static backend gate. See docs/development/ci.md.

on:
  workflow_call:
    inputs:
      backend:
        type: boolean
        default: false
      web:
        type: boolean
        default: false
      lambdas:
        type: boolean
        default: false
      cloudflare-worker:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      backend:
        type: boolean
        default: true
      web:
        type: boolean
        default: true
      lambdas:
        type: boolean
        default: true
      cloudflare-worker:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  static-backend:
    if: inputs.backend
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      actions: read
      contents: read
    services:
      valkey:
        image: valkey/valkey-bundle:9.1.0@sha256:16004aceeb7a1246e2d1bb85d353e38120eb440951cb7d0c971b6d63fda5b3d7
        ports:
          - 6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /data:rw,size=64m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
        id: setup-backend
        timeout-minutes: 5
      - name: Check backend dependencies
        run: pnpm exec depcruise --config backend/.dependency-cruiser.cjs --output-type err --cache --cache-strategy content backend ts-shared
        timeout-minutes: 2
      - name: Check PostgreSQL contracts, API fixtures, and MCP catalog
        run: |
          pnpm run backend-row-contracts:check
          pnpm run api-fixtures:check
          export NODE_ENV=test
          export VALKEY_URL=redis://localhost:${{ job.services.valkey.ports['6379'] }}
          export S3_BUCKET_IMAGES=test-images
          export S3_BUCKET_IMAGE_UPLOADS=test-image-uploads
          export S3_BUCKET_SITEMAPS=test-sitemaps
          export S3_BUCKET_RENDERS=test-renders
          export S3_BUCKET_ASSETS=test-assets
          export S3_BUCKET_CRAWLS=test-crawls
          export S3_BUCKET_USER_EXPORTS=test-user-exports
          export S3_BUCKET_QUARANTINE=test-quarantine
          node ci/check-live-mcp-catalog.mjs
          pnpm run mcp:catalog -- --check
        timeout-minutes: 4
      - name: Check canonical API snapshot git state
        shell: bash
        run: |
          git diff --exit-code -- api-fixtures/v1/manifest.json api-fixtures/v1/schema-lock.json api-fixtures/v1/responses api-fixtures/v1/request-contracts.json
          untracked_generated_files="$(git ls-files --others --exclude-standard -- api-fixtures/v1/manifest.json api-fixtures/v1/schema-lock.json api-fixtures/v1/responses api-fixtures/v1/request-contracts.json)"
          if [ -n "$untracked_generated_files" ]; then
            echo "::error::Generated API fixture files are untracked:"
            printf '%s\n' "$untracked_generated_files"
            exit 1
          fi
        timeout-minutes: 1

  static-web:
    if: inputs.web
    # The standalone build includes native packages (sharp) and its cache key includes runner.arch, so
    # every consumer (integration, Playwright, credentialed Playwright) must run on this runner arch
    # or it misses the cache and rebuilds in each shard. Move them together.
    runs-on: ubuntu-24.04-arm
    # Fail-fast budget: every Web suite waits on this job, which healthy runs finish in under 4
    # minutes. Step ceilings sum past this cap; see the CI job timeout budgets reference.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
        timeout-minutes: 5
      - name: Next.js pages-router check
        timeout-minutes: 1
        run: |
          if [ -d web/pages ] || [ -d web/src/pages ]; then
            echo "::error::Pages Router directory found (Next.js pages router not allowed)"
            exit 1
          fi
          echo "No pages router directory found"
      - name: Check web dependencies
        run: pnpm exec depcruise --config web/.dependency-cruiser.cjs --output-type err --cache --cache-strategy content web
        timeout-minutes: 2
      - uses: ./.github/actions/build-web-targets
        timeout-minutes: 6
        with:
          artifact-suffix: static-web
          shared-build-cache-mode: producer
          web-build-fs-cache-enabled: ${{ vars.WEB_BUILD_FS_CACHE_ENABLED }}
      - name: Smoke test web
        run: ./web/scripts/tests/smoke-test-web.sh
        timeout-minutes: 2
        env:
          IMAGE_ORIGIN: http://localhost:3100

  static-lambdas:
    if: inputs.lambdas
    # The Lambda architecture, so the deployment package smoke test loads the sharp binary it ships.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
        timeout-minutes: 5
      - name: Check lambda dependencies
        run: pnpm exec depcruise --config lambdas/.dependency-cruiser.cjs --output-type err --cache --cache-strategy content lambdas
        timeout-minutes: 2
      - name: Smoke test image lambda
        run: ./lambdas/image-resize/scripts/tests/smoke-test-image-lambda.sh
        timeout-minutes: 2
      - name: Build the image-resize deployment package
        run: pnpm --filter @lambdas/image-resize run build
        timeout-minutes: 3
      - name: Smoke test the image-resize deployment package
        run: pnpm --filter @lambdas/image-resize run test:smoke:package
        timeout-minutes: 2

  static-cloudflare:
    if: inputs.cloudflare-worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
        timeout-minutes: 5
      - name: Smoke test Cloudflare Worker runtime
        working-directory: cloudflare-worker
        run: |
          printf '%s\n' 'CSP_BROWSER_UPLOAD_ORIGINS=["https://test-images.s3.us-west-2.amazonaws.com","https://test-images.s3.dualstack.us-west-2.amazonaws.com"]' > .dev.vars
          ./scripts/tests/smoke-test-cloudflare-worker.sh
        timeout-minutes: 2
      - name: Validate Cloudflare Worker bundle
        working-directory: cloudflare-worker
        run: pnpm exec wrangler deploy --config wrangler.local.jsonc --dry-run --outdir "${RUNNER_TEMP}/cloudflare-worker-dry-run"
        timeout-minutes: 2
