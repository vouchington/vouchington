name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  detect-changes:
    uses: ./.github/workflows/ci-detect-changes.yml
    permissions:
      contents: read
      pull-requests: read
  static-code-analysis:
    needs: [detect-changes]
    if: '!cancelled()'
    uses: ./.github/workflows/static-code-analysis.yml
    with:
      docs_only: ${{ needs.detect-changes.outputs.docs-only == 'true' }}
    permissions:
      contents: read

  # Area-gated static gates (typecheck/depcruise/build/smoke) lifted off the
  # per-area Vitest jobs into their own jobs, gated on detect-changes. See
  # .github/workflows/checks-static.yml.
  static-backend:
    needs: [detect-changes, static-code-analysis]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.docs-only != 'true' &&
      needs.static-code-analysis.result == 'success' &&
      (
        (github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true') ||
        needs.detect-changes.outputs.backend == 'true' ||
        (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')
      )
    uses: ./.github/workflows/checks-static.yml
    with:
      backend: true
    permissions:
      contents: read
      actions: read

  static-web:
    needs: [detect-changes, static-code-analysis]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.docs-only != 'true' &&
      needs.static-code-analysis.result == 'success' &&
      (
        (github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true') ||
        needs.detect-changes.outputs.web == 'true' ||
        needs.detect-changes.outputs.web-integration == 'true' ||
        needs.detect-changes.outputs.playwright == 'true' ||
        needs.detect-changes.outputs.playwright-credentialed == 'true' ||
        (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')
      )
    uses: ./.github/workflows/checks-static.yml
    with:
      web: true
    permissions:
      contents: read
      actions: read

  static-lambdas:
    needs: [detect-changes, static-code-analysis]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.docs-only != 'true' &&
      needs.static-code-analysis.result == 'success' &&
      (
        (github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true') ||
        needs.detect-changes.outputs.lambdas == 'true' ||
        (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')
      )
    uses: ./.github/workflows/checks-static.yml
    with:
      lambdas: true
    permissions:
      contents: read
      actions: read

  static-cloudflare-worker:
    needs: [detect-changes, static-code-analysis]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.docs-only != 'true' &&
      needs.static-code-analysis.result == 'success' &&
      (
        (github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true') ||
        needs.detect-changes.outputs.cloudflare-worker == 'true' ||
        (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')
      )
    uses: ./.github/workflows/checks-static.yml
    with:
      cloudflare-worker: true
    permissions:
      contents: read
      actions: read

  initialize-smoke-test:
    needs: [detect-changes, static-code-analysis]
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true' || needs.detect-changes.outputs.shell-scripts == 'true' || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.detect-changes.outputs.docs-only != 'true' &&
      needs.static-code-analysis.result == 'success'
    uses: ./.github/workflows/initialize-smoke-test.yml
    permissions:
      contents: read

  test-ts-shared:
    needs: [detect-changes, static-code-analysis]
    if: >-
      !cancelled() &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true' || github.event_name == 'merge_group') || (needs.detect-changes.outputs.ts-shared == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success'
    uses: ./.github/workflows/tests-ts-shared.yml
    with:
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
    permissions:
      actions: read
      contents: read

  test-tooling:
    needs: [detect-changes, static-code-analysis]
    if: >-
      !cancelled() &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true' || github.event_name == 'merge_group') || (needs.detect-changes.outputs.tooling == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success'
    uses: ./.github/workflows/tests-tooling.yml
    with:
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
    permissions:
      actions: read
      contents: read

  test-backend-modules:
    needs: [detect-changes, static-code-analysis, static-backend]
    if: >-
      !cancelled() &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true' || github.event_name == 'merge_group') || (needs.detect-changes.outputs.backend == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-backend.result == 'success' || needs.static-backend.result == 'skipped')
    uses: ./.github/workflows/tests-backend-modules.yml
    with:
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
    permissions:
      contents: read
      actions: read

  test-backend-unit:
    needs: [detect-changes, static-code-analysis, static-backend]
    if: >-
      !cancelled() &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true' || github.event_name == 'merge_group') || (needs.detect-changes.outputs.backend == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-backend.result == 'success' || needs.static-backend.result == 'skipped')
    uses: ./.github/workflows/tests-backend-unit.yml
    with:
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
    permissions:
      contents: read
      actions: read

  backend-smoke:
    needs: [detect-changes, static-backend]
    if: >-
      !cancelled() &&
      (needs.static-backend.result == 'success' || needs.static-backend.result == 'skipped') &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true' || github.event_name == 'workflow_dispatch') ||
      github.event_name == 'merge_group' ||
      (needs.detect-changes.outputs.backend == 'true' && needs.detect-changes.outputs.docs-only != 'true') ||
      (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false'))
    uses: ./.github/workflows/checks-backend-smoke.yml
    permissions:
      contents: read
      actions: read

  test-backend-credentialed:
    needs: [detect-changes, static-code-analysis, static-backend]
    if: >-
      !cancelled() &&
      (github.event_name == 'merge_group' || needs.detect-changes.outputs.docs-only != 'true' || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success' &&
      needs.detect-changes.outputs.trusted-secret-context == 'true' &&
      (needs.static-backend.result == 'success' || needs.static-backend.result == 'skipped') &&
      (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && needs.detect-changes.outputs.workflow-action-changes == 'true') || (github.ref == 'refs/heads/main' && needs.detect-changes.outputs.backend == 'true') || needs.detect-changes.outputs.backend-credentialed == 'true' || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false'))
    uses: ./.github/workflows/tests-backend-credentialed.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      trusted_secret_context: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' }}
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
    secrets:
      AWS_TEST_ROLE_ARN: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' && secrets.AWS_TEST_ROLE_ARN || '' }}
      OPENAI_API_KEY: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' && secrets.OPENAI_API_KEY || '' }}
      OPENROUTER_API_KEY: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' && secrets.OPENROUTER_API_KEY || '' }}
      STRIPE_SECRET_KEY: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' && secrets.STRIPE_SECRET_KEY || '' }}

  test-postgres-schema:
    needs: [detect-changes, static-code-analysis, static-backend]
    if: >-
      !cancelled() &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true' || github.event_name == 'merge_group') || (needs.detect-changes.outputs.postgres-schema == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-backend.result == 'success' || needs.static-backend.result == 'skipped')
    uses: ./.github/workflows/tests-postgres-schema.yml
    permissions:
      contents: read
      actions: read
    with:
      upload_vitest_blob_artifact: true

  test-web:
    needs: [detect-changes, static-code-analysis, static-web]
    if: >-
      !cancelled() &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true' || github.event_name == 'merge_group') || (needs.detect-changes.outputs.web == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-web.result == 'success' || needs.static-web.result == 'skipped')
    uses: ./.github/workflows/tests-web.yml
    with:
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
    permissions:
      actions: read
      contents: read

  storybook:
    needs: [detect-changes, static-code-analysis]
    if: >-
      !cancelled() &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true' || github.event_name == 'merge_group') || (needs.detect-changes.outputs.storybook == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      (needs.detect-changes.outputs.trusted-secret-context == 'true' || needs.detect-changes.outputs.dependency-bot-test-context == 'true') &&
      needs.static-code-analysis.result == 'success'
    uses: ./.github/workflows/storybook.yml
    permissions:
      actions: read
      contents: read
    with:
      cancel_in_progress: ${{ github.event_name == 'pull_request' }}
      checkout_ref: ${{ github.sha }}
      # Stable per-PR cancellation key so a new head cancels its stale Storybook build.
      concurrency_key: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true

  test-web-api:
    needs: [detect-changes, static-code-analysis, static-web]
    if: >-
      !cancelled() &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true' || github.event_name == 'merge_group') || (needs.detect-changes.outputs.web-integration == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-web.result == 'success' || needs.static-web.result == 'skipped')
    uses: ./.github/workflows/tests-web-api.yml
    with:
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
    permissions:
      contents: read
      actions: read

  test-web-integration:
    needs: [detect-changes, static-code-analysis, static-web]
    if: >-
      !cancelled() &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true' || github.event_name == 'merge_group') || (needs.detect-changes.outputs.web-integration == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-web.result == 'success' || needs.static-web.result == 'skipped')
    uses: ./.github/workflows/tests-web-integration.yml
    with:
      shared_build_available: ${{ needs.static-web.result == 'success' }}
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
    permissions:
      contents: read
      actions: read

  test-playwright:
    needs:
      [
        detect-changes,
        static-code-analysis,
        static-backend,
        static-web,
        static-lambdas,
        static-cloudflare-worker,
      ]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.docs-only != 'true' &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-backend.result == 'success' || needs.static-backend.result == 'skipped') &&
      (needs.static-web.result == 'success' || needs.static-web.result == 'skipped') &&
      (needs.static-lambdas.result == 'success' || needs.static-lambdas.result == 'skipped') &&
      (needs.static-cloudflare-worker.result == 'success' || needs.static-cloudflare-worker.result == 'skipped') &&
      (
        (github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true' || github.event_name == 'workflow_dispatch') ||
        needs.detect-changes.outputs.playwright == 'true' ||
        (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')
      )
    uses: ./.github/workflows/tests-playwright.yml
    with:
      shared_build_available: ${{ needs.static-web.result == 'success' }}
      event-name: ${{ github.event_name }}
      otel_enabled: ${{ vars.PLAYWRIGHT_OTEL_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.trusted-secret-context == 'true' }}
    permissions:
      actions: read
      contents: read

  test-playwright-credentialed:
    needs:
      [
        detect-changes,
        static-code-analysis,
        static-backend,
        static-web,
        static-lambdas,
        static-cloudflare-worker,
      ]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.docs-only != 'true' &&
      needs.detect-changes.outputs.trusted-secret-context == 'true' &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-backend.result == 'success' || needs.static-backend.result == 'skipped') &&
      (needs.static-web.result == 'success' || needs.static-web.result == 'skipped') &&
      (needs.static-lambdas.result == 'success' || needs.static-lambdas.result == 'skipped') &&
      (needs.static-cloudflare-worker.result == 'success' || needs.static-cloudflare-worker.result == 'skipped') &&
      (
        (github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true' || github.event_name == 'workflow_dispatch') ||
        (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false') ||
        needs.detect-changes.outputs.playwright-credentialed == 'true'
      )
    uses: ./.github/workflows/tests-playwright-credentialed.yml
    with:
      event-name: ${{ github.event_name }}
      trusted_secret_context: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' }}
    secrets:
      AWS_TEST_ROLE_ARN: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' && secrets.AWS_TEST_ROLE_ARN || '' }}
      S3_BUCKET_IMAGES: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' && secrets.S3_BUCKET_IMAGES || '' }}
      S3_BUCKET_IMAGE_UPLOADS: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' && secrets.S3_BUCKET_IMAGE_UPLOADS || '' }}
    permissions:
      actions: read
      contents: read
      id-token: write

  test-cloudflare-worker:
    needs: [detect-changes, static-code-analysis, static-cloudflare-worker]
    if: >-
      !cancelled() &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true' || github.event_name == 'merge_group') || (needs.detect-changes.outputs.cloudflare-worker == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-cloudflare-worker.result == 'success' || needs.static-cloudflare-worker.result == 'skipped')
    uses: ./.github/workflows/tests-cloudflare-worker.yml
    with:
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
    permissions:
      actions: read
      contents: read

  test-lambdas:
    needs: [detect-changes, static-code-analysis, static-lambdas]
    if: >-
      !cancelled() &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true' || github.event_name == 'merge_group') || (needs.detect-changes.outputs.lambdas == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-lambdas.result == 'success' || needs.static-lambdas.result == 'skipped')
    uses: ./.github/workflows/tests-lambdas.yml
    with:
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
    permissions:
      actions: read
      contents: read

  test-explain-analyze:
    needs: [detect-changes, static-code-analysis, static-backend]
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true' || needs.detect-changes.outputs.explain-analyze == 'true' || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.detect-changes.outputs.docs-only != 'true' &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-backend.result == 'success' || needs.static-backend.result == 'skipped')
    uses: ./.github/workflows/explain-analyze.yml
    permissions:
      contents: read
      actions: read

  # Minimal host-sensitive canaries run on both supported CI operating systems.
  test-portability:
    needs: [detect-changes, static-code-analysis]
    if: >-
      !cancelled() &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true' || github.event_name == 'merge_group') || (needs.detect-changes.outputs.portability == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success'
    uses: ./.github/workflows/tests-portability.yml
    with:
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
    permissions:
      actions: read
      contents: read

  # Intentionally separate from the `tests` fan-in: test-coverage only waits on
  # coverage-producing jobs and does NOT wait on test-playwright (~5-7 min per
  # shard). Keeping them separate lets the Patch Coverage check resolve while
  # Playwright shards are still running, so coverage failures surface earlier on
  # PRs. Do not fold this into `tests` — that would block coverage feedback on
  # the Playwright critical path.
  test-coverage:
    name: Patch Coverage
    if: >-
      always() &&
      !cancelled()
    needs:
      - detect-changes
      - test-ts-shared
      - test-tooling
      - test-backend-modules
      - test-backend-unit
      - test-backend-credentialed
      - test-web
      - test-web-api
      - storybook
      - test-web-integration
      - test-cloudflare-worker
      - test-lambdas
      - test-portability
    uses: ./.github/workflows/ci-test-coverage.yml
    with:
      test-backend-unit-shard-total: ${{ needs.test-backend-unit.outputs.shard-total }}
      test-web-shard-total: ${{ needs.test-web.outputs.shard-total }}
      test-web-api-shard-total: ${{ needs.test-web-api.outputs.shard-total }}
      test-web-integration-shard-total: ${{ needs.test-web-integration.outputs.shard-total }}
      test-ts-shared-result: ${{ needs.test-ts-shared.result }}
      test-tooling-result: ${{ needs.test-tooling.result }}
      test-backend-modules-result: ${{ needs.test-backend-modules.result }}
      test-backend-unit-result: ${{ needs.test-backend-unit.result }}
      test-backend-credentialed-result: ${{ needs.test-backend-credentialed.result }}
      test-web-result: ${{ needs.test-web.result }}
      test-web-api-result: ${{ needs.test-web-api.result }}
      storybook-result: ${{ needs.storybook.result }}
      test-web-integration-result: ${{ needs.test-web-integration.result }}
      test-cloudflare-worker-result: ${{ needs.test-cloudflare-worker.result }}
      test-lambdas-result: ${{ needs.test-lambdas.result }}
      test-portability-result: ${{ needs.test-portability.result }}
      detect-changes-result: ${{ needs.detect-changes.result }}
    permissions:
      contents: read
      actions: read
      pull-requests: write

  # Independent, non-required reporter: Codecov cannot delay or fail Patch Coverage or `tests`.
  upload-codecov:
    needs:
      - test-ts-shared
      - test-tooling
      - test-backend-modules
      - test-backend-unit
      - test-backend-credentialed
      - test-web
      - test-web-api
      - storybook
      - test-web-integration
      - test-cloudflare-worker
      - test-lambdas
      - test-portability
    if: "always() && !cancelled() && github.event_name == 'pull_request'"
    uses: ./.github/workflows/ci-upload-codecov.yml
    permissions:
      actions: read
      contents: read
      id-token: write

  tests-processing:
    needs:
      [
        detect-changes,
        static-code-analysis,
        static-backend,
        static-web,
        static-lambdas,
        static-cloudflare-worker,
        initialize-smoke-test,
        test-postgres-schema,
        test-playwright,
        test-playwright-credentialed,
        test-explain-analyze,
        test-portability,
        test-coverage,
        backend-smoke,
        storybook,
        test-web-api,
        test-web-integration,
      ]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/ci-tests-processing.yml
    with:
      vitest-report-expectations: ${{ needs.test-coverage.outputs.vitest-report-expectations }}
      postgres-result: ${{ needs.test-postgres-schema.result }}
      postgres-vitest-attempt: ${{ needs.test-postgres-schema.outputs.vitest-report-attempt }}
      results: |-
        {"detect-changes":{"result":"${{ needs.detect-changes.result }}"},"static-code-analysis":{"result":"${{ needs.static-code-analysis.result }}"},"static-backend":{"result":"${{ needs.static-backend.result }}"},"static-web":{"result":"${{ needs.static-web.result }}"},"static-lambdas":{"result":"${{ needs.static-lambdas.result }}"},"static-cloudflare-worker":{"result":"${{ needs.static-cloudflare-worker.result }}"},"initialize-smoke-test":{"result":"${{ needs.initialize-smoke-test.result }}"},"test-postgres-schema":{"result":"${{ needs.test-postgres-schema.result }}"},"test-playwright":{"result":"${{ needs.test-playwright.result }}"},"test-playwright-credentialed":{"result":"${{ needs.test-playwright-credentialed.result }}"},"test-explain-analyze":{"result":"${{ needs.test-explain-analyze.result }}"},"test-portability":{"result":"${{ needs.test-portability.result }}"},"test-coverage":{"result":"${{ needs.test-coverage.result }}"},"backend-smoke":{"result":"${{ needs.backend-smoke.result }}"},"storybook":{"result":"${{ needs.storybook.result }}"},"test-web-api":{"result":"${{ needs.test-web-api.result }}"},"test-web-integration":{"result":"${{ needs.test-web-integration.result }}"}}
    permissions:
      contents: read
      actions: write

  tests:
    name: tests
    if: ${{ !cancelled() }}
    needs: [tests-processing]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASH_ENV: /dev/null
    permissions:
      contents: read
    steps:
      - uses: vouchington/vouchington-tooling/.github/actions/ci-required-result-gate@34beb63001ccd5d0aec033945a6fcd4c9502a5f2 # v0.20.0
        timeout-minutes: 1
        with:
          results: >-
            {"tests-processing":{"result":"${{ needs.tests-processing.result }}"}}
  # Docker image validation waits only on static analysis, alongside the tests.
  build-backend:
    needs: [detect-changes, static-code-analysis, static-backend]
    # On PRs, build when Docker configuration, copied workspace manifests, or the root dependency
    # boundary changes. Root manifest and lockfile changes fail open to both images so transitive
    # dependency updates receive image validation before merge. On non-PR events, build whenever
    # any source that affects the image changes.
    if: >-
      !cancelled() &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-backend.result == 'success' || needs.static-backend.result == 'skipped') &&
      needs.detect-changes.outputs.docs-only != 'true' &&
      needs.detect-changes.outputs.trusted-secret-context == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.ref_name != 'main') &&
      (
        ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true' || github.event_name == 'pull_request' && needs.detect-changes.outputs.build-backend-infra == 'true')) ||
        (github.event_name != 'pull_request' && (needs.detect-changes.outputs.build-backend == 'true' || needs.detect-changes.outputs.workflow-action-changes != 'false'))
      )
    uses: ./.github/workflows/build-backend.yml
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      trusted_secret_context: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' }}
    secrets:
      AWS_TEST_ROLE_ARN: ${{ secrets.AWS_TEST_ROLE_ARN }}

  # Docker image validation waits only on static analysis, alongside the tests.
  build-web:
    needs: [detect-changes, static-code-analysis, static-web]
    # On PRs, build when Docker configuration, copied workspace manifests, or the root dependency
    # boundary changes. Root manifest and lockfile changes fail open to both images so transitive
    # dependency updates receive image validation before merge. On non-PR events, build whenever
    # any source that affects the image changes.
    if: >-
      !cancelled() &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-web.result == 'success' || needs.static-web.result == 'skipped') &&
      needs.detect-changes.outputs.docs-only != 'true' &&
      needs.detect-changes.outputs.trusted-secret-context == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.ref_name != 'main') &&
      (
        ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && needs.detect-changes.outputs.workflow-action-changes == 'true' || github.event_name == 'pull_request' && needs.detect-changes.outputs.build-web-infra == 'true')) ||
        (github.event_name != 'pull_request' && (needs.detect-changes.outputs.build-web == 'true' || needs.detect-changes.outputs.workflow-action-changes != 'false'))
      )
    uses: ./.github/workflows/build-web.yml
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      trusted_secret_context: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' }}
    secrets:
      AWS_TEST_ROLE_ARN: ${{ secrets.AWS_TEST_ROLE_ARN }}

  build:
    name: build
    if: ${{ !cancelled() }}
    needs: [tests, build-backend, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASH_ENV: /dev/null
    permissions:
      contents: read
    steps:
      - uses: vouchington/vouchington-tooling/.github/actions/ci-required-result-gate@34beb63001ccd5d0aec033945a6fcd4c9502a5f2 # v0.20.0
        timeout-minutes: 1
        with:
          mode: build
          results: |-
            {"tests":{"result":"${{ needs.tests.result }}"},"build-backend":{"result":"${{ needs.build-backend.result }}"},"build-web":{"result":"${{ needs.build-web.result }}"}}
