      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-expensive-jobs != 'true' &&
      needs.detect-changes.outputs.docs-only != 'true' &&
      needs.detect-changes.outputs.trusted-secret-context == 'true' &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-backend.result == 'success' || needs.static-backend.result == 'skipped') &&
      (needs.static-web.result == 'success' || needs.static-web.result == 'skipped') &&
      (needs.static-lambdas.result == 'success' || needs.static-lambdas.result == 'skipped') &&
      (needs.static-cloudflare-worker.result == 'success' || needs.static-cloudflare-worker.result == 'skipped') &&
      (needs.test-ts-shared.result == 'success' || needs.test-ts-shared.result == 'failure' || needs.test-ts-shared.result == 'skipped') &&
      (needs.test-backend-modules.result == 'success' || needs.test-backend-modules.result == 'failure' || needs.test-backend-modules.result == 'skipped') &&
      (needs.test-backend-unit.result == 'success' || needs.test-backend-unit.result == 'failure' || needs.test-backend-unit.result == 'skipped') &&
      (needs.test-backend-credentialed.result == 'success' || needs.test-backend-credentialed.result == 'failure' || needs.test-backend-credentialed.result == 'skipped') &&
      (needs.test-postgres-schema.result == 'success' || needs.test-postgres-schema.result == 'failure' || needs.test-postgres-schema.result == 'skipped') &&
      (needs.test-web.result == 'success' || needs.test-web.result == 'failure' || needs.test-web.result == 'skipped') &&
      (needs.test-web-api.result == 'success' || needs.test-web-api.result == 'failure' || needs.test-web-api.result == 'skipped') &&
      (needs.test-web-integration.result == 'success' || needs.test-web-integration.result == 'failure' || needs.test-web-integration.result == 'skipped') &&
      (needs.test-lambdas.result == 'success' || needs.test-lambdas.result == 'failure' || needs.test-lambdas.result == 'skipped') &&
      (needs.test-cloudflare-worker.result == 'success' || needs.test-cloudflare-worker.result == 'failure' || needs.test-cloudflare-worker.result == 'skipped') &&
      (
        (github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-test-playwright-credentialed == 'true') || github.event_name == 'workflow_dispatch') ||
        (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false') ||
        needs.detect-changes.outputs.playwright-credentialed == 'true'
      )
    uses: ./.github/workflows/tests-playwright-credentialed.yml
    with:
      event-name: ${{ github.event_name }}
      trusted_secret_context: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' }}
    secrets:
      AWS_TEST_ROLE_ARN: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' && secrets.AWS_TEST_ROLE_ARN || '' }}
      OPENAI_API_KEY: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' && secrets.OPENAI_API_KEY || '' }}
      S3_BUCKET_IMAGES: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' && secrets.S3_BUCKET_IMAGES || '' }}
      S3_BUCKET_IMAGE_UPLOADS: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' && secrets.S3_BUCKET_IMAGE_UPLOADS || '' }}
    permissions:
      actions: read
      contents: read
      id-token: write

  test-cloudflare-worker:
    needs: [detect-changes, static-code-analysis, static-cloudflare-worker, select-ci]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-settled-producers != 'true' &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-test-cloudflare-worker == 'true') || needs.select-ci.outputs.full-suite == 'true') || needs.select-ci.outputs.full-test-cloudflare-worker == 'true' || (needs.detect-changes.outputs.cloudflare-worker == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-cloudflare-worker.result == 'success' || needs.static-cloudflare-worker.result == 'skipped') &&
      needs.select-ci.outputs.skip-test-cloudflare-worker != 'true'
    uses: ./.github/workflows/tests-cloudflare-worker.yml
    with:
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
      full_suite: ${{ needs.select-ci.outputs.full-suite != 'false' || needs.select-ci.outputs.full-test-cloudflare-worker == 'true' }}
      run_tests: ${{ needs.select-ci.outputs.run-tests-test-cloudflare-worker != 'false' }}
      selected_test_files: ${{ needs.select-ci.outputs.files-test-cloudflare-worker || '' }}
    permissions:
      actions: read
      contents: read

  test-lambdas:
    needs: [detect-changes, static-code-analysis, static-lambdas, select-ci]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-settled-producers != 'true' &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-test-lambdas == 'true') || needs.select-ci.outputs.full-suite == 'true') || needs.select-ci.outputs.full-test-lambdas == 'true' || (needs.detect-changes.outputs.lambdas == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-lambdas.result == 'success' || needs.static-lambdas.result == 'skipped') &&
      needs.select-ci.outputs.skip-test-lambdas != 'true'
    uses: ./.github/workflows/tests-lambdas.yml
    with:
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
      full_suite: ${{ needs.select-ci.outputs.full-suite != 'false' || needs.select-ci.outputs.full-test-lambdas == 'true' }}
      run_tests: ${{ needs.select-ci.outputs.run-tests-test-lambdas != 'false' }}
      selected_test_files: ${{ needs.select-ci.outputs.files-test-lambdas || '' }}
    permissions:
      actions: read
      contents: read

  test-explain-analyze:
    needs: [detect-changes, static-code-analysis, static-backend, select-ci]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-settled-producers != 'true' &&
      (github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-test-explain-analyze == 'true') || needs.detect-changes.outputs.explain-analyze == 'true' || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.detect-changes.outputs.docs-only != 'true' &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-backend.result == 'success' || needs.static-backend.result == 'skipped')
    uses: ./.github/workflows/explain-analyze.yml
    permissions:
      contents: read
      actions: read

  # Minimal host-sensitive canaries run on both supported CI operating systems.
  test-portability:
    needs: [detect-changes, static-code-analysis, select-ci]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-settled-producers != 'true' &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-test-portability == 'true') || needs.select-ci.outputs.full-suite == 'true') || needs.select-ci.outputs.full-test-portability == 'true' || (needs.detect-changes.outputs.portability == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success' &&
      needs.select-ci.outputs.skip-test-portability != 'true'
    uses: ./.github/workflows/tests-portability.yml
    with:
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
      full_suite: ${{ needs.select-ci.outputs.full-suite != 'false' || needs.select-ci.outputs.full-test-portability == 'true' }}
      selected_test_files: ${{ needs.select-ci.outputs.files-test-portability || '' }}
    permissions:
      actions: read
      contents: read

  # Intentionally separate from the `tests` fan-in: test-coverage only waits on
  # coverage-producing jobs and does NOT wait on test-playwright (~5-7 min per
  # shard). Keeping them separate lets the Patch Coverage check resolve while
  # Playwright shards are still running, so coverage failures surface earlier on
  # PRs. Do not fold this into `tests` — that would block coverage feedback on
  # the Playwright critical path.
  test-coverage:
    name: Patch Coverage
    if: >-
      always() &&
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-settled-producers != 'true' &&
      (needs.detect-changes.outputs.docs-only != 'true' ||
        needs.detect-changes.outputs.has-vitest-full == 'true')
    needs:
      - detect-changes
      - select-ci
      - test-ts-shared
      - test-tooling
      - test-backend-modules
      - test-backend-unit
      - test-backend-credentialed
      - test-web
      - test-web-api
      - storybook
      - test-web-integration
      - test-cloudflare-worker
      - test-lambdas
      - test-portability
    uses: ./.github/workflows/ci-test-coverage.yml
    with:
      detect-changes-outputs-skip-ci-producers: ${{ needs.detect-changes.outputs.skip-ci-producers }}
      detect-changes-outputs-skip-settled-producers: ${{ needs.detect-changes.outputs.skip-settled-producers }}
      detect-changes-outputs-docs-only: ${{ needs.detect-changes.outputs.docs-only }}
      detect-changes-outputs-has-vitest-full: ${{ needs.detect-changes.outputs.has-vitest-full }}
      select-vitest-outputs-run-tests-test-web: ${{ needs.select-ci.outputs.run-tests-test-web }}
      select-vitest-outputs-run-tests-test-web-api: ${{ needs.select-ci.outputs.run-tests-test-web-api }}
      select-vitest-outputs-run-tests-test-backend-unit: ${{ needs.select-ci.outputs.run-tests-test-backend-unit }}
      select-vitest-outputs-run-tests-test-backend-modules: ${{ needs.select-ci.outputs.run-tests-test-backend-modules }}
      select-vitest-outputs-run-tests-test-cloudflare-worker: ${{ needs.select-ci.outputs.run-tests-test-cloudflare-worker }}
      select-vitest-outputs-run-tests-test-lambdas: ${{ needs.select-ci.outputs.run-tests-test-lambdas }}
      test-backend-unit-shard-total: ${{ needs.test-backend-unit.outputs.shard-total }}
      test-web-shard-total: ${{ needs.test-web.outputs.shard-total }}
      test-web-api-shard-total: ${{ needs.test-web-api.outputs.shard-total }}
      test-web-integration-shard-total: ${{ needs.test-web-integration.outputs.shard-total }}
      select-vitest-outputs-storybook-browser-mode: ${{ needs.select-ci.outputs.storybook-browser-mode }}
      test-ts-shared-result: ${{ needs.test-ts-shared.result }}
      test-tooling-result: ${{ needs.test-tooling.result }}
      test-backend-modules-result: ${{ needs.test-backend-modules.result }}
      test-backend-unit-result: ${{ needs.test-backend-unit.result }}
      test-backend-credentialed-result: ${{ needs.test-backend-credentialed.result }}
      test-web-result: ${{ needs.test-web.result }}
      test-web-api-result: ${{ needs.test-web-api.result }}
      storybook-result: ${{ needs.storybook.result }}
      test-web-integration-result: ${{ needs.test-web-integration.result }}
      test-cloudflare-worker-result: ${{ needs.test-cloudflare-worker.result }}
      test-lambdas-result: ${{ needs.test-lambdas.result }}
      test-portability-result: ${{ needs.test-portability.result }}
      detect-changes-result: ${{ needs.detect-changes.result }}
    permissions:
      contents: read
      actions: read
      pull-requests: write

  tests-processing:
    needs:
      [
        detect-changes,
        static-code-analysis,
        static-backend,
        static-web,
        static-lambdas,
        static-cloudflare-worker,
        initialize-smoke-test,
        test-postgres-schema,
        test-playwright,
        test-playwright-credentialed,
        test-explain-analyze,
        test-portability,
        test-coverage,
        backend-smoke,
        storybook,
        test-web-api,
        test-web-integration,
      ]
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/ci-tests-processing.yml
    with:
      skip-ci-producers: ${{ needs.detect-changes.outputs.skip-ci-producers }}
      skip-settled-producers: ${{ needs.detect-changes.outputs.skip-settled-producers }}
      docs-only: ${{ needs.detect-changes.outputs.docs-only }}
      has-vitest-full: ${{ needs.detect-changes.outputs.has-vitest-full }}
      vitest-report-expectations: ${{ needs.test-coverage.outputs.vitest-report-expectations }}
      postgres-result: ${{ needs.test-postgres-schema.result }}
      postgres-vitest-ran: ${{ needs.test-postgres-schema.outputs.vitest-ran }}
      postgres-vitest-attempt: ${{ needs.test-postgres-schema.outputs.vitest-report-attempt }}
      results: |-
        {"detect-changes":{"result":"${{ needs.detect-changes.result }}"},"static-code-analysis":{"result":"${{ needs.static-code-analysis.result }}"},"static-backend":{"result":"${{ needs.static-backend.result }}"},"static-web":{"result":"${{ needs.static-web.result }}"},"static-lambdas":{"result":"${{ needs.static-lambdas.result }}"},"static-cloudflare-worker":{"result":"${{ needs.static-cloudflare-worker.result }}"},"initialize-smoke-test":{"result":"${{ needs.initialize-smoke-test.result }}"},"test-postgres-schema":{"result":"${{ needs.test-postgres-schema.result }}"},"test-playwright":{"result":"${{ needs.test-playwright.result }}"},"test-playwright-credentialed":{"result":"${{ needs.test-playwright-credentialed.result }}"},"test-explain-analyze":{"result":"${{ needs.test-explain-analyze.result }}"},"test-portability":{"result":"${{ needs.test-portability.result }}"},"test-coverage":{"result":"${{ needs.test-coverage.result }}"},"backend-smoke":{"result":"${{ needs.backend-smoke.result }}"},"storybook":{"result":"${{ needs.storybook.result }}"},"test-web-api":{"result":"${{ needs.test-web-api.result }}"},"test-web-integration":{"result":"${{ needs.test-web-integration.result }}"}}
    permissions:
      contents: read
      actions: write

  tests:
    name: tests
    if: ${{ !cancelled() }}
    needs: [tests-processing]
    runs-on: [self-hosted]
    timeout-minutes: 2
    env:
      BASH_ENV: /dev/null
    permissions:
      contents: read
    steps:
      - uses: vouchington/vouchington-tooling/.github/actions/ci-required-result-gate@37587cbcd959b9f94ae3efe254d422890b0c15c8 # v0.16.1
        with:
          results: >-
            {"tests-processing":{"result":"${{ needs.tests-processing.result }}"}}
  build-backend:
    needs: [detect-changes, tests, select-ci]
    # On PRs, build when Docker configuration, copied workspace manifests, or the root dependency
    # boundary changes. Root manifest and lockfile changes fail open to both images so transitive
    # dependency updates receive image validation before merge. On non-PR events, build whenever
    # any source that affects the image changes.
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-expensive-jobs != 'true' &&
      needs.detect-changes.outputs.docs-only != 'true' &&
      needs.detect-changes.outputs.trusted-secret-context == 'true' &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || github.ref_name != 'main') &&
      (
        ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-build-backend == 'true') || github.event_name == 'pull_request' && needs.detect-changes.outputs.build-backend-infra == 'true')) ||
        (github.event_name != 'pull_request' && (needs.detect-changes.outputs.build-backend == 'true' || needs.detect-changes.outputs.workflow-action-changes != 'false'))
      )
    uses: ./.github/workflows/build-backend.yml
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      trusted_secret_context: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' }}
    secrets:
      AWS_TEST_ROLE_ARN: ${{ secrets.AWS_TEST_ROLE_ARN }}

  build-web:
    needs: [detect-changes, tests, select-ci]
    # On PRs, build when Docker configuration, copied workspace manifests, or the root dependency
    # boundary changes. Root manifest and lockfile changes fail open to both images so transitive
    # dependency updates receive image validation before merge. On non-PR events, build whenever
    # any source that affects the image changes.
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-expensive-jobs != 'true' &&
      needs.detect-changes.outputs.docs-only != 'true' &&
      needs.detect-changes.outputs.trusted-secret-context == 'true' &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || github.ref_name != 'main') &&
      (
        ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-build-web == 'true') || github.event_name == 'pull_request' && needs.detect-changes.outputs.build-web-infra == 'true')) ||
        (github.event_name != 'pull_request' && (needs.detect-changes.outputs.build-web == 'true' || needs.detect-changes.outputs.workflow-action-changes != 'false'))
      )
    uses: ./.github/workflows/build-web.yml
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      trusted_secret_context: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' }}
    secrets:
      AWS_TEST_ROLE_ARN: ${{ secrets.AWS_TEST_ROLE_ARN }}

  ci-record-state:
    needs:
      [
        detect-changes,
        tests-processing,
        static-backend,
        static-web,
        static-lambdas,
        static-cloudflare-worker,
        initialize-smoke-test,
        test-ts-shared,
        test-tooling,
        test-backend-modules,
        test-backend-unit,
        backend-smoke,
        test-backend-credentialed,
        test-postgres-schema,
        test-web,
        test-web-api,
        test-cloudflare-worker,
        test-lambdas,
        test-explain-analyze,
        test-portability,
        test-coverage,
        storybook,
        test-web-integration,
        test-playwright,
        test-playwright-credentialed,
        build-backend,
        build-web,
      ]
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-settled-producers != 'true'
    uses: ./.github/workflows/ci-record-state.yml
    with:
      producer-results: >-
        {"static-backend":{"result":"${{ needs.static-backend.result }}"},"static-web":{"result":"${{ needs.static-web.result }}"},"static-lambdas":{"result":"${{ needs.static-lambdas.result }}"},"static-cloudflare-worker":{"result":"${{ needs.static-cloudflare-worker.result }}"},"initialize-smoke-test":{"result":"${{ needs.initialize-smoke-test.result }}"},"test-ts-shared":{"result":"${{ needs.test-ts-shared.result }}"},"test-tooling":{"result":"${{ needs.test-tooling.result }}"},"test-backend-modules":{"result":"${{ needs.test-backend-modules.result }}"},"test-backend-unit":{"result":"${{ needs.test-backend-unit.result }}"},"backend-smoke":{"result":"${{ needs.backend-smoke.result }}"},"test-backend-credentialed":{"result":"${{ needs.test-backend-credentialed.result }}"},"test-postgres-schema":{"result":"${{ needs.test-postgres-schema.result }}"},"test-web":{"result":"${{ needs.test-web.result }}"},"test-web-api":{"result":"${{ needs.test-web-api.result }}"},"test-cloudflare-worker":{"result":"${{ needs.test-cloudflare-worker.result }}"},"test-lambdas":{"result":"${{ needs.test-lambdas.result }}"},"test-explain-analyze":{"result":"${{ needs.test-explain-analyze.result }}"},"test-portability":{"result":"${{ needs.test-portability.result }}"},"test-coverage":{"result":"${{ needs.test-coverage.result }}"},"storybook":{"result":"${{ needs.storybook.result }}"},"test-web-integration":{"result":"${{ needs.test-web-integration.result }}"},"test-playwright":{"result":"${{ needs.test-playwright.result }}"},"test-playwright-credentialed":{"result":"${{ needs.test-playwright-credentialed.result }}"},"build-backend":{"result":"${{ needs.build-backend.result }}"},"build-web":{"result":"${{ needs.build-web.result }}"}}
      tested-sha: ${{ github.sha }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      pr-number: ${{ github.event.pull_request.number }}
      processing-result: ${{ needs.tests-processing.result }}
      deferred: ${{ needs.detect-changes.outputs.skip-expensive-jobs }}
    permissions: {}

  build:
    name: build
    if: ${{ !cancelled() }}
    needs: [tests, build-backend, build-web]
    runs-on: [self-hosted]
    timeout-minutes: 1
    env:
      BASH_ENV: /dev/null
    permissions:
      contents: read
    steps:
      - uses: vouchington/vouchington-tooling/.github/actions/ci-required-result-gate@37587cbcd959b9f94ae3efe254d422890b0c15c8 # v0.16.1
        with:
          mode: build
