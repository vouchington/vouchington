      (needs.static-cloudflare-worker.result == 'success' || needs.static-cloudflare-worker.result == 'skipped') &&
      (needs.test-ts-shared.result == 'success' || needs.test-ts-shared.result == 'failure' || needs.test-ts-shared.result == 'skipped') &&
      (needs.test-backend-modules.result == 'success' || needs.test-backend-modules.result == 'failure' || needs.test-backend-modules.result == 'skipped') &&
      (needs.test-backend-unit.result == 'success' || needs.test-backend-unit.result == 'failure' || needs.test-backend-unit.result == 'skipped') &&
      (needs.test-postgres-schema.result == 'success' || needs.test-postgres-schema.result == 'failure' || needs.test-postgres-schema.result == 'skipped') &&
      (needs.test-web.result == 'success' || needs.test-web.result == 'failure' || needs.test-web.result == 'skipped') &&
      (needs.test-web-api.result == 'success' || needs.test-web-api.result == 'failure' || needs.test-web-api.result == 'skipped') &&
      (needs.test-web-integration.result == 'success' || needs.test-web-integration.result == 'failure' || needs.test-web-integration.result == 'skipped') &&
      (needs.test-lambdas.result == 'success' || needs.test-lambdas.result == 'failure' || needs.test-lambdas.result == 'skipped') &&
      (needs.test-cloudflare-worker.result == 'success' || needs.test-cloudflare-worker.result == 'failure' || needs.test-cloudflare-worker.result == 'skipped') &&
      (
        (github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-test-playwright == 'true') || github.event_name == 'workflow_dispatch') ||
        needs.detect-changes.outputs.playwright == 'true' ||
        (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false') ||
