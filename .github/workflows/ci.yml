name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'ready_for_review' }}

permissions: {}

jobs:
  ready-dedupe:
    uses: ./.github/workflows/ci-ready-dedupe.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read

  detect-changes:
    needs: [ready-dedupe]
    uses: ./.github/workflows/ci-detect-changes.yml
    with:
      skip-ci-producers: ${{ needs.ready-dedupe.outputs.skip-ci-producers }}
      skip-expensive-jobs: ${{ needs.ready-dedupe.outputs.skip-expensive-jobs }}
      skip-settled-producers: ${{ needs.ready-dedupe.outputs.skip-settled-producers }}
      pr-labels-json: ${{ needs.ready-dedupe.outputs.pr-labels-json }}
      has-playwright-full: ${{ needs.ready-dedupe.outputs.has-playwright-full }}
      has-vitest-full: ${{ needs.ready-dedupe.outputs.has-vitest-full }}
    permissions:
      contents: read
      pull-requests: read
  static-code-analysis:
    needs: [detect-changes]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true'
    uses: ./.github/workflows/static-code-analysis.yml
    with:
      docs_only: ${{ needs.detect-changes.outputs.docs-only == 'true' }}
    permissions:
      contents: read

  # Area-gated static gates (typecheck/depcruise/build/smoke) lifted off the
  # per-area Vitest jobs onto the bare self-hosted fleet. Gated on
  # detect-changes plus select-ci topology outputs: these steps aren't Vitest and must
  # still run on a backend-only or web-only change even when no test file was
  # selected. See .github/workflows/checks-static.yml.
  static-backend:
    needs: [detect-changes, static-code-analysis, select-ci]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-settled-producers != 'true' &&
      needs.detect-changes.outputs.docs-only != 'true' &&
      needs.static-code-analysis.result == 'success' &&
      (
        (github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-static-backend == 'true')) ||
        needs.detect-changes.outputs.backend == 'true' ||
        (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')
      )
    uses: ./.github/workflows/checks-static.yml
    with:
      backend: true
    permissions:
      contents: read
      actions: read

  static-web:
    needs: [detect-changes, static-code-analysis, select-ci]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-settled-producers != 'true' &&
      needs.detect-changes.outputs.docs-only != 'true' &&
      needs.static-code-analysis.result == 'success' &&
      (
        (github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-static-web == 'true')) ||
        needs.detect-changes.outputs.web == 'true' ||
        (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')
      )
    uses: ./.github/workflows/checks-static.yml
    with:
      web: true
    permissions:
      contents: read
      actions: read

  static-lambdas:
    needs: [detect-changes, static-code-analysis, select-ci]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-settled-producers != 'true' &&
      needs.detect-changes.outputs.docs-only != 'true' &&
      needs.static-code-analysis.result == 'success' &&
      (
        (github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-static-lambdas == 'true')) ||
        needs.detect-changes.outputs.lambdas == 'true' ||
        (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')
      )
    uses: ./.github/workflows/checks-static.yml
    with:
      lambdas: true
    permissions:
      contents: read
      actions: read

  static-cloudflare-worker:
    needs: [detect-changes, static-code-analysis, select-ci]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-settled-producers != 'true' &&
      needs.detect-changes.outputs.docs-only != 'true' &&
      needs.static-code-analysis.result == 'success' &&
      (
        (github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-static-cloudflare-worker == 'true')) ||
        needs.detect-changes.outputs.cloudflare-worker == 'true' ||
        (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')
      )
    uses: ./.github/workflows/checks-static.yml
    with:
      cloudflare-worker: true
    permissions:
      contents: read
      actions: read

  initialize-smoke-test:
    needs: [detect-changes, static-code-analysis, select-ci]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-settled-producers != 'true' &&
      (github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-initialize-smoke-test == 'true') || needs.detect-changes.outputs.shell-scripts == 'true' || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.detect-changes.outputs.docs-only != 'true' &&
      needs.static-code-analysis.result == 'success'
    uses: ./.github/workflows/initialize-smoke-test.yml
    permissions:
      contents: read

  select-ci:
    needs: [detect-changes]
    uses: ./.github/workflows/ci-select-vitest.yml
    with:
      detect-changes-outputs-skip-ci-producers: ${{ needs.detect-changes.outputs.skip-ci-producers }}
      detect-changes-outputs-docs-only: ${{ needs.detect-changes.outputs.docs-only }}
      detect-changes-outputs-has-vitest-full: ${{ needs.detect-changes.outputs.has-vitest-full }}
      detect-changes-outputs-pr-labels-json: ${{ needs.detect-changes.outputs.pr-labels-json }}
    permissions:
      contents: read

  test-ts-shared:
    needs: [detect-changes, static-code-analysis, select-ci]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-settled-producers != 'true' &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-test-ts-shared == 'true') || needs.select-ci.outputs.full-suite == 'true') || needs.select-ci.outputs.full-test-ts-shared == 'true' || (needs.detect-changes.outputs.ts-shared == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success' &&
      needs.select-ci.outputs.skip-test-ts-shared != 'true'
    uses: ./.github/workflows/tests-ts-shared.yml
    with:
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
      full_suite: ${{ needs.select-ci.outputs.full-suite != 'false' || needs.select-ci.outputs.full-test-ts-shared == 'true' }}
      selected_test_files: ${{ needs.select-ci.outputs.files-test-ts-shared || '' }}
    permissions:
      actions: read
      contents: read

  test-tooling:
    needs: [detect-changes, static-code-analysis, select-ci]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-settled-producers != 'true' &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-test-tooling == 'true') || needs.select-ci.outputs.full-suite == 'true') || needs.select-ci.outputs.full-test-tooling == 'true' || (needs.detect-changes.outputs.tooling == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success' &&
      needs.select-ci.outputs.skip-test-tooling != 'true'
    uses: ./.github/workflows/tests-tooling.yml
    with:
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
      full_suite: ${{ needs.select-ci.outputs.full-suite != 'false' || needs.select-ci.outputs.full-test-tooling == 'true' }}
      selected_test_files: ${{ needs.select-ci.outputs.files-test-tooling || '' }}
    permissions:
      actions: read
      contents: read

  test-backend-modules:
    needs: [detect-changes, static-code-analysis, static-backend, test-ts-shared, select-ci]
    if: >-
      always() &&
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-settled-producers != 'true' &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-test-backend-modules == 'true') || needs.select-ci.outputs.full-suite == 'true') || needs.select-ci.outputs.full-test-backend-modules == 'true' || (needs.detect-changes.outputs.backend == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-backend.result == 'success' || needs.static-backend.result == 'skipped') &&
      (needs.test-ts-shared.result == 'success' || needs.test-ts-shared.result == 'failure' || needs.test-ts-shared.result == 'skipped') &&
      needs.select-ci.outputs.skip-test-backend-modules != 'true'
    uses: ./.github/workflows/tests-backend-modules.yml
    with:
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
      full_suite: ${{ needs.select-ci.outputs.full-suite != 'false' || needs.select-ci.outputs.full-test-backend-modules == 'true' }}
      run_tests: ${{ needs.select-ci.outputs.run-tests-test-backend-modules != 'false' }}
      selected_test_files: ${{ needs.select-ci.outputs.files-test-backend-modules || '' }}
    permissions:
      contents: read
      actions: read

  test-backend-unit:
    needs: [detect-changes, static-code-analysis, static-backend, test-ts-shared, select-ci]
    if: >-
      always() &&
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-settled-producers != 'true' &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-test-backend-unit == 'true') || needs.select-ci.outputs.full-suite == 'true') || needs.select-ci.outputs.full-test-backend-unit == 'true' || (needs.detect-changes.outputs.backend == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-backend.result == 'success' || needs.static-backend.result == 'skipped') &&
      (needs.test-ts-shared.result == 'success' || needs.test-ts-shared.result == 'failure' || needs.test-ts-shared.result == 'skipped') &&
      needs.select-ci.outputs.skip-test-backend-unit != 'true'
    uses: ./.github/workflows/tests-backend-unit.yml
    with:
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
      full_suite: ${{ needs.select-ci.outputs.full-suite != 'false' || needs.select-ci.outputs.full-test-backend-unit == 'true' }}
      run_tests: ${{ needs.select-ci.outputs.run-tests-test-backend-unit != 'false' }}
      shard_total_override: ${{ needs.select-ci.outputs.shard-total-test-backend-unit || '' }}
      selected_test_files: ${{ needs.select-ci.outputs.files-test-backend-unit || '' }}
    permissions:
      contents: read
      actions: read

  backend-smoke:
    needs: [detect-changes, static-backend, select-ci]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-settled-producers != 'true' &&
      (needs.static-backend.result == 'success' || needs.static-backend.result == 'skipped') &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-backend-smoke == 'true') || github.event_name == 'workflow_dispatch') ||
      needs.select-ci.outputs.full-suite == 'true' ||
      (needs.detect-changes.outputs.backend == 'true' && needs.detect-changes.outputs.docs-only != 'true') ||
      (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false') ||
      needs.detect-changes.outputs.has-vitest-full == 'true')
    uses: ./.github/workflows/checks-backend-smoke.yml
    permissions:
      contents: read
      actions: read

  test-backend-credentialed:
    needs: [detect-changes, static-code-analysis, static-backend, test-ts-shared, select-ci]
    if: >-
      always() &&
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-settled-producers != 'true' &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-test-backend-credentialed == 'true') || needs.select-ci.outputs.full-suite == 'true') || needs.select-ci.outputs.full-test-backend-credentialed == 'true' || needs.detect-changes.outputs.docs-only != 'true' || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success' &&
      needs.detect-changes.outputs.trusted-secret-context == 'true' &&
      (needs.static-backend.result == 'success' || needs.static-backend.result == 'skipped') &&
      (needs.test-ts-shared.result == 'success' || needs.test-ts-shared.result == 'failure' || needs.test-ts-shared.result == 'skipped') &&
      (needs.select-ci.outputs.full-suite == 'true' || needs.select-ci.outputs.full-test-backend-credentialed == 'true' || needs.select-ci.outputs.files-test-backend-credentialed != '' || (github.ref == 'refs/heads/main' && needs.detect-changes.outputs.backend == 'true') || needs.detect-changes.outputs.backend-credentialed == 'true' || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.select-ci.outputs.skip-test-backend-credentialed != 'true'
    uses: ./.github/workflows/tests-backend-credentialed.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      trusted_secret_context: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' }}
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
      full_suite: ${{ needs.select-ci.outputs.full-suite != 'false' || needs.select-ci.outputs.full-test-backend-credentialed == 'true' }}
      selected_test_files: ${{ needs.select-ci.outputs.files-test-backend-credentialed || '' }}
    secrets:
      AWS_TEST_ROLE_ARN: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' && secrets.AWS_TEST_ROLE_ARN || '' }}
      OPENAI_API_KEY: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' && secrets.OPENAI_API_KEY || '' }}
      STRIPE_SECRET_KEY: ${{ needs.detect-changes.outputs.trusted-secret-context == 'true' && secrets.STRIPE_SECRET_KEY || '' }}

  test-postgres-schema:
    needs: [detect-changes, static-code-analysis, static-backend, select-ci]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-settled-producers != 'true' &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-test-postgres-schema == 'true') || needs.select-ci.outputs.full-suite == 'true') || needs.select-ci.outputs.full-test-postgres-schema == 'true' || (needs.detect-changes.outputs.postgres-schema == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-backend.result == 'success' || needs.static-backend.result == 'skipped')
    uses: ./.github/workflows/tests-postgres-schema.yml
    permissions:
      contents: read
      actions: read
    with:
      upload_vitest_blob_artifact: true
      full_suite: ${{ needs.select-ci.outputs.full-suite != 'false' || needs.select-ci.outputs.full-test-postgres-schema == 'true' }}
      run_tests: ${{ needs.select-ci.outputs.run-tests-test-postgres-schema != 'false' }}
      selected_test_files: ${{ needs.select-ci.outputs.files-test-postgres-schema || '' }}

  test-web:
    needs: [detect-changes, static-code-analysis, static-web, select-ci]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-settled-producers != 'true' &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-test-web == 'true') || needs.select-ci.outputs.full-suite == 'true') || needs.select-ci.outputs.full-test-web == 'true' || (needs.detect-changes.outputs.web == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-web.result == 'success' || needs.static-web.result == 'skipped') &&
      needs.select-ci.outputs.skip-test-web != 'true'
    uses: ./.github/workflows/tests-web.yml
    with:
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
      full_suite: ${{ needs.select-ci.outputs.full-suite != 'false' || needs.select-ci.outputs.full-test-web == 'true' }}
      run_tests: ${{ needs.select-ci.outputs.run-tests-test-web != 'false' }}
      shard_total_override: ${{ needs.select-ci.outputs.shard-total-test-web || '' }}
      selected_test_files: ${{ needs.select-ci.outputs.files-test-web || '' }}
    permissions:
      actions: read
      contents: read

  storybook:
    needs: [detect-changes, static-code-analysis, select-ci]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-expensive-jobs != 'true' &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-storybook == 'true') || needs.select-ci.outputs.full-suite == 'true') || needs.select-ci.outputs.full-storybook == 'true' || (needs.detect-changes.outputs.storybook == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      (needs.detect-changes.outputs.trusted-secret-context == 'true' || needs.detect-changes.outputs.dependency-bot-test-context == 'true') &&
      needs.static-code-analysis.result == 'success'
    uses: ./.github/workflows/storybook.yml
    permissions:
      actions: read
      contents: read
    with:
      cancel_in_progress: ${{ github.event_name == 'pull_request' }}
      checkout_ref: ${{ github.sha }}
      # Stable per-PR cancellation key so a new head cancels its stale Storybook build.
      concurrency_key: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
      selected_test_files: ${{ needs.select-ci.outputs.storybook-browser-files }}
      browser_test_mode: ${{ needs.select-ci.outputs.storybook-browser-mode || 'full' }}

  test-web-api:
    needs: [detect-changes, static-code-analysis, static-web, test-web, select-ci]
    if: >-
      always() &&
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-settled-producers != 'true' &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-test-web-api == 'true') || needs.select-ci.outputs.full-suite == 'true') || needs.select-ci.outputs.full-test-web-api == 'true' || (needs.detect-changes.outputs.web-integration == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-web.result == 'success' || needs.static-web.result == 'skipped') &&
      (needs.test-web.result == 'success' || needs.test-web.result == 'failure' || needs.test-web.result == 'skipped') &&
      needs.select-ci.outputs.skip-test-web-api != 'true'
    uses: ./.github/workflows/tests-web-api.yml
    with:
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
      full_suite: ${{ needs.select-ci.outputs.full-suite != 'false' || needs.select-ci.outputs.full-test-web-api == 'true' }}
      run_tests: ${{ needs.select-ci.outputs.run-tests-test-web-api != 'false' }}
      shard_total_override: ${{ needs.select-ci.outputs.shard-total-test-web-api || '' }}
      selected_test_files: ${{ needs.select-ci.outputs.files-test-web-api || '' }}
    permissions:
      contents: read
      actions: read

  test-web-integration:
    needs: [detect-changes, static-code-analysis, static-web, test-web, select-ci]
    if: >-
      always() &&
      !cancelled() &&
      needs.detect-changes.outputs.skip-ci-producers != 'true' &&
      needs.detect-changes.outputs.skip-expensive-jobs != 'true' &&
      ((github.event_name == 'pull_request' && needs.detect-changes.outputs.docs-only != 'true' && (needs.select-ci.outputs.full-ci != 'false' || needs.select-ci.outputs.run-test-web-integration == 'true') || needs.select-ci.outputs.full-suite == 'true') || needs.select-ci.outputs.full-test-web-integration == 'true' || (needs.detect-changes.outputs.web-integration == 'true' && needs.detect-changes.outputs.docs-only != 'true') || (github.event_name == 'workflow_dispatch' && needs.detect-changes.outputs.workflow-action-changes != 'false')) &&
      needs.static-code-analysis.result == 'success' &&
      (needs.static-web.result == 'success' || needs.static-web.result == 'skipped') &&
      (needs.test-web.result == 'success' || needs.test-web.result == 'failure' || needs.test-web.result == 'skipped') &&
      needs.select-ci.outputs.skip-test-web-integration != 'true'
    uses: ./.github/workflows/tests-web-integration.yml
    with:
      publish_coverage: ${{ github.event_name == 'pull_request' }}
      upload_vitest_blob_artifact: true
