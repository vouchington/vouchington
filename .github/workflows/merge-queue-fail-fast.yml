name: Merge Queue Fail Fast

# A merge-queue entry is ejected only when a required area gate (`backend`, `web`, ...) reports, and
# each gate `needs` every suite in its area, so one early failure is reported only after the slowest
# suite finishes. Every entry behind it waits, then is rebuilt. This scheduled sweep finds active
# merge-group entries whose gate-feeding job has already failed and cancels that entry's area runs.
# On a merge group each area gate still runs after its run is cancelled, so it fails on the real
# failed job instead of waiting for the slowest suite, and the queue ejects the entry the usual way.
# Pull requests are not affected: their authors want every failure from one run.
#
# Each sweep is one short pass: one runs listing plus one GraphQL query per active entry. Nothing
# waits inside a job. It is never a required check, so a failure cannot eject an entry. It checks
# out nothing and runs no repository code. See
# docs/development/ci/workflows/reference-merge-queue-fail-fast.md.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: merge-queue-fail-fast
  cancel-in-progress: false

permissions: {}

jobs:
  sweep:
    name: Cancel failed merge groups
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
    steps:
      - name: Cancel area runs of entries with a failed gating job
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
          # Workflows that own a required area gate. merge-queue-fail-fast.test.mts keeps this list
          # equal to the workflows that run a required gate on merge_group.
          AREA_WORKFLOWS: '["Static","Backend","Web","Cloudflare Worker","Lambdas","Tooling","Gitleaks"]'
          # Jobs no gate waits on; their failure must not eject an entry. A reusable caller's jobs
          # report as `<caller> / <callee job>`. The same test keeps this list exact.
          NON_GATING_JOBS: '["codecov","test-backend-credentialed","test-playwright-credentialed"]'
        run: |
          set -euo pipefail
          # GraphQL variables, not shell expansions.
          # shellcheck disable=SC2016
          query='query($owner: String!, $repo: String!, $sha: GitObjectID!) {
            repository(owner: $owner, name: $repo) {
              object(oid: $sha) {
                ... on Commit {
                  checkSuites(first: 50, filterBy: { appId: 15368 }) {
                    nodes {
                      status
                      workflowRun { databaseId event workflow { name } }
                      checkRuns(first: 50, filterBy: { conclusions: [FAILURE, TIMED_OUT, STARTUP_FAILURE] }) {
                        nodes { name }
                      }
                    }
                  }
                }
              }
            }
          }'
          # GitHub Actions is app 15368. The query returns only failed, timed-out, and unstarted jobs.

          if ! shas=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs?event=merge_group&status=in_progress&per_page=100" \
            --jq '.workflow_runs[].head_sha' 2>"$RUNNER_TEMP/list-error.txt"); then
            echo "::warning::Could not list active merge-group runs: $(tr '\n' ' ' < "$RUNNER_TEMP/list-error.txt")"
            exit 0
          fi

          rows=
          while read -r sha; do
            [[ -n "$sha" ]] || continue
            if ! response=$(gh api graphql -f query="$query" -f owner="${GITHUB_REPOSITORY%/*}" \
              -f repo="${GITHUB_REPOSITORY#*/}" -f sha="$sha" 2>"$RUNNER_TEMP/graphql-error.txt"); then
              echo "::warning::Could not read check suites for $sha: $(tr '\n' ' ' < "$RUNNER_TEMP/graphql-error.txt")"
              continue
            fi
            state=$(jq -c --argjson areas "$AREA_WORKFLOWS" --argjson ignored "$NON_GATING_JOBS" '
              [.data.repository.object.checkSuites.nodes[]?
                | select(.workflowRun.event? == "merge_group")
                | select(.workflowRun.workflow.name as $name | $areas | index($name))
                | {
                    run: .workflowRun.databaseId,
                    workflow: .workflowRun.workflow.name,
                    status,
                    failed: [.checkRuns.nodes[].name
                      | select(. as $job | $ignored
                        | all(. as $prefix | $job != $prefix and ($job | startswith($prefix + " / ") | not)))]
                  }]
              | {
                  failed: [.[] | select(.failed != []) | "\(.workflow): `\(.failed[0])`"],
                  active: [.[] | select(.status != "COMPLETED") | {run, workflow}]
                }' <<< "$response")
            if [[ $(jq '.failed | length' <<< "$state") -eq 0 ]]; then
              continue
            fi
            cause=$(jq -r '.failed | join(", ")' <<< "$state")

            # A 409 means the run finished first. Gateway errors are retried up to three times.
            while IFS=$'\t' read -r id workflow; do
              for attempt in 1 2 3; do
                if error=$(gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" 2>&1 >/dev/null); then
                  result=cancelled
                  break
                elif [[ "$error" == *"HTTP 409"* ]]; then
                  result='already completed'
                  break
                elif [[ "$attempt" -lt 3 && ( "$error" == *"HTTP 502"* || "$error" == *"HTTP 503"* || "$error" == *"HTTP 504"* ) ]]; then
                  sleep 1
                else
                  result=failed
                  echo "::warning::Could not cancel $workflow run $id: $error"
                  break
                fi
              done
              echo "$result: $workflow run $id ($sha) after $cause"
              rows="$rows| \`${sha:0:12}\` | $cause | $workflow | [$id]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id) | $result |"$'\n'
            done < <(jq -r '.active[] | [.run, .workflow] | @tsv' <<< "$state")
          done < <(sort -u <<< "$shas")

          {
            echo "### Merge-group fail fast"
            echo
            if [[ -z "$rows" ]]; then
              echo "No active merge-group entry had a failed gating job."
            else
              echo "| Group | Failed gating job | Workflow | Run | Result |"
              echo "| --- | --- | --- | --- | --- |"
              printf '%s' "$rows"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
