name: Automation Plan

# Triggered when an authorized user comments /plan on any issue.
# Dispatches Auto Harness to investigate and post a plan reply without editing code.

on:
  issue_comment:
    types: [created]

concurrency:
  group: plan-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Validate /plan trigger
    if: >-
      vars.HARNESS_DISPATCH_ENABLED == 'true' &&
      vars.HARNESS_PLAN_ENABLED == 'true' &&
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '/plan')
    runs-on: ubuntu-slim
    timeout-minutes: 4
    permissions:
      contents: read
      issues: write
    outputs:
      accepted: ${{ steps.authorize.outputs.authorized == 'true' && steps.extract-plan.outputs.accepted }}
      plan_request: ${{ steps.extract-plan.outputs.request }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - id: authorize
        timeout-minutes: 1
        uses: vouchington/vouchington-tooling/.github/actions/comment-command-authorize@ccb179f471c0388d354a0bc5c9a02075c0b34101 # v0.72.0

      - id: extract-plan
        timeout-minutes: 2
        if: steps.authorize.outputs.authorized == 'true'
        uses: vouchington/vouchington-tooling/.github/actions/comment-command-parse@ccb179f471c0388d354a0bc5c9a02075c0b34101 # v0.72.0
        with:
          command: /plan

      - name: Acknowledge
        timeout-minutes: 2
        if: steps.extract-plan.outputs.accepted == 'true'
        uses: vouchington/vouchington-tooling/.github/actions/comment-command-acknowledge@ccb179f471c0388d354a0bc5c9a02075c0b34101 # v0.72.0
        with:
          command: /plan

  render-prompt:
    name: Render automation prompt
    needs: [gate]
    if: needs.gate.outputs.accepted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prompt: ${{ steps.render.outputs.prompt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1

      - uses: ./.github/actions/setup-node-pnpm
        timeout-minutes: 5

      - name: Prepare prompt variables
        timeout-minutes: 2
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REQUEST_BODY: ${{ needs.gate.outputs.plan_request }}
        run: |
          set -euo pipefail
          printf '%s' "$ISSUE_TITLE" > issue-title.txt
          printf '%s' "$REQUEST_BODY" > request-body.txt

      - name: Render prompt
        timeout-minutes: 2
        id: render
        uses: jonathanong/auto-harness/actions/harness-render-prompt@8325525ec675f738a3969cb92ce20477f38dcf71 # v1.0.2
        with:
          template: docs/prompts/automation/plan.md
          merge-authority-doc: docs/development/merge-authority.md
          vars: |
            ISSUE_NUMBER=${{ github.event.issue.number }}
            ISSUE_URL=${{ github.event.issue.html_url }}
            TRIGGER_COMMENT_ID=${{ github.event.comment.id }}
          var-files: |
            ISSUE_TITLE=issue-title.txt
            REQUEST_BODY=request-body.txt

  dispatch:
    name: Harness dispatch
    needs: [gate, render-prompt]
    if: needs.gate.outputs.accepted == 'true'
    uses: vouchington/vouchington-tooling/.github/workflows/harness-dispatch.yml@f0f8a576e3dc51bb38c1bca80d2046c5124637a2 # v0.67.0
    permissions:
      contents: read
    secrets:
      HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
    with:
      surface-gate: HARNESS_PLAN_ENABLED
      agent-ref: ${{ github.sha }}
      expected-head-sha: ${{ github.sha }}
      concurrency-id: vouchington:plan:${{ github.event.issue.number }}
      completion-mode: issue-comment
      issue-number: ${{ github.event.issue.number }}
      trigger-comment-id: ${{ github.event.comment.id }}
      slack-source: |
        *Source:* `/plan` on issue #${{ github.event.issue.number }}
        *Issue:* ${{ github.event.issue.html_url }}
        *Issue title:* ${{ github.event.issue.title }}
      prompt: ${{ needs.render-prompt.outputs.prompt }}

  comment-session:
    name: Comment session link
    needs: [gate, dispatch]
    if: >-
      needs.gate.outputs.accepted == 'true' &&
      needs.dispatch.result == 'success' &&
      needs.dispatch.outputs.session-url != ''
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: vouchington/vouchington-tooling/.github/actions/comment-harness-session@ccb179f471c0388d354a0bc5c9a02075c0b34101 # v0.72.0
        timeout-minutes: 1
        with:
          target: ${{ github.event.issue.number }}
          session-id: ${{ needs.dispatch.outputs.session-id }}
          session-url: ${{ needs.dispatch.outputs.session-url }}

  escalate:
    name: Comment failure on issue
    needs: [gate, render-prompt, dispatch]
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      needs.gate.outputs.accepted == 'true' &&
      (
        needs.render-prompt.result == 'failure' ||
        needs.render-prompt.result == 'cancelled' ||
        (needs.dispatch.result == 'failure' || needs.dispatch.result == 'cancelled')
      )
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Revalidate trigger comment
        timeout-minutes: 1
        uses: vouchington/vouchington-tooling/.github/actions/comment-command-authorize@ccb179f471c0388d354a0bc5c9a02075c0b34101 # v0.72.0
        with:
          mode: revalidate
          issue-number: ${{ github.event.issue.number }}

      - name: Check the trigger is still open and valid
        timeout-minutes: 1
        id: check
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" --jq \
            'select(.state == "open") | .number' | grep -qx "$ISSUE_NUMBER"
          COMMENT_JSON="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$TRIGGER_COMMENT_ID")"
          COMMAND="$(jq -r '.body | split("\n")[0]' <<< "$COMMENT_JSON" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [[ "$COMMAND" != "/plan" ]]; then
            echo "Suppressing failure comment because the triggering /plan command is no longer valid."
            exit 0
          fi
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Comment failure on source issue
        timeout-minutes: 1
        if: steps.check.outputs.valid == 'true'
        uses: vouchington/vouchington-tooling/.github/actions/comment-harness-session@ccb179f471c0388d354a0bc5c9a02075c0b34101 # v0.72.0
        with:
          status: failed
          target: ${{ github.event.issue.number }}
          session-id: ${{ needs.dispatch.outputs.session-id }}
          headline: '/plan run failed — plan generation could not complete.'
          run-label: Plan run
          closing: 'Please investigate manually or re-comment `/plan` to retry.'
