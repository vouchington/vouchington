name: PostgreSQL Schema Tests

on:
  workflow_call:
    inputs:
      publish_coverage:
        description: Publish native materialized-view LCOV for backend coverage
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  NODE_ENV: test

jobs:
  postgres-schema-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c max_connections=300 -c log_min_messages=log'
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 1s
          --tmpfs /var/lib/postgresql:rw,size=1g

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/start-valkey
        timeout-minutes: 2
      - name: Set service connections
        timeout-minutes: 1
        run: |
          postgres_url="postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres"
          {
            echo "DATABASE_URL=${postgres_url}"
            echo "READ_DATABASE_URL=${postgres_url}"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-backend
        timeout-minutes: 5
      - name: Check PostgreSQL SQL safety
        run: pnpm exec squawk backend/data-stores/psql/migrations/*.sql backend/data-stores/psql/config-driven/*.sql backend/data-stores/psql/views/*.sql
        timeout-minutes: 2
      - working-directory: backend
        env:
          ENVIRONMENT: staging
        run: node data-stores/psql/migrate.mts
        timeout-minutes: 3
      - name: Check staging RSS fresh bootstrap
        working-directory: backend
        run: node data-stores/psql/check-staging-rss-bootstrap.mts
        timeout-minutes: 1
      - name: Check platform-stats snapshot against live data
        working-directory: backend
        run: node scripts/check-platform-stats-snapshot.mts
        timeout-minutes: 2
      - name: Check native materialized-view contracts
        working-directory: backend
        timeout-minutes: 3
        env:
          NODE_DISABLE_COMPILE_CACHE: '1'
          NODE_V8_COVERAGE: ${{ runner.temp }}/native-mv-v8
          ANALYTICS_BACKEND: local
          ANALYTICS_LOCAL_DIR: ${{ runner.temp }}/native-mv-analytics
          VOUCHA_STORED_SECRET_ENCRYPTION_KEYS: fake-native-mv-ci-key:raw32:this fake test key is not secret
          VOUCHA_OTP_TOKEN_HASH_SECRET: this is a fake native MV CI OTP HMAC secret
          S3_BUCKET_IMAGES: test-images
          S3_BUCKET_IMAGE_UPLOADS: test-image-uploads
          S3_BUCKET_SITEMAPS: test-sitemaps
          S3_BUCKET_RENDERS: test-renders
          S3_BUCKET_ASSETS: test-assets
          S3_BUCKET_CRAWLS: test-crawls
          S3_BUCKET_USER_EXPORTS: test-user-exports
          S3_BUCKET_QUARANTINE: test-quarantine
          S3_BUCKET_BEDROCK_BATCH: test-bedrock-batch
        run: python3 "$GITHUB_WORKSPACE/node_modules/vouchington-tooling/scripts/run-bounded.py" 120 node --experimental-test-module-mocks scripts/check-materialized-view-contracts.mts
      - name: Clear stale PostgreSQL schema JUnit report
        timeout-minutes: 1
        run: rm -f postgres-schema-test-report.junit.xml
      - name: Run PostgreSQL schema tests
        # The command keeps the previous 180s step budget. The extra minute lets
        # run-bounded reap the process group and flush the log. GitHub's
        # timeout-minutes did not: merge-group job 117056768718 stayed in this
        # step until the 20-minute job cap and the log was dropped (run 38925407300).
        timeout-minutes: 4
        env:
          VITEST_CI_REPORTERS: run
          VITEST_DIAGNOSTICS: '1'
          VITEST_JUNIT_OUTPUT_FILE: postgres-schema-test-report.junit.xml
        run: |
          VITEST_MAX_WORKERS=1 python3 "$GITHUB_WORKSPACE/node_modules/vouchington-tooling/scripts/run-bounded.py" 180 pnpm exec ./ci/with-node-test-options vitest run --bail=3 --no-file-parallelism --project backend-postgres-schema --project backend-activitypub-capacity
      - name: Upload PostgreSQL schema JUnit report
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: postgres-schema-junit
          path: postgres-schema-test-report.junit.xml
          retention-days: 1
          if-no-files-found: ignore
      - name: Check PostgreSQL schema snapshot is up to date
        if: ${{ !cancelled() }}
        working-directory: backend
        run: node data-stores/psql/schema-snapshot/generate.mts --check
        timeout-minutes: 2
      - name: Convert native materialized-view coverage
        if: ${{ inputs.publish_coverage }}
        timeout-minutes: 1
        run: >-
          pnpm exec coverage-check native-v8-to-lcov
          --v8-dir "$RUNNER_TEMP/native-mv-v8"
          --source-root "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/native-mv-coverage/lcov.info"
          --include 'backend/{api,data-stores,modules,queues,services,workers}/**/*.mts'
          --exclude '**/*.test.mts'
      - name: Preserve full native materialized-view LCOV
        if: ${{ inputs.publish_coverage }}
        timeout-minutes: 1
        run: |
          mkdir -p coverage-full
          cp "$RUNNER_TEMP/native-mv-coverage/lcov.info" coverage-full/lcov.info
      - name: Upload full native materialized-view LCOV (attempt 1)
        id: full-lcov-1
        if: ${{ inputs.publish_coverage }}
        continue-on-error: true
        timeout-minutes: 3
        uses: vouchington/vouchington-tooling/.github/actions/upload-full-lcov@ccb179f471c0388d354a0bc5c9a02075c0b34101 # v0.72.0
        with:
          suite: backend-native-mv
      - name: Upload full native materialized-view LCOV (attempt 2)
        id: full-lcov-1-retry
        if: ${{ inputs.publish_coverage && steps.full-lcov-1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: vouchington/vouchington-tooling/.github/actions/upload-full-lcov@ccb179f471c0388d354a0bc5c9a02075c0b34101 # v0.72.0
        with:
          suite: backend-native-mv
          name-suffix: -retry
      - name: Require persisted native materialized-view LCOV
        if: ${{ inputs.publish_coverage }}
        timeout-minutes: 1
        env:
          FAMILY: full-lcov
          SUITE: backend-native-mv
          FIRST_OUTCOME: ${{ steps.full-lcov-1.outcome }}
          RETRY_OUTCOME: ${{ steps.full-lcov-1-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - if: failure()
        uses: ./.github/actions/valkey-logs
        timeout-minutes: 1
