name: Test plan shadow

# Shadow mode only: computes the `no-mistakes tests plan` pullRequest plan for the pull request a
# finished area workflow ran, then compares it with that run's JUnit reports. It never changes what
# runs, is not a required check, and cannot fail the pull request.
on:
  workflow_run:
    workflows:
      - Backend
      - Cloudflare Worker
      - Lambdas
      - Tooling
      - Web
    types: [completed]

permissions: {}

concurrency:
  group: test-plan-shadow-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  shadow:
    # Same-repository pull requests only: fork code never runs here. Failed area runs matter most,
    # since a miss is a failure the plan would have skipped.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].base.ref != ''
    runs-on: ubuntu-slim
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    # No job-level token: the plan and comparison steps read pull-request-controlled files.
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      BASE_REF: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
    steps:
      # Areas skipped by path filters upload no JUnit reports, so stop before any checkout.
      - name: Find JUnit reports
        id: reports
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and (.name | test("junit|test-report")))] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.reports.outputs.count != '0'
        with:
          fetch-depth: 1
          persist-credentials: false
        timeout-minutes: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.reports.outputs.count != '0'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: pr
          fetch-depth: 1
          persist-credentials: false
        timeout-minutes: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.reports.outputs.count != '0'
        timeout-minutes: 2
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Resolve pnpm version
        id: pnpm-version
        if: steps.reports.outputs.count != '0'
        timeout-minutes: 1
        uses: vouchington/vouchington-tooling/.github/actions/resolve-pnpm-version@feaaab5f6bb8e49407264b5cc6720447d6f21d35 # v3.9.0
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        if: steps.reports.outputs.count != '0'
        timeout-minutes: 1
        with:
          node-version-file: 'false'
          install: false
          cache: false
          version: ${{ steps.pnpm-version.outputs.version }}
      - name: Download JUnit reports
        if: steps.reports.outputs.count != '0'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir junit
          --pattern '*junit*' --pattern '*test-report*'
      - name: Compute test plans
        if: steps.reports.outputs.count != '0'
        timeout-minutes: 4
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: source .github/workflows/test-plan-shadow-compute-plans.sh
      - name: Compare plans with JUnit results
        if: ${{ !cancelled() && steps.reports.outputs.count != '0' }}
        timeout-minutes: 1
        env:
          JUNIT_DIR: junit
          VITEST_PLAN: ${{ runner.temp }}/plans/vitest.json
          PLAYWRIGHT_PLAN: ${{ runner.temp }}/plans/playwright.json
          OUT_DIR: ${{ runner.temp }}/test-plan-shadow
        run: node ci/test-plan-shadow/main.mts
      - name: Upload shadow report
        if: ${{ !cancelled() && steps.reports.outputs.count != '0' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: test-plan-shadow-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/test-plan-shadow/test-plan-shadow.json
          retention-days: 7
          if-no-files-found: ignore
