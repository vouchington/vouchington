name: Initialize Smoke Test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialize-smoke-test:
    runs-on: ubuntu-latest
    # Chains three full ./dev/initialize passes (monorepo, backend, web) plus
    # PostgreSQL provisioning, each individually allowed up to 5 minutes below.
    # See the .no-mistakes.yml github-actions-job-timeouts allow-list entry for
    # this job (repository default cap is 10m) for the step-budget accounting
    # behind this value.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare disposable worktree
        timeout-minutes: 1
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/voucha-initialize-smoke/worktrees/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          smoke_worktree="$smoke_root/voucha"
          mkdir -p "$smoke_root"
          git worktree add --detach "$smoke_worktree" HEAD

          if [ ! -f "$smoke_worktree/.git" ]; then
            echo "::error::Expected disposable checkout to be a linked worktree"
            exit 1
          fi
          case "$smoke_worktree" in
            */worktrees/*) ;;
            *)
              echo "::error::Disposable worktree path must contain /worktrees/ for isolated dev resources"
              exit 1
              ;;
          esac

          echo "SMOKE_WORKTREE=$smoke_worktree" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Initialize monorepo
        env:
          SKIP_NVM_INSTALL: '1'
        timeout-minutes: 5
        run: cd "$SMOKE_WORKTREE" && ./dev/initialize monorepo
      - name: Ensure PostgreSQL is available
        timeout-minutes: 5
        run: |
          pg_container="voucha-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          docker run -d \
            --name "$pg_container" \
            -e POSTGRES_DB=postgres \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_INITDB_ARGS="-c max_connections=300" \
            -p "127.0.0.1::5432" \
            pgvector/pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
          PGPORT=$(docker port "$pg_container" 5432 | cut -d: -f2)
          if [ -z "$PGPORT" ]; then echo "::error::Failed to retrieve Postgres host port from docker"; exit 1; fi
          export PGHOST=localhost
          export PGPORT
          export PGUSER=postgres
          source "$SMOKE_WORKTREE/dev/lib/worktree-resource-env.sh"
          smoke_db_name=$(worktree_resource_owned_db_name "$SMOKE_WORKTREE")
          export DATABASE_URL="postgres://postgres@localhost:${PGPORT}/${smoke_db_name}"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          for _attempt in $(seq 1 10); do
            if pg_isready; then
              break
            fi
            sleep 1
          done
          pg_isready
      - name: Initialize backend
        env:
          SKIP_NVM_INSTALL: '1'
        timeout-minutes: 5
        run: cd "$SMOKE_WORKTREE" && ./dev/initialize backend
      - name: Initialize web
        env:
          SKIP_NVM_INSTALL: '1'
          S3_AWS_ACCESS_KEY_ID: initialize-smoke-access-key
          S3_AWS_SECRET_ACCESS_KEY: initialize-smoke-secret-key
          S3_BUCKET_IMAGES: initialize-smoke-images
          S3_BUCKET_IMAGE_UPLOADS: initialize-smoke-image-uploads
        timeout-minutes: 5
        run: cd "$SMOKE_WORKTREE" && ./dev/initialize web
