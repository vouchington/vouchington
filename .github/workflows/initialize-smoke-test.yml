name: Initialize Smoke Test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialize-smoke-test:
    runs-on: ubuntu-latest
    # Chains three full ./dev/initialize passes (monorepo, backend, web) plus
    # PostgreSQL provisioning, each individually allowed up to 5 minutes below.
    # See the .no-mistakes/rules/policies.yml github-actions-job-timeouts allow-list entry for
    # this job (repository default cap is 10m) for the step-budget accounting
    # behind this value.
    timeout-minutes: 23
    # These idle services only pre-pull the images ./dev/initialize and prepare-postgres.sh start.
    # The runner retries a failed service image pull, while their own `docker run` fails on one
    # reset GHCR blob fetch (#5513). Keep the refs identical so `docker run` finds them locally;
    # dependency-pin.test.mts checks the Valkey pin. No ports are published, so they cannot
    # collide with the containers the steps start.
    services:
      valkey-image:
        image: ghcr.io/vouchington/dependency-valkey:9.1.0@sha256:16004aceeb7a1246e2d1bb85d353e38120eb440951cb7d0c971b6d63fda5b3d7
      pgvector-image:
        image: ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_HOST_AUTH_METHOD: trust

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
      - name: Prepare disposable worktree
        timeout-minutes: 1
        run: source .github/workflows/initialize-smoke-test/prepare-worktree.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        timeout-minutes: 2
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Resolve pnpm version
        timeout-minutes: 1
        id: pnpm-version
        uses: vouchington/vouchington-tooling/.github/actions/resolve-pnpm-version@e4f21b79d1398af8dd76c70f0775ded58f0c4f80 # v2.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        timeout-minutes: 1
        with:
          node-version-file: 'false'
          install: false
          cache: false
          version: ${{ steps.pnpm-version.outputs.version }}
      - name: Initialize monorepo
        env:
          SKIP_NVM_INSTALL: '1'
        timeout-minutes: 5
        run: cd "$SMOKE_WORKTREE" && ./dev/initialize monorepo
      - name: Ensure PostgreSQL is available
        timeout-minutes: 5
        run: source .github/workflows/initialize-smoke-test/prepare-postgres.sh
      - name: Initialize backend
        env:
          SKIP_NVM_INSTALL: '1'
        timeout-minutes: 5
        run: cd "$SMOKE_WORKTREE" && ./dev/initialize backend
      - name: Initialize web
        env:
          SKIP_NVM_INSTALL: '1'
          S3_AWS_ACCESS_KEY_ID: initialize-smoke-access-key
          S3_AWS_SECRET_ACCESS_KEY: initialize-smoke-secret-key
          S3_BUCKET_IMAGES: initialize-smoke-images
          S3_BUCKET_IMAGE_UPLOADS: initialize-smoke-image-uploads
        timeout-minutes: 5
        run: cd "$SMOKE_WORKTREE" && ./dev/initialize web
