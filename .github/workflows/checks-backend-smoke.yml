name: backend-smoke

# The backend API/worker smoke gate is deliberately separate from Vitest shards. It owns the
# deterministic server-port handoff needed to exercise the running backend. Each database
# consumer restores the shared prepared baseline into its own PostgreSQL service.
on:
  workflow_call:
    inputs:
      prepared_database:
        description: 'Use the prepared backend PostgreSQL artifact from the caller'
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  NODE_ENV: test

jobs:
  prepare-postgres:
    if: ${{ !inputs.prepared_database }}
    uses: ./.github/workflows/prepare-postgres.yml
    permissions:
      actions: read
      contents: read

  smoke:
    needs: [prepare-postgres]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    # The bun leg compiles the api and worker-io Bun executables (#4236 will ship them in the
    # images), so a backend change that breaks `bun build --compile` fails before that switch.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    permissions:
      actions: read
      contents: read
    services:
      postgres:
        image: ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c max_connections=300 -c log_min_messages=log'
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 1s
          --tmpfs /var/lib/postgresql:rw,size=1g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
      - uses: ./.github/actions/start-valkey
        timeout-minutes: 2
      - name: Set service ports
        timeout-minutes: 1
        run: |
          echo "DATABASE_URL=postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-backend
        id: setup-backend
        timeout-minutes: 6
      - uses: ./.github/actions/download-artifact
        timeout-minutes: 2
        with:
          name: backend-postgres-${{ github.run_id }}
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Restore prepared PostgreSQL database
        timeout-minutes: 3
        run: |
          docker run --rm --network host -i \
            ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62 \
            pg_restore --dbname="$DATABASE_URL" --exit-on-error --no-owner --no-privileges \
            < "$RUNNER_TEMP/backend-postgres.dump"
      - name: Compile Bun executables
        if: matrix.runtime == 'bun'
        timeout-minutes: 6
        env:
          # renovate: datasource=npm depName=bun
          BUN_VERSION: 1.4.4
        run: source .github/workflows/checks-backend-smoke-compile-bun.sh
      - name: Allocate backend port
        timeout-minutes: 1
        run: source .github/workflows/checks-backend-smoke-allocate-port.sh
      - name: Smoke test backend
        timeout-minutes: 3
        working-directory: backend
        run: ./scripts/tests/smoke-test-server.sh && ./scripts/tests/smoke-test-worker.sh
      - if: failure()
        uses: ./.github/actions/valkey-logs
        timeout-minutes: 1
