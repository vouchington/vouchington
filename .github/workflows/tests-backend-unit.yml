name: Backend Uncredentialed Docker Tests

on:
  workflow_call:
    outputs:
      shard-total:
        value: ${{ jobs.prep.outputs.shard-total }}
    inputs:
      publish_coverage:
        description: 'Whether to collect coverage and publish the full LCOV for the area coverage gate and Codecov'
        required: false
        type: boolean
        default: false
      diagnostics:
        description: 'Stream Vitest file progress and backend resource samples'
        required: false
        type: boolean
        default: false
      prepared_database:
        description: 'Use the prepared backend PostgreSQL artifact from the caller'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      diagnostics:
        description: 'Stream Vitest file progress and backend resource samples'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  NODE_ENV: test
  VITEST_MAX_WORKERS: '3'

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LINGUA_RS_SKIP_DOWNLOAD: '1'
    permissions:
      contents: read
    outputs:
      shard-matrix: ${{ steps.shards.outputs.matrix }}
      shard-total: ${{ steps.shards.outputs.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 1
      - uses: vouchington/vouchington-tooling/.github/actions/setup-node-pnpm@e4f21b79d1398af8dd76c70f0775ded58f0c4f80 # v2.0.1
        timeout-minutes: 5
        with:
          deadline-seconds: '270'
      - name: Resolve backend-unit shard total
        timeout-minutes: 2
        id: shard-total
        env:
          FILES_PER_SHARD_OVERRIDE: ${{ vars.TEST_BACKEND_UNIT_FILES_PER_SHARD }}
        run: node ci/vitest/shard-total.mts test-backend-unit
      - uses: ./.github/actions/make-shard-matrix
        timeout-minutes: 2
        id: shards
        with:
          total: ${{ steps.shard-total.outputs.shard-total }}

  prepare-postgres:
    if: ${{ !inputs.prepared_database }}
    uses: ./.github/workflows/prepare-postgres.yml
    permissions:
      actions: read
      contents: read

  backend-tests:
    needs: [prep, prepare-postgres]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 29
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prep.outputs.shard-matrix) }}

    services:
      postgres:
        image: ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          # Tests rapidly grow the empty restored baseline; refresh estimates during that growth.
          POSTGRES_INITDB_ARGS: >-
            -c max_connections=300 -c log_min_messages=log
            -c autovacuum_naptime=1s -c autovacuum_analyze_threshold=0
            -c autovacuum_analyze_scale_factor=0
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 1s
          --tmpfs /var/lib/postgresql:rw,size=1g

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 1
      - uses: ./.github/actions/start-valkey
        timeout-minutes: 2
      # Repo-owned download exits once files are on disk; the upstream action hangs (#4328, #5453).
      - name: Download prepared PostgreSQL database
        id: download-postgres
        uses: ./.github/actions/download-artifact
        timeout-minutes: 3
        with:
          name: backend-postgres-${{ github.run_id }}
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Explain prepared PostgreSQL download failure
        if: ${{ failure() && steps.download-postgres.outcome == 'failure' }}
        timeout-minutes: 1
        run: |
          message='Prepared PostgreSQL artifact download failed or did not exit within its 60-second deadline. Backend tests did not start; a transfer-success log does not mean the action returned.'
          echo "::error title=Prepared PostgreSQL artifact download failed::$message"
          printf '### Prepared PostgreSQL artifact download failed\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
      - name: Set service ports
        timeout-minutes: 1
        run: |
          echo "DATABASE_URL=postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
      - name: Restore prepared PostgreSQL database
        timeout-minutes: 3
        run: |
          docker run --rm --network host -i \
            ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62 \
            pg_restore --dbname="$DATABASE_URL" --exit-on-error --no-owner --no-privileges \
            < "$RUNNER_TEMP/backend-postgres.dump"
          # The prepared dump omits planner statistics; analyze its populated baseline before tests.
          docker run --rm --network host \
            ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62 \
            psql --dbname="$DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --command=ANALYZE
      - uses: ./.github/actions/setup-backend
        id: setup-backend
        timeout-minutes: 6
      # Opt-in file progress and resource samples share this step's streamed log. A runner
      # shutdown keeps that log; the JUnit artifact is still skipped when the run is killed.
      # File progress is always buffered to a file and dumped 60s before the step timeout.
      - name: Run backend tests
        id: backend-tests
        env:
          GIT_COMMIT: ${{ github.sha }}
          IMAGE_ORIGIN: http://127.0.0.1:3100
          CI_SHARD: ${{ matrix.shard }}/${{ needs.prep.outputs.shard-total }}
          CI_PROJECT: backend-unit
          VITEST_CI_REPORTERS: run
          VITEST_DIAGNOSTICS: ${{ (inputs.diagnostics || vars.VITEST_DIAGNOSTICS == '1') && '1' || '0' }}
          REQUEST_QUERY_PROFILE_DIAGNOSTICS: '1'
          REQUEST_QUERY_PROFILE_HITS_FILE: backend-query-profile-hits-shard-${{ matrix.shard }}.json
          VITEST_COVERAGE_ENABLED: ${{ inputs.publish_coverage && 'true' || 'false' }}
          VITEST_JUNIT_OUTPUT_FILE: test-report.junit.xml
          VITEST_FILE_PROGRESS_FILE: ${{ github.workspace }}/backend-unit-file-progress.log
          # The step timeout minus 60 seconds; the workflow test pins the relationship.
          DEADLINE_DUMP_AFTER_SECONDS: '540'
        run: source "$GITHUB_WORKSPACE/.github/workflows/tests-backend-unit-run-backend-tests.sh"
        # Fewer, longer-running shards (see ci/vitest/project-ownership.mts) push real per-shard
        # test-execution time higher than the old <5m-per-shard target tolerated; this watchdog
        # now matches the repo's 10-minute-hard-ceiling CI runtime target instead of the stale 5m.
        timeout-minutes: 10
      # Vitest writes the JUnit report when the run finishes, so a shard killed by the step timeout
      # uploads nothing. Per-file durations from these reports size and audit the shards.
      - name: Upload backend-shard-${{ matrix.shard }} JUnit report
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: backend-junit-shard-${{ matrix.shard }}
          path: test-report.junit.xml
          retention-days: 1
          if-no-files-found: ignore
      # The incremental file survives a step killed by its timeout, which writes no JUnit report.
      - name: Upload backend-shard-${{ matrix.shard }} file progress
        if: always()
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: backend-file-progress-shard-${{ matrix.shard }}
          path: backend-unit-file-progress.log
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload backend-shard-${{ matrix.shard }} query-profile hits
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: backend-query-profile-hits-shard-${{ matrix.shard }}
          path: backend-query-profile-hits-shard-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: error
      - name: Preserve full backend-shard-${{ matrix.shard }} LCOV
        timeout-minutes: 1
        # Vitest writes no coverage report after a failed test, so a failed shard has nothing to preserve.
        if: ${{ !cancelled() && inputs.publish_coverage && steps.backend-tests.outcome == 'success' }}
        shell: bash
        run: source "$GITHUB_WORKSPACE/.github/workflows/tests-backend-unit-preserve-full-backend-shard-lcov.sh"
      - name: Upload full backend-shard-${{ matrix.shard }} LCOV to GitHub (attempt 1)
        id: full-lcov-1
        if: ${{ inputs.publish_coverage }}
        continue-on-error: true
        timeout-minutes: 3
        uses: vouchington/vouchington-tooling/.github/actions/upload-full-lcov@e4f21b79d1398af8dd76c70f0775ded58f0c4f80 # v2.0.1
        with:
          suite: backend-shard-${{ matrix.shard }}
      - name: Upload full backend-shard-${{ matrix.shard }} LCOV to GitHub (attempt 2)
        id: full-lcov-1-retry
        if: ${{ inputs.publish_coverage && steps.full-lcov-1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: vouchington/vouchington-tooling/.github/actions/upload-full-lcov@e4f21b79d1398af8dd76c70f0775ded58f0c4f80 # v2.0.1
        with:
          suite: backend-shard-${{ matrix.shard }}
          name-suffix: -retry
      - name: Require a persisted full backend-shard-${{ matrix.shard }} LCOV
        id: full-lcov-outcome-1
        if: ${{ inputs.publish_coverage }}
        timeout-minutes: 1
        env:
          FAMILY: full-lcov
          SUITE: backend-shard-${{ matrix.shard }}
          FIRST_OUTCOME: ${{ steps.full-lcov-1.outcome }}
          RETRY_OUTCOME: ${{ steps.full-lcov-1-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - if: failure()
        uses: ./.github/actions/valkey-logs
        timeout-minutes: 1

  check-query-profile-baseline:
    needs: [prep, backend-tests]
    if: ${{ !cancelled() && needs.backend-tests.result == 'success' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
      # No setup-node: this dependency-free script runs on the ubuntu-slim image's built-in Node
      # (24.x, above package.json engines). Downloading Node 26 from GitHub Releases here twice
      # exceeded the step deadline in merge groups, and slim has no caching benefit.
      - name: Download complete backend-unit query-profile hits
        uses: ./.github/actions/download-artifact
        timeout-minutes: 3
        with:
          pattern: backend-query-profile-hits-shard-*
          path: backend-query-profile-hits
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Check query-profile baseline freshness
        timeout-minutes: 1
        env:
          EXPECTED_SHARDS: ${{ needs.prep.outputs.shard-total }}
        shell: bash
        run: source ci/check-backend-query-profile-manifests.sh
