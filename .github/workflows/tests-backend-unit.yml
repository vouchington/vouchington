name: Backend Uncredentialed Docker Tests

on:
  workflow_call:
    outputs:
      shard-total:
        value: ${{ jobs.prep.outputs.shard-total }}
    inputs:
      publish_coverage:
        description: 'Whether to collect coverage and publish the full LCOV for the area coverage gate and Codecov'
        required: false
        type: boolean
        default: false
      diagnostics:
        description: 'Stream Vitest file progress and backend resource samples'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      diagnostics:
        description: 'Stream Vitest file progress and backend resource samples'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  NODE_ENV: test
  VITEST_MAX_WORKERS: '3'

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      shard-matrix: ${{ steps.shards.outputs.matrix }}
      shard-total: ${{ steps.shards.outputs.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-node-pnpm
        timeout-minutes: 5
      - name: Resolve backend-unit shard total
        timeout-minutes: 2
        id: shard-total
        run: node ci/vitest/shard-total.mts test-backend-unit
      - uses: ./.github/actions/make-shard-matrix
        timeout-minutes: 2
        id: shards
        with:
          total: ${{ steps.shard-total.outputs.shard-total }}

  backend-tests:
    needs: [prep]
    runs-on: ubuntu-latest
    timeout-minutes: 29
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prep.outputs.shard-matrix) }}

    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c max_connections=300 -c log_min_messages=log'
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 1s
          --tmpfs /var/lib/postgresql:rw,size=1g

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/start-valkey
        timeout-minutes: 2
      - name: Set service ports
        timeout-minutes: 1
        run: |
          echo "DATABASE_URL=postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-backend
        id: setup-backend
        timeout-minutes: 6
      - working-directory: backend
        run: node data-stores/psql/migrate.mts
        timeout-minutes: 3
      - name: Verify retained relation bootstrap
        working-directory: backend
        timeout-minutes: 1
        run: node scripts/data-retention/check-retained-relation-bootstrap.mts
      - name: Upload retained relation bootstrap receipt
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: retained-relation-bootstrap-${{ matrix.shard }}
          path: artifacts/retained-relation-bootstrap.json
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      # Opt-in file progress and resource samples share this step's streamed log. A runner
      # shutdown keeps that log; the JUnit artifact is still skipped when the run is killed.
      # File progress is always buffered to a file and dumped 60s before the step timeout.
      - name: Run backend tests
        env:
          GIT_COMMIT: ${{ github.sha }}
          IMAGE_ORIGIN: http://127.0.0.1:3100
          CI_SHARD: ${{ matrix.shard }}/${{ needs.prep.outputs.shard-total }}
          CI_PROJECT: backend-unit
          VITEST_CI_REPORTERS: run
          VITEST_DIAGNOSTICS: ${{ (inputs.diagnostics || vars.VITEST_DIAGNOSTICS == '1') && '1' || '0' }}
          VITEST_COVERAGE_ENABLED: ${{ inputs.publish_coverage && 'true' || 'false' }}
          VITEST_JUNIT_OUTPUT_FILE: test-report.junit.xml
          VITEST_FILE_PROGRESS_FILE: ${{ github.workspace }}/backend-unit-file-progress.log
          # The step timeout minus 60 seconds; the workflow test pins the relationship.
          DEADLINE_DUMP_AFTER_SECONDS: '540'
        run: |
          resource_prefix='[backend-unit-resources]'
          postgres_wait_prefix='[backend-unit-pg-waits]'
          pressure_prefix='[backend-unit-pressure]'
          prefix_lines() {
            while IFS= read -r line || [ -n "$line" ]; do
              printf '%s %s\n' "$1" "$line"
            done
          }
          sample_runner_resources() {
            {
              date -u +%Y-%m-%dT%H:%M:%SZ
              free -m
              df -h "$GITHUB_WORKSPACE"
              df -h -t tmpfs
              # head closes the pipe, so ps exits on SIGPIPE. That is not a sample failure.
              ps -eo pid,rss,pmem,comm --sort=-rss | head -n 15 || true
            } 2>&1 | prefix_lines "$resource_prefix"
          }
          # Prints a row only for a blocked or blocking backend, or one statement running 1.5s or longer.
          sample_postgres_waits() {
            command -v psql >/dev/null 2>&1 || return 0
            PGAPPNAME=ci-pg-wait-sampler PGCONNECT_TIMEOUT=3 PGOPTIONS='-c statement_timeout=3000' \
              psql "$DATABASE_URL" -X -At -F '|' -f ci/backend-unit-pg-waits.sql 2>/dev/null |
              prefix_lines "$postgres_wait_prefix"
          }
          # vmstat columns end in us sy id wa st (user, system, idle, iowait, hypervisor steal).
          sample_runner_pressure() {
            {
              date -u +%H:%M:%S
              vmstat 1 2 | tail -n 1
              for resource in cpu io memory; do
                if [ -r "/proc/pressure/$resource" ]; then
                  printf '%s %s\n' "$resource" "$(head -n 1 "/proc/pressure/$resource")"
                fi
              done
            } 2>&1 | tr '\n' ' ' | prefix_lines "$pressure_prefix"
          }
          # Runs once, shortly before the step timeout kills this shell. The run is then
          # stuck or only slow; the log names unfinished files with their running time, the
          # slowest finished files, and the largest processes.
          dump_deadline_state() {
            printf '[backend-unit-deadline] step deadline in 60s\n'
            node ci/backend-unit-unfinished-files.mts "$VITEST_FILE_PROGRESS_FILE" || true
            { ps -eo pid,rss,pmem,etime,args --sort=-rss | head -n 15 || true; } 2>&1 |
              prefix_lines '[backend-unit-deadline] ps'
          }
          sampler_pids=
          start_deadline_dump() {
            (
              set +e
              set +o pipefail
              sleep_pid=
              # TERM can arrive after sleep starts but before sleep_pid=$! records it.
              trap 'for child_pid in $(jobs -pr); do kill "$child_pid" 2>/dev/null || true; wait "$child_pid" 2>/dev/null || true; done; exit 0' TERM INT
              sleep "$DEADLINE_DUMP_AFTER_SECONDS" &
              sleep_pid=$!
              wait "${sleep_pid}" && dump_deadline_state
            ) &
            sampler_pids="${sampler_pids} $!"
          }
          start_sampler() {
            (
              set +e
              set +o pipefail
              sleep_pid=
              trap 'for child_pid in $(jobs -pr); do kill "$child_pid" 2>/dev/null || true; wait "$child_pid" 2>/dev/null || true; done; exit 0' TERM INT
              while true; do
                "$1"
                sleep "$2" &
                sleep_pid=$!
                wait "${sleep_pid}"
                sleep_pid=
              done
            ) &
            sampler_pids="${sampler_pids} $!"
          }
          stop_samplers() {
            # TERM hits each sampler shell, which stops its sleep child before exiting.
            for sampler_pid in ${sampler_pids}; do
              kill -TERM "${sampler_pid}" 2>/dev/null || true
            done
            for sampler_pid in ${sampler_pids}; do
              wait "${sampler_pid}" 2>/dev/null || true
            done
            return 0
          }
          trap stop_samplers EXIT
          start_deadline_dump
          if [ "$VITEST_DIAGNOSTICS" = 1 ]; then
            start_sampler sample_runner_resources 15
            start_sampler sample_postgres_waits 0.5
            start_sampler sample_runner_pressure 2
          fi
          pnpm exec ./ci/with-node-test-options vitest run --bail=3 --project backend/analytics-integration --project backend-data-stores --project backend-platform-stats-cache --project backend-mocks --project backend-migration-initializers --project backend-real-glide-mq --shard ${{ matrix.shard }}/${{ needs.prep.outputs.shard-total }}
        # Fewer, longer-running shards (see ci/vitest/project-ownership.mts) push real per-shard
        # test-execution time higher than the old <5m-per-shard target tolerated; this watchdog
        # now matches the repo's 10-minute-hard-ceiling CI runtime target instead of the stale 5m.
        timeout-minutes: 10
      # Vitest writes the JUnit report when the run finishes, so a shard killed by the step timeout
      # uploads nothing. Per-file durations from these reports size and audit the shards.
      - name: Upload backend-shard-${{ matrix.shard }} JUnit report
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: backend-junit-shard-${{ matrix.shard }}
          path: test-report.junit.xml
          retention-days: 1
          if-no-files-found: ignore
      # The incremental file survives a step killed by its timeout, which writes no JUnit report.
      - name: Upload backend-shard-${{ matrix.shard }} file progress
        if: always()
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: backend-file-progress-shard-${{ matrix.shard }}
          path: backend-unit-file-progress.log
          retention-days: 1
          if-no-files-found: ignore
      - name: Preserve full backend-shard-${{ matrix.shard }} LCOV
        timeout-minutes: 1
        if: ${{ !cancelled() && inputs.publish_coverage }}
        shell: bash
        run: |
          if [ ! -s coverage/lcov.info ]; then
            echo "::error::Backend shard did not write coverage/lcov.info" >&2
            exit 1
          fi
          rm -rf coverage-merge-input
          mkdir -p coverage-full coverage-merge-input/parent
          cp coverage/lcov.info coverage-merge-input/parent/lcov.info
          ./ci/node_modules/.bin/coverage-check merge \
            --artifacts coverage-merge-input \
            --output coverage-full/lcov.info
      - name: Upload full backend-shard-${{ matrix.shard }} LCOV to GitHub (attempt 1)
        id: full-lcov-1
        if: ${{ inputs.publish_coverage }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-full-lcov
        with:
          suite: backend-shard-${{ matrix.shard }}
      - name: Upload full backend-shard-${{ matrix.shard }} LCOV to GitHub (attempt 2)
        id: full-lcov-1-retry
        if: ${{ inputs.publish_coverage && steps.full-lcov-1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-full-lcov
        with:
          suite: backend-shard-${{ matrix.shard }}
          name-suffix: -retry
      - name: Require a persisted full backend-shard-${{ matrix.shard }} LCOV
        id: full-lcov-outcome-1
        if: ${{ inputs.publish_coverage }}
        timeout-minutes: 1
        env:
          FAMILY: full-lcov
          SUITE: backend-shard-${{ matrix.shard }}
          FIRST_OUTCOME: ${{ steps.full-lcov-1.outcome }}
          RETRY_OUTCOME: ${{ steps.full-lcov-1-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - if: failure()
        uses: ./.github/actions/valkey-logs
        timeout-minutes: 1
