name: Backend Uncredentialed Docker Tests

on:
  workflow_call:
    outputs:
      shard-total:
        value: ${{ jobs.prep.outputs.shard-total }}
    inputs:
      publish_coverage:
        description: 'Whether to collect coverage and publish the full LCOV for the area coverage gate and Codecov'
        required: false
        type: boolean
        default: false
      publish_coverage_pair:
        description: 'Whether to also publish the sparse coverage pair for the ci.yml Patch Coverage consumer'
        required: false
        type: boolean
        default: false
      upload_vitest_blob_artifact:
        description: 'Whether to upload Vitest blob artifacts to GitHub as a fallback'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      upload_vitest_blob_artifact:
        description: 'Whether to upload Vitest blob artifacts to GitHub as a fallback'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  NODE_ENV: test
  VITEST_MAX_WORKERS: '3'

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      shard-matrix: ${{ steps.shards.outputs.matrix }}
      shard-total: ${{ steps.shards.outputs.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-node-pnpm
        timeout-minutes: 5
      - name: Resolve backend-unit shard total
        id: shard-total
        env:
          FILES_PER_SHARD_OVERRIDE: ${{ vars.TEST_BACKEND_UNIT_FILES_PER_SHARD }}
        run: node ci/vitest/shard-total.mts test-backend-unit
      - uses: ./.github/actions/make-shard-matrix
        id: shards
        with:
          total: ${{ steps.shard-total.outputs.shard-total }}

  backend-tests:
    needs: [prep]
    runs-on: ubuntu-latest
    timeout-minutes: 29
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prep.outputs.shard-matrix) }}

    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c max_connections=300 -c log_min_messages=log'
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql:rw,size=1g
      valkey:
        image: valkey/valkey-bundle:9.1.0@sha256:16004aceeb7a1246e2d1bb85d353e38120eb440951cb7d0c971b6d63fda5b3d7
        ports:
          - 6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /data:rw,size=64m

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/fetch-base-ref
        if: ${{ inputs.publish_coverage_pair }}
      - name: Set service ports
        timeout-minutes: 1
        run: |
          echo "DATABASE_URL=postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
          echo "VALKEY_URL=redis://localhost:${{ job.services.valkey.ports['6379'] }}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-backend
        id: setup-backend
        timeout-minutes: 6
      - working-directory: backend
        run: node data-stores/psql/migrate.mts
        timeout-minutes: 3
      - name: Run backend tests
        env:
          GIT_COMMIT: ${{ github.sha }}
          IMAGE_ORIGIN: http://127.0.0.1:3100
          CI_SHARD: ${{ matrix.shard }}/${{ needs.prep.outputs.shard-total }}
          CI_PROJECT: backend-unit
          VITEST_CI_REPORTERS: run
          VITEST_COVERAGE_ENABLED: ${{ inputs.publish_coverage && 'true' || 'false' }}
          VITEST_JUNIT_OUTPUT_FILE: test-report.junit.xml
          VITEST_BLOB_OUTPUT_FILE: .vitest-reports/backend-shard-${{ matrix.shard }}.json
          VITEST_FORK_DIAGNOSTIC_DIR: .vitest-reports/fork-diagnostics-${{ matrix.shard }}
        run: pnpm exec ./ci/with-node-test-options vitest run --bail=3 --project backend/analytics-integration --project backend-data-stores --project backend-mocks --project backend-real-glide-mq --shard ${{ matrix.shard }}/${{ needs.prep.outputs.shard-total }}
        # Fewer, longer-running shards (see ci/vitest/project-ownership.mts) push real per-shard
        # test-execution time higher than the old <5m-per-shard target tolerated; this watchdog
        # now matches the repo's 10-minute-hard-ceiling CI runtime target instead of the stale 5m.
        timeout-minutes: 10
      - name: Vitest fork diagnostic report summary
        if: failure()
        continue-on-error: true
        timeout-minutes: 1
        env:
          VITEST_FORK_DIAGNOSTIC_DIR: .vitest-reports/fork-diagnostics-${{ matrix.shard }}
        run: node ci/vitest-diagnostic-report-summary.mts
      - if: failure()
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          overwrite: true
          name: vitest-fork-diagnostics-backend-shard-${{ matrix.shard }}
          path: .vitest-reports/fork-diagnostics-${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: ignore
      - name: Preserve full backend-shard-${{ matrix.shard }} LCOV
        if: ${{ !cancelled() && inputs.publish_coverage }}
        shell: bash
        run: |
          if [ -f coverage/lcov.info ]; then
            mkdir -p coverage-full
            cp coverage/lcov.info coverage-full/lcov.info
          fi
      - name: Stamp backend-shard-${{ matrix.shard }} coverage provenance
        id: coverage-stamp-1
        timeout-minutes: 1
        if: ${{ !cancelled() && inputs.publish_coverage_pair }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_SHARD: ${{ matrix.shard }}/${{ needs.prep.outputs.shard-total }}
        run: node ci/coverage-manifest.mts patch "backend-shard-${{ matrix.shard }}" "$(node -p "JSON.parse(require('node:fs').readFileSync('node_modules/vitest/package.json','utf8')).version")"
      - name: Upload backend-shard-${{ matrix.shard }} vitest blob to GitHub (fallback)
        id: vitest-blob-fallback-1
        if: ${{ !cancelled() && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-blob
        with:
          suite: backend-shard-${{ matrix.shard }}
      - name: Upload backend-shard-${{ matrix.shard }} vitest blob to GitHub (fallback attempt 2)
        id: vitest-blob-fallback-1-retry
        if: ${{ !cancelled() && inputs.upload_vitest_blob_artifact && steps.vitest-blob-fallback-1.outcome == 'failure' }}
        timeout-minutes: 3
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-blob
        with:
          suite: backend-shard-${{ matrix.shard }}
          name-suffix: -retry
      - name: Require a persisted backend-shard-${{ matrix.shard }} vitest blob
        id: vitest-blob-outcome-1
        if: ${{ !cancelled() && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        env:
          FAMILY: vitest-blob
          SUITE: backend-shard-${{ matrix.shard }}
          FIRST_OUTCOME: ${{ steps.vitest-blob-fallback-1.outcome }}
          RETRY_OUTCOME: ${{ steps.vitest-blob-fallback-1-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - name: Persist backend-shard-${{ matrix.shard }} Vitest report attempt (attempt 1)
        id: vitest-report-attempt-1
        if: ${{ always() && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-report-attempt
        with:
          suite: backend-shard-${{ matrix.shard }}
      - name: Persist backend-shard-${{ matrix.shard }} Vitest report attempt (attempt 2)
        id: vitest-report-attempt-1-retry
        if: ${{ always() && inputs.upload_vitest_blob_artifact && steps.vitest-report-attempt-1.outcome == 'failure' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/upload-vitest-report-attempt
        with:
          suite: backend-shard-${{ matrix.shard }}
          name-suffix: -retry
      - name: Assert backend-shard-${{ matrix.shard }} Vitest report attempt persisted
        id: vitest-report-attempt-1-outcome
        if: ${{ !cancelled() && inputs.upload_vitest_blob_artifact }}
        timeout-minutes: 1
        env:
          FAMILY: vitest-report-attempt
          SUITE: backend-shard-${{ matrix.shard }}
          FIRST_OUTCOME: ${{ steps.vitest-report-attempt-1.outcome }}
          RETRY_OUTCOME: ${{ steps.vitest-report-attempt-1-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - name: Upload backend-shard-${{ matrix.shard }} coverage pair to GitHub (fallback attempt 1)
        id: coverage-fallback-1-1
        if: ${{ !cancelled() && inputs.publish_coverage_pair && steps.coverage-stamp-1.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-coverage-pair
        with:
          suite: backend-shard-${{ matrix.shard }}
      - name: Upload backend-shard-${{ matrix.shard }} coverage pair to GitHub (fallback attempt 2)
        id: coverage-fallback-2-1
        if: ${{ !cancelled() && inputs.publish_coverage_pair && steps.coverage-stamp-1.outcome == 'success' && steps.coverage-fallback-1-1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-coverage-pair
        with:
          suite: backend-shard-${{ matrix.shard }}
          name-suffix: -retry
      - name: Require a persisted backend-shard-${{ matrix.shard }} coverage pair
        id: coverage-outcome-1
        if: ${{ !cancelled() && inputs.publish_coverage_pair && steps.coverage-stamp-1.outcome == 'success' }}
        timeout-minutes: 1
        env:
          FAMILY: coverage-pair
          SUITE: backend-shard-${{ matrix.shard }}
          FIRST_OUTCOME: ${{ steps.coverage-fallback-1-1.outcome }}
          RETRY_OUTCOME: ${{ steps.coverage-fallback-2-1.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
      - name: Upload full backend-shard-${{ matrix.shard }} LCOV to GitHub (attempt 1)
        id: full-lcov-1
        if: ${{ inputs.publish_coverage }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-full-lcov
        with:
          suite: backend-shard-${{ matrix.shard }}
      - name: Upload full backend-shard-${{ matrix.shard }} LCOV to GitHub (attempt 2)
        id: full-lcov-1-retry
        if: ${{ inputs.publish_coverage && steps.full-lcov-1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/upload-full-lcov
        with:
          suite: backend-shard-${{ matrix.shard }}
          name-suffix: -retry
      - name: Require a persisted full backend-shard-${{ matrix.shard }} LCOV
        id: full-lcov-outcome-1
        if: ${{ inputs.publish_coverage }}
        timeout-minutes: 1
        env:
          FAMILY: full-lcov
          SUITE: backend-shard-${{ matrix.shard }}
          FIRST_OUTCOME: ${{ steps.full-lcov-1.outcome }}
          RETRY_OUTCOME: ${{ steps.full-lcov-1-retry.outcome }}
        run: node ci/artifact-upload-outcome.mts "$FAMILY" "$SUITE" "$FIRST_OUTCOME" "$RETRY_OUTCOME"
