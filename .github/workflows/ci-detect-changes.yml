name: CI detect changes

on:
  workflow_call:
    outputs:
      backend:
        value: ${{ jobs.detect-changes.outputs.backend }}
      backend-credentialed:
        value: ${{ jobs.detect-changes.outputs.backend-credentialed }}
      web:
        value: ${{ jobs.detect-changes.outputs.web }}
      storybook:
        value: ${{ jobs.detect-changes.outputs.storybook }}
      playwright:
        value: ${{ jobs.detect-changes.outputs.playwright }}
      web-integration:
        value: ${{ jobs.detect-changes.outputs.web-integration }}
      postgres-schema:
        value: ${{ jobs.detect-changes.outputs.postgres-schema }}
      ts-shared:
        value: ${{ jobs.detect-changes.outputs.ts-shared }}
      workflow-action-changes:
        value: ${{ jobs.detect-changes.outputs.workflow-action-changes }}
      tooling:
        value: ${{ jobs.detect-changes.outputs.tooling }}
      cloudflare-worker:
        value: ${{ jobs.detect-changes.outputs.cloudflare-worker }}
      lambdas:
        value: ${{ jobs.detect-changes.outputs.lambdas }}
      explain-analyze:
        value: ${{ jobs.detect-changes.outputs.explain-analyze }}
      build-backend:
        value: ${{ jobs.detect-changes.outputs.build-backend }}
      build-backend-infra:
        value: ${{ jobs.detect-changes.outputs.build-backend-infra }}
      build-web:
        value: ${{ jobs.detect-changes.outputs.build-web }}
      build-web-infra:
        value: ${{ jobs.detect-changes.outputs.build-web-infra }}
      shell-scripts:
        value: ${{ jobs.detect-changes.outputs.shell-scripts }}
      portability:
        value: ${{ jobs.detect-changes.outputs.portability }}
      playwright-credentialed:
        value: ${{ jobs.detect-changes.outputs.playwright-credentialed }}
      docs-only:
        value: ${{ jobs.detect-changes.outputs.docs-only }}
      trusted-secret-context:
        value: ${{ jobs.detect-changes.outputs.trusted-secret-context }}
      dependency-bot-test-context:
        value: ${{ jobs.detect-changes.outputs.dependency-bot-test-context }}
      area-backend:
        value: ${{ jobs.detect-changes.outputs.area-backend }}
      area-web:
        value: ${{ jobs.detect-changes.outputs.area-web }}
      area-cloudflare-worker:
        value: ${{ jobs.detect-changes.outputs.area-cloudflare-worker }}
      area-lambdas:
        value: ${{ jobs.detect-changes.outputs.area-lambdas }}
      area-tooling:
        value: ${{ jobs.detect-changes.outputs.area-tooling }}
      i18n-route-bounds:
        value: ${{ jobs.detect-changes.outputs.i18n-route-bounds }}

permissions: {}

jobs:
  detect-changes:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      backend-credentialed: ${{ steps.filter.outputs.backend-credentialed }}
      web: ${{ steps.refine-runtime-web.outputs.runtime-web }}
      storybook: ${{ steps.refine-runtime-web.outputs.runtime-storybook }}
      playwright: ${{ steps.refine-runtime-web.outputs.runtime-playwright }}
      web-integration: ${{ steps.refine-runtime-web.outputs.runtime-web-integration }}
      postgres-schema: ${{ steps.filter.outputs.postgres-schema }}
      ts-shared: ${{ steps.filter.outputs.ts-shared }}
      workflow-action-changes: ${{ steps.filter.outputs.workflow-action-changes }}
      tooling: ${{ steps.filter.outputs.tooling }}
      cloudflare-worker: ${{ steps.filter.outputs.cloudflare-worker }}
      lambdas: ${{ steps.filter.outputs.lambdas }}
      explain-analyze: ${{ steps.filter.outputs.explain-analyze }}
      build-backend: ${{ steps.refine-runtime-web.outputs.runtime-build-backend }}
      build-backend-infra: ${{ steps.filter.outputs.build-backend-infra }}
      build-web: ${{ steps.refine-runtime-web.outputs.runtime-build-web }}
      build-web-infra: ${{ steps.filter.outputs.build-web-infra }}
      shell-scripts: ${{ steps.filter.outputs.shell-scripts }}
      portability: ${{ steps.filter.outputs.portability }}
      playwright-credentialed: ${{ steps.filter.outputs.playwright-credentialed }}
      docs-only: ${{ steps.docs-check.outputs.docs-only }}
      trusted-secret-context: ${{ steps.trusted-context.outputs.trusted }}
      dependency-bot-test-context: ${{ steps.trusted-context.outputs.dependency-bot-test }}
      area-backend: ${{ steps.areas.outputs.backend }}
      area-web: ${{ steps.areas.outputs.web }}
      area-cloudflare-worker: ${{ steps.areas.outputs.cloudflare-worker }}
      area-lambdas: ${{ steps.areas.outputs.lambdas }}
      area-tooling: ${{ steps.areas.outputs.tooling }}
      i18n-route-bounds: ${{ steps.areas.outputs.i18n-route-bounds }}
    steps:
      # The checkout is one commit. fetch-base-ref then fetches only that commit's ancestry (both
      # parents of a pull request's merge commit, which the docs-only check diffs as HEAD^1..HEAD)
      # and the base branch (the merge-queue range's merge base). It never fetches every branch,
      # and the blobless filter skips file contents because every diff here reads names only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
      - uses: vouchington/vouchington-tooling/.github/actions/fetch-base-ref@e4f21b79d1398af8dd76c70f0775ded58f0c4f80 # v2.0.1
        timeout-minutes: 2
        with:
          filter: blob:none
      - name: Resolve merge queue diff range
        timeout-minutes: 2
        id: merge-queue-range
        if: github.event_name == 'merge_group'
        run: source .github/workflows/ci-detect-changes/merge-queue-range.sh
      # Full runs have no change set, so they are never docs-only.
      - name: Check for docs-only changes
        timeout-minutes: 2
        id: docs-check
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: source .github/workflows/ci-detect-changes/docs-check.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_QUEUE_BASE_SHA: ${{ steps.merge-queue-range.outputs.base }}
          MERGE_QUEUE_HEAD_SHA: ${{ steps.merge-queue-range.outputs.head }}
      - name: Check for trusted secret context
        timeout-minutes: 2
        id: trusted-context
        run: source .github/workflows/ci-detect-changes/trusted-context.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          BASE_REPO: ${{ github.repository }}
      # Full runs (nightly schedule, manual dispatch) select every area without a diff; a schedule
      # payload carries no base for paths-filter to compare against. On pull requests the action
      # ignores base/ref and reads the PR API file list, which is the layer's own files.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        timeout-minutes: 2
        id: filter
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          base: ${{ steps.merge-queue-range.outputs.base }}
          ref: ${{ steps.merge-queue-range.outputs.head }}
          filters: .github/ci-path-filters.yml
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        timeout-minutes: 2
        id: refine-runtime-web
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          base: ${{ steps.merge-queue-range.outputs.base }}
          ref: ${{ steps.merge-queue-range.outputs.head }}
          predicate-quantifier: every
          filters: .github/ci-path-filters.yml
      # One boolean per area workflow: the union of its suites' filters. A touched area runs its
      # whole suite; docs-only changes select nothing; workflow/action changes select everything.
      - name: Resolve area selection
        timeout-minutes: 2
        id: areas
        run: source .github/workflows/ci-detect-changes/areas.sh
        env:
          FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          DOCS_ONLY: ${{ steps.docs-check.outputs.docs-only }}
          WORKFLOW_ACTION_CHANGES: ${{ steps.filter.outputs.workflow-action-changes }}
          BACKEND: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.backend-credentialed == 'true' || steps.filter.outputs.postgres-schema == 'true' || steps.filter.outputs.explain-analyze == 'true' || steps.refine-runtime-web.outputs.runtime-build-backend == 'true' || steps.filter.outputs.build-backend-infra == 'true' }}
          WEB: ${{ steps.refine-runtime-web.outputs.runtime-web == 'true' || steps.refine-runtime-web.outputs.runtime-storybook == 'true' || steps.refine-runtime-web.outputs.runtime-playwright == 'true' || steps.refine-runtime-web.outputs.runtime-web-integration == 'true' || steps.filter.outputs.playwright-credentialed == 'true' || steps.refine-runtime-web.outputs.runtime-build-web == 'true' || steps.filter.outputs.build-web-infra == 'true' }}
          CLOUDFLARE_WORKER: ${{ steps.filter.outputs.cloudflare-worker }}
          LAMBDAS: ${{ steps.filter.outputs.lambdas }}
          TOOLING: ${{ steps.filter.outputs.ts-shared == 'true' || steps.filter.outputs.tooling == 'true' || steps.filter.outputs.portability == 'true' || steps.filter.outputs.shell-scripts == 'true' }}
          I18N_ROUTE_BOUNDS: ${{ steps.filter.outputs.i18n-route-bounds }}
