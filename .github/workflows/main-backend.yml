name: Main CI (backend)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-backend.yml'
      - '.github/workflows/publish-backend-images.yml'
      - '.github/ci-path-filters.yml'
      - '.github/actions/build-backend-images/**'
      - '.dockerignore'
      - '.hadolint.yaml'
      - '.github/workflows/tests-backend-unit.yml'
      - '.github/workflows/checks-backend-smoke.yml'
      - '.github/workflows/tests-backend-modules.yml'
      - '.github/workflows/tests-backend-credentialed.yml'
      - '.github/workflows/tests-postgres-schema.yml'
      - '.github/worker-io-automation.env'
      - '.github/workflows/checks-static.yml'
      - '.github/actions/**'
      - '.squawk.toml'
      - '.trivyignore.yaml'
      - 'api-fixtures/**'
      - 'backend/**'
      - 'email-templates/**'
      - 'localization/**'
      - 'dev/localization/**'
      - 'static-code-analysis/docker-deploy/prune-deployed-runtime-deps.mts'
      - 'static-code-analysis/docker-deploy/restore-deployed-workspace-packages.mts'
      - 'ts-shared/**'
      - 'test-helpers/**'
      - 'ci/prepare-trivy-db.sh'
      - 'ci/image-promotion.mts'
      - 'ci/image-promotion-cli.mts'
      - 'ci/image-targets.mts'
      - 'ci/bounded-exec.mts'
      - 'ci/image-provenance.mts'
      - 'ci/image-provenance-verify.mts'
      - 'ci/image-registry.mts'
      - 'ci/image-registry-http.mts'
      - 'ci/image-registry-manifest.mts'
      - 'ci/verify-main-ancestor.sh'
      - 'ci/allocate-browser-safe-ports.py'
      - 'ci/package.json'
      - 'vitest.config.mts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

concurrency:
  group: ${{ github.run_attempt == 1 && 'main-backend' || format('main-backend-retry-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect-image-publication:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.image-paths.outputs.runtime-build-backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: image-paths
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          predicate-quantifier: every
          filters: .github/ci-path-filters.yml

  backend-deploy-intent:
    needs: detect-image-publication
    if: needs.detect-image-publication.outputs.publish == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: ':'

  test-backend-modules:
    needs: [static-checks]
    if: ${{ !cancelled() && needs.static-checks.result == 'success' }}
    uses: ./.github/workflows/tests-backend-modules.yml
    permissions:
      actions: read
      contents: read

  test-backend-unit:
    needs: [static-checks]
    if: ${{ !cancelled() && needs.static-checks.result == 'success' }}
    uses: ./.github/workflows/tests-backend-unit.yml
    permissions:
      actions: read
      contents: read
    secrets: inherit

  backend-smoke:
    needs: [static-checks]
    if: ${{ !cancelled() && needs.static-checks.result == 'success' }}
    uses: ./.github/workflows/checks-backend-smoke.yml
    permissions:
      actions: read
      contents: read

  test-backend-credentialed:
    needs: [static-checks]
    if: ${{ !cancelled() && needs.static-checks.result == 'success' }}
    uses: ./.github/workflows/tests-backend-credentialed.yml
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      trusted_secret_context: true
    secrets: inherit

  postgres-schema-tests:
    needs: [static-checks]
    if: ${{ !cancelled() && needs.static-checks.result == 'success' }}
    uses: ./.github/workflows/tests-postgres-schema.yml
    permissions:
      actions: read
      contents: read
    secrets: inherit

  # Verifies the merge-group-published backend image set and reuses its immutable digests. An
  # authenticated missing manifest triggers one build through the same smoke/Trivy composite used
  # by PR validation, followed by missing-only publication and complete-set verification.
  #
  # Gated on static-checks only, like every other job here, so it runs alongside the test jobs
  # rather than after them. A revision whose tests later fail still leaves images in GHCR, but
  # nothing ever deploys them: dispatch-completed-deploy.yml fires only when this whole workflow
  # concludes successfully, and vouchington-infra resolves digests solely for the revision its
  # preflight verified. Those unreferenced images are reaped by ghcr-cleanup.yml.
  publish-backend-images:
    needs: [detect-image-publication, static-checks]
    if: >-
      !cancelled() &&
      needs.detect-image-publication.outputs.publish == 'true' &&
      needs.static-checks.result == 'success'
    uses: ./.github/workflows/publish-backend-images.yml
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      trusted_secret_context: true
    secrets: inherit

  static-checks:
    uses: ./.github/workflows/checks-static.yml
    with:
      backend: true
    permissions:
      contents: read
      actions: read
