name: Claude OpenRouter Code Reviewer

on:
  pull_request:
    # closed and converted_to_draft are included only so their run enters the concurrency group
    # below and coalesces away a still-queued review. closed needs an explicit if: exclusion below
    # since draft stays false; converted_to_draft needs none because the event's
    # pull_request.draft is already true by the time it fires, which the existing draft == false
    # check already excludes.
    types: [opened, reopened, ready_for_review, synchronize, closed, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: claude-openrouter-code-reviewer-${{ github.event.pull_request.number }}
  # Queued reviews for the same PR coalesce to the latest commit; an already-running review is
  # never cancelled, only a still-queued one is superseded by a newer push.
  cancel-in-progress: false

jobs:
  claude-openrouter-code-reviewer:
    if: >-
      vars.CLAUDE_OPENROUTER_CODE_REVIEW_ENABLED == 'true' &&
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    concurrency:
      group: claude-openrouter-code-reviewer-fleet-admission
      # Repo-wide cap: only 1 run of this reviewer executes at a time across all PRs, so the
      # shared 4-runner "Code Review" pool never oversubscribes. queue: max (FIFO) so a distinct
      # PR's request is only delayed, never silently dropped by coalescing — same rationale as
      # harness-dispatch-fleet-admission in fix-issue.yml and its siblings.
      queue: max
      cancel-in-progress: false
    uses: vouchington/vouchington-tooling/.github/workflows/code-review.yml@37587cbcd959b9f94ae3efe254d422890b0c15c8 # v0.16.1
    permissions:
      actions: read
      checks: write # both callee jobs declare it; a caller cannot grant less than the callee requests
      contents: read
      issues: read # the review job's context materializer reads issues linked from the PR body
      pull-requests: write
      id-token: write # the callee's poster job declares it; a caller cannot grant less than the callee requests
    with:
      pr_number: ${{ github.event.pull_request.number }}
      expected_head_sha: ${{ github.event.pull_request.head.sha }}
      expected_base_sha: ${{ github.event.pull_request.base.sha }}
      trusted_prompt_ref: ${{ github.event.pull_request.base.sha }}
      provider_name: Claude (OpenRouter)
      token_source: github-token
      anthropic_base_url: https://openrouter.ai/api
      # minimax/minimax-m3:free has 0 serving endpoints on OpenRouter as of #11267 (every run
      # 404s); thinkingmachines/inkling:free has 1 live endpoint and tool-calling support.
      anthropic_default_opus_model: thinkingmachines/inkling:free # intentional: single $0 model for all tiers; split when a paid tier is approved
      anthropic_default_sonnet_model: thinkingmachines/inkling:free
      anthropic_default_haiku_model: thinkingmachines/inkling:free
      runs_on: '["ubuntu-latest"]'
    secrets:
      provider_api_token: ${{ secrets.OPENROUTER_FREE_API_KEY }}
