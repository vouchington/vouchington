name: Gitleaks

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks-scan:
    uses: vouchington/vouchington-tooling/.github/workflows/gitleaks.yml@342444cffceccb5ea0c1fca9d264be6af79d9fd5 # v0.83.0
    with:
      version: 8.30.1

  # Keeps the required `gitleaks` check name: a reusable-workflow job reports as
  # `<caller job> / <callee job>`.
  gitleaks:
    needs: [gitleaks-scan]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Require the gitleaks scan to succeed
        timeout-minutes: 1
        env:
          SCAN_RESULT: ${{ needs.gitleaks-scan.result }}
        run: test "$SCAN_RESULT" = success
