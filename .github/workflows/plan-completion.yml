name: Plan completion advisory

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: plan-completion-main
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: vouchington/vouchington-tooling/.github/actions/setup-node-pnpm@bd89d56c941ff4aa3b3c09edf1eb597ab93f1718 # v0.85.2
        timeout-minutes: 5
        with:
          deadline-seconds: '270'
          install-scripts: 'false'
      - name: Audit open Plans
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/plan-completion.mts
