name: Plan completion advisory

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: plan-completion-main
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
        id: checkout
        continue-on-error: true
        timeout-minutes: 1
      # Retry once after a network stall; the first attempt's failure stays in the log.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
        if: steps.checkout.outcome != 'success'
        timeout-minutes: 1
      - uses: vouchington/vouchington-tooling/.github/actions/setup-node-pnpm@273d313fc952c000baa7ee36056ca0e403666581 # v3.6.4
        timeout-minutes: 5
        with:
          deadline-seconds: '270'
          install-scripts: 'false'
      - name: Audit open Plans
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/plan-completion.mts
