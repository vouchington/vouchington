name: Plan completion advisory

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: plan-completion-main
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 1
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Audit open Plans
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/plan-completion.mts
