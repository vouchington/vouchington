name: Static

# Repository-wide static analysis on every pull request and merge group. It has no `changes` job:
# no-mistakes' tsconfig-gate-coverage rule counts a typecheck only when this root reaches it
# provably, and a `needs:` on a reusable job defeats that. The `static` job is the required check.
# nightly.yml calls this workflow for the full run. See docs/development/ci.md.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  workflow_call:
  workflow_dispatch:

# A literal prefix: under workflow_call, github.workflow names the caller, which would collide the
# area calls nightly.yml makes.
concurrency:
  group: static-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  static-code-analysis:
    uses: ./.github/workflows/static-code-analysis.yml
    permissions:
      contents: read
      issues: read

  static:
    name: static
    if: ${{ !cancelled() || github.event_name == 'merge_group' }}
    needs: [static-code-analysis]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASH_ENV: /dev/null
    permissions:
      contents: read
    steps:
      - uses: vouchington/vouchington-tooling/.github/actions/ci-required-result-gate@e4f21b79d1398af8dd76c70f0775ded58f0c4f80 # v2.0.1
        timeout-minutes: 1
        with:
          results: >-
            {"static-code-analysis":{"result":"${{ needs.static-code-analysis.result }}"}}

  # Merge-group fail fast: when a gate-feeding suite fails, cancel this run so the required gate
  # fails on that job now instead of after the slowest suite. These jobs check out nothing and run no
  # repository code, so the `actions: write` token never meets pull-request-controlled content. See
  # docs/development/ci/workflows/reference-merge-queue-fail-fast.md.

  cancel-static-code-analysis:
    needs: [static-code-analysis]
    if: ${{ failure() && needs.static-code-analysis.result == 'failure' && github.event_name == 'merge_group' }}
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Cancel the merge-group run so the queue ejects this entry now
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          output=$(gh api --method POST "repos/$GH_REPO/actions/runs/$RUN_ID/cancel" 2>&1) && exit 0
          [[ "$output" == *"HTTP 409"* ]] && echo "::warning::Run $RUN_ID already finished: $output" && exit 0
          echo "$output" >&2; exit 1
