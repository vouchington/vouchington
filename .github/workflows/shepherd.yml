name: Automation Shepherd

on:
  issue_comment:
    types: [created]

concurrency:
  group: shepherd-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Validate /shepherd trigger
    if: >-
      vars.HARNESS_DISPATCH_ENABLED == 'true' &&
      vars.HARNESS_SHEPHERD_ENABLED == 'true' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/shepherd')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    outputs:
      should_dispatch: ${{ steps.authorize.outputs.authorized == 'true' && steps.gate.outputs.should_dispatch }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      pr_title: ${{ steps.gate.outputs.pr_title }}
      pr_url: ${{ steps.gate.outputs.pr_url }}
      pr_head_ref: ${{ steps.gate.outputs.pr_head_ref }}
      pr_head_sha: ${{ steps.gate.outputs.pr_head_sha }}
      checkpoint_comment_id: ${{ steps.checkpoint.outputs.checkpoint_comment_id }}
      resume_session_id: ${{ steps.checkpoint.outputs.resume_session_id }}
    steps:
      - id: authorize
        timeout-minutes: 1
        uses: vouchington/vouchington-tooling/.github/actions/comment-command-authorize@102b3d948645b8f6ad9fc361d8681bfc55081551 # v0.85.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: vouchington/vouchington-tooling/.github/actions/setup-node-pnpm@102b3d948645b8f6ad9fc361d8681bfc55081551 # v0.85.1
        timeout-minutes: 5
        with:
          deadline-seconds: '270'

      - id: parse
        timeout-minutes: 2
        if: steps.authorize.outputs.authorized == 'true'
        uses: vouchington/vouchington-tooling/.github/actions/comment-command-parse@102b3d948645b8f6ad9fc361d8681bfc55081551 # v0.85.1
        with:
          command: /shepherd
          mode: whole-body

      - name: Resolve PR and validate command
        timeout-minutes: 2
        id: gate
        if: steps.authorize.outputs.authorized == 'true' && steps.parse.outputs.accepted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: source "$GITHUB_WORKSPACE/.github/workflows/shepherd-resolve-pr.sh"

      - name: Prepare durable shepherd checkpoint
        timeout-minutes: 2
        id: checkpoint
        if: steps.gate.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_HEAD_REF: ${{ steps.gate.outputs.pr_head_ref }}
          PR_HEAD_SHA: ${{ steps.gate.outputs.pr_head_sha }}
          CHECKPOINT_RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
        run: source "$GITHUB_WORKSPACE/.github/workflows/shepherd-prepare-checkpoint.sh"

      - name: Acknowledge
        timeout-minutes: 2
        if: steps.gate.outputs.should_dispatch == 'true'
        uses: vouchington/vouchington-tooling/.github/actions/comment-command-acknowledge@102b3d948645b8f6ad9fc361d8681bfc55081551 # v0.85.1
        with:
          command: /shepherd
          post-run-link: 'false'

  render-prompt:
    name: Render automation prompt
    needs: [gate]
    if: needs.gate.outputs.should_dispatch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prompt: ${{ steps.render.outputs.prompt }}
      pr_shepherd_version: ${{ steps.pr-shepherd-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3

      - uses: vouchington/vouchington-tooling/.github/actions/setup-node-pnpm@102b3d948645b8f6ad9fc361d8681bfc55081551 # v0.85.1
        timeout-minutes: 5
        with:
          deadline-seconds: '270'

      - name: Resolve trusted pr-shepherd version
        timeout-minutes: 2
        id: pr-shepherd-version
        run: source "$GITHUB_WORKSPACE/.github/workflows/shepherd-resolve-version.sh"

      - name: Prepare prompt variables
        timeout-minutes: 2
        env:
          PR_TITLE: ${{ needs.gate.outputs.pr_title }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_TITLE" > pr-title.txt

      - name: Render prompt
        timeout-minutes: 2
        id: render
        uses: jonathanong/auto-harness/actions/harness-render-prompt@8325525ec675f738a3969cb92ce20477f38dcf71 # v1.0.2
        with:
          template: docs/prompts/automation/shepherd.md
          merge-authority-doc: docs/development/merge-authority.md
          vars: |
            PR_NUMBER=${{ needs.gate.outputs.pr_number }}
            TRIGGER_COMMENT_ID=${{ github.event.comment.id }}
            PR_URL=${{ needs.gate.outputs.pr_url }}
            PR_HEAD_REF=${{ needs.gate.outputs.pr_head_ref }}
            PR_HEAD_SHA=${{ needs.gate.outputs.pr_head_sha }}
            PR_SHEPHERD_VERSION=${{ steps.pr-shepherd-version.outputs.version }}
            REPOSITORY=${{ github.repository }}
          var-files: PR_TITLE=pr-title.txt

  dispatch:
    name: Harness dispatch
    needs: [gate, render-prompt]
    if: needs.gate.outputs.should_dispatch == 'true'
    uses: vouchington/vouchington-tooling/.github/workflows/harness-dispatch.yml@102b3d948645b8f6ad9fc361d8681bfc55081551 # v0.85.1
    permissions:
      contents: read
    secrets:
      HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
    with:
      surface-gate: HARNESS_SHEPHERD_ENABLED
      agent-ref: refs/heads/${{ needs.gate.outputs.pr_head_ref }}
      expected-head-sha: ${{ needs.gate.outputs.pr_head_sha }}
      concurrency-id: vouchington:shepherd:${{ needs.gate.outputs.pr_number }}
      publish-contract: shepherd
      pr-shepherd-version: ${{ needs.render-prompt.outputs.pr_shepherd_version }}
      resume-session-id: ${{ needs.gate.outputs.resume_session_id }}
      checkpoint-issue-number: ${{ needs.gate.outputs.pr_number }}
      trigger-comment-id: ${{ github.event.comment.id }}
      slack-source: |
        *Source:* `/shepherd` on PR #${{ needs.gate.outputs.pr_number }}
        *PR:* ${{ needs.gate.outputs.pr_url }}
        *PR title:* ${{ needs.gate.outputs.pr_title }}
      prompt: ${{ needs.render-prompt.outputs.prompt }}

  checkpoint-dispatch:
    name: Record immediate dispatch outcome on checkpoint
    needs: [gate, dispatch]
    if: >-
      always() && needs.gate.result == 'success' &&
      needs.gate.outputs.should_dispatch == 'true' &&
      (needs.dispatch.result == 'success' || needs.dispatch.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: vouchington/vouchington-tooling/.github/actions/setup-node-pnpm@102b3d948645b8f6ad9fc361d8681bfc55081551 # v0.85.1
        timeout-minutes: 5
        with:
          deadline-seconds: '270'
      - name: Revalidate and patch the exact checkpoint comment
        timeout-minutes: 2
        env:
          CHECKPOINT_ACTOR: github-actions[bot]
          CHECKPOINT_COMMENT_ID: ${{ needs.gate.outputs.checkpoint_comment_id }}
          CHECKPOINT_STATUS: ${{ needs.dispatch.result == 'success' && 'running' || 'failed' }}
          GH_TOKEN: ${{ github.token }}
          HARNESS_SESSION_ID: ${{ needs.dispatch.outputs.session-id }}
          HARNESS_SESSION_URL: ${{ needs.dispatch.outputs.session-url }}
          PR_HEAD_REF: ${{ needs.gate.outputs.pr_head_ref }}
          PR_HEAD_SHA: ${{ needs.gate.outputs.pr_head_sha }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
        run: source "$GITHUB_WORKSPACE/.github/workflows/shepherd-update-checkpoint.sh"

  escalate:
    name: Comment failure on PR
    needs: [gate, render-prompt, dispatch, checkpoint-dispatch]
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      needs.gate.outputs.should_dispatch == 'true' &&
      (
        needs.render-prompt.result == 'failure' ||
        needs.render-prompt.result == 'cancelled' ||
        (needs.dispatch.result == 'failure' || needs.dispatch.result == 'cancelled') ||
        (needs.checkpoint-dispatch.result == 'failure' || needs.checkpoint-dispatch.result == 'cancelled')
      )
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_HEAD_REF: ${{ needs.gate.outputs.pr_head_ref }}
      PR_HEAD_SHA: ${{ needs.gate.outputs.pr_head_sha }}
      PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
      TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Revalidate trigger comment
        timeout-minutes: 1
        uses: vouchington/vouchington-tooling/.github/actions/comment-command-authorize@102b3d948645b8f6ad9fc361d8681bfc55081551 # v0.85.1
        with:
          mode: revalidate
          issue-number: ${{ needs.gate.outputs.pr_number }}

      - name: Check the PR head and trigger are still valid
        timeout-minutes: 1
        id: check
        # no-mistakes-disable-next-line github-actions-max-inline-script-lines: Runs in the escalation job with no checkout; keep PR-head and trigger-comment revalidation inline without changing checkout or permissions.
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq \
            'select(.state == "open" and .head.repo.full_name == env.GITHUB_REPOSITORY and .head.ref == env.PR_HEAD_REF and .head.sha == env.PR_HEAD_SHA) | .number' \
            | grep -qx "$PR_NUMBER"
          COMMENT_JSON="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$TRIGGER_COMMENT_ID")"
          COMMAND="$(jq -r '.body' <<< "$COMMENT_JSON" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [[ "$COMMAND" != "/shepherd" ]]; then
            echo "Suppressing failure comment because the triggering /shepherd command is no longer valid."
            exit 0
          fi
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Comment failure on PR
        timeout-minutes: 1
        if: steps.check.outputs.valid == 'true'
        uses: vouchington/vouchington-tooling/.github/actions/comment-harness-session@102b3d948645b8f6ad9fc361d8681bfc55081551 # v0.85.1
        with:
          status: failed
          target: ${{ needs.gate.outputs.pr_number }}
          session-id: ${{ needs.dispatch.outputs.session-id }}
          headline: '/shepherd run failed.'
          details: '**PR:** ${{ needs.gate.outputs.pr_url }}'
          run-label: Auto-shepherd run
          closing: 'Please investigate manually or re-comment `/shepherd` to retry.'
