name: Cancel Replaced Merge Group Runs

# When the merge queue removes an entry, GitHub rebuilds every entry behind it on a new temporary
# branch (`gh-readonly-queue/main/pr-<N>-<sha>`). The old entry can never merge, but its merge-group
# runs keep running and hold hosted runners. A pull request has exactly one live queue entry, so a
# still-active run on an older `pr-<N>-*` branch is dead. This workflow cancels those runs, across
# every workflow, when the replacement entry's checks are requested.
#
# `concurrency:` cannot do this: group keys cannot extract the pull-request number from the queue
# branch name, and every entry gets a different branch. A run is cancelled only when its branch
# differs from this entry's and its run id is lower than this run's, so a slow older job never
# cancels a newer entry.
#
# This job is never a required check, so a failure cannot eject a queue entry. It checks out
# nothing and runs no repository code; the queue ref reaches the script only through `env:`.

on:
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  cancel:
    permissions:
      actions: write
    uses: vouchington/vouchington-tooling/.github/workflows/cancel-replaced-merge-group-runs.yml@9296610eabc6d4cdeaea6dd5b318df7abda64acb # v0.72.3
