name: Dependabot PR Auto-merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  automerge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Evaluate Dependabot update
        uses: vouchington/vouchington-tooling/.github/actions/dependabot-automerge@354ea1a198cefa66cce4b587bf50735d77a6c9df # v0.17.0
        with:
          automerge_token: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}

  cleanup-retargeted-automerge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref != github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Disable stale Dependabot auto-merge
        uses: vouchington/vouchington-tooling/.github/actions/dependabot-automerge@354ea1a198cefa66cce4b587bf50735d77a6c9df # v0.17.0
        with:
          automerge_token: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
