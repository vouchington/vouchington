name: Dispatch completed deploy

on:
  workflow_run:
    workflows:
      - Docs Publish
      - Main CI (backend)
      - Main CI (cloudflare-worker)
      - Main CI (lambdas)
      - Main CI (storybook)
      - Main CI (web)
      - Sync Articles
    types: [completed]

permissions: {}

concurrency:
  group: dispatch-completed-deploy-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Check route deployment intent
        timeout-minutes: 2
        id: intent
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
        run: source .github/workflows/dispatch-completed-deploy/check-intent.sh
      - name: Map completed source workflow
        timeout-minutes: 2
        id: source
        if: steps.intent.outputs.should_dispatch == 'true'
        env:
          SOURCE_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
        run: source .github/workflows/dispatch-completed-deploy/map-source.sh
      - name: Mint vouchington-infra dispatch token
        timeout-minutes: 2
        id: app-token
        if: steps.intent.outputs.should_dispatch == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.VOUCHINGTON_INFRA_APP_ID }}
          private-key: ${{ secrets.VOUCHINGTON_INFRA_APP_PRIVATE_KEY }}
          owner: vouchington
          repositories: vouchington-infra
          permission-contents: write
      - name: Dispatch source revision to vouchington-infra
        timeout-minutes: 2
        if: steps.intent.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_WORKFLOW: ${{ steps.source.outputs.source_workflow }}
          DISPATCH_EVENT_TYPE: ${{ steps.source.outputs.event_type }}
        run: |
          set -euo pipefail
          jq --compact-output --null-input \
            --arg source_repository "$SOURCE_REPOSITORY" \
            --arg source_revision "$SOURCE_REVISION" \
            --arg source_workflow "$SOURCE_WORKFLOW" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_run_attempt "$SOURCE_RUN_ATTEMPT" \
            --arg event_type "$DISPATCH_EVENT_TYPE" \
            '{event_type: $event_type, client_payload: {source_repository: $source_repository, source_revision: $source_revision, source_workflow: $source_workflow, source_run_id: $source_run_id, source_run_attempt: $source_run_attempt}}' |
            gh api --method POST repos/vouchington/vouchington-infra/dispatches --input -
