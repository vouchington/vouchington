name: Automation Fix Main

on:
  workflow_run:
    workflows:
      - Nightly
      - 'Main CI (backend)'
      - 'Main CI (cloudflare-worker)'
      - 'Main CI (lambdas)'
      - 'Main CI (storybook)'
      - 'Main CI (web)'
      - Plan completion advisory
      - 'Sync Articles'
      - 'Docs Publish'
      - 'Dispatch completed deploy'
    types: [completed]
    branches: [main]

concurrency:
  group: fix-main-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.workflow_id }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  triage-and-rerun:
    name: Triage failure
    if: >-
      vars.HARNESS_DISPATCH_ENABLED == 'true' &&
      vars.HARNESS_FIX_MAIN_ENABLED == 'true' &&
      (
        github.event.workflow_run.event == 'push' ||
        (
          (github.event.workflow_run.event == 'schedule' ||
           github.event.workflow_run.event == 'workflow_dispatch') &&
          github.event.workflow_run.name == 'Nightly'
        ) ||
        (
          github.event.workflow_run.event == 'workflow_run' &&
          github.event.workflow_run.name == 'Dispatch completed deploy'
        )
      ) &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["failure", "timed_out", "cancelled"]'),
               github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      checks: read
      contents: read
    outputs:
      should_dispatch: ${{ steps.triage.outputs.should_dispatch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: vouchington/vouchington-tooling/.github/actions/setup-node-pnpm@90e878e740edd47d19dae5d0dd28866afd719a01 # v0.85.3
        timeout-minutes: 5
        with:
          deadline-seconds: '270'
          install-scripts: 'false'
      - name: Revalidate source run
        timeout-minutes: 2
        id: source-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node ci/source-run-state.mts
      - name: Decide transient retry
        timeout-minutes: 2
        id: decide
        if: steps.source-state.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node ci/transient-retry/decide.mts
      - name: Rerun workflow on transient match
        timeout-minutes: 2
        if: >-
          steps.source-state.outputs.current == 'true' &&
          steps.decide.outputs.decision == 'rerun'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MATCHED_RULE: ${{ steps.decide.outputs.matched_rule }}
        run: |
          echo "Matched rule: $MATCHED_RULE"
          gh run rerun --repo "$GITHUB_REPOSITORY" "$WORKFLOW_RUN_ID"
      - name: Set should_dispatch output
        timeout-minutes: 2
        id: triage
        env:
          # Independent of HARNESS_DISPATCH_ENABLED (the job-level gate above,
          # which also covers safe rerun steps): this
          # second gate lets retries run with Harness dispatch to a new PR/issue
          # kept off, or vice versa.
          HARNESS_AGENT_DISPATCH_ENABLED: ${{ vars.HARNESS_AGENT_DISPATCH_ENABLED }}
          SOURCE_CURRENT: ${{ steps.source-state.outputs.current }}
          DECISION: ${{ steps.decide.outputs.decision }}
        run: bash --noprofile --norc -e -o pipefail ci/automation-inline/fix-main-dispatch-decision.sh

  related-candidates:
    name: Find related open PRs or issues
    needs: [triage-and-rerun]
    if: needs.triage-and-rerun.outputs.should_dispatch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      related-candidates: ${{ steps.authorized-candidates.outputs.related-candidates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
      - uses: vouchington/vouchington-tooling/.github/actions/setup-node-pnpm@90e878e740edd47d19dae5d0dd28866afd719a01 # v0.85.3
        timeout-minutes: 5
        with:
          deadline-seconds: '270'
          install-scripts: 'false'
      - uses: jonathanong/auto-harness/actions/harness-prompt-context@8325525ec675f738a3969cb92ce20477f38dcf71 # v1.0.2
        timeout-minutes: 2
        id: prompt-context
        with:
          check-issues: 'true'
          check-prs: 'true'
          related-title-key: 'Automation fix: ${{ github.event.workflow_run.name }}'
          related-extra-labels: ''
          related-limit: '5'
          github-token: ${{ github.token }}

      - name: Authorize related issues
        timeout-minutes: 2
        id: authorized-candidates
        env:
          GH_TOKEN: ${{ github.token }}
          RELATED_CANDIDATES: ${{ steps.prompt-context.outputs.related-candidates }}
        run: node ci/fix-main-candidates.mts

  render-prompt:
    name: Render automation prompt
    needs: [triage-and-rerun, related-candidates]
    if: >-
      !cancelled() &&
      needs.triage-and-rerun.outputs.should_dispatch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      prompt: ${{ steps.render.outputs.prompt }}
      source-current: ${{ steps.source-state.outputs.current }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3

      - uses: vouchington/vouchington-tooling/.github/actions/setup-node-pnpm@90e878e740edd47d19dae5d0dd28866afd719a01 # v0.85.3
        timeout-minutes: 5
        with:
          deadline-seconds: '270'
          install-scripts: 'false'

      - name: Revalidate source run
        timeout-minutes: 2
        id: source-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node ci/source-run-state.mts

      - name: Render prompt
        timeout-minutes: 2
        id: render
        if: steps.source-state.outputs.current == 'true'
        uses: jonathanong/auto-harness/actions/harness-render-prompt@8325525ec675f738a3969cb92ce20477f38dcf71 # v1.0.2
        with:
          template: docs/prompts/automation/fix-main.md
          merge-authority-doc: docs/development/merge-authority.md
          var-files: |
            CI_FAILURE_CORE=docs/prompts/automation/ci-failure-core.md
          vars: |
            WORKFLOW_NAME=${{ github.event.workflow_run.name }}
            RUN_URL=${{ github.event.workflow_run.html_url }}
            RUN_ID=${{ github.event.workflow_run.id }}
            COMMIT_SHA=${{ github.event.workflow_run.head_sha }}
            RELATED_CANDIDATES=${{ needs.related-candidates.outputs.related-candidates || '[]' }}

  dispatch:
    name: Harness dispatch
    needs: [triage-and-rerun, related-candidates, render-prompt]
    if: >-
      !cancelled() &&
      needs.triage-and-rerun.outputs.should_dispatch == 'true' &&
      needs.render-prompt.result == 'success' &&
      needs.render-prompt.outputs.source-current == 'true'
    uses: vouchington/vouchington-tooling/.github/workflows/harness-dispatch.yml@90e878e740edd47d19dae5d0dd28866afd719a01 # v0.85.3
    permissions:
      contents: read
    secrets:
      HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
    with:
      surface-gate: HARNESS_FIX_MAIN_ENABLED
      additional-gate: HARNESS_AGENT_DISPATCH_ENABLED
      agent-ref: ${{ github.event.workflow_run.head_sha }}
      expected-head-sha: ${{ github.event.workflow_run.head_sha }}
      concurrency-id: vouchington:fix-main:${{ github.event.workflow_run.workflow_id }}:${{ github.event.workflow_run.head_sha }}
      publish-contract: fix-main
      publish-base-ref: main
      publish-title-prefix: 'Automation fix: ${{ github.event.workflow_run.name }} @ ${{ github.event.workflow_run.head_sha }}'
      publish-title-suffix: '(failing run #${{ github.event.workflow_run.id }})'
      publish-duplicate-key: 'Automation fix: ${{ github.event.workflow_run.name }} @ ${{ github.event.workflow_run.head_sha }}'
      publish-related-candidates: ${{ needs.related-candidates.outputs.related-candidates || '[]' }}
      allow-duplicate-issue-completion: true
      pr-label: automation:auto-fix
      source-run-id: ${{ github.event.workflow_run.id }}
      source-run-attempt: ${{ github.event.workflow_run.run_attempt }}
      source-run-conclusion: ${{ github.event.workflow_run.conclusion }}
      slack-source: |
        *Source:* `${{ github.event.workflow_run.name }}` failed on `main`
        *Failing run:* ${{ github.event.workflow_run.html_url }}
        *Failing commit:* `${{ github.event.workflow_run.head_sha }}`
      prompt: ${{ needs.render-prompt.outputs.prompt }}

  classify-self-failure:
    name: Classify self failure
    needs: [triage-and-rerun, related-candidates, render-prompt, dispatch]
    if: >-
      always() &&
      needs.triage-and-rerun.result == 'success' &&
      needs.triage-and-rerun.outputs.should_dispatch == 'true' &&
      (
        needs.related-candidates.result == 'failure' ||
        needs.related-candidates.result == 'cancelled' ||
        needs.render-prompt.result == 'failure' ||
        needs.render-prompt.result == 'cancelled' ||
        needs.dispatch.result == 'failure' ||
        needs.dispatch.result == 'cancelled'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      retry_pending: ${{ steps.retry-pending.outputs.retry_pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
      - uses: vouchington/vouchington-tooling/.github/actions/setup-node-pnpm@90e878e740edd47d19dae5d0dd28866afd719a01 # v0.85.3
        timeout-minutes: 5
        with:
          deadline-seconds: '270'
          install-scripts: 'false'
      - name: Decide transient retry for this run
        timeout-minutes: 2
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          CONCLUSION: failure
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node ci/transient-retry/decide.mts
      - name: Set retry_pending output
        timeout-minutes: 2
        id: retry-pending
        env:
          DECISION: ${{ steps.decide.outputs.decision }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash --noprofile --norc -e -o pipefail ci/automation-inline/fix-main-retry-pending.sh

  escalate:
    name: Escalate to human
    needs: [triage-and-rerun, related-candidates, render-prompt, dispatch, classify-self-failure]
    if: >-
      always() &&
      needs.triage-and-rerun.result == 'success' &&
      needs.triage-and-rerun.outputs.should_dispatch == 'true' &&
      (
        needs.render-prompt.result == 'failure' ||
        needs.render-prompt.result == 'cancelled' ||
        needs.dispatch.result == 'failure' ||
        needs.dispatch.result == 'cancelled'
      ) &&
      needs.classify-self-failure.outputs.retry_pending != 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      FAILED_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
      FAILED_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
      RENDER_PROMPT_RESULT: ${{ needs.render-prompt.result }}
      DISPATCH_RESULT: ${{ needs.dispatch.result }}
      SESSION_ID: ${{ needs.dispatch.outputs.session-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Revalidate source run
        timeout-minutes: 2
        id: source-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: bash --noprofile --norc -e -o pipefail ci/automation-inline/source-run-guard.sh

      - name: Escalate to human — open or update issue
        timeout-minutes: 2
        if: steps.source-state.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash --noprofile --norc -e -o pipefail ci/automation-inline/fix-main-escalate.sh
