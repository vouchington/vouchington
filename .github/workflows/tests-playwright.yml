name: Playwright Tests

on:
  workflow_call:
    inputs:
      otel_enabled:
        description: 'Whether Playwright web servers should export OTel traces/logs for opt-in diagnostics'
        type: boolean
        required: false
        default: false
      shared_build_available:
        description: 'A preceding job in this run produced the shared web build'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      otel_enabled:
        description: 'Export OTel traces/logs for this manual run (default off)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  shards:
    # Fallback producer of the shared web build; it must share the consumers' runner arch.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      LINGUA_RS_SKIP_DOWNLOAD: '1'
    permissions:
      contents: read
    outputs:
      shard-total: ${{ steps.shards.outputs.shard-total }}
      shard-matrix: ${{ steps.shards.outputs.shard-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
      - uses: vouchington/vouchington-tooling/.github/actions/setup-node-pnpm@8a48840ca216dfaa119d6cacd2789cb3c0dcdba1 # v2.0.0
        timeout-minutes: 5
        with:
          deadline-seconds: '270'
      - name: Compute Playwright shards
        id: shards
        timeout-minutes: 1
        env:
          SHARD_TOTAL_OVERRIDE: ${{ vars.PLAYWRIGHT_SHARD_TOTAL }}
        run: node ci/playwright/shard-total.mts
      - uses: ./.github/actions/build-web-targets
        if: ${{ !inputs.shared_build_available && steps.shards.outputs.shard-total != '1' }}
        timeout-minutes: 9
        with:
          artifact-suffix: playwright-producer
          shared-build-cache-mode: producer
          web-build-fs-cache-enabled: ${{ vars.WEB_BUILD_FS_CACHE_ENABLED }}

  playwright-tests:
    needs: [shards]
    # Consumer of the shared web build; its cache key includes runner.arch, so it matches the producer.
    runs-on: ubuntu-24.04-arm
    # Shards aim to finish within 10 minutes. The step ceilings below cannot fire on a runner that
    # stops responding, so this cap is what ends a wedged shard.
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      LINGUA_RS_SKIP_DOWNLOAD: '1'
      NODE_ENV: test
      PLAYWRIGHT_MAX_WORKERS: '3'
      API_KEY_CHECKSUM_SECRET: this is a fake Playwright CI API key checksum secret
      VOUCHA_OTP_TOKEN_HASH_SECRET: this is a fake Playwright CI OTP HMAC secret
      VOUCHA_STORED_SECRET_ENCRYPTION_KEYS: fake-playwright-ci-key:raw32:this fake test key is not secret
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.shard-matrix) }}

    services:
      postgres:
        image: ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c max_connections=300 -c log_min_messages=log'
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 1s
          --tmpfs /var/lib/postgresql:rw,size=1g

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
      - uses: ./.github/actions/start-valkey
        timeout-minutes: 2
      - name: Set service ports
        timeout-minutes: 1
        run: |
          echo "DATABASE_URL=postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-backend
        id: setup-backend
        timeout-minutes: 8
      - name: Allocate ports
        timeout-minutes: 1
        run: source "$GITHUB_WORKSPACE/.github/workflows/tests-playwright-allocate-ports.sh"
      - name: Start OTel collector
        if: inputs.otel_enabled
        timeout-minutes: 2
        env:
          SHARD: ${{ matrix.shard }}
        run: source "$GITHUB_WORKSPACE/.github/workflows/tests-playwright-start-otel-collector.sh"
      - name: Set image origin
        timeout-minutes: 1
        run: echo "IMAGE_ORIGIN=http://localhost:$IMAGE_LAMBDA_PORT" >> "$GITHUB_ENV"
      # Covers browser-cache restore plus two 2-minute install attempts.
      - uses: vouchington/vouchington-tooling/.github/actions/setup-playwright@8a48840ca216dfaa119d6cacd2789cb3c0dcdba1 # v2.0.0
        timeout-minutes: 5
      - name: Create cloudflare worker dev vars
        timeout-minutes: 1
        run: source "$GITHUB_WORKSPACE/.github/workflows/tests-playwright-create-cloudflare-worker-dev-vars.sh"
      - name: Run database migrations
        working-directory: backend
        run: node data-stores/psql/migrate.mts
        timeout-minutes: 3
      - uses: ./.github/actions/build-web-targets
        timeout-minutes: 9
        with:
          artifact-suffix: playwright-${{ matrix.shard }}
          shared-build-cache-mode: consumer
          web-build-fs-cache-enabled: ${{ vars.WEB_BUILD_FS_CACHE_ENABLED }}
      - name: Compile localization catalog
        timeout-minutes: 3
        run: source "$GITHUB_WORKSPACE/.github/workflows/tests-playwright-compile-localization-catalog.sh"
      - name: Clear stale Playwright JUnit report
        timeout-minutes: 1
        run: rm -f test-report.junit.xml
      - name: Run Playwright tests
        id: run-playwright
        # PLAYWRIGHT_EXECUTION_BUDGET_SECONDS (ci/playwright/shard-total.mts) sizes shards to about
        # 300s of average test time (about 350s for the heaviest); this ceiling adds a slow-runner
        # tail on top of it. Assertion failures still fail the step.
        # run-bounded kills the process group one minute under this ceiling. Neither fired when
        # shards 5 and 8 hung until the job cap with their logs dropped (runs 37726973537 and
        # 40397368974), so the background sampler logs memory and the largest processes.
        timeout-minutes: 9
        env:
          GIT_COMMIT: ${{ github.sha }}
          NEXT_PUBLIC_GIT_COMMIT: ${{ github.sha }}
          OTEL_ENABLED: ${{ inputs.otel_enabled && '1' || '' }}
          OTEL_EXPORTER_OTLP_PROTOCOL: ${{ inputs.otel_enabled && 'http/protobuf' || '' }}
          OTEL_LOGS_EXPORTER: ${{ inputs.otel_enabled && 'otlp' || '' }}
          OTEL_TRACES_SAMPLER: ${{ inputs.otel_enabled && 'parentbased_always_on' || '' }}
          CI_SHARD: ${{ matrix.shard }}/${{ needs.shards.outputs.shard-total }}
          CI_PROJECT: playwright
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-report.junit.xml
        run: source "$GITHUB_WORKSPACE/.github/workflows/tests-playwright-run-playwright-tests.sh"
      - name: Stop OTel collector
        if: ${{ always() && inputs.otel_enabled }}
        timeout-minutes: 1
        continue-on-error: true
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          docker stop --time 10 "voucha-otel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SHARD}" || true
      - name: Upload OTel debug artifact
        if: ${{ always() && inputs.otel_enabled }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: playwright-otel-output-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/otel-output
            ${{ runner.temp }}/playwright-web-server-logs
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: warn
      - name: Upload JUnit test results
        # Retain passing test counts for no-skip evidence as well as failures and retries.
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: playwright-junit-shard-${{ matrix.shard }}
          path: test-report.junit.xml
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload Playwright test-results (traces, screenshots, videos)
        if: ${{ !cancelled() && (failure() || steps.run-playwright.outputs.retried == 'true') }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: playwright-test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload wrangler logs
        if: ${{ !cancelled() && (failure() || steps.run-playwright.outputs.retried == 'true') }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: wrangler-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/wrangler-logs/
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload web and backend server logs
        if: ${{ !cancelled() && (failure() || steps.run-playwright.outputs.retried == 'true') }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: playwright-server-logs-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/playwright-web-server-logs/
          retention-days: 1
          if-no-files-found: ignore
      - if: failure()
        uses: ./.github/actions/valkey-logs
        timeout-minutes: 1
