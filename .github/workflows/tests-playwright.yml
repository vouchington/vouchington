name: Playwright Tests

on:
  workflow_call:
    inputs:
      otel_enabled:
        description: 'Whether Playwright web servers should export OTel traces/logs for opt-in diagnostics'
        type: boolean
        required: false
        default: false
      shared_build_available:
        description: 'A preceding job in this run produced the shared web build'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      otel_enabled:
        description: 'Export OTel traces/logs for this manual run (default off)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  shards:
    # Fallback producer of the shared web build; it must share the consumers' runner arch.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      shard-total: ${{ steps.shards.outputs.shard-total }}
      shard-matrix: ${{ steps.shards.outputs.shard-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
      - uses: vouchington/vouchington-tooling/.github/actions/setup-node-pnpm@c81f9b19a7fe0fb0f18ca9f6454e83325c6969c2 # v0.78.0
        timeout-minutes: 5
      - name: Compute Playwright shards
        id: shards
        timeout-minutes: 1
        env:
          SHARD_TOTAL_OVERRIDE: ${{ vars.PLAYWRIGHT_SHARD_TOTAL }}
        run: node ci/playwright/shard-total.mts
      - uses: ./.github/actions/build-web-targets
        if: ${{ !inputs.shared_build_available && steps.shards.outputs.shard-total != '1' }}
        timeout-minutes: 9
        with:
          artifact-suffix: playwright-producer
          shared-build-cache-mode: producer
          web-build-fs-cache-enabled: ${{ vars.WEB_BUILD_FS_CACHE_ENABLED }}

  playwright-tests:
    needs: [shards]
    # Consumer of the shared web build; its cache key includes runner.arch, so it matches the producer.
    runs-on: ubuntu-24.04-arm
    # Shards aim to finish within 10 minutes. The step ceilings below cannot fire on a runner that
    # stops responding, so this cap is what ends a wedged shard.
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      NODE_ENV: test
      PLAYWRIGHT_MAX_WORKERS: '3'
      API_KEY_CHECKSUM_SECRET: this is a fake Playwright CI API key checksum secret
      VOUCHA_OTP_TOKEN_HASH_SECRET: this is a fake Playwright CI OTP HMAC secret
      VOUCHA_STORED_SECRET_ENCRYPTION_KEYS: fake-playwright-ci-key:raw32:this fake test key is not secret
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.shard-matrix) }}

    services:
      postgres:
        image: ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c max_connections=300 -c log_min_messages=log'
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 1s
          --tmpfs /var/lib/postgresql:rw,size=1g

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
      - uses: ./.github/actions/start-valkey
        timeout-minutes: 2
      - name: Set service ports
        timeout-minutes: 1
        run: |
          echo "DATABASE_URL=postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-backend
        id: setup-backend
        timeout-minutes: 8
      - name: Allocate ports
        timeout-minutes: 1
        run: |
          # One call keeps every app and collector port distinct.
          set -euo pipefail
          PORTS=$(python3 node_modules/vouchington-tooling/scripts/allocate-browser-safe-ports.py 6)
          read -r PORT NEXT_PORT IMAGE_LAMBDA_PORT WORKER_PORT OTEL_HTTP_PORT OTEL_GRPC_PORT <<< "$PORTS"
          if [ -z "$PORT" ] || [ -z "$NEXT_PORT" ] || [ -z "$IMAGE_LAMBDA_PORT" ] || [ -z "$WORKER_PORT" ] || [ -z "$OTEL_HTTP_PORT" ] || [ -z "$OTEL_GRPC_PORT" ]; then
            echo "::error::Failed to allocate ports"
            exit 1
          fi
          {
            echo "PORT=$PORT"
            echo "NEXT_PORT=$NEXT_PORT"
            echo "IMAGE_LAMBDA_PORT=$IMAGE_LAMBDA_PORT"
            echo "WORKER_PORT=$WORKER_PORT"
            echo "OTEL_HTTP_PORT=$OTEL_HTTP_PORT"
            echo "OTEL_GRPC_PORT=$OTEL_GRPC_PORT"
            echo "OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:$OTEL_HTTP_PORT"
          } >> "$GITHUB_ENV"
      - name: Start OTel collector
        if: inputs.otel_enabled
        timeout-minutes: 2
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          echo "Starting OTel collector"
          mkdir -p "$RUNNER_TEMP/otel-output"
          chmod 0777 "$RUNNER_TEMP/otel-output"
          COLLECTOR_NAME="voucha-otel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SHARD}"
          docker run -d --name "$COLLECTOR_NAME" \
            -p "127.0.0.1:$OTEL_HTTP_PORT:4318" \
            -p "127.0.0.1:$OTEL_GRPC_PORT:4317" \
            -v "$PWD/dev/otel/collector-config-ci.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            -v "$RUNNER_TEMP/otel-output:/otel-output" \
            ghcr.io/vouchington/dependency-otel:0.153.0@sha256:93aad750175cbf1a973ae1c5886c3371f4d800f61be25cdd26870b8441ffe9fa
          sleep 2
          if [ "$(docker inspect -f '{{.State.Running}}' "$COLLECTOR_NAME")" != "true" ]; then
            docker logs "$COLLECTOR_NAME" || true
            exit 1
          fi
      - name: Set image origin
        timeout-minutes: 1
        run: echo "IMAGE_ORIGIN=http://localhost:$IMAGE_LAMBDA_PORT" >> "$GITHUB_ENV"
      # Covers browser-cache restore plus two 2-minute install attempts.
      - uses: vouchington/vouchington-tooling/.github/actions/setup-playwright@c81f9b19a7fe0fb0f18ca9f6454e83325c6969c2 # v0.78.0
        timeout-minutes: 5
      - name: Create cloudflare worker dev vars
        timeout-minutes: 1
        run: |
          CF_WORKER_SECRET=$(openssl rand -hex 32)
          {
            echo "BACKEND_ORIGIN=http://localhost:$PORT"
            echo "WEB_ORIGIN=http://localhost:$NEXT_PORT"
            echo 'CSP_BROWSER_UPLOAD_ORIGINS=["https://test-images.s3.us-west-2.amazonaws.com","https://test-images.s3.dualstack.us-west-2.amazonaws.com"]'
            echo "CF_WORKER_SECRET=$CF_WORKER_SECRET"
            echo "CACHE_PLACEHOLDER_NONCE=$(openssl rand -hex 32)"
          } > cloudflare-worker/.dev.vars
          echo "CF_WORKER_SECRET=$CF_WORKER_SECRET" >> "$GITHUB_ENV"
      - name: Run database migrations
        working-directory: backend
        run: node data-stores/psql/migrate.mts
        timeout-minutes: 3
      - uses: ./.github/actions/build-web-targets
        timeout-minutes: 9
        with:
          artifact-suffix: playwright-${{ matrix.shard }}
          shared-build-cache-mode: consumer
          web-build-fs-cache-enabled: ${{ vars.WEB_BUILD_FS_CACHE_ENABLED }}
      - name: Compile localization catalog
        timeout-minutes: 3
        run: |
          if [ -d /dev/shm ]; then
            export TMPDIR=/dev/shm
            sqlite_path="/dev/shm/vouchington-catalog-$$.sqlite"
          else
            sqlite_path="${RUNNER_TEMP}/vouchington-catalog.sqlite"
          fi
          echo "Compiling localization catalog to $sqlite_path"
          node backend/services/localization/compile-cli.mts --source localization/catalog --output "$sqlite_path"
          echo "LOCALIZATION_SQLITE_PATH=$sqlite_path" >> "$GITHUB_ENV"
      - name: Clear stale Playwright JUnit report
        timeout-minutes: 1
        run: rm -f test-report.junit.xml
      - name: Run Playwright tests
        id: run-playwright
        # PLAYWRIGHT_EXECUTION_BUDGET_SECONDS (ci/playwright/shard-total.mts) sizes shards to about
        # 300s of average test time (about 350s for the heaviest); this ceiling adds a slow-runner
        # tail on top of it. Assertion failures still fail the step.
        # run-bounded kills the process group one minute under this ceiling. Neither fired when
        # shards 5 and 8 hung until the job cap with their logs dropped (runs 37726973537 and
        # 40397368974), so the background sampler logs memory and the largest processes.
        timeout-minutes: 9
        env:
          GIT_COMMIT: ${{ github.sha }}
          NEXT_PUBLIC_GIT_COMMIT: ${{ github.sha }}
          OTEL_ENABLED: ${{ inputs.otel_enabled && '1' || '' }}
          OTEL_EXPORTER_OTLP_PROTOCOL: ${{ inputs.otel_enabled && 'http/protobuf' || '' }}
          OTEL_LOGS_EXPORTER: ${{ inputs.otel_enabled && 'otlp' || '' }}
          OTEL_TRACES_SAMPLER: ${{ inputs.otel_enabled && 'parentbased_always_on' || '' }}
          CI_SHARD: ${{ matrix.shard }}/${{ needs.shards.outputs.shard-total }}
          CI_PROJECT: playwright
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-report.junit.xml
        run: |
          set -euo pipefail
          if [ -r /proc/meminfo ]; then
            # sleep gets no inherited output pipes, so stopping the sampler never waits on it.
            (while sleep 30 >/dev/null 2>&1; do
              awk '/^(MemAvailable|SwapFree):/ { printf "%s %d MiB ", $1, $2 / 1024 } END { print "" }' /proc/meminfo
              ps -eo rss=,comm= --sort=-rss | head -3 | awk '{ printf "  %d MiB %s\n", $1 / 1024, $2 }'
            done) &
            sampler=$!
            trap 'kill "$sampler" 2>/dev/null || true' EXIT
          fi
          python3 "$GITHUB_WORKSPACE/node_modules/vouchington-tooling/scripts/run-bounded.py" 480 pnpm exec ./ci/with-node-test-options playwright test "--shard=$CI_SHARD" && test_exit=0 || test_exit=$?
          # `trace: 'on-first-retry'` (playwright/config/shared-config.mts) writes a
          # trace.zip only for a test's first retry attempt, so its presence under
          # test-results/ is a direct signal that something retried in this shard —
          # a flake if the retry then passed, a confirmed failure otherwise. Surface
          # it as a step output so future alerting can key off retries directly
          # instead of inferring them from the job's overall conclusion.
          if find test-results -name 'trace.zip' -print -quit 2>/dev/null | grep -q .; then
            echo "retried=true" >> "${GITHUB_OUTPUT:-/dev/null}"
          else
            echo "retried=false" >> "${GITHUB_OUTPUT:-/dev/null}"
          fi
          exit "$test_exit"
      - name: Stop OTel collector
        if: ${{ always() && inputs.otel_enabled }}
        timeout-minutes: 1
        continue-on-error: true
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          docker stop --time 10 "voucha-otel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SHARD}" || true
      - name: Upload OTel debug artifact
        if: ${{ always() && inputs.otel_enabled }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: playwright-otel-output-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/otel-output
            ${{ runner.temp }}/playwright-web-server-logs
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: warn
      - name: Upload JUnit test results
        # Retain passing test counts for no-skip evidence as well as failures and retries.
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: playwright-junit-shard-${{ matrix.shard }}
          path: test-report.junit.xml
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload Playwright test-results (traces, screenshots, videos)
        if: ${{ !cancelled() && (failure() || steps.run-playwright.outputs.retried == 'true') }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: playwright-test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload wrangler logs
        if: ${{ !cancelled() && (failure() || steps.run-playwright.outputs.retried == 'true') }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: wrangler-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/wrangler-logs/
          retention-days: 1
          if-no-files-found: ignore
      - if: failure()
        uses: ./.github/actions/valkey-logs
        timeout-minutes: 1
