name: Playwright Tests

on:
  workflow_call:
    inputs:
      event-name:
        description: Triggering workflow event name (pull_request triggers affected-test selection)
        type: string
        required: false
        default: ''
      shard_total_override:
        description: Override the computed Playwright shard total
        type: string
        required: false
        default: ''
      otel_enabled:
        description: 'Whether Playwright web servers should export OTel traces/logs for main CI observability'
        type: boolean
        required: false
        default: false
      shared_build_available:
        description: 'A preceding job in this run produced the shared web build'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      otel_enabled:
        description: 'Export OTel traces/logs for this manual run (default off; see PLAYWRIGHT_OTEL_ENABLED for the main CI default)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # Serialize Playwright workflow runs for the same PR/ref without serializing shards.
  group: playwright-tests-${{ github.event.pull_request.number || github.ref || github.sha }}
  cancel-in-progress: ${{ inputs.event-name == 'pull_request' }}

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.select.outputs.skip }}
      full-suite: ${{ steps.select.outputs.full-suite }}
      files: ${{ steps.select.outputs.files }}
      shard-total: ${{ steps.shards.outputs.total }}
      shard-matrix: ${{ steps.shards.outputs.matrix }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
        timeout-minutes: 5
      - name: Select Playwright tests
        id: select
        env:
          EVENT_NAME: ${{ inputs.event-name }}
          SHARD_TOTAL_OVERRIDE: ${{ inputs.shard_total_override || vars.PLAYWRIGHT_SHARD_TOTAL }}
        run: node ci/playwright/ci-select.mts
      - name: Build shard matrix
        id: shards
        if: steps.select.outputs.skip != 'true'
        timeout-minutes: 1
        run: |
          total="${{ steps.select.outputs.shard-total }}"
          if ! [[ "$total" =~ ^([1-9][0-9]{0,2})$ ]] || [ "$total" -gt 256 ]; then
            echo "::error::shard-total must be an integer from 1 through 256, got: '$total'"
            exit 1
          fi
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "matrix=[$(seq -s, 1 "$total")]" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-web-targets
        if: ${{ steps.select.outputs.skip != 'true' && !inputs.shared_build_available && steps.shards.outputs.total != '1' }}
        timeout-minutes: 13
        with:
          artifact-suffix: playwright-producer
          shared-build-cache-mode: producer
          web-build-fs-cache-enabled: ${{ vars.WEB_BUILD_FS_CACHE_ENABLED }}
      - name: Upload Playwright test plan
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          overwrite: true
          name: playwright-test-plan
          path: |
            playwright-test-plan.json
            playwright-test-plan.md
          if-no-files-found: ignore
          retention-days: 1

  playwright-tests:
    needs: [select]
    if: needs.select.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      NODE_ENV: test
      PLAYWRIGHT_MAX_WORKERS: '3'
      API_KEY_CHECKSUM_SECRET: this is a fake Playwright CI API key checksum secret
      VOUCHA_OTP_TOKEN_HASH_SECRET: this is a fake Playwright CI OTP HMAC secret
      VOUCHA_STORED_SECRET_ENCRYPTION_KEYS: fake-playwright-ci-key:raw32:this fake test key is not secret
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shard-matrix) }}

    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c max_connections=300'
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql:rw,size=1g
      valkey:
        image: valkey/valkey-bundle:9.1.0@sha256:16004aceeb7a1246e2d1bb85d353e38120eb440951cb7d0c971b6d63fda5b3d7
        ports:
          - 6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /data:rw,size=64m

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set service ports
        timeout-minutes: 1
        run: |
          echo "DATABASE_URL=postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
          echo "VALKEY_URL=redis://localhost:${{ job.services.valkey.ports['6379'] }}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-backend
        id: setup-backend
        timeout-minutes: 8
      - name: Allocate ports
        timeout-minutes: 1
        run: |
          # One call keeps every app and collector port distinct.
          set -euo pipefail
          PORTS=$(python3 ci/allocate-browser-safe-ports.py 6)
          read -r PORT NEXT_PORT IMAGE_LAMBDA_PORT WORKER_PORT OTEL_HTTP_PORT OTEL_GRPC_PORT <<< "$PORTS"
          if [ -z "$PORT" ] || [ -z "$NEXT_PORT" ] || [ -z "$IMAGE_LAMBDA_PORT" ] || [ -z "$WORKER_PORT" ] || [ -z "$OTEL_HTTP_PORT" ] || [ -z "$OTEL_GRPC_PORT" ]; then
            echo "::error::Failed to allocate ports"
            exit 1
          fi
          {
            echo "PORT=$PORT"
            echo "NEXT_PORT=$NEXT_PORT"
            echo "IMAGE_LAMBDA_PORT=$IMAGE_LAMBDA_PORT"
            echo "WORKER_PORT=$WORKER_PORT"
            echo "OTEL_HTTP_PORT=$OTEL_HTTP_PORT"
            echo "OTEL_GRPC_PORT=$OTEL_GRPC_PORT"
            echo "OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:$OTEL_HTTP_PORT"
          } >> "$GITHUB_ENV"
      - name: Start OTel collector
        if: inputs.otel_enabled
        timeout-minutes: 2
        run: |
          set -euo pipefail
          echo "Starting OTel collector"
          mkdir -p "$RUNNER_TEMP/otel-output"
          chmod 0777 "$RUNNER_TEMP/otel-output"
          COLLECTOR_NAME="voucha-otel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.shard }}"
          docker run -d --name "$COLLECTOR_NAME" \
            -p "127.0.0.1:$OTEL_HTTP_PORT:4318" \
            -p "127.0.0.1:$OTEL_GRPC_PORT:4317" \
            -v "$PWD/dev/otel/collector-config-ci.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            -v "$RUNNER_TEMP/otel-output:/otel-output" \
            otel/opentelemetry-collector-contrib:0.153.0
          sleep 2
          if [ "$(docker inspect -f '{{.State.Running}}' "$COLLECTOR_NAME")" != "true" ]; then
            docker logs "$COLLECTOR_NAME" || true
            exit 1
          fi
      - name: Set image origin
        run: echo "IMAGE_ORIGIN=http://localhost:$IMAGE_LAMBDA_PORT" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-playwright
        timeout-minutes: 10
      - name: Create cloudflare worker dev vars
        timeout-minutes: 1
        run: |
          CF_WORKER_SECRET=$(openssl rand -hex 32)
          {
            echo "BACKEND_ORIGIN=http://localhost:$PORT"
            echo "WEB_ORIGIN=http://localhost:$NEXT_PORT"
            echo 'CSP_BROWSER_UPLOAD_ORIGINS=["https://test-images.s3.us-west-2.amazonaws.com","https://test-images.s3.dualstack.us-west-2.amazonaws.com"]'
            echo "CF_WORKER_SECRET=$CF_WORKER_SECRET"
          } > cloudflare-worker/.dev.vars
          echo "CF_WORKER_SECRET=$CF_WORKER_SECRET" >> "$GITHUB_ENV"
      - name: Run database migrations
        working-directory: backend
        run: node data-stores/psql/migrate.mts
        timeout-minutes: 3
      - uses: ./.github/actions/build-web-targets
        timeout-minutes: 13
        with:
          artifact-suffix: playwright-${{ matrix.shard }}
          shared-build-cache-mode: consumer
          web-build-fs-cache-enabled: ${{ vars.WEB_BUILD_FS_CACHE_ENABLED }}
      - name: Compile localization catalog
        timeout-minutes: 3
        run: |
          if [ -d /dev/shm ]; then
            export TMPDIR=/dev/shm
            sqlite_path="/dev/shm/vouchington-catalog-$$.sqlite"
          else
            sqlite_path="${RUNNER_TEMP}/vouchington-catalog.sqlite"
          fi
          echo "Compiling localization catalog to $sqlite_path"
          node --experimental-strip-types backend/services/localization/compile-cli.mts --source localization/catalog --output "$sqlite_path"
          echo "LOCALIZATION_SQLITE_PATH=$sqlite_path" >> "$GITHUB_ENV"
      - name: Run Playwright tests
        id: run-playwright
        # Sized to PLAYWRIGHT_EXECUTION_BUDGET_SECONDS (ci/playwright/shard-selection.mts): a
        # 350s/shard execution budget plus a per-shard warm-up/variance buffer, rounded up to a
        # whole minute since GitHub Actions timeout-minutes literals in this repo stay integral.
        timeout-minutes: 9
        env:
          GIT_COMMIT: ${{ github.sha }}
          NEXT_PUBLIC_GIT_COMMIT: ${{ github.sha }}
          OTEL_ENABLED: ${{ inputs.otel_enabled && '1' || '' }}
          OTEL_EXPORTER_OTLP_PROTOCOL: ${{ inputs.otel_enabled && 'http/protobuf' || '' }}
          OTEL_LOGS_EXPORTER: ${{ inputs.otel_enabled && 'otlp' || '' }}
          OTEL_TRACES_SAMPLER: ${{ inputs.otel_enabled && 'parentbased_always_on' || '' }}
          CI_SHARD: ${{ matrix.shard }}/${{ needs.select.outputs.shard-total }}
          CI_PROJECT: playwright
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-report.junit.xml
          PW_FULL_SUITE: ${{ needs.select.outputs.full-suite }}
          PW_FILES: ${{ needs.select.outputs.files }}
        run: |
          set -euo pipefail
          SHARD_ARG="--shard=${{ matrix.shard }}/${{ needs.select.outputs.shard-total }}"
          if [[ "$PW_FULL_SUITE" == "true" || -z "$PW_FILES" ]]; then
            pnpm exec ./ci/with-node-test-options playwright test "$SHARD_ARG" && test_exit=0 || test_exit=$?
          else
            # PW_FILES is newline-delimited (vouchington-tooling/gha-selected-files's
            # encodeSelectedFiles). A quoted read loop plus a quoted array expansion
            # preserve paths containing spaces or shell glob metacharacters, replacing
            # the previous unquoted $PW_FILES word-splitting/glob-expansion. This avoids
            # `mapfile` (bash 4.0+) so the script stays portable to macOS /bin/bash 3.2.
            FILES=()
            while IFS= read -r file; do
              if [ -n "$file" ]; then FILES+=("$file"); fi
            done <<< "$PW_FILES"
            pnpm exec ./ci/with-node-test-options playwright test "${FILES[@]}" "$SHARD_ARG" && test_exit=0 || test_exit=$?
          fi
          # `trace: 'on-first-retry'` (playwright/config/shared-config.mts) writes a
          # trace.zip only for a test's first retry attempt, so its presence under
          # test-results/ is a direct signal that something retried in this shard —
          # a flake if the retry then passed, a confirmed failure otherwise. Surface
          # it as a step output so future alerting can key off retries directly
          # instead of inferring them from the job's overall conclusion.
          if find test-results -name 'trace.zip' -print -quit 2>/dev/null | grep -q .; then
            echo "retried=true" >> "${GITHUB_OUTPUT:-/dev/null}"
          else
            echo "retried=false" >> "${GITHUB_OUTPUT:-/dev/null}"
          fi
          exit "$test_exit"
      - name: Stop OTel collector
        if: ${{ always() && inputs.otel_enabled }}
        timeout-minutes: 1
        continue-on-error: true
        run: |
          docker stop --time 10 "voucha-otel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.shard }}" || true
      - name: Upload OTel debug artifact
        if: ${{ always() && inputs.otel_enabled }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          overwrite: true
          name: playwright-otel-output-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/otel-output
            ${{ runner.temp }}/playwright-web-server-logs
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: warn
      - name: Upload JUnit test results
        # cleanup-artifacts (main-checks.yml/main-web.yml) fans in on the *whole run* going
        # green, so a flaky test that fails then passes on retry -- exactly the case this
        # upload exists to capture -- makes cleanup delete it right back out from under a
        # bare `!cancelled()`. Gate on an actual failure or a confirmed retry (the
        # `run-playwright` step's `retried` output) instead, so a clean run uploads nothing
        # at all and has nothing for cleanup to race.
        if: ${{ !cancelled() && (failure() || steps.run-playwright.outputs.retried == 'true') }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          overwrite: true
          name: playwright-junit-shard-${{ matrix.shard }}
          path: test-report.junit.xml
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload Playwright test-results (traces, screenshots, videos)
        if: ${{ !cancelled() && (failure() || steps.run-playwright.outputs.retried == 'true') }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          overwrite: true
          name: playwright-test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload wrangler logs
        if: ${{ !cancelled() && (failure() || steps.run-playwright.outputs.retried == 'true') }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          overwrite: true
          name: wrangler-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/wrangler-logs/
          retention-days: 1
          if-no-files-found: ignore
