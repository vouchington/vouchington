name: Main CI (web)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-artifacts.yml'
      - 'ci/cleanup-artifacts-pattern-matcher.mjs'
      - 'ci/cleanup-artifacts-patterns.json'
      - 'ci/cleanup-run-artifacts.mjs'
      - '.github/workflows/main-web.yml'
      - '.github/workflows/publish-web-images.yml'
      - '.github/ci-path-filters.yml'
      - '.github/actions/build-web-images/**'
      - '.dockerignore'
      - '.hadolint.yaml'
      - '.github/workflows/tests-web.yml'
      - '.github/workflows/tests-web-api.yml'
      - '.github/workflows/tests-web-integration.yml'
      - '.github/workflows/tests-playwright.yml'
      - '.github/workflows/tests-playwright-credentialed.yml'
      - '.github/workflows/checks-static.yml'
      - '.github/actions/**'
      - 'ci/curl-to.sh'
      - 'ci/exec-vouchington-gha.sh'
      - '.trivyignore.yaml'
      - 'api-fixtures/**'
      - 'web/**'
      - 'backend/types/**'
      - 'ts-shared/**'
      - 'cloudflare-worker/**'
      - 'lambdas/image-resize/**'
      - 'lambdas/shared/**'
      - 'playwright/**'
      - 'playwright.config.mts'
      - 'playwright.credentialed.config.mts'
      - 'wrangler.*'
      - 'integration-tests/web/**'
      - 'integration-tests/web-api/**'
      - 'ci/allocate-browser-safe-ports.py'
      - 'ci/playwright/**'
      - 'ci/setup-web-integration.mts'
      - 'ci/run-pnpm-command.mts'
      - 'ci/write-web-build-timings-summary.mts'
      - 'ci/store-playwright-otel.sh'
      - 'dev/otel/**'
      - 'dev/initialize*'
      - 'ci/prepare-trivy-db.sh'
      - 'ci/image-promotion.mts'
      - 'ci/image-promotion-cli.mts'
      - 'ci/image-targets.mts'
      - 'ci/bounded-exec.mts'
      - 'ci/image-provenance.mts'
      - 'ci/image-provenance-verify.mts'
      - 'ci/image-registry.mts'
      - 'ci/image-registry-http.mts'
      - 'ci/image-registry-manifest.mts'
      - 'ci/verify-main-ancestor.sh'
      - 'vitest.config.mts'
      - 'test-helpers/vitest-config/web-projects.mts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

concurrency:
  group: ${{ github.run_attempt == 1 && 'main-web' || format('main-web-retry-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect-image-publication:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.image-paths.outputs.runtime-build-web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: image-paths
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          predicate-quantifier: every
          filters: .github/ci-path-filters.yml

  web-deploy-intent:
    needs: detect-image-publication
    if: needs.detect-image-publication.outputs.publish == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: ':'

  # Verifies the merge-group-published web image and reuses its immutable digest. An authenticated
  # missing manifest triggers one build through the same smoke/Trivy composite used by PR
  # validation, followed by missing-only publication and complete-set verification.
  #
  # The shared runtime-image filter distinguishes deployable inputs from the wider validation
  # trigger. Workflow/tooling-only and test-only pushes still run their owning checks without
  # requesting an image fallback or web deployment.
  publish-web-images:
    needs: [detect-image-publication, static-checks]
    if: >-
      !cancelled() &&
      needs.detect-image-publication.outputs.publish == 'true' &&
      needs.static-checks.result == 'success'
    uses: ./.github/workflows/publish-web-images.yml
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      trusted_secret_context: true
    secrets: inherit

  test-web:
    needs: [static-checks]
    if: ${{ !cancelled() && needs.static-checks.result == 'success' }}
    uses: ./.github/workflows/tests-web.yml
    permissions:
      actions: read
      contents: read
    secrets: inherit

  test-web-api:
    needs: [static-checks]
    if: ${{ !cancelled() && needs.static-checks.result == 'success' }}
    uses: ./.github/workflows/tests-web-api.yml
    permissions:
      actions: read
      contents: read
    secrets: inherit

  test-web-integration:
    needs: [static-checks]
    if: ${{ !cancelled() && needs.static-checks.result == 'success' }}
    uses: ./.github/workflows/tests-web-integration.yml
    with:
      shared_build_available: true
    permissions:
      actions: read
      contents: read
    secrets: inherit

  playwright-tests:
    needs: [static-checks]
    if: ${{ !cancelled() && needs.static-checks.result == 'success' }}
    uses: ./.github/workflows/tests-playwright.yml
    permissions:
      actions: read
      contents: read
    with:
      shared_build_available: true
      # OTel trace export is opt-in (debugging only) — default off to avoid
      # continuous GitHub Actions artifact storage cost from every main run
      # (see cost-reduction PR). Dispatch tests-playwright.yml directly with
      # otel_enabled: true for a one-off debug run regardless of this variable.
      otel_enabled: ${{ vars.PLAYWRIGHT_OTEL_ENABLED == 'true' }}
    secrets: inherit

  store-playwright-otel:
    needs: [playwright-tests]
    continue-on-error: true
    # OTel trace upload is opt-in (debugging only) — default off to avoid
    # continuous S3 storage cost from every main run (see cost-reduction PR).
    if: >-
      !cancelled() &&
      vars.OTEL_TRACE_UPLOAD_ENABLED == 'true' &&
      (needs.playwright-tests.result == 'success' || needs.playwright-tests.result == 'failure')
    runs-on: ubuntu-slim
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check OTel store credential availability
        id: otel-store-credentials
        env:
          AWS_OTEL_STORE_ROLE_ARN: ${{ secrets.AWS_OTEL_STORE_ROLE_ARN }}
          AWS_OTEL_STORE_URI: ${{ secrets.AWS_OTEL_STORE_URI }}
        run: |
          if [ -n "$AWS_OTEL_STORE_ROLE_ARN" ] && [ -n "$AWS_OTEL_STORE_URI" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Download Playwright OTel artifacts
        if: steps.otel-store-credentials.outputs.available == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        timeout-minutes: 2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          pattern: playwright-otel-output-shard-*
          path: ${{ runner.temp }}/playwright-otel-output
          merge-multiple: false
      - name: Configure AWS credentials for OTel store
        if: steps.otel-store-credentials.outputs.available == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        timeout-minutes: 2
        with:
          role-to-assume: ${{ secrets.AWS_OTEL_STORE_ROLE_ARN }}
          aws-region: us-west-2
          action-timeout-s: 90
      - name: Store Playwright OTel output to S3
        if: steps.otel-store-credentials.outputs.available == 'true'
        timeout-minutes: 3
        env:
          OTEL_OUTPUT_ROOT: ${{ runner.temp }}/playwright-otel-output
          OTEL_STORE_URI: ${{ secrets.AWS_OTEL_STORE_URI }}/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}
        run: ./ci/store-playwright-otel.sh

  playwright-credentialed-tests:
    needs: [static-checks]
    if: ${{ !cancelled() && needs.static-checks.result == 'success' }}
    uses: ./.github/workflows/tests-playwright-credentialed.yml
    permissions:
      actions: read
      contents: read
      id-token: write
    secrets: inherit

  static-checks:
    uses: ./.github/workflows/checks-static.yml
    with:
      web: true
    permissions:
      contents: read
      actions: read

  cleanup-artifacts:
    # test-web/test-web-api/test-web-integration are no longer transitive ancestors of
    # store-playwright-otel/playwright-credentialed-tests now that all test stages fan out
    # directly from static-checks (see PR flattening main-web.yml's DAG). Without these three
    # in `needs:`, failure() below would stop seeing their results, and a run where only one of
    # them fails (while both Playwright stages pass) would run cleanup and delete that failed
    # stage's report/coverage artifacts — violating "never delete failure artifacts."
    needs:
      [
        test-web,
        test-web-api,
        test-web-integration,
        store-playwright-otel,
        playwright-credentialed-tests,
      ]
    if: ${{ always() && !cancelled() && !failure() }}
    uses: ./.github/workflows/cleanup-artifacts.yml
    permissions:
      actions: write
      contents: read
    with:
      run_id: ${{ github.run_id }}
