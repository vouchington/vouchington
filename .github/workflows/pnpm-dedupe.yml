name: pnpm Dedupe (Weekly)

# Runs pnpm dedupe on the shared workspace lockfile. Branch is fixed and
# force-pushed so subsequent runs update the same PR rather than piling up.

on:
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dedupe:
    uses: vouchington/vouchington-tooling/.github/workflows/pnpm-dedupe.yml@9296610eabc6d4cdeaea6dd5b318df7abda64acb # v0.72.3
    secrets:
      PUSH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
