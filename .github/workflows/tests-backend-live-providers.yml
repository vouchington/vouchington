name: Backend Live Provider Tests

# Paid live-provider checks, one job per provider so one failure never hides another. They run only
# from the Nightly run and a manual dispatch, never on a pull request or merge group: recorded
# responses in the unit suites gate request construction and response handling. The cheap real-AWS
# S3 check stays in `tests-backend-credentialed.yml`. See docs/development/tests.md#live-provider-smoke-checks.
on:
  workflow_call:
    inputs:
      provider:
        description: 'Provider to run: all, bedrock, openai, openrouter, anthropic, or lightpanda'
        required: false
        type: string
        default: all
      prepared_database:
        description: 'Use the prepared backend PostgreSQL artifact from the caller'
        required: false
        type: boolean
        default: false
    secrets:
      LIGHTPANDA_TOKEN:
        required: false
      OPENAI_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      AWS_TEST_ROLE_ARN:
        required: false
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provider to run'
        required: true
        type: choice
        default: all
        options: [all, bedrock, openai, openrouter, anthropic, lightpanda]

permissions:
  contents: read
  actions: read

env:
  NODE_ENV: test

jobs:
  prepare-postgres:
    if: ${{ !inputs.prepared_database && (inputs.provider == 'all' || inputs.provider == 'openai' || inputs.provider == 'openrouter' || inputs.provider == 'anthropic') }}
    uses: ./.github/workflows/prepare-postgres.yml
    permissions:
      actions: read
      contents: read

  backend-bedrock:
    if: ${{ !cancelled() && !failure() && (inputs.provider == 'all' || inputs.provider == 'bedrock') }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AWS_REGION: us-west-2
      BEDROCK_AWS_REGION: us-east-1
      VITEST_MAX_WORKERS: '3'
      VITEST_DIAGNOSTICS: ${{ vars.VITEST_DIAGNOSTICS == '1' && '1' || '0' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
        timeout-minutes: 6
      - uses: vouchington/vouchington-tooling/.github/actions/setup-aws@f7169f51576c21f4e640582fec4a70b77a717b78 # v0.80.2
        timeout-minutes: 2
        with:
          role-arn: ${{ secrets.AWS_TEST_ROLE_ARN }}
          aws-region: us-west-2
          action-timeout-s: 90
      - name: Run Bedrock live tests
        env:
          GIT_COMMIT: ${{ github.sha }}
          CI_PROJECT: backend-credentialed
          VITEST_CI_REPORTERS: run
          VITEST_JUNIT_OUTPUT_FILE: backend-bedrock-test-report.junit.xml
          VITEST_COVERAGE_ENABLED: 'false'
        run: |
          pnpm exec ./ci/with-node-test-options vitest run --bail=3 --project backend-bedrock
        timeout-minutes: 5
      - name: Upload Bedrock JUnit report
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: backend-live-junit-bedrock
          path: backend-bedrock-test-report.junit.xml
          retention-days: 1
          if-no-files-found: warn

  backend-openai:
    if: ${{ !cancelled() && !failure() && (inputs.provider == 'all' || inputs.provider == 'openai') }}
    needs: [prepare-postgres]
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: us-west-2
      VITEST_MAX_WORKERS: '3'
      VITEST_DIAGNOSTICS: ${{ vars.VITEST_DIAGNOSTICS == '1' && '1' || '0' }}

    services:
      postgres:
        image: ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c max_connections=300 -c log_min_messages=log'
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 1s
          --tmpfs /var/lib/postgresql:rw,size=1g

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/start-valkey
        timeout-minutes: 2
      - uses: ./.github/actions/setup-backend
        timeout-minutes: 6
      - name: Set service ports
        timeout-minutes: 1
        run: |
          echo "DATABASE_URL=postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        timeout-minutes: 2
        with:
          name: backend-postgres-${{ github.run_id }}
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Restore prepared PostgreSQL database
        timeout-minutes: 3
        run: |
          docker run --rm --network host -i \
            ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62 \
            pg_restore --dbname="$DATABASE_URL" --exit-on-error --no-owner --no-privileges \
            < "$RUNNER_TEMP/backend-postgres.dump"
      - name: Run OpenAI live tests
        env:
          GIT_COMMIT: ${{ github.sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CI_PROJECT: backend-credentialed
          VITEST_CI_REPORTERS: run
          VITEST_JUNIT_OUTPUT_FILE: backend-openai-test-report.junit.xml
          VITEST_COVERAGE_ENABLED: 'false'
        run: |
          pnpm exec ./ci/with-node-test-options vitest run --bail=3 --project backend-openai
        timeout-minutes: 5
      - name: Upload OpenAI JUnit report
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: backend-live-junit-openai
          path: backend-openai-test-report.junit.xml
          retention-days: 1
          if-no-files-found: warn
      - if: failure()
        uses: ./.github/actions/valkey-logs
        timeout-minutes: 1

  backend-openrouter:
    if: ${{ !cancelled() && !failure() && (inputs.provider == 'all' || inputs.provider == 'openrouter') }}
    needs: [prepare-postgres]
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: us-west-2
      VITEST_MAX_WORKERS: '3'
      VITEST_DIAGNOSTICS: ${{ vars.VITEST_DIAGNOSTICS == '1' && '1' || '0' }}

    services:
      postgres:
        image: ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c max_connections=300 -c log_min_messages=log'
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 1s
          --tmpfs /var/lib/postgresql:rw,size=1g

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/start-valkey
        timeout-minutes: 2
      - uses: ./.github/actions/setup-backend
        timeout-minutes: 6
      - name: Set service ports
        timeout-minutes: 1
        run: |
          echo "DATABASE_URL=postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        timeout-minutes: 2
        with:
          name: backend-postgres-${{ github.run_id }}
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Restore prepared PostgreSQL database
        timeout-minutes: 3
        run: |
          docker run --rm --network host -i \
            ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62 \
            pg_restore --dbname="$DATABASE_URL" --exit-on-error --no-owner --no-privileges \
            < "$RUNNER_TEMP/backend-postgres.dump"
      - name: Run OpenRouter live tests
        env:
          GIT_COMMIT: ${{ github.sha }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CI_PROJECT: backend-credentialed
          VITEST_CI_REPORTERS: run
          VITEST_JUNIT_OUTPUT_FILE: backend-openrouter-test-report.junit.xml
          VITEST_COVERAGE_ENABLED: 'false'
        run: |
          pnpm exec ./ci/with-node-test-options vitest run --bail=3 --project backend-openrouter
        timeout-minutes: 5
      - name: Upload OpenRouter JUnit report
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: backend-live-junit-openrouter
          path: backend-openrouter-test-report.junit.xml
          retention-days: 1
          if-no-files-found: warn
      - if: failure()
        uses: ./.github/actions/valkey-logs
        timeout-minutes: 1

  backend-anthropic:
    if: ${{ !cancelled() && !failure() && (inputs.provider == 'all' || inputs.provider == 'anthropic') }}
    needs: [prepare-postgres]
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: us-west-2
      VITEST_MAX_WORKERS: '3'
      VITEST_DIAGNOSTICS: ${{ vars.VITEST_DIAGNOSTICS == '1' && '1' || '0' }}

    services:
      postgres:
        image: ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c max_connections=300 -c log_min_messages=log'
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 1s
          --tmpfs /var/lib/postgresql:rw,size=1g

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/start-valkey
        timeout-minutes: 2
      - uses: ./.github/actions/setup-backend
        timeout-minutes: 6
      - name: Set service ports
        timeout-minutes: 1
        run: |
          echo "DATABASE_URL=postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        timeout-minutes: 2
        with:
          name: backend-postgres-${{ github.run_id }}
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Restore prepared PostgreSQL database
        timeout-minutes: 3
        run: |
          docker run --rm --network host -i \
            ghcr.io/vouchington/dependency-pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62 \
            pg_restore --dbname="$DATABASE_URL" --exit-on-error --no-owner --no-privileges \
            < "$RUNNER_TEMP/backend-postgres.dump"
      - name: Mint Anthropic federation token
        # One exchange per job, never per Vitest worker: GitHub's OIDC token is single-use and the
        # minted token lasts about 10 minutes, longer than the Anthropic test step. The federation
        # rule matches branch refs, so dispatch this workflow with `--ref <branch>`.
        timeout-minutes: 1
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          oidc_response=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://api.anthropic.com")
          oidc_token=$(jq -er .value <<<"$oidc_response")
          echo "::add-mask::${oidc_token}"
          exchange_body=$(jq -n \
            --arg assertion "$oidc_token" \
            --arg federation_rule_id "$ANTHROPIC_FEDERATION_RULE_ID" \
            --arg organization_id "$ANTHROPIC_ORGANIZATION_ID" \
            --arg service_account_id "$ANTHROPIC_SERVICE_ACCOUNT_ID" \
            --arg workspace_id "$ANTHROPIC_WORKSPACE_ID" \
            '{grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer", $assertion, $federation_rule_id, $organization_id, $service_account_id, $workspace_id}')
          # integrity-check: skip reason=authenticated-token-exchange-not-an-artifact-download
          exchange_response=$(curl -sS --fail-with-body https://api.anthropic.com/v1/oauth/token \
            -H 'content-type: application/json' -d "$exchange_body")
          access_token=$(jq -er .access_token <<<"$exchange_response")
          echo "::add-mask::${access_token}"
          echo "ANTHROPIC_AUTH_TOKEN=${access_token}" >> "$GITHUB_ENV"
      - name: Run Anthropic live tests
        env:
          GIT_COMMIT: ${{ github.sha }}
          CI_PROJECT: backend-credentialed
          VITEST_CI_REPORTERS: run
          VITEST_JUNIT_OUTPUT_FILE: backend-anthropic-test-report.junit.xml
          VITEST_COVERAGE_ENABLED: 'false'
        run: |
          pnpm exec ./ci/with-node-test-options vitest run --bail=3 --project backend-anthropic
        timeout-minutes: 5
      - name: Upload Anthropic JUnit report
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: backend-live-junit-anthropic
          path: backend-anthropic-test-report.junit.xml
          retention-days: 1
          if-no-files-found: warn
      - if: failure()
        uses: ./.github/actions/valkey-logs
        timeout-minutes: 1

  backend-lightpanda:
    if: ${{ !cancelled() && !failure() && (inputs.provider == 'all' || inputs.provider == 'lightpanda') }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITEST_MAX_WORKERS: '3'
      VITEST_DIAGNOSTICS: ${{ vars.VITEST_DIAGNOSTICS == '1' && '1' || '0' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
        timeout-minutes: 6
      - name: Run Lightpanda live tests
        env:
          GIT_COMMIT: ${{ github.sha }}
          LIGHTPANDA_TOKEN: ${{ secrets.LIGHTPANDA_TOKEN }}
          CI_PROJECT: backend-credentialed
          VITEST_CI_REPORTERS: run
          VITEST_JUNIT_OUTPUT_FILE: backend-lightpanda-test-report.junit.xml
          VITEST_COVERAGE_ENABLED: 'false'
        run: |
          pnpm exec ./ci/with-node-test-options vitest run --bail=3 --project backend-lightpanda
        timeout-minutes: 5
      - name: Upload Lightpanda JUnit report
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: backend-live-junit-lightpanda
          path: backend-lightpanda-test-report.junit.xml
          retention-days: 1
          if-no-files-found: warn
