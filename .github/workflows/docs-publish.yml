name: Docs Publish

on:
  push:
    branches: [main]
    paths:
      - 'api-fixtures/v1/openapi.json'
      - 'backend/data-stores/psql/schema-snapshot/**'
      - 'ci/render-psql-docs.mts'
      - '.github/workflows/docs-publish.yml'
      - '.github/actions/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: docs-publish-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-node-pnpm
        timeout-minutes: 3
      - name: Build and validate documentation
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p delivery/docs/openapi
          cp api-fixtures/v1/openapi.json delivery/docs/openapi/openapi.json
          pnpm exec redocly build-docs api-fixtures/v1/openapi.json --output delivery/docs/openapi/index.html --disableGoogleFont
          node ci/render-psql-docs.mts delivery/docs/psql
          for required_path in \
            delivery/docs/openapi/index.html \
            delivery/docs/openapi/openapi.json \
            delivery/docs/psql/index.html \
            delivery/docs/psql/schema.md \
            delivery/docs/psql/schema.json; do
            test -f "$required_path"
          done
          if find delivery -type l -print -quit | grep -q .; then
            echo '::error::Documentation delivery contains a symbolic link'
            exit 1
          fi
          if find delivery ! -type f ! -type d -print -quit | grep -q .; then
            echo '::error::Documentation delivery contains a non-regular entry'
            exit 1
          fi
      - name: Upload documentation delivery
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery
          if-no-files-found: error
          retention-days: 1
          overwrite: true
