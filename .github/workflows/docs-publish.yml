name: Docs Publish

on:
  push:
    branches: [main]
    paths:
      - 'api-fixtures/v1/mcp.json'
      - 'backend/data-stores/psql/schema-snapshot/**'
      - 'docs/development/postgresql/schema-snapshot/**'
      - 'ci/render-docs-cli.mts'
      - 'ci/render-docs-page.mts'
      - 'ci/render-mcp-docs.mts'
      - 'ci/render-psql-docs.mts'
      - '.github/workflows/docs-publish.yml'
      - '.github/workflows/docs-publish-build-and-validate.sh'
      - '.github/actions/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: docs-publish-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: vouchington/vouchington-tooling/.github/actions/setup-node-pnpm@102b3d948645b8f6ad9fc361d8681bfc55081551 # v0.85.1
        timeout-minutes: 3
        with:
          deadline-seconds: '150'
      - name: Build and validate documentation
        timeout-minutes: 5
        run: source "$GITHUB_WORKSPACE/.github/workflows/docs-publish-build-and-validate.sh"
      - name: Upload documentation delivery
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery
          if-no-files-found: error
          retention-days: 1
          overwrite: true
