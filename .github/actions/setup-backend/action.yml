name: Setup Backend
description: >
  Sets up Node.js and pnpm, installs the full workspace, and builds email
  templates. The caller must run actions/checkout before invoking this action.

runs:
  using: composite
  steps:
    - uses: vouchington/vouchington-tooling/.github/actions/setup-node-pnpm@804d6274d71329823f0416182debcdf681f350dd # v0.80.1
    - name: Build email-templates
      # Build explicitly so the backend can resolve @email-templates/core even
      # when generated output was absent before install.
      shell: bash
      working-directory: email-templates
      run: pnpm run build
