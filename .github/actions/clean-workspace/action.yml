name: Clean workspace
description: >
  Resets tracked-file modifications and removes untracked files. On every
  event except fork pull requests (head repo != base repo) and Dependabot
  pull requests, paths matching `node_modules` (at any depth) and any `extra-keep` patterns are
  preserved so forced `pnpm install --frozen-lockfile --prefer-offline`
  on persistent self-hosted runners can relink from the local store
  instead of downloading packages again. Callers can disable node_modules preservation while
  retaining trusted-run cache behavior for other paths. Fork
  pull requests get a full clean and write a contamination sentinel outside
  the workspace; the next run on the same persistent runner that sees the
  sentinel forces a full clean regardless of trust level, reducing the risk
  of fork-PR-modified binaries surviving into a subsequent trusted run
  (best-effort: fork PR code runs as the same user and can delete the
  sentinel; fully closing this surface requires separate runner pools for
  fork PRs). Before cleaning, common generated dependency, Next.js, Wrangler,
  and Wrangler temp/log trees are reclaimed when non-interactive sudo is
  available and then have user directory write bits restored. If `git clean` still finds
  another stale locked-down generated path, the action repairs the whole
  working tree while pruning `.git` and retries the clean once.
  On ephemeral runners the working directory starts empty so behavior is
  unchanged. Mirrors the persistence pattern already used for the pnpm
  store and Playwright browsers on self-hosted runners.
  Dependabot pull requests get a full clean so dependency updates cannot
  typecheck against stale transitive package trees from a prior checkout
  (see .github/workflows/README.md).

inputs:
  preserve-node-modules:
    description: >
      Preserve node_modules on trusted runs. Set false before a deferred dependency install so
      Codex cannot inherit a prior checkout's workspace dependency tree.
    default: 'true'
  extra-keep:
    description: >
      Additional gitignore-style patterns to preserve on every trusted
      event (e.g. ".next/cache web/.next/cache"). These follow the same
      trust-gate as node_modules: preserved on every event except fork
      pull requests, which get a full clean.
    default: ''
  deepen:
    description: >
      If 'true', ensure the local clone has full history of the base branch.
      Required for jobs that diff against the base ref (paths-filter, change
      detection). Default is 'false'
      so workflows with intentionally shallow checkouts (default
      `fetch-depth: 1`) keep their fast-clone characteristics. Pair this
      with `actions/checkout@v6 with: fetch-depth: 0`.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Reset, selective clean, refresh git state
      shell: bash
      env:
        EXTRA_KEEP: ${{ inputs.extra-keep }}
        PRESERVE_NODE_MODULES: ${{ inputs.preserve-node-modules }}
        DEEPEN: ${{ inputs.deepen }}
        BASE_REF: ${{ github.base_ref || github.event.repository.default_branch || 'main' }}
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BASE_REPO: ${{ github.repository }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        GITHUB_TOKEN: ${{ github.token }}
        GENERATED_REPAIR_PATHS: >-
          web/.next cloudflare-worker/.wrangler
          ${{ runner.temp }}/voucha-wrangler
      run: >-
        bash ci/exec-vouchington-gha.sh
        clean-workspace scripts/gha/clean-workspace.sh
