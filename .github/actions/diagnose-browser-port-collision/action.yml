name: Diagnose browser port collision
description: Capture bounded, best-effort listener and Linux host diagnostics after a browser-port workflow failure.

inputs:
  ports:
    description: Space-separated ports allocated by the caller's existing allocator.
    required: false
    default: ''
  artifact-suffix:
    description: Suffix for the one-day browser-port-diagnostics artifact.
    required: false
    default: generic

runs:
  using: composite
  steps:
    - name: Capture browser port diagnostics
      shell: bash
      env:
        PORTS: ${{ inputs.ports }}
        OUTPUT_DIR: ${{ runner.temp }}/browser-port-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        BROWSER_PORT_DIAGNOSTICS_BOUNDED_CHILD: '0'
        BROWSER_PORT_DIAGNOSTICS_TIMEOUT_SECONDS: '45'
      run: bash "$GITHUB_ACTION_PATH/../../../ci/diagnose-browser-port-collision.sh"
    - name: Upload browser port diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: browser-port-diagnostics-${{ inputs.artifact-suffix }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/browser-port-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        if-no-files-found: warn
        overwrite: true
        retention-days: 1
