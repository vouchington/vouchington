name: Upload Codecov
description: >-
  Best-effort upload of full LCOV reports to Codecov as an informational-only signal. Codecov
  never gates a pull request: the in-house patch-coverage gate remains the sole blocking
  coverage check. The caller wraps this step with `continue-on-error: true`.
inputs:
  token:
    description: Codecov upload token.
    required: true
  directory:
    description: Directory to search for LCOV reports.
    required: true
runs:
  using: composite
  steps:
    - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ inputs.token }}
        directory: ${{ inputs.directory }}
        disable_search: false
        fail_ci_if_error: false
