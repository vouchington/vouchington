name: Valkey logs
description: >
  Prints the container logs of the Valkey started by `start-valkey`. Call it with
  `if: failure()` so only a failed job pays for the log volume.
runs:
  using: composite
  steps:
    - name: Print Valkey container logs
      shell: bash
      # valkey-search logs one startup warning per INFO field it defines; none describe a fault.
      run: |
        docker logs voucha-valkey 2>&1 | grep -v 'info.cc:[0-9]*: Defined Info Field: ' || true
