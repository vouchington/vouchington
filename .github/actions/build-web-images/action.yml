name: Build web images
description: >
  Builds the web Docker image locally and runs the Docker smoke test against it, gating on a
  Trivy CRITICAL/HIGH scan before generating an SBOM. Produces a validated local image tagged
  sha-<sha> under the voucha-validation namespace; does not publish anywhere. The caller must run
  actions/checkout (fetch-depth 0) before invoking this action, must set job env
  IMAGE_REPOSITORY and SHA_TAG, and must assume the AWS OIDC role (via
  the vouchington-tooling setup-aws action) before invoking this action, so AWS_ACCESS_KEY_ID,
  AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN, and AWS_REGION are already in the job environment
  for the smoke test step.

inputs:
  next-public-asset-prefix:
    # Composite actions cannot read `vars.*` directly (fails at template-parse time), so the
    # caller forwards the repo variable here -- mirrors build-web-targets's
    # web-build-fs-cache-enabled input.
    description: Forwarded value of the `NEXT_PUBLIC_ASSET_PREFIX` repo variable.
    required: false
    default: ''
  sentry-source-map-upload:
    description: Enable the trusted production Sentry source-map upload during the image build.
    required: false
    default: 'false'
  sentry-release:
    description: Immutable Git SHA used as the Sentry release for a trusted production build.
    required: false
    default: ''
  sentry-auth-token:
    description: Sentry upload token forwarded only to the Docker build as a BuildKit secret.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
      with:
        config: .hadolint.yaml
        dockerfile: web/Dockerfile

    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      with:
        # Hosted runners are ephemeral, so builder teardown only adds post-job tail.
        cleanup: false
        driver-opts: image=ghcr.io/vouchington/dependency-buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ${{ env.IMAGE_REPOSITORY }}/web
        tags: |
          type=sha,prefix=sha-,format=long

    - name: Inject .next/cache into BuildKit cache mount
      uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
      with:
        cache-map: |
          {
            "web-next-cache": {
              "target": "/app/web/.next/cache"
            }
          }

    - name: Build Docker image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: .
        file: web/Dockerfile
        load: true
        push: false
        platforms: linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: |
          type=gha,scope=web-arm64
        cache-to: type=gha,scope=web-arm64,mode=max
        build-args: |
          NEXT_PUBLIC_GIT_COMMIT=${{ github.sha }}
          NEXT_PUBLIC_ASSET_PREFIX=${{ inputs.next-public-asset-prefix }}
          STRIP_TEST_IDS=true
          SENTRY_RELEASE=${{ inputs.sentry-source-map-upload == 'true' && (inputs.sentry-release || github.sha) || '' }}
          SENTRY_SOURCE_MAP_UPLOAD=${{ inputs.sentry-source-map-upload == 'true' && '1' || '0' }}
        secrets: |
          SENTRY_AUTH_TOKEN=${{ inputs.sentry-source-map-upload == 'true' && inputs.sentry-auth-token || '' }}
      env:
        DOCKER_BUILD_SUMMARY: 'false'
        DOCKER_BUILD_RECORD_UPLOAD: 'false'
        BUILDX_METADATA_PROVENANCE: disabled

    - name: Report Docker image size
      shell: bash
      continue-on-error: true
      env:
        IMAGE_TAG: ${{ env.SHA_TAG }}
      run: 'source "$GITHUB_ACTION_PATH/report-image-size.sh"'

    - uses: vouchington/vouchington-tooling/.github/actions/setup-node-pnpm@102b3d948645b8f6ad9fc361d8681bfc55081551 # v0.85.1
    - name: Run Docker smoke test
      shell: bash
      env:
        IMAGE_TAG: ${{ env.SHA_TAG }}
      run: 'source "$GITHUB_ACTION_PATH/smoke-test.sh"'

    - name: Install Trivy
      id: install-trivy
      shell: bash
      continue-on-error: true
      env:
        # renovate: datasource=github-releases depName=aquasecurity/trivy extractVersion=^v(?<version>.*)$
        TRIVY_VERSION: 0.71.2
      run: 'source "$GITHUB_ACTION_PATH/install-trivy.sh"'

    - name: Trivy install guard
      if: ${{ !cancelled() && steps.install-trivy.outcome != 'skipped' }}
      shell: bash
      run: 'source "$GITHUB_ACTION_PATH/trivy-install-guard.sh"'

    - name: Prepare Trivy database
      shell: bash
      run: ./ci/prepare-trivy-db.sh

    - name: Scan OS packages in web image with Trivy
      shell: bash
      env:
        IMAGE_TAG: ${{ env.SHA_TAG }}
        TRIVY_FINDINGS_EXIT_CODE: '10'
      run: |
        set -euo pipefail
        image="$IMAGE_REPOSITORY/web:$IMAGE_TAG"
        trivy_exit=0
        trivy image \
          --scanners vuln \
          --quiet \
          --pkg-types os \
          --skip-db-update \
          --exit-code "$TRIVY_FINDINGS_EXIT_CODE" \
          --severity CRITICAL,HIGH \
          --ignore-unfixed \
          --ignorefile .trivyignore.yaml \
          --format table \
          --table-mode detailed \
          --output trivy-web-os-table.txt \
          "$image" 2> trivy-web-os-stderr.txt || trivy_exit=$?
        if [ "$trivy_exit" -eq "$TRIVY_FINDINGS_EXIT_CODE" ]; then
          echo "::error title=Trivy OS vulnerability findings::CRITICAL/HIGH fixable OS vulnerabilities were found in $image."
          {
            echo "## Trivy OS Package Scan — Web"
            echo ""
            echo "⚠️ CRITICAL/HIGH fixable OS vulnerabilities were found."
            echo ""
            echo '```'
            cat trivy-web-os-table.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat trivy-web-os-table.txt
          exit "$trivy_exit"
        elif [ "$trivy_exit" -ne 0 ]; then
          echo "::error title=Trivy scanner error::Trivy could not complete the OS package scan for $image (exit $trivy_exit)."
          echo "✗ Trivy scanner error while scanning OS packages in $image (exit $trivy_exit)"
          cat trivy-web-os-stderr.txt >&2
          exit "$trivy_exit"
        fi

    - name: Generate web SBOM
      shell: bash
      env:
        IMAGE_TAG: ${{ env.SHA_TAG }}
      run: |
        # Gating already happened in "Scan OS packages in web image with Trivy" above; this step
        # only runs once that step has passed, so an exit-code/severity filter
        # here can never trigger. Keep the SBOM free of vulnerability filters so it
        # remains a complete OS and language package component inventory for the
        # uploaded artifact, not a truncated gate report.
        trivy image \
          --quiet \
          --skip-db-update \
          --exit-code 0 \
          --format cyclonedx \
          --output sbom-web.cdx.json \
          "$IMAGE_REPOSITORY/web:$IMAGE_TAG"

    - name: Upload Trivy artifacts
      if: ${{ !cancelled() }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: trivy-web-${{ github.sha }}
        path: |
          trivy-web-os-table.txt
          trivy-web-os-stderr.txt
          sbom-web.cdx.json
        if-no-files-found: ignore
        overwrite: true
        retention-days: 1
