name: Setup Node.js and pnpm
description: >
  Sets up Node.js from .nvmrc and pnpm, then installs the full workspace.
  Every job runs on a fresh, ephemeral runner, so install is always an
  unconditional full install with no reconciliation.
  The caller must run actions/checkout before invoking this action.
  Set timeout-minutes on the calling step to cap the combined operations.
inputs:
  install-scripts:
    description: 'Set false when dependency lifecycle scripts are intentionally deferred'
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: '.nvmrc'
        package-manager-cache: false
    - name: Activate pnpm via corepack
      shell: bash
      run: bash "$GITHUB_WORKSPACE/ci/activate-pnpm.sh"
    - name: Resolve pnpm store path
      id: pnpm-store
      shell: bash
      run: |
        echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        if command -v sha256sum >/dev/null 2>&1; then
          echo "lockfile-hash=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        else
          echo "lockfile-hash=$(shasum -a 256 pnpm-lock.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        fi
    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-store.outputs.lockfile-hash }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ runner.arch }}-
    - name: pnpm install
      shell: bash
      env:
        INSTALL_SCRIPTS: ${{ inputs.install-scripts }}
      run: |
        set -euo pipefail
        bash "$GITHUB_WORKSPACE/ci/pnpm-install.sh" \
          --runner-lifecycle ephemeral-full \
          --install-scripts "$INSTALL_SCRIPTS"
