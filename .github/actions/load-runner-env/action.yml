name: Load Runner Environment
description: >
  Loads runner-specific environment overrides into GITHUB_ENV with a 3-level
  priority chain: (1) ~/.github-actions.env on the runner host (highest),
  (2) GitHub Actions variables passed as inputs, (3) config file defaults.
  The caller must run actions/checkout before invoking this action.

inputs:
  VITEST_MAX_WORKERS:
    description: Vitest max workers (GitHub Actions variable fallback, e.g. vars.VITEST_MAX_WORKERS)
    required: false
    default: ''
  PLAYWRIGHT_MAX_WORKERS:
    description: Playwright max workers (GitHub Actions variable fallback, e.g. vars.PLAYWRIGHT_MAX_WORKERS)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Load runner environment
      shell: bash
      env:
        INPUT_VITEST_MAX_WORKERS: ${{ inputs.VITEST_MAX_WORKERS }}
        INPUT_PLAYWRIGHT_MAX_WORKERS: ${{ inputs.PLAYWRIGHT_MAX_WORKERS }}
        WORKER_VAR_NAMES: VITEST_MAX_WORKERS PLAYWRIGHT_MAX_WORKERS
      run: bash "$GITHUB_WORKSPACE/ci/load-runner-env.sh"
