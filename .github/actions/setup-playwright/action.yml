name: Setup Playwright
description: >
  Install Playwright browsers. Every job runs on a fresh, ephemeral runner
  with no persisted local state, so ~/.cache/ms-playwright is restored from
  actions/cache (keyed on the pnpm lockfile hash, with no restore-keys
  fallback so a stale or mismatched browser cache never silently restores —
  a miss just re-installs). Dependency installation is scoped to the current
  ephemeral runner.

runs:
  using: composite
  steps:
    - name: Resolve Playwright cache key
      id: playwright-cache-key
      shell: bash
      run: |
        if command -v sha256sum >/dev/null 2>&1; then
          echo "lockfile-hash=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        else
          echo "lockfile-hash=$(shasum -a 256 pnpm-lock.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        fi
    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-cache-key.outputs.lockfile-hash }}

    - name: Install Playwright browsers
      shell: bash
      # A stalled apt or browser download must die inside this attempt. Healthy installs
      # finish well under two minutes; one retry covers a transient mirror stall.
      run: |
        set -euo pipefail
        attempt=1
        max_attempts=2
        install_status=0
        while [ "$attempt" -le "$max_attempts" ]; do
          set +e
          python3 "$GITHUB_WORKSPACE/ci/run-bounded.py" 120 bash -c '
            set -euo pipefail
            if pnpm exec playwright install-deps --dry-run chromium > /dev/null 2>&1; then
              :
            else
              bash "$GITHUB_WORKSPACE/ci/wait-for-apt-locks.sh"
              pnpm exec playwright install-deps --dry-run chromium || pnpm exec playwright install-deps chromium
            fi
            pnpm exec playwright install chromium
          '
          install_status=$?
          set -e
          if [ "$install_status" -eq 0 ]; then
            exit 0
          fi
          if [ "$attempt" -ge "$max_attempts" ]; then
            echo "::error::Playwright browser install failed after ${max_attempts} attempts (status ${install_status})"
            exit "$install_status"
          fi
          echo "::warning::Playwright browser install attempt ${attempt} failed with status ${install_status}; retrying"
          attempt=$((attempt + 1))
        done
