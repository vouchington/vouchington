name: Setup Playwright
description: >
  Install Playwright browsers. Every job runs on a fresh, ephemeral runner
  with no persisted local state, so ~/.cache/ms-playwright is restored from
  actions/cache (keyed on the pnpm lockfile hash, with no restore-keys
  fallback so a stale/mismatched browser cache never silently restores —
  a miss just re-installs). Pass ubicloud: 'true' on ARM64 runners (e.g.
  GitHub-hosted ubuntu-24.04-arm) to bypass Node-based extract-zip and use
  system curl + unzip instead — required on ARM64 where yauzl extraction of
  the ~150MB Chromium zip times out. Probes host dependencies first. Only
  drift repair uses the shared host lock to serialize package-manager
  operations across concurrent jobs sharing the same OS user.

inputs:
  ubicloud:
    description: 'Use curl + system unzip instead of playwright install to bypass slow ARM64 Node extraction (use true on ARM64 runners; not for x64)'
    default: 'false'

runs:
  using: composite
  steps:
    - name: Resolve Playwright cache key
      id: playwright-cache-key
      shell: bash
      run: |
        if command -v sha256sum >/dev/null 2>&1; then
          echo "lockfile-hash=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        else
          echo "lockfile-hash=$(shasum -a 256 pnpm-lock.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        fi
    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-cache-key.outputs.lockfile-hash }}

    - name: Install Playwright browsers (ARM64 curl+unzip)
      if: inputs.ubicloud == 'true' && runner.arch == 'ARM64'
      shell: bash
      # Bypass playwright install's Node-based extract-zip on arm64.
      # extract-zip + yauzl is single-threaded and CPU-bound; on ARM64 it
      # grinds through Chromium's ~150MB / thousands of files and times out.
      # System unzip finishes the same archive in ~10s.
      run: ./ci/playwright-install-ubicloud-browsers.sh

    - name: Install Playwright browsers
      if: inputs.ubicloud != 'true' || runner.arch != 'ARM64'
      shell: bash
      run: |
        set -euo pipefail
        if pnpm exec playwright install-deps --dry-run chromium > /dev/null 2>&1; then
          :
        else
          bash "$GITHUB_WORKSPACE/ci/wait-for-apt-locks.sh"
          host_lock_timeout_seconds=300
          # Storybook currently gives this action a 5m step budget; keep enough
          # room for dependency repair after the 120s apt preflight. Host-lock
          # contention is less common there, so it gets the tighter 60s budget.
          if [ "${GITHUB_JOB:-}" = "storybook" ] || [ "${GITHUB_WORKFLOW:-}" = "Storybook" ]; then
            host_lock_timeout_seconds=60
          fi
          bash "$GITHUB_WORKSPACE/ci/with-host-lock.sh" \
            --name host-package-manager \
            --timeout-seconds "$host_lock_timeout_seconds" \
            -- bash -c 'pnpm exec playwright install-deps --dry-run chromium || pnpm exec playwright install-deps chromium'
        fi
        pnpm exec playwright install chromium
