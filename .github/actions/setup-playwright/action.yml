name: Setup Playwright
description: >
  Install Playwright browsers, restoring them from actions/cache when a prior
  run already downloaded the same version. Pass ubicloud: 'true' on ARM64
  ubicloud runners to bypass Node-based extract-zip and use system curl +
  unzip instead — required on ARM64 ubicloud runners where yauzl extraction
  of the ~150MB Chromium zip times out. Probes host dependencies first. Only
  drift repair uses the shared host lock to serialize package-manager
  operations across concurrent jobs sharing the same OS user.

inputs:
  ubicloud:
    description: 'Use curl + system unzip instead of playwright install to bypass slow ARM64 Node extraction (use true for ubicloud ARM64 runners; not for x64)'
    default: 'false'

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      # Fails loudly rather than exporting an empty value: the cache key below interpolates this,
      # so an unresolved version would collapse to a version-less key shared by every Playwright
      # version -- serving one version's browser binaries to another.
      shell: bash
      run: |
        set -euo pipefail
        version="$(node -p "require('playwright-core/package.json').version")"
        if [ -z "$version" ] || [ "$version" = 'undefined' ]; then
          echo "::error::Could not resolve playwright-core's version for the browser cache key"
          exit 1
        fi
        echo "PLAYWRIGHT_VERSION=$version" >> "$GITHUB_ENV"

    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}

    - name: Install Playwright browsers (ubicloud curl+unzip)
      if: inputs.ubicloud == 'true' && runner.arch == 'ARM64'
      shell: bash
      # Bypass playwright install's Node-based extract-zip on arm64.
      # extract-zip + yauzl is single-threaded and CPU-bound; on ubicloud ARM64
      # it grinds through Chromium's ~150MB / thousands of files and times out.
      # System unzip finishes the same archive in ~10s.
      run: ./ci/playwright-install-ubicloud-browsers.sh

    - name: Install Playwright browsers
      if: inputs.ubicloud != 'true' || runner.arch != 'ARM64'
      shell: bash
      run: |
        set -euo pipefail
        if pnpm exec playwright install-deps --dry-run chromium > /dev/null 2>&1; then
          :
        else
          bash "$GITHUB_WORKSPACE/ci/wait-for-apt-locks.sh"
          host_lock_timeout_seconds=300
          # Storybook currently gives this action a 5m step budget; keep enough
          # room for dependency repair after the 120s apt preflight. Host-lock
          # contention is less common there, so it gets the tighter 60s budget.
          if [ "${GITHUB_JOB:-}" = "storybook" ] || [ "${GITHUB_WORKFLOW:-}" = "Storybook" ]; then
            host_lock_timeout_seconds=60
          fi
          bash "$GITHUB_WORKSPACE/ci/with-host-lock.sh" \
            --name host-package-manager \
            --timeout-seconds "$host_lock_timeout_seconds" \
            -- bash -c 'pnpm exec playwright install-deps --dry-run chromium || pnpm exec playwright install-deps chromium'
        fi
        pnpm exec playwright install chromium
