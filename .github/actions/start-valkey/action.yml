name: Start Valkey
description: >
  Starts the pinned Valkey bundle container for a test job and exports VALKEY_URL. It replaces a
  job `services:` entry because GitHub prints a service container's complete `docker logs` at job
  teardown on every run, and the search module logs ~150 info-field warning lines at startup. A
  step container prints nothing unless `valkey-logs` is asked to, so a green job stays quiet.
  The container publishes to loopback on an ephemeral host port that is resolved after start.
outputs:
  url:
    description: Valkey connection URL, also exported as VALKEY_URL for later steps.
    value: ${{ steps.start.outputs.url }}

runs:
  using: composite
  steps:
    - name: Start Valkey
      id: start
      shell: bash
      env:
        VALKEY_IMAGE: ghcr.io/vouchington/dependency-valkey:9.1.0@sha256:16004aceeb7a1246e2d1bb85d353e38120eb440951cb7d0c971b6d63fda5b3d7
        VALKEY_CONTAINER: voucha-valkey
      run: bash "$GITHUB_WORKSPACE/ci/build-infra/start-valkey.sh"
