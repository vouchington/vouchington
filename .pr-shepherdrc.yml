# ignoreChecks entries must be the RAW name — either a Checks API check_run `name`
# (e.g. 'Kilo Code Review') or a Statuses API commit status `context` (e.g. 'CodeRabbit')
# — not the composite display name shown in the PR UI.
# pr-shepherd matches against the raw name; composite-name entries silently never match.
ignoreChecks:
  - 'Kilo Code Review'
  - 'CodeRabbit'
  # Informational live-provider smoke checks. The `backend` gate does not wait on them, so shepherd
  # must not either; the red check, its job summary, and the Nightly run still report a failure.
  # See docs/development/tests.md#live-provider-smoke-checks.
  - 'test-backend-credentialed / backend-credentialed-tests'

# Single source of the WAIT-tick cadence: checked-in guidance omits `--interval` so this applies.
# GraphQL quota-warning bands scale from it (2x/5x/10x → 6/15/30 minutes).
poll:
  intervalSeconds: 180

# The repo disallows merge commits and rebase merges (squash-only, see
# allow_squash_merge/allow_merge_commit/allow_rebase_merge); without this,
# Shepherd's `--merge` default fails with "Merge commits are not allowed on
# this repository."
merge:
  commandArgs:
    - '--squash'
