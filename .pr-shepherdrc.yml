# yaml-language-server: $schema=./node_modules/pr-shepherd/pr-shepherd.schema.json
version: 1

checks:
  # checks.ignore entries are case-insensitive globs over the RAW name — either a Checks API
  # check_run `name` (e.g. 'Kilo Code Review') or a Statuses API commit status `context`
  # (e.g. 'CodeRabbit') — not the composite display name shown in the PR UI.
  # pr-shepherd matches against the raw name; composite-name entries silently never match.
  ignore:
    - 'Kilo Code Review'
    - 'CodeRabbit'
    # Informational live-provider smoke checks. The `backend` gate does not wait on them, so shepherd
    # must not either; the red check, its job summary, and the Nightly run still report a failure.
    # See docs/development/tests.md#live-provider-smoke-checks.
    - 'test-backend-credentialed / backend-credentialed-tests'
    # Informational credentialed Playwright checks against real cloud resources; the `web` gate does
    # not wait on them either. See docs/development/tests.md#live-provider-smoke-checks.
    - 'test-playwright-credentialed / playwright-credentialed-tests'

# Use vendor-specific bundled rules instead of local author-wide suppression. Coverage reports
# are informational comments; coverage checks still gate readiness.
classify:
  standard:
    all: true

# Single source of the WAIT-tick cadence: checked-in guidance omits `--interval` so this applies.
# GraphQL quota-warning bands scale from it (2x/5x/10x → 6/15/30 minutes).
poll:
  interval-seconds: 180
