# Local OpenTelemetry stack — traces only, for local testing.
# Start:  ./dev/otel-up
# Stop:   ./dev/otel-down
# UI:     http://localhost:16686 (Jaeger)
#
# To deploy on AWS: replace this file with ADOT (see docs/development/opentelemetry.md).
# App instrumentation (OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_ENABLED) is unchanged.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - '127.0.0.1:4317:4317' # OTLP gRPC
      - '127.0.0.1:4318:4318' # OTLP HTTP
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - '127.0.0.1:16686:16686' # Jaeger UI
    environment:
      - COLLECTOR_OTLP_ENABLED=true
